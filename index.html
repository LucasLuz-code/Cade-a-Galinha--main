function criaHudFase(cena, fase) {
  var h = {};
  h.nome = txt(cena, 14, 18, (fase.indice + 1) + '.  ' + fase.nome, 9, C.moeda, 0);
  h.pontos = txt(cena, 14, 40, '0', 15, C.ui, 0);
  h.quedas = txt(cena, 14, 60, '', 8, C.cinza, 0);
  h.tempo = txt(cena, LARG - 14, 18, '', 12, C.ui, 1);
  h.ovos = txt(cena, LARG - 14, 42, '', 10, C.moeda, 1);
  h.secretos = txt(cena, LARG - 14, 60, '', 8, C.p1luz, 1);
  // combo bem no alto, no meio: e a informacao que muda mais rapido
  h.combo = txt(cena, LARG / 2, 34, '', 18, C.perigo2).setAlpha(0);
  h.mult = txt(cena, LARG / 2, 58, '', 10, C.moeda).setAlpha(0);
  // barra da habilidade + barra de progresso da fase
  h.g = cena.add.graphics();
  h.habNome = txt(cena, 20, ALT - 40, '', 8, C.cinza, 0);
  h.lista = [h.nome, h.pontos, h.quedas, h.tempo, h.ovos, h.secretos,
             h.combo, h.mult, h.g, h.habNome];
  for (var i = 0; i < h.lista.length; i++) h.lista[i].setScrollFactor(0).setDepth(100);
  h.pontosMostrados = 0;
  return h;
}

// Desenha o que muda a cada quadro (barras) e atualiza os textos. A pontuacao
// "corre" ate o valor real em vez de saltar: da para ver quanto rendeu.
function atualizaHudFase(cena, h, dados) {
  var g = h.g, r = dados.r, larg, f;
  h.pontosMostrados += (dados.pontos - h.pontosMostrados) * 0.25;
  if (Math.abs(dados.pontos - h.pontosMostrados) < 1) h.pontosMostrados = dados.pontos;
  h.pontos.setText(num(h.pontosMostrados));
  h.quedas.setText('QUEDAS ' + dados.mortes);
  h.ovos.setText('OVOS ' + dados.ovos + '/' + dados.totalOvos);
  if (dados.totalSecretos > 0) h.secretos.setText('SEGREDOS ' + dados.secretos + '/' + dados.totalSecretos);

  // tempo: conta para cima, ou para baixo quando a fase tem limite
  if (dados.limite) {
    var resta = Math.max(0, dados.limite - dados.tempo);
    h.tempo.setText(tempoStr(resta));
    h.tempo.setColor(resta < 10000 ? C.perigo : (resta < 20000 ? C.perigo2 : C.ui));
  } else {
    h.tempo.setText(tempoStr(dados.tempo));
  }

  // combo: aparece quando existe, some quando morre
  if (dados.combo >= 2) {
    h.combo.setText('COMBO x' + dados.combo).setAlpha(1);
    h.mult.setText(dados.mult > 1 ? 'MULTIPLICADOR x' + dados.mult : '').setAlpha(dados.mult > 1 ? 1 : 0);
    // a barrinha embaixo do combo mostra quanto falta para ele morrer
    f = limita(dados.janela / PONT.JANELA, 0, 1);
  } else {
    h.combo.setAlpha(0); h.mult.setAlpha(0);
    f = 0;
  }

  g.clear();
  // ---- barra de tempo do combo ----
  if (f > 0) {
    var yb = h.yBarra || 71;
    g.fillStyle(N.escuro, 0.8); g.fillRect(LARG / 2 - 91, yb, 182, 7);
    g.fillStyle(f < 0.3 ? N.perigo : N.moeda, 1); g.fillRect(LARG / 2 - 90, yb + 1, 180 * f, 5);
  }
  // ---- barra da habilidade (canto de baixo, do lado do boneco) ----
  if (r) {
    var pronta = 1, cor = r.luzN, rot = r.pf.habNome;
    if (r.pf.hab === 'escudo') {
      if (r.escudando) { pronta = limita(r.escudoT / r.pf.escudoDur, 0, 1); cor = N.ui; rot = 'ESCUDO ATIVO'; }
      else if (r.habCd > 0) { pronta = 1 - limita(r.habCd / (r.pf.escudoDur + r.pf.escudoCd), 0, 1); cor = N.painelLuz; rot = 'ESCUDO CARREGANDO'; }
    } else {
      if (r.habCd > 0) { pronta = 1 - limita(r.habCd / r.pf.piruetaCd, 0, 1); cor = N.painelLuz; rot = 'PIRUETA CARREGANDO'; }
      else if (r.piruetaUsada && !r.noChao) { pronta = 0; cor = N.painel; rot = 'PIRUETA: TOQUE O CHÃO'; }
    }
    g.fillStyle(N.escuro, 0.85); g.fillRect(18, ALT - 30, 184, 14);
    g.fillStyle(N.painel, 1);    g.fillRect(20, ALT - 28, 180, 10);
    g.fillStyle(cor, 1);         g.fillRect(20, ALT - 28, 180 * pronta, 10);
    if (h.habNome.text !== rot) h.habNome.setText(rot);
    // cargas de dash a direita da barra
    for (var k = 0; k < r.cargasMax; k++) {
      g.fillStyle(N.escuro, 0.85); g.fillRect(210 + k * 16, ALT - 30, 14, 14);
      g.fillStyle(k < r.cargas ? r.luzN : N.painel, 1); g.fillRect(212 + k * 16, ALT - 28, 10, 10);
    }
  }
  // ---- progresso da fase: filete fino no topo da tela ----
  if (dados.progresso !== undefined) {
    g.fillStyle(N.escuro, 0.7); g.fillRect(0, 0, LARG, 4);
    g.fillStyle(N.moeda, 0.9);  g.fillRect(0, 0, LARG * limita(dados.progresso, 0, 1), 3);
  }
}

// ============================================================================
//  JOGADOR
//  A colisao usa uma imagem invisivel de 20x26 ("corpo"); o desenho fica num
//  sprite separado que a segue. Assim da para fazer squash & stretch sem
//  baguncar a caixa de colisao.
// ============================================================================
var SEM_ENTRADA = { esq: false, dir: false, pulo: false, puloAgora: false,
                    dashAgora: false, habAgora: false, baixo: false, baixoAgora: false };

function criaCorredor(cena, x, y, id) {
  var pre = 'p' + id + '_', pf = perfilDe(id);
  var corpo = cena.physics.add.image(x, y, 'corpo');
  corpo.setVisible(false).setDepth(9);
  corpo.body.setMaxVelocity(9999, FIS.QUEDA_MAX);
  var spr = cena.add.sprite(x, y + 18, pre + 'parado0').setOrigin(0.5, 1).setDepth(10);
  spr.play(pre + 'parado');
  var r = {
    id: id, pre: pre, corpo: corpo, spr: spr, pf: pf,
    corN: id === 1 ? N.p1 : N.p2, luzN: id === 1 ? N.p1luz : N.p2luz,
    cor: id === 1 ? C.p1 : C.p2, luz: id === 1 ? C.p1luz : C.p2luz,
    face: 1, coyote: 0, buffer: 0,
    dashT: 0, dashDir: 1, dashCd: 0, dashando: false,
    cargas: pf.cargas, cargasMax: pf.cargas,      // dash com cargas (Koburo tem 2)
    pulando: false, noChao: false, atordoado: 0, invenc: 0, morto: false,
    // ---- habilidades ----
    habCd: 0,                                     // recarga da habilidade principal
    escudoT: 0, escudando: false, escudoAviso: false,
    piruetaUsada: false,                          // 1 pirueta por voo
    girando: 0,                                   // ms de animacao de pirueta
    baixoT: 0, mergulhando: false, pisando: false, pisaoCd: 0, pisaoPendente: false,
    molaPendente: false, quique: null, escorregando: false,
    // ---- estado geral ----
    sx: 1, sy: 1, animAtual: '', entrada: SEM_ENTRADA,
    vidas: 3, maxX: x, eliminado: false, x0: x,
    aura: null, bolha: null
  };
  criaEfeitosHab(cena, r);
  corpo.setData('r', r);
  return r;
}

// ---- Efeito visual de cada habilidade -------------------------------------
// A bolha do escudo e um circulo desenhado (nao gasta textura) e o rastro da
// pirueta reaproveita as particulas do dash. Os dois ficam escondidos ate
// serem usados, entao nao pesam quando ninguem esta usando nada.
function criaEfeitosHab(cena, r) {
  if (r.pf.hab === 'escudo') {
    r.bolha = cena.add.graphics().setDepth(11).setVisible(false);
  }
  // marcador de carga do dash flutuando junto do boneco (so quando tem 2+)
  r.aura = cena.add.graphics().setDepth(8).setVisible(false);
}

// redesenha a bolha do escudo (raio "pulsa" de leve enquanto esta no ar)
function pintaEscudo(r, t) {
  var g = r.bolha;
  if (!g) return;
  if (!r.escudando) { g.setVisible(false); return; }
  var acabando = r.escudoT < 600;
  // piscando no fim = aviso visual de que a protecao vai cair (vale sem som)
  if (acabando && !POUCO_MOV && Math.floor(r.escudoT / 100) % 2 === 0) { g.setVisible(false); return; }
  var raio = 21 + (POUCO_MOV ? 0 : Math.sin(t / 130) * 1.6);
  g.setVisible(true).clear();
  g.setPosition(r.corpo.x, r.corpo.y);
  g.fillStyle(r.luzN, 0.16); g.fillCircle(0, 0, raio);
  g.lineStyle(2, r.luzN, acabando ? 0.55 : 0.9); g.strokeCircle(0, 0, raio);
  g.lineStyle(1, 0xffffff, 0.5); g.strokeCircle(0, 0, raio - 4);
}

// pintinhas de carga de dash ao lado do boneco (so quem tem 2 cargas ve)
function pintaCargas(r) {
  var g = r.aura, i;
  if (!g || r.cargasMax < 2) { if (g) g.setVisible(false); return; }
  g.setVisible(true).clear();
  g.setPosition(r.corpo.x, r.corpo.y - 24);
  for (i = 0; i < r.cargasMax; i++) {
    g.fillStyle(i < r.cargas ? r.luzN : N.painel, i < r.cargas ? 1 : 0.55);
    g.fillRect(-5 + i * 7, 0, 4, 4);
  }
}

function poeira(cena, r) {
  if (POUCO_MOV) return;
  cena.pPoeira.explode(7, r.corpo.x, r.corpo.body.bottom - 2);
}

// Fisica do jogador - igual na Campanha e na Corrida.
// As HABILIDADES entram aqui, mas sempre por cima da base: a caminhada, o
// pulo e o dash continuam exatamente como eram (o que mantem todas as fases
// antigas jogaveis). O que muda de um personagem para o outro vem do PERFIL.
function atualizaCorredor(cena, r, dt) {
  if (r.morto || r.eliminado) return;
  var b = r.corpo.body, pf = r.pf;
  var ent = (r.atordoado > 0) ? SEM_ENTRADA : r.entrada;
  var noChao = b.blocked.down || b.touching.down;

  if (r.atordoado > 0) r.atordoado -= dt;
  if (r.dashCd > 0) r.dashCd -= dt;
  if (r.invenc > 0) r.invenc -= dt;
  if (r.habCd > 0) r.habCd -= dt;
  if (r.pisaoCd > 0) r.pisaoCd -= dt;
  if (r.girando > 0) r.girando -= dt;

  // ---- escudo (Tobias): conta o tempo e avisa antes de acabar ----
  if (r.escudando) {
    r.escudoT -= dt;
    if (r.escudoT <= 0) { r.escudando = false; r.escudoT = 0; SOM.escudoFim(); }
  }

  // Tocar o chao devolve o coyote time e recarrega TODAS as cargas de dash,
  // a pirueta e o pisao. E a regra que sempre valeu ("o dash recarrega ao
  // tocar o telhado"), agora valendo para as habilidades novas tambem.
  if (noChao) {
    r.coyote = FIS.COYOTE;
    if (r.cargas < r.cargasMax) {
      r.cargas = r.cargasMax;
      if (r.cargasMax > 1) SOM.dashPronto();
    }
    r.piruetaUsada = false;
    if (!r.noChao) {
      r.sx = 1.35; r.sy = 0.72; poeira(cena, r);                // pousou
      if (r.mergulhando) { r.sx = 1.5; r.sy = 0.6; }            // mergulho pousa duro
      if (r.pisando) { r.pisaoPendente = true; }                // avisa a fase: baque!
      r.mergulhando = false; r.pisando = false;
    }
    r.noChao = true;
  } else {
    r.coyote -= dt;
    r.noChao = false;
  }

  // jump buffer: guarda o pedido de pulo por alguns ms
  if (ent.puloAgora) r.buffer = FIS.BUFFER; else r.buffer -= dt;

  if (r.dashT > 0) {
    // ---- DASH ----------------------------------------------------------
    // Gravidade desligada + velocidade horizontal fixa = "esticao" que cruza
    // buracos maiores que o pulo. Funciona no chao e no ar.
    r.dashT -= dt;
    b.setAllowGravity(false);
    r.corpo.setVelocity(r.dashDir * pf.dashVel, 0);
    if (!POUCO_MOV) cena.pDash[r.id].explode(2, r.corpo.x - r.dashDir * 10, r.corpo.y + 4);
    if (r.dashT <= 0) {
      b.setAllowGravity(true);
      r.corpo.setVelocityX(r.dashDir * pf.dashSai);    // sobra impulso
      r.dashando = false;
    }
  } else if (r.pisando) {
    // ---- PISAO (Tobias): desce reto e rapido, sem controle no ar --------
    b.setAllowGravity(false);
    r.corpo.setVelocity(0, pf.pisaoVY);
    if (!POUCO_MOV) cena.pDash[r.id].explode(1, r.corpo.x, r.corpo.y - 10);
  } else {
    // A gravidade so pode ficar desligada ENQUANTO dura um dash ou um pisao.
    // Chegar aqui significa que nenhum dos dois esta acontecendo, entao ela
    // volta - inclusive quando o movimento foi cortado de fora (pousar de
    // pisao, levar um esbarrao na Perseguicao). Antes so o fim natural do
    // dash religava, e quem pousava de pisao ficava boiando: sem cair, sem
    // conseguir pular (o pulo exige chao ou coyote) e sem recarregar dash.
    if (!b.allowGravity) b.setAllowGravity(true);

    // ---- andar com aceleracao e atrito ---------------------------------
    var dir = (ent.dir ? 1 : 0) - (ent.esq ? 1 : 0);
    if (dir !== 0) r.face = dir;
    var vx = b.velocity.x, alvo = dir * FIS.CORRIDA, taxa;
    if (dir === 0) taxa = noChao ? FIS.ATR_CHAO : FIS.ATR_AR;
    else if (Math.abs(vx) > FIS.CORRIDA && (vx > 0 ? 1 : -1) === dir) taxa = FIS.FREIO_EXC;
    else taxa = noChao ? FIS.ACEL_CHAO : FIS.ACEL_AR;
    r.corpo.setVelocityX(aproxima(vx, alvo, taxa * dt / 1000));

    // ---- pulo com coyote time e altura variavel ------------------------
    if (r.buffer > 0 && (noChao || r.coyote > 0)) {
      r.corpo.setVelocityY(FIS.PULO);
      r.buffer = 0; r.coyote = 0; r.pulando = true;
      r.sx = 0.74; r.sy = 1.3;
      SOM.pulo();
    }
    if (r.pulando && !ent.pulo && b.velocity.y < FIS.CORTE) {
      r.corpo.setVelocityY(FIS.CORTE);   // soltou cedo: pula baixo
      r.pulando = false;
    }
    if (b.velocity.y >= 0) r.pulando = false;

    // ---- iniciar dash (gasta 1 carga) ----------------------------------
    if (ent.dashAgora) {
      if (r.cargas > 0 && r.dashCd <= 0) {
        r.dashT = pf.dashDur;
        r.dashDir = r.face;
        r.dashCd = pf.dashDur + (r.cargas > 1 ? pf.recarga : FIS.DASH_REC);
        r.cargas--;
        r.dashando = true;
        r.mergulhando = false;
        r.sx = 1.4; r.sy = 0.76;
        SOM.dash();
      } else if (r.dashCd <= 0) {
        SOM.semCarga();                  // sem carga: avisa em vez de nada
      }
    }

    // ---- HABILIDADE PRINCIPAL ------------------------------------------
    if (ent.habAgora) usaHabilidade(cena, r, noChao);

    // ---- BAIXO no ar: mergulho (Koburo) ou pisao (Tobias) --------------
    if (ent.baixoAgora && !noChao && b.velocity.y > -180) iniciaBaixoAr(cena, r);
  }
  if (r.corpo.x > r.maxX) r.maxX = r.corpo.x;
}

// ---- Habilidade principal de cada personagem ------------------------------
// PIRUETA (Koburo): impulso para cima no ar, uma vez por voo. Nao substitui o
// pulo duplo classico: gasta a recarga e empurra um pouco para a frente, o
// que abre rotas altas sem virar "voar".
// ESCUDO (Tobias): uma bolha temporaria. Nao acelera nada; so deixa passar
// por onde o outro precisa desviar.
function usaHabilidade(cena, r, noChao) {
  var pf = r.pf;
  if (r.habCd > 0) { SOM.semCarga(); return; }

  if (pf.hab === 'pirueta') {
    if (noChao || r.piruetaUsada) { SOM.semCarga(); return; }
    r.corpo.setVelocityY(pf.piruetaVY);
    r.corpo.setVelocityX(r.corpo.body.velocity.x + r.face * pf.piruetaVX * 0.5);
    r.piruetaUsada = true;
    r.pulando = false;                   // o pulo variavel nao corta a pirueta
    r.habCd = pf.piruetaCd;
    r.girando = 420;
    r.mergulhando = false;
    r.sx = 0.72; r.sy = 1.36;
    SOM.pulo(); SOM.escudoApara();       // "fiu-tin": giro curto e brilhante
    if (!POUCO_MOV) cena.pDash[r.id].explode(10, r.corpo.x, r.corpo.y + 8);
    avisoHab(cena, r, 'PIRUETA!');
    if (cena.contaHabilidade) cena.contaHabilidade(r);

  } else if (pf.hab === 'escudo') {
    if (r.escudando) { SOM.semCarga(); return; }
    r.escudando = true;
    r.escudoT = pf.escudoDur;
    r.habCd = pf.escudoDur + pf.escudoCd;
    SOM.escudoLiga();
    if (!POUCO_MOV) cena.pDash[r.id].explode(12, r.corpo.x, r.corpo.y);
    avisoHab(cena, r, 'ESCUDO!');
    if (cena.contaHabilidade) cena.contaHabilidade(r);
  }
}

// Mergulho / pisao: os dois caem rapido, mas so o pisao BATE no telhado.
function iniciaBaixoAr(cena, r) {
  var pf = r.pf;
  if (pf.baixoAr === 'mergulho') {
    if (r.mergulhando) return;
    r.mergulhando = true;
    r.corpo.setVelocityY(pf.mergulhoVY);       // mantem o vx: e uma descida rapida
    r.sx = 0.8; r.sy = 1.25;
    SOM.pisaoDesce();
  } else if (pf.baixoAr === 'pisao') {
    if (r.pisando || r.pisaoCd > 0) return;
    r.pisando = true;
    r.pisaoCd = pf.pisaoCd;
    r.dashT = 0; r.dashando = false;
    r.sx = 0.72; r.sy = 1.34;
    SOM.pisaoDesce();
  }
}

// avisozinho escrito da habilidade (tambem serve de indicador visual para
// quem joga sem som, quando as LEGENDAS estao ligadas)
function avisoHab(cena, r, s) {
  if (POUCO_MOV && !LEGENDAS) return;
  balao(cena, r.corpo.x, r.corpo.y - 30, s, r.luz);
}

// o escudo aparou alguma coisa: mostra e devolve true (quem chamou decide)
function escudoAparou(cena, r) {
  if (!r.escudando) return false;
  SOM.escudoApara();
  r.invenc = Math.max(r.invenc, 260);
  if (!POUCO_MOV) {
    cena.pDash[r.id].explode(10, r.corpo.x, r.corpo.y);
    r.sx = 1.25; r.sy = 0.85;
  }
  return true;
}

// Espelha o desenho na fisica: posicao, squash & stretch, animacao e piscada.
// "tempo" so e usado pelos efeitos que pulsam (bolha do escudo).
function sincronizaCorredor(r, tempo) {
  var b = r.corpo.body;
  r.sx += (1 - r.sx) * 0.18;
  r.sy += (1 - r.sy) * 0.18;
  r.spr.setScale(r.sx, r.sy);
  r.spr.flipX = r.face < 0;

  // A pirueta roda o boneco de verdade. Para o giro ficar no meio do corpo (e
  // nao no calcanhar), a origem vai para o centro durante o giro e o Y e
  // compensado; terminado o giro tudo volta ao normal.
  if (r.girando > 0) {
    if (r.spr.originY !== 0.5) r.spr.setOrigin(0.5, 0.5);
    r.spr.x = r.corpo.x;
    r.spr.y = r.corpo.y + 18 - 22 * r.sy;
    r.spr.angle = (1 - r.girando / 420) * 360 * (r.face < 0 ? -1 : 1);
  } else {
    if (r.spr.originY !== 1) { r.spr.setOrigin(0.5, 1); r.spr.angle = 0; }
    r.spr.x = r.corpo.x;
    r.spr.y = r.corpo.y + 18;
  }

  var anim;
  if (r.girando > 0) anim = 'gira';
  else if (r.dashando) anim = 'dash';
  else if (r.pisando || r.mergulhando) anim = 'pisao';
  else if (!r.noChao) anim = (b.velocity.y < 0 ? 'pula' : 'cai');
  else anim = (Math.abs(b.velocity.x) > 25 ? 'corre' : 'parado');
  if (r.animAtual !== anim) { r.animAtual = anim; r.spr.play(r.pre + anim, true); }
  r.spr.setAlpha(r.invenc > 0 ? (Math.floor(r.invenc / 70) % 2 ? 0.3 : 1) : 1);
  r.spr.setVisible(!r.eliminado && !r.morto);

  // efeitos das habilidades acompanham o boneco
  var vivo = !r.eliminado && !r.morto;
  if (r.bolha) { if (vivo) pintaEscudo(r, tempo || 0); else r.bolha.setVisible(false); }
  if (r.aura) { if (vivo) pintaCargas(r); else r.aura.setVisible(false); }
}

// Efeito de queda (comico, sem violencia): "puf" de poeira, estrelinhas de
// tontura e um tremidinho de camera. O boneco some e reaparece inteiro.
function explodeMorte(cena, r, cam) {
  if (!POUCO_MOV) {
    cena.pPoeira.explode(16, r.corpo.x, r.corpo.y);
    cena.pMoeda.explode(7, r.corpo.x, r.corpo.y - 12);
    (cam || cena.cameras.main).shake(200, 0.009);
    // o boneco sai rodopiando para cima e cai fora da tela (o corpo de
    // verdade some na hora e volta inteiro no checkpoint)
    if (r.spr && r.spr.visible) {
      var fan = cena.add.sprite(r.spr.x, r.spr.y, r.spr.texture.key, r.spr.frame.name).setOrigin(0.5, 1)
        .setFlipX(r.spr.flipX).setDepth(r.spr.depth + 1);
      var lado = r.face < 0 ? 1 : -1;
      cena.tweens.add({ targets: fan, x: fan.x + lado * 40, y: fan.y - 50, angle: lado * 220, duration: 280, ease: 'Quad.easeOut',
        onComplete: function () {
          cena.tweens.add({ targets: fan, y: fan.y + 140, alpha: 0, angle: lado * 420, duration: 440, ease: 'Quad.easeIn',
                            onComplete: function () { fan.destroy(); } });
        } });
      FX.anel(cena, r.corpo.x, r.corpo.y, 0xffffff, 40, 260);
    }
  }
  SOM.morte();
}

// ---- Textos voadores reaproveitados ---------------------------------------
// Baloes, pontos e avisos aparecem o tempo todo. Criar e destruir um objeto de
// texto a cada vez aloca uma textura nova; a cena guarda os que ja terminaram,
// separados por tamanho de fonte, e reaproveita. Limite de 20 por tamanho:
// passando disso o mais antigo e reciclado na hora (nada cresce sem fim).
function textoVoador(cena, x, y, s, tam, cor) {
  var mapa = cena._poolTxt;
  if (!mapa) {
    mapa = cena._poolTxt = {};
    // A cena e REAPROVEITADA no restart, mas os objetos dela sao destruidos:
    // sem isto o pool guardaria textos mortos e o Phaser quebraria ao usa-los.
    cena.events.once('shutdown', function () { cena._poolTxt = null; });
  }
  var lista = mapa[tam] || (mapa[tam] = { itens: [], prox: 0 });
  var t = null, i;
  for (i = 0; i < lista.itens.length; i++) if (!lista.itens[i].active) { t = lista.itens[i]; break; }
  if (!t) {
    if (lista.itens.length >= 20) {
      t = lista.itens[lista.prox];                  // recicla o mais antigo
      lista.prox = (lista.prox + 1) % lista.itens.length;
      cena.tweens.killTweensOf(t);
    } else {
      t = txt(cena, x, y, s, tam, cor);
      lista.itens.push(t);
    }
  }
  t.setActive(true).setVisible(true).setAlpha(1).setScale(1).setAngle(0);
  t.setPosition(x, y).setText(s).setColor(cor || C.ui).setOrigin(0.5);
  t.setScrollFactor(1).setDepth(30);
  return t;
}
function guardaTexto(t) { t.setActive(false).setVisible(false); }

// Legenda de acessibilidade: quando "AVISOS ESCRITOS" esta ligado, o que os
// sons avisam tambem aparece escrito no rodape da tela. Quem joga sem audio
// (ou com o som baixo) nao perde o aviso do chefe nem o "NOVO RECORDE".
function legenda(cena, texto, cor) {
  if (!LEGENDAS) return;
  var t = cena._legenda;
  if (!t) {
    t = cena._legenda = txt(cena, LARG / 2, ALT - 58, '', 9, C.ui)
      .setScrollFactor(0).setDepth(220);
    cena.events.once('shutdown', function () { cena._legenda = null; });
  }
  cena.tweens.killTweensOf(t);
  t.setText('[ ' + texto + ' ]').setColor(cor || C.ui).setAlpha(1);
  cena.tweens.add({ targets: t, alpha: 0, delay: 1400, duration: 500 });
}

// Balaozinho de texto que sobe e some (quedas, esbarroes, a Cócó zombando).
// Fica no mundo: na Perseguicao aparece nas duas metades da tela.
var FRASES_QUEDA = ['BUÁÁÁ!', 'OPA!', 'ESCORREGOU!', 'QUE TOMBO!', 'AI, O EMPREGO!', 'JÁ ERA O EMPREGO!'];
function fraseQueda() { return FRASES_QUEDA[(Math.random() * FRASES_QUEDA.length) | 0]; }
function balao(cena, x, y, s, cor) {
  var b = textoVoador(cena, x, y, s, 10, cor);
  cena.tweens.add({ targets: b, y: y - 34, alpha: 0, delay: 380, duration: 720,
                    onComplete: function () { guardaTexto(b); } });
  return b;
}
// Pontos ganhos subindo do lugar onde foram feitos ("+100", "COMBO x4").
// "sobe" mais alto e "pula" um pouco no comeco: le bem no meio da acao.
function pontosVoando(cena, x, y, s, cor, tam) {
  var b = textoVoador(cena, x, y, s, tam || 11, cor || C.moeda);
  b.setScale(POUCO_MOV ? 1 : 0.5);
  if (!POUCO_MOV) cena.tweens.add({ targets: b, scale: 1, duration: 180, ease: 'Back.easeOut' });
  cena.tweens.add({ targets: b, y: y - 42, alpha: 0, delay: 300, duration: 620,
                    onComplete: function () { guardaTexto(b); } });
  return b;
}

// ============================================================================
//  MONTAGEM DO MUNDO a partir dos mapas ASCII
// ============================================================================
// completa linhas curtas com "." (da para editar o mapa sem contar colunas)
function normalizaMapa(mapa) {
  var w = 0, i, s, g = [];
  for (i = 0; i < mapa.length; i++) w = Math.max(w, mapa[i].length);
  for (i = 0; i < mapa.length; i++) {
    s = mapa[i];
    while (s.length < w) s += '.';
    g.push(s);
  }
  return g;
}
// Junta os blocos solidos em poucos retangulos. Isso evita que o jogador
// "engate" nas emendas entre corpos vizinhos e deixa a fisica bem mais leve.
function juntaRetangulos(g) {
  var h = g.length, w = g[0].length, usado = [], y, x, x2, y2, ok, i, yy;
  for (y = 0; y < h; y++) usado.push(new Array(w));
  // ":" (telha trincada) e "A" (escorregadia) tem colisao propria, entao nao
  // entram na juncao de retangulos; "#" continua sendo o telhado comum.
  var solido = function (xx, yy2) { return g[yy2].charAt(xx) === '#'; };
  var res = [];
  for (y = 0; y < h; y++) {
    for (x = 0; x < w; x++) {
      if (usado[y][x] || !solido(x, y)) continue;
      x2 = x;
      while (x2 + 1 < w && !usado[y][x2 + 1] && solido(x2 + 1, y)) x2++;
      y2 = y;
      for (;;) {
        if (y2 + 1 >= h) break;
        ok = true;
        for (i = x; i <= x2; i++) if (usado[y2 + 1][i] || !solido(i, y2 + 1)) { ok = false; break; }
        if (!ok) break;
        y2++;
      }
      for (yy = y; yy <= y2; yy++) for (i = x; i <= x2; i++) usado[yy][i] = true;
      res.push({ x: x, y: y, w: x2 - x + 1, h: y2 - y + 1 });
    }
  }
  return res;
}
// Cria os corpos estaticos (invisiveis) a partir dos retangulos juntados
function criaSolidos(grupo, rets, offX, offY) {
  var lista = [], i, r, s;
  for (i = 0; i < rets.length; i++) {
    r = rets[i];
    s = grupo.create(offX + r.x * T + r.w * T / 2, offY + r.y * T + r.h * T / 2, 'branco');
    s.setVisible(false);
    s.setDisplaySize(r.w * T, r.h * T);
    s.refreshBody();
    lista.push(s);
  }
  return lista;
}
// Desenha os blocos em "fatias" de 32 colunas: 1 imagem por fatia em vez de
// centenas de sprites. O bloco de cima vira telhado; os de baixo viram parede
// (algumas colunas ganham uma janela acesa logo abaixo do beiral).
function montaFatias(cena, g, chaveBase, offX, offY, prof) {
  var w = g[0].length, h = g.length, imgs = [], texs = [];
  var COLS = 32, n = Math.ceil(w / COLS), s, x, y, temAlgo, c0, c1, chave;
  for (s = 0; s < n; s++) {
    c0 = s * COLS; c1 = Math.min(w, c0 + COLS); temAlgo = false;
    for (y = 0; y < h && !temAlgo; y++) {
      for (x = c0; x < c1; x++) if (g[y].charAt(x) === '#') { temAlgo = true; break; }
    }
    if (!temAlgo) continue;
    chave = chaveBase + '_' + s;
    criaTex(cena, chave, (c1 - c0) * T, h * T, function (ctx) {
      for (var yy = 0; yy < h; yy++) {
        for (var xx = c0; xx < c1; xx++) {
          if (g[yy].charAt(xx) !== '#') continue;
          var topo = (yy === 0) || g[yy - 1].charAt(xx) !== '#';
          var chaveBloco = topo ? 'bloco_topo' : 'bloco_meio';
          if (!topo && (yy < 2 || g[yy - 2].charAt(xx) !== '#') && (xx * 7 + yy * 3) % 5 === 0) {
            chaveBloco = 'bloco_janela';
          }
          ctx.drawImage(ART[chaveBloco], (xx - c0) * T, yy * T);
        }
      }
    });
    imgs.push(cena.add.image(offX + c0 * T, offY, chave).setOrigin(0, 0).setDepth(prof === undefined ? 4 : prof));
    texs.push(chave);
  }
  return { imgs: imgs, texs: texs };
}
// Mato e buraco: o desenho e uma imagem comum e a area que derruba
// e um corpo estatico invisivel menor que o bloco (da para passar rente sem cair).
// O mato balanca (ou enverga, se a cena marcou "ventoForte"); cada touceira
// comeca num quadro conforme a coluna, entao o balanco corre pelo telhado
// como uma onda. Com "pouco movimento" ligado ele fica parado.
function criaPerigo(cena, grupo, tipo, px, py) {
  var esp = (tipo === '^'), img;
  if (esp && !POUCO_MOV) {
    img = cena.add.sprite(px, py, 'espinho').setOrigin(0, 0).setDepth(6);
    img.play({ key: cena.ventoForte ? 'mato_vento' : 'mato_brisa', startFrame: Math.floor(px / T) % 4 });
  } else {
    img = cena.add.image(px, py, esp ? 'espinho' : 'lava').setOrigin(0, 0).setDepth(6);
  }
  var bw = esp ? 26 : 32, bh = esp ? 16 : 26;
  var bx = px + (esp ? 3 : 0), by = py + (esp ? 16 : 6);
  var corpo = grupo.create(bx + bw / 2, by + bh / 2, 'branco');
  corpo.setVisible(false);
  corpo.setDisplaySize(bw, bh);
  corpo.refreshBody();
  corpo.setData('tipo', tipo);          // '^' mato  |  'L' buraco
  return { img: img, corpo: corpo };
}
// Item que so precisa de sobreposicao (moeda, bandeira, checkpoint):
// sprite com fisica desligada, para poder animar normalmente.
function criaItem(cena, x, y, chave, anim, prof) {
  var s = cena.physics.add.sprite(x, y, chave).setDepth(prof === undefined ? 7 : prof);
  s.body.setAllowGravity(false);
  s.body.setImmovable(true);
  if (anim) s.play(anim);
  return s;
}

  fechaModal: function () {
    var c = this.ctr, i;
    if (!c) return;
    if (c.listaDlg) { c.listaDlg.destroi(); c.listaDlg = null; }
    if (!c.modal) return;
    for (i = 0; i < c.modal.length; i++) { this.tweens.killTweensOf(c.modal[i]); c.modal[i].destroy(); }
    c.modal = null;
  },
  cancelaCaptura: function () {
    var c = this.ctr;
    if (!c) return;
    c.capturando = null;
    this.fechaModal();
    SOM.voltar();
    this.pintaControles();
  },

  // chega uma tecla enquanto a captura esta aberta
  teclaCapturada: function (ev) {
    var c = this.ctr, cap = c && c.capturando, cod;
    if (!cap || cap.trava > 0 || c.listaDlg) return;
    cod = ev.keyCode;
    if (ev.preventDefault) ev.preventDefault();
    if (cod === 27) { this.cancelaCaptura(); return; }
    // BACKSPACE apaga a tecla daquela coluna (se sobrar pelo menos uma)
    if (cod === 8) {
      if (Controles.limpa(c.jog, cap.acao, cap.slot)) {
        SOM.ok(); c.capturando = null; this.fechaModal(); this.pintaControles();
      } else {
        this.avisaModal('CADA AÇÃO PRECISA DE PELO MENOS UMA TECLA');
      }
      return;
    }
    if (TECLAS_PROIBIDAS[cod]) {
      this.avisaModal('A TECLA ' + nomeTecla(cod) + ' NÃO PODE SER USADA');
      return;
    }
    var conf = Controles.conflito(cod, c.jog, cap.acao);
    if (conf && conf.fixo) {
      this.avisaModal(nomeTecla(cod) + ' JÁ É UM ATALHO DO JOGO (' + conf.nome + ')');
      return;
    }
    if (conf) { this.perguntaConflito(cod, conf); return; }
    this.aplicaTecla(cod, false);
  },
  // recado curto dentro da janela de captura, sem fechar a captura
  avisaModal: function (s) {
    var c = this.ctr;
    if (!c || !c.modal) return;
    SOM.voltar();
    var t = txt(this, LARG / 2, 306, s, 8, C.perigo).setDepth(62);
    c.modal.push(t);
    if (!POUCO_MOV) this.tweens.add({ targets: t, alpha: 0.35, duration: 260, yoyo: true, repeat: 2 });
  },

    var cena = this, c = this.ctr, i;

      { rot: 'CANCELAR', acao: function () { cena.cancelaCaptura(); } }
    ], 30, 11);
    var objsD = c.listaDlg.textos.concat([c.listaDlg.seta]);
    for (i = 0; i < objsD.length; i++) objsD[i].setDepth(62);
    c.listaDlg.realce.setDepth(61.5);

    if (this.lista) this.lista.fixa(22);
    // entrada suave da pagina (as paginas nao trocam mais "no seco")
    surgir(this, this.objs.concat(this.lista ? this.lista.objetos() : []), 180);
  },

  update: function (tempo, delta) {
    var dt = Math.min(delta, 34);
    // a tecla M continua valendo e a tela de configuracoes acompanha
    if (checaMudo(this.teclas) && this.pagina === 'config') this.pintaConfig();

    // parallax lento so para o fundo nao ficar parado
    this.mont.tilePositionX += dt * 0.004;
    this.morr.tilePositionX += dt * 0.010;

    // ---- perseguicao de fundo (ciclo de 7,6s): a Cócó corre, bota ovos de
    //      susto, o Koburo pega os ovos e o Tobias da um dash para alcancar ----
    var tAnt = this.demoT, q;
    this.demoT = (this.demoT + dt) % 7600;
    if (this.demoT < tAnt) {                         // recomecou: some com os ovos que sobraram
      for (q = 0; q < this.ovosDemo.length; q++) this.ovosDemo[q].destroy();
      this.ovosDemo = [];
    }
    var t = this.demoT, gx = -60 + t * 0.19;
    this.cocoDemo.x = gx;
    this.demo1.x = gx - 150;
    var dashando = (t >= 2700 && t < 2950);
    this.demo2.x = gx - 330 + (t < 2700 ? 0 : (dashando ? 110 * (t - 2700) / 250 : 110));
    var an2 = dashando ? 'p2_dash' : 'p2_corre';
    if (this.demo2.anims.getName() !== an2) this.demo2.play(an2, true);
    if (dashando && !POUCO_MOV) this.pDash[2].explode(2, this.demo2.x - 14, this.demo2.y - 16);
    this.falaCoco.x = gx;
    this.falaCoco.setAlpha(t > 700 && t < 1900 ? 1 : 0);
    // a Cócó bota um ovo de susto: pulinho assustado, pouso orgulhoso, e o
    // ovo dourado "salta" e fica para tras (o Koburo pega quando passa)
    if ((tAnt < 1900 && t >= 1900) || (tAnt < 3900 && t >= 3900)) {
      var ov = this.add.sprite(gx - 8, 446, 'moeda0').setOrigin(0.5, 1).setDepth(4).setScale(0.3).play('moeda_gira');
      this.tweens.add({ targets: ov, scale: 1, duration: 200, ease: 'Back.easeOut' });
      this.ovosDemo.push(ov);
      this.cocoDemo.play('coco_ovo');
      this.botando = 420;
    }
    if (this.botando > 0) {
      this.botando -= dt;
      if (this.botando <= 0) this.cocoDemo.play('coco_corre');
    }
    for (q = this.ovosDemo.length - 1; q >= 0; q--) {
      if (this.demo1.x >= this.ovosDemo[q].x) {
        if (!POUCO_MOV) this.pMoeda.explode(8, this.ovosDemo[q].x, 438);
        this.ovosDemo[q].destroy();
        this.ovosDemo.splice(q, 1);
      }
    }

    // ---- navegacao ----
    // Enquanto a pagina CONTROLES espera uma tecla (ou pergunta sobre um
    // conflito), a lista da pagina fica congelada: qualquer tecla apertada
    // ali e resposta da janelinha, nao comando de menu.
    if (this.ctr) {
      var cap = this.ctr.capturando;
      if (cap && cap.trava > 0) cap.trava -= dt;
      if (this.ctr.listaDlg) { this.ctr.listaDlg.atualiza(this.teclas, dt); return; }
      if (cap) { if (JD(this.teclas.esc) || TOQUE.ap('voltar')) this.cancelaCaptura(); return; }
    }
    if (this.lista) this.lista.atualiza(this.teclas, dt);
    if (this.pagina === 'personagens') this.teclasPers(dt);
    if ((JD(this.teclas.esc) || TOQUE.ap('voltar')) && this.pagina !== 'principal') {
      SOM.voltar();
      var volta = VOLTA_PAGINA[this.pagina] || ['principal', 0];
      this.abre(volta[0], volta[1]);
    }
    if (this.pagina === 'fases' && JD(this.teclas.r)) { SOM.voltar(); this.abre('apagar'); }
  },

  // ---- pagina PERSONAGENS ----------------------------------------------------
  // um cartao por personagem: retrato com o boneco animado (4x), nome, apelido
  // e a historia. O cartao inteiro e clicavel.
  criaCartao: function (i) {
    var cena = this, p = PERSONAGENS[i], o = this.objs, k;
    var x0 = 50 + i * 440, y0 = 58, w = 420, h = 420, cx = x0 + w / 2;
    o.push(painel(this, x0, y0, w, h));
    o.push(this.add.image(cx, y0 + 10, 'retrato' + p.id).setOrigin(0.5, 0));
    // os pes do boneco ficam 5px acima da borda do quadro (20px em 4x): assim
    // ele pisa exatamente no telhado do retrato
    var baseY = y0 + 10 + 168 + 20;
    var boneco = this.add.sprite(cx, baseY, 'p' + p.id + '_parado0').setOrigin(0.5, 1).setScale(4);
    boneco.play('p' + p.id + '_parado');
    o.push(boneco);
    o.push(txt(this, cx, y0 + 206, p.nome, 14, p.luz));
    // etiqueta do estilo de jogo: e a informacao que decide a escolha
    var gEst = this.add.graphics();
    var tEst = txt(this, cx, y0 + 228, p.estilo, 9, C.escuro);
    tEst.setShadow(0, 0, C.escuro, 0, false, false);
    var lw = Math.round(tEst.width) + 26;
    gEst.fillStyle(N.escuro, 1); gEst.fillRect(cx - lw / 2 - 1, y0 + 217, lw + 2, 24);
    gEst.fillStyle(p.id === 1 ? N.p1luz : N.p2luz, 1); gEst.fillRect(cx - lw / 2, y0 + 218, lw, 22);
    o.push(gEst, tEst);
    tEst.setDepth(21);
    o.push(txt(this, cx, y0 + 248, p.apelido, 8, C.cinza));
    for (k = 0; k < p.historia.length; k++) {
      o.push(txt(this, cx, y0 + 268 + k * 14, p.historia[k], 7, C.ui));
    }
    // ---- habilidades, com a tecla de cada uma (lida dos controles atuais) ----
    var sep = this.add.graphics();
    sep.fillStyle(N.painelLuz, 1); sep.fillRect(x0 + 24, y0 + 322, w - 48, 1);
    o.push(sep);
    for (k = 0; k < p.habilidades.length; k++) {
      var hb = p.habilidades[k], hy = y0 + 336 + k * 22;
      var cods = Controles.teclasDe(p.id, hb.tecla);
      var tecla = cods.length ? nomeTecla(cods[0], true) : '-';
      var tv = teclaVisual(this, x0 + 24, hy, tecla);
      o = o.concat(tv.objs);
      this.objs = o;
      o.push(txt(this, x0 + 32 + tv.w, hy - 6, hb.nome, 8, p.luz, 0));
      o.push(txt(this, x0 + 32 + tv.w, hy + 7, hb.desc, 7, C.cinza, 0));
    }
    var status = txt(this, cx, y0 + 404, '', 8, C.cinza);
    o.push(status);
    var zona = this.add.zone(x0, y0, w, h).setOrigin(0).setInteractive({ useHandCursor: true });
    zona.on('pointerover', function () { cena.focaPers(i); });
    zona.on('pointerdown', function () { cena.focaPers(i); cena.escolhePers(i); });
    o.push(zona);
    this.pers.cards.push({ x: x0, y: y0, w: w, h: h, cx: cx, baseY: baseY,
                           boneco: boneco, status: status, p: p });
  },

  // foco: 0 e 1 = cartoes, 2 = VOLTAR
  focaPers: function (f) {
    var p = this.pers;
    if (!p || p.foco === f) return;
    p.foco = f;
    if (f < 2) p.ultimoCard = f;
    SOM.mover();
    this.pintaPers();
  },
  escolhePers: function (i) {
    var p = this.pers, c = p && p.cards[i];
    if (!c) return;
    Save.escolhePersonagem(c.p.id);
    SOM.ok();
    this.pintaPers();
    balao(this, c.cx, c.y + 44, c.p.grito, c.p.luz);
    // pulinho de alegria (sem pulinho se o jogador pediu menos movimento)
    var b = c.boneco, pre = 'p' + c.p.id + '_';
    this.tweens.killTweensOf(b);
    b.y = c.baseY;
    if (!POUCO_MOV) {
      b.play(pre + 'pula');
      this.tweens.add({ targets: b, y: c.baseY - 26, duration: 170, yoyo: true, ease: 'Quad.easeOut',
                        onComplete: function () { b.play(pre + 'parado'); } });
    }
  },
  pintaPers: function () {
    var p = this.pers, esc = Save.personagem() - 1, k, c, v;
    if (!p) return;
    p.gEscolha.clear(); p.gFoco.clear();
    for (k = 0; k < p.cards.length; k++) {
      c = p.cards[k];
      c.status.setText(k === esc ? 'ESCOLHIDO PARA A CAMPANHA!' : 'ENTER OU CLIQUE PARA ESCOLHER');
      c.status.setColor(k === esc ? C.moeda : C.cinza);
      if (k === esc) {                         // moldura dourada: o escolhido
        p.gEscolha.lineStyle(4, N.moeda, 1);
        p.gEscolha.strokeRect(c.x - 6, c.y - 6, c.w + 12, c.h + 12);
      }
      if (k === p.foco) {                      // moldura branca piscando: o cursor
        p.gFoco.lineStyle(2, N.ui, 1);
        p.gFoco.strokeRect(c.x - 10, c.y - 10, c.w + 20, c.h + 20);
      }
    }
    v = p.voltar;
    v.setColor(p.foco === 2 ? C.moeda : C.ui);
    p.seta.setVisible(p.foco === 2);
    p.seta.setPosition(v.x - v.width / 2 - 20, v.y);
  },
  teclasPers: function (dt) {
    var t = this.teclas, p = this.pers;
    if (!p) return;
    if (p.trava > 0) p.trava -= dt;
    if (JD(t.esq) || JD(t.a)) this.focaPers(0);
    if (JD(t.dir) || JD(t.d)) this.focaPers(1);
    if (JD(t.baixo) || JD(t.s)) this.focaPers(2);
    if ((JD(t.cima) || JD(t.w)) && p.foco === 2) this.focaPers(p.ultimoCard);
    if ((JD(t.enter) || JD(t.espaco)) && p.trava <= 0) {
      if (p.foco === 2) { SOM.voltar(); this.abre('principal', 4); }
      else this.escolhePers(p.foco);
    }
  }
});

// ============================================================================
//  EFEITOS (FX) - particulas, brilhos, anel de choque, rastro e "hitstop"
//  ---------------------------------------------------------------------------
//  Tudo respeita o POUCO_MOV: com menos movimento ligado nao ha tremor,
//  flash nem congelada, e as particulas caem para uma fracao. Os emissores
//  sao criados uma vez por cena (sob demanda) e reaproveitados; as
//  particulas nascem em coordenadas do mundo (o emissor fica parado em 0,0).
// ============================================================================
var FX = {
  emissores: function (cena) {
    if (cena._fx) return cena._fx;
    var fx = cena._fx = {};
    fx.brasa = cena.add.particles(0, 0, 'pixel', {
      lifespan: { min: 500, max: 1100 }, speedX: { min: -40, max: 40 }, speedY: { min: -110, max: -30 },
      scale: { start: 0.9, end: 0 }, alpha: { start: 1, end: 0 }, gravityY: -30,
      tint: [0xff2438, 0xd7192c, 0xff6a3d, 0xffd2d6], blendMode: 'ADD', emitting: false
    }).setDepth(12);
    fx.fumaca = cena.add.particles(0, 0, 'fumaca', {
      lifespan: { min: 700, max: 1400 }, speedX: { min: -26, max: 26 }, speedY: { min: -48, max: -12 },
      scale: { start: 0.9, end: 2.4 }, alpha: { start: 0.6, end: 0 },
      tint: [0x0a090d, 0x29272b, 0x3d0b16], emitting: false
    }).setDepth(11);
    fx.faisca = cena.add.particles(0, 0, 'pixel', {
      lifespan: { min: 220, max: 480 }, speed: { min: 120, max: 340 }, angle: { min: 0, max: 360 },
      scale: { start: 0.8, end: 0 }, gravityY: 500, tint: [0xffffff, 0xff2438, 0xffcd75],
      blendMode: 'ADD', emitting: false
    }).setDepth(13);
    fx.luz = cena.add.particles(0, 0, 'pixel', {
      lifespan: { min: 900, max: 1800 }, speedX: { min: -24, max: 24 }, speedY: { min: -64, max: -14 },
      scale: { start: 1, end: 0 }, alpha: { start: 1, end: 0 }, tint: [0xffffff, 0xfff0b8, 0xffcd75],
      blendMode: 'ADD', emitting: false
    }).setDepth(14);
    // vapor branco que sai dos robos (escapamento, superaquecimento)
    fx.vapor = cena.add.particles(0, 0, 'fumaca', {
      lifespan: { min: 600, max: 1200 }, speedX: { min: -30, max: 30 }, speedY: { min: -70, max: -25 },
      scale: { start: 0.7, end: 2.2 }, alpha: { start: 0.55, end: 0 }, tint: [0xdfe8f0, 0xb8c2d6, 0xffffff],
      emitting: false
    }).setDepth(11);
    // chama do propulsor (para baixo)
    fx.jato = cena.add.particles(0, 0, 'pixel', {
      lifespan: { min: 160, max: 320 }, speedX: { min: -30, max: 30 }, speedY: { min: 160, max: 280 },
      scale: { start: 1.2, end: 0 }, tint: [0xffcd75, 0xef7d57, 0xffffff], blendMode: 'ADD', emitting: false
    }).setDepth(10);
    // pecas soltas (chapinhas e parafusos) pulando de uma pane
    fx.pecas = cena.add.particles(0, 0, 'peca', {
      lifespan: { min: 700, max: 1100 }, speed: { min: 90, max: 220 }, angle: { min: 200, max: 340 },
      gravityY: 700, rotate: { min: 0, max: 720 }, alpha: { start: 1, end: 0.6 }, emitting: false
    }).setDepth(12);
    fx.pena = cena.add.particles(0, 0, 'pena_branca', {
      lifespan: { min: 900, max: 1700 }, speed: { min: 40, max: 170 }, angle: { min: 200, max: 340 },
      gravityY: 150, rotate: { min: 0, max: 360 }, alpha: { start: 1, end: 0 }, emitting: false
    }).setDepth(12);
    cena.events.once('shutdown', function () { cena._fx = null; });
    return fx;
  },
  qtd: function (n) { return POUCO_MOV ? Math.max(1, Math.round(n / 4)) : n; },
  solta: function (cena, tipo, n, x, y) { FX.emissores(cena)[tipo].explode(FX.qtd(n), x, y); },
  // brilho que acende e some (blendMode ADD; o tint da a cor)
  brilho: function (cena, x, y, cor, esc, ms, prof) {
    var im = cena.add.image(x, y, 'luz_rad').setBlendMode('ADD').setTint(cor).setDepth(prof || 12)
      .setScale(esc * 0.6).setAlpha(0.95);
    cena.tweens.add({ targets: im, scale: esc, alpha: 0, duration: ms || 380, ease: 'Quad.easeOut',
                      onComplete: function () { im.destroy(); } });
    return im;
  },
  // anel de choque que cresce e some ("achata" deixa ele em perspectiva)
  anel: function (cena, x, y, cor, raio, ms, achata) {
    var a = achata || 1;
    var im = cena.add.image(x, y, 'anel').setTint(cor).setDepth(12).setScale(0.1, 0.1 * a).setBlendMode('ADD');
    cena.tweens.add({ targets: im, scaleX: raio / 48, scaleY: raio / 48 * a, alpha: 0, duration: ms || 420,
                      ease: 'Cubic.easeOut', onComplete: function () { im.destroy(); } });
    return im;
  },
  // impacto: brilho + anel + faiscas + tremor (o pacote de "acertou forte")
  impacto: function (cena, x, y, cor, forca) {
    var f = forca || 1;
    FX.brilho(cena, x, y, cor, 0.8 * f, 300);
    if (!POUCO_MOV) FX.anel(cena, x, y, cor, 70 * f, 360, 0.6);
    FX.solta(cena, 'faisca', Math.round(12 * f), x, y);
    if (!POUCO_MOV) cena.cameras.main.shake(140 + 80 * f, 0.004 + 0.004 * f);
  },
  // imagem-fantasma do quadro atual (rastro de investida)
  rastro: function (cena, spr, cor, ms) {
    if (POUCO_MOV) return;
    var g = cena.add.image(spr.x, spr.y, spr.texture.key, spr.frame.name).setOrigin(spr.originX, spr.originY)
      .setFlipX(spr.flipX).setScale(spr.scaleX, spr.scaleY).setDepth(spr.depth - 0.5)
      .setTintFill(cor).setAlpha(0.45).setBlendMode('ADD');
    cena.tweens.add({ targets: g, alpha: 0, duration: ms || 260, onComplete: function () { g.destroy(); } });
  },
  // congela a fisica por alguns ms: o "peso" de um golpe certeiro
  hitstop: function (cena, ms) {
    if (POUCO_MOV || cena.hitstopT > 0 || !cena.physics) return;
    cena.physics.pause();
    cena.hitstopT = ms;
  },
  flash: function (cena, ms, r, g, b) {
    if (POUCO_MOV) return;
    cena.cameras.main.flash(ms || 120, r === undefined ? 255 : r, g === undefined ? 255 : g, b === undefined ? 255 : b);
  }
};

// ---- AURA: o campo de energia dos robos -------------------------------------
// Brilho ADD do reator atras do corpo, faiscas pulando e arcos eletricos em
// zigue-zague em volta da carcaca. "alvoForca" (0 a 1) controla tudo e a
// forca real anda devagar ate ela; "instavel" faz o campo falhar (pane).
function Aura(cena, cor, prof) {
  var p = prof || 7;
  this.cena = cena; this.cor = cor || 0xff2438;
  this.forca = 0.5; this.alvoForca = 0.5; this.instavel = false; this.visivel = true;
  this.t = 0; this.tArco = 0; this.tBrasa = 0;
  this.luz = cena.add.image(0, 0, 'luz_rad').setBlendMode('ADD').setTint(this.cor).setDepth(p - 0.6);
  this.arcos = cena.add.graphics().setDepth(p + 0.4).setBlendMode('ADD');
  // faiscas eletricas: pulam e caem (nada de brasa flutuando)
  this.brasa = cena.add.particles(0, 0, 'pixel', {
    lifespan: { min: 300, max: 700 }, speedX: { min: -70, max: 70 }, speedY: { min: -120, max: -20 },
    gravityY: 420, scale: { start: 0.7, end: 0 }, alpha: { start: 1, end: 0 },
    tint: [0xffffff, 0xffcd75, 0xff6a6a, 0x9fe8ff], blendMode: 'ADD', emitting: false
  }).setDepth(p + 0.2);
}
Aura.prototype.atualiza = function (dt, x, yPes, alt, larg) {
  this.t += dt;
  this.forca += (this.alvoForca - this.forca) * Math.min(1, dt / 260);
  var f = this.forca, pulso = POUCO_MOV ? 0 : Math.sin(this.t / 160) * 0.08;
  if (this.instavel && !POUCO_MOV && Math.random() < 0.08) pulso -= 0.35;   // engasga
  var vis = this.visivel && f > 0.02, cy = yPes - alt * 0.5, k, j;
  this.luz.setVisible(vis).setPosition(x, cy)
    .setScale((alt / 84) * (0.8 + f * 0.8) * (1 + pulso)).setAlpha(limita(0.15 + f * 0.5 + pulso, 0, 1));
  // brasas nascendo em volta do corpo (mais forca = mais brasas)
  this.tBrasa -= dt;
  if (vis && !POUCO_MOV && f > 0.08 && this.tBrasa <= 0) {
    this.tBrasa = Math.max(14, 130 - f * 110);
    this.brasa.emitParticleAt(x + (Math.random() - 0.5) * larg * 1.2, yPes - Math.random() * alt, 1);
  }
  // arcos de energia redesenhados de tempos em tempos
  this.tArco -= dt;
  if (this.tArco <= 0) {
    this.tArco = 90 + Math.random() * 120;
    this.arcos.clear();
    if (vis && !POUCO_MOV) {
      var n = Math.round(f * 3.4);
      for (k = 0; k < n; k++) {
        var lado = Math.random() < 0.5 ? -1 : 1;
        var px = x + lado * (larg * 0.5 + Math.random() * 8), py = yPes - Math.random() * alt;
        this.arcos.lineStyle(1, k % 2 ? 0x9fe8ff : 0xffffff, 0.9);
        this.arcos.beginPath(); this.arcos.moveTo(px, py);
        for (j = 0; j < 4; j++) {
          px += lado * (3 + Math.random() * 7); py += (Math.random() - 0.6) * 12;
          this.arcos.lineTo(Math.round(px), Math.round(py));
        }
        this.arcos.strokePath();
      }
    }
  }
};
Aura.prototype.destroi = function () { this.luz.destroy(); this.arcos.destroy(); this.brasa.destroy(); };

// ============================================================================
//  CINEMA - faixas pretas, cartao de titulo e falas das cutscenes
//  O Phaser aplica o zoom da camera tambem em quem tem scrollFactor 0, entao
//  a cada quadro estes objetos sao reposicionados e reescalados pela conta
//  inversa (veja ajusta): ficam presos na TELA mesmo com a camera em zoom.
// ============================================================================
function Cinema(cena) {
  this.cena = cena; this.itens = []; this.ab = 0;
  this.cima = this.poe(cena.add.rectangle(0, 0, LARG + 8, 70, 0x000000).setOrigin(0, 0), -4, -70);
  this.baixo = this.poe(cena.add.rectangle(0, 0, LARG + 8, 70, 0x000000).setOrigin(0, 0), -4, ALT);
  this.falaAtual = null; this.dicaPula = null; this.titulos = [];
}
Cinema.prototype.poe = function (o, x, y, prof) {
  o.setScrollFactor(0).setDepth(prof || 260);
  var it = { o: o, x: x, y: y, esc: 1 };
  this.itens.push(it);
  this.ajusta(it, this.cena.cameras.main.zoom);
  return it;
};
Cinema.prototype.ajusta = function (it, z) {
  it.o.setPosition(LARG / 2 + (it.x - LARG / 2) / z, ALT / 2 + (it.y - ALT / 2) / z);
  it.o.setScale(it.esc / z);
};
Cinema.prototype.atualiza = function () {
  var z = this.cena.cameras.main.zoom, i, it;
  this.cima.y = -70 + 56 * this.ab;
  this.baixo.y = ALT - 56 * this.ab;
  for (i = this.itens.length - 1; i >= 0; i--) {
    it = this.itens[i];
    if (!it.o.active) { this.itens.splice(i, 1); continue; }   // ja foi destruido
    this.ajusta(it, z);
  }
};
Cinema.prototype.barras = function (liga, ms) {
  this.cena.tweens.killTweensOf(this);
  this.cena.tweens.add({ targets: this, ab: liga ? 1 : 0, duration: POUCO_MOV ? 1 : (ms || 500), ease: 'Sine.easeInOut' });
};
// fala/legenda da cena, na faixa preta de baixo
Cinema.prototype.fala = function (texto, cor, ms) {
  var cena = this.cena;
  if (this.falaAtual) { cena.tweens.killTweensOf(this.falaAtual.o); this.falaAtual.o.destroy(); }
  var t = txt(cena, 0, 0, texto, 10, cor || C.ui);
  this.falaAtual = this.poe(t, LARG / 2, ALT - 26, 262);
  t.setAlpha(0);
  cena.tweens.add({ targets: t, alpha: 1, duration: 220 });
  cena.tweens.add({ targets: t, alpha: 0, delay: ms || 1800, duration: 300 });
};
// cartao de titulo no meio da tela (apresentacao de chefe, "fim")
Cinema.prototype.titulo = function (sup, nome, sub, cor, ms) {
  var cena = this.cena, cin = this, y = ALT / 2 - 40, objs = [], i;
  var corN = parseInt((cor || C.perigo).substr(1), 16);
  var g = cena.add.graphics();
  g.fillStyle(0x000000, 0.62); g.fillRect(-LARG / 2, -50, LARG, 112);
  g.fillStyle(corN, 1); g.fillRect(-LARG / 2, -50, LARG, 2); g.fillRect(-LARG / 2, 60, LARG, 2);
  objs.push(this.poe(g, LARG / 2, y, 258));
  if (sup) objs.push(this.poe(txt(cena, 0, 0, sup, 9, C.cinza), LARG / 2, y - 28, 259));
  var tn = txt(cena, 0, 0, nome, 24, cor || C.perigo);
  tn.setShadow(0, 4, '#000000', 0, false, true);
  var itNome = this.poe(tn, LARG / 2, y + 4, 259);
  objs.push(itNome);
  if (sub) objs.push(this.poe(txt(cena, 0, 0, sub, 9, C.ui), LARG / 2, y + 40, 259));
  for (i = 0; i < objs.length; i++) objs[i].o.setAlpha(0);
  cena.tweens.add({ targets: objs.map(function (it) { return it.o; }), alpha: 1, duration: 300 });
  if (!POUCO_MOV) { itNome.esc = 1.6; cena.tweens.add({ targets: itNome, esc: 1, duration: 420, ease: 'Back.easeOut' }); }
  cena.time.delayedCall(ms || 2200, function () {
    for (var k = 0; k < objs.length; k++) {
      (function (o) {
        if (!o.active) return;
        cena.tweens.add({ targets: o, alpha: 0, duration: 380, onComplete: function () { o.destroy(); } });
      })(objs[k].o);
    }
  });
  this.titulos = this.titulos.concat(objs);
};
// "ENTER: PULAR" (so aparece quando a cutscene ja foi vista uma vez)
Cinema.prototype.dica = function (texto) {
  this.limpaDica();
  var t = txt(this.cena, 0, 0, texto, 7, C.cinza, 1, 0.5);
  this.dicaPula = this.poe(t, LARG - 16, 20, 262);
};
Cinema.prototype.limpaDica = function () {
  if (this.dicaPula) { this.dicaPula.o.destroy(); this.dicaPula = null; }
};
Cinema.prototype.limpaTextos = function () {
  var i;
  for (i = 0; i < this.titulos.length; i++) if (this.titulos[i].o.active) this.titulos[i].o.destroy();
  this.titulos = [];
  if (this.falaAtual) { this.falaAtual.o.destroy(); this.falaAtual = null; }
};

// ============================================================================
//  ROTEIRO - sequenciador das cutscenes
//  Uma lista de passos, um depois do outro, cada um com:
//    ms     quanto dura (0 = so executa o "ini" e segue na hora)
//    ini    o que acontece quando o passo comeca
//    passo  chamado a cada quadro com (dt, p), p = 0..1 do andamento
//    ate    (opcional) o passo so termina quando isto devolver true
//           (com um teto de seguranca em "max" ms)
//  Roda dentro do update da cena, entao a PAUSA congela tudo de graca.
//  "pula" encerra na hora e chama aoPular: quem monta o roteiro decide como
//  deixar o mundo no estado final.
// ============================================================================
function Roteiro(cena, passos, aoFim, aoPular) {
  this.cena = cena; this.passos = passos; this.aoFim = aoFim; this.aoPular = aoPular;
  this.i = -1; this.t = 0; this.dur = 0; this.fim = false; this.podePular = false;
  this.prox();
}
Roteiro.prototype.prox = function () {
  while (!this.fim) {
    this.i++;
    if (this.i >= this.passos.length) {
      this.fim = true;
      if (this.aoFim) this.aoFim.call(this.cena);
      return;
    }
    var p = this.passos[this.i];
    this.t = 0; this.dur = p.ms || 0;
    if (p.ini) p.ini.call(this.cena, this);
    if (this.fim) return;
    if (this.dur > 0 || p.ate) return;
  }
};
Roteiro.prototype.atualiza = function (dt) {
  if (this.fim) return;
  var p = this.passos[this.i];
  this.t += dt;
  if (p.passo) p.passo.call(this.cena, dt, this.dur ? Math.min(1, this.t / this.dur) : 1, this);
  if (this.fim) return;
  var acabou = p.ate ? (p.ate.call(this.cena, this) || this.t > (p.max || 8000)) : this.t >= this.dur;
  if (acabou) this.prox();
};
Roteiro.prototype.pula = function () {
  if (this.fim) return;
  this.fim = true;
  if (this.aoPular) this.aoPular.call(this.cena); else if (this.aoFim) this.aoFim.call(this.cena);
};

// ============================================================================
//  AMBIENTE - o clima vivo de cada cenario
//  Cada cenario ganha a propria particula (poeira dourada no fim de tarde,
//  petalas de cerejeira na alvorada, vaga-lumes a noite e no luar, chuva e
//  raios na tempestade, neve) e uma vinheta de intensidade propria. As
//  particulas vivem na TELA (scrollFactor 0): sao clima, nao objetos do
//  telhado.
// ============================================================================
var AMBIENTES = {
  tarde:      { vinheta: 0.26, tipo: 'poeira' },
  alvorada:   { vinheta: 0.2,  tipo: 'petalas' },
  noite:      { vinheta: 0.48, tipo: 'vagalumes' },
  tempestade: { vinheta: 0.42, tipo: 'chuva', raios: true },
  neve:       { vinheta: 0.24, tipo: 'neve' },
  luar:       { vinheta: 0.45, tipo: 'vagalumes' }
};
function criaAmbiente(cena, cen) {
  var a = AMBIENTES[cen] || AMBIENTES.tarde, f = POUCO_MOV ? 4 : 1;
  var amb = { def: a, emis: [], tRaio: 2500 + Math.random() * 3000 };
  amb.vinheta = cena.add.image(0, 0, 'vinheta').setOrigin(0).setScrollFactor(0).setDepth(95).setAlpha(a.vinheta);
  var zona = function (x, y, w, h) { return { type: 'random', source: new Phaser.Geom.Rectangle(x, y, w, h) }; };
  var pisca = { onUpdate: function (p, k, t) { return Math.sin(t * Math.PI); } };
  var cfg = null, chave = 'pixel';
  if (a.tipo === 'chuva') {
    chave = 'chuva';
    cfg = { emitZone: zona(-120, -30, LARG + 240, 10), lifespan: 800, speedY: { min: 640, max: 820 },
            speedX: { min: -170, max: -130 }, rotate: 12, alpha: { start: 0.55, end: 0.25 },
            frequency: 12 * f, quantity: 2 };
  } else if (a.tipo === 'neve') {
    chave = 'floco';
    cfg = { emitZone: zona(-40, -10, LARG + 80, 10), lifespan: 7000, speedY: { min: 30, max: 70 },
            speedX: { min: -24, max: 12 }, alpha: { start: 0.9, end: 0.4 }, scale: { min: 0.8, max: 1.6 },
            frequency: 110 * f };
  } else if (a.tipo === 'petalas') {
    chave = 'petala';
    cfg = { emitZone: zona(LARG * 0.2, -10, LARG, 10), lifespan: 6500, speedY: { min: 30, max: 60 },
            speedX: { min: -70, max: -30 }, rotate: { start: 0, end: 540 }, alpha: { start: 0.9, end: 0.3 },
            frequency: 420 * f };
  } else if (a.tipo === 'vagalumes') {
    cfg = { emitZone: zona(0, ALT * 0.35, LARG, ALT * 0.5), lifespan: { min: 2400, max: 4200 },
            speedX: { min: -14, max: 14 }, speedY: { min: -16, max: 8 }, scale: 0.55,
            alpha: pisca, tint: [0xd8ff7a, 0xffcd75], blendMode: 'ADD', frequency: 380 * f };
  } else if (a.tipo === 'poeira') {
    cfg = { emitZone: zona(0, 0, LARG, ALT * 0.8), lifespan: { min: 3000, max: 5000 },
            speedX: { min: 4, max: 18 }, speedY: { min: -8, max: 4 }, scale: 0.45,
            alpha: pisca, tint: 0xffcd75, blendMode: 'ADD', frequency: 420 * f };
  }
  if (cfg) amb.emis.push(cena.add.particles(0, 0, chave, cfg).setScrollFactor(0).setDepth(90));
  return amb;
}
function atualizaAmbiente(cena, amb, dt) {
  if (!amb || !amb.def.raios) return;
  amb.tRaio -= dt;
  if (amb.tRaio > 0) return;
  amb.tRaio = 6000 + Math.random() * 7000;
  relampago(cena, false);
}
// raio no ceu (atras das montanhas) + clarao + trovao chegando depois
function relampago(cena, forte) {
  var x = 120 + Math.random() * (LARG - 240);
  var r = cena.add.image(x, 0, 'raio' + ((Math.random() * 2) | 0)).setOrigin(0.5, 0)
    .setScrollFactor(0).setDepth(0.5).setAlpha(POUCO_MOV ? 0.5 : 0.95);
  cena.tweens.add({ targets: r, alpha: 0, duration: 280, delay: 90, onComplete: function () { r.destroy(); } });
  if (!POUCO_MOV) {
    var cl = cena.add.rectangle(0, 0, LARG, ALT, 0xdfe8ff).setOrigin(0).setScrollFactor(0).setDepth(94)
      .setAlpha(forte ? 0.45 : 0.22);
    cena.tweens.add({ targets: cl, alpha: 0, duration: 260, onComplete: function () { cl.destroy(); } });
  }
  cena.time.delayedCall(forte ? 120 : 300 + Math.random() * 700, function () { SOM.trovao(); });
  legenda(cena, 'TROVÃO', C.cinza);
}

// ============================================================================

//  ---------------------------------------------------------------------------
//  COMO FUNCIONA
//  Um chefe e um objeto "Boss" que vive DENTRO da fase de campanha: ele NAO
//  tem corpo de fisica e NAO entra em nenhum colisor do jogador. A cada quadro
//  a fase chama boss.atualiza(dt, r), que:
//    1. anda com a maquina de estados (entrada, espera, ataque, tonto...);

//  efeito do chefe sobre ele e um impulso avulso (r.quique), aplicado DEPOIS
//  da fisica, igual ao trampolim.

//  ser "pego" e so levar um tombo e voltar do checkpoint.

    },

    combos: { 1: ['B', 'A', 'B', 'B'], 2: ['A', 'B', 'A', 'B'], 3: ['B', 'B', 'A', 'B'] },
    // ondas de plasma de cada fase (o "corte de energia")
    ondas: { 1: ['B'], 2: ['B', 'A'], 3: ['B', 'A', 'B'] },
    velAnda: 150, velInvestida: 520, velOnda: 360, alturaPulo: 190,

  coco: {

    fasesFolego: { 8: 1, 7: 1, 6: 1, 5: 2, 4: 2, 3: 2, 2: 3, 1: 4 },
