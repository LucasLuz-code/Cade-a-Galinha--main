    return { m: m, h: h, objs: [m, h] };
  },

  // HUD do MODO INFINITO: distancia, pontos, combo, vidas e habilidade.
  criaHudSolo: function () {
    var r = this.r1, objs = [], i;
    var nome = txt(this, 16, 20, PERSONAGENS[r.id - 1].curto, 11, r.luz, 0)
      .setScrollFactor(0).setDepth(100);
    objs.push(nome);
    var hx = 16 + nome.width + 20;
    r.coracoes = [];
    for (i = 0; i < 3; i++) {
      var c = this.add.image(hx + i * 20, 20, 'coracao1').setScrollFactor(0).setDepth(100);
      r.coracoes.push(c); objs.push(c);
    }
    r.hudDist = txt(this, LARG - 16, 20, '0 M', 14, C.ui, 1).setScrollFactor(0).setDepth(100);
    this.hudPontos = txt(this, LARG - 16, 44, '0', 12, C.moeda, 1).setScrollFactor(0).setDepth(100);
    this.hudRecorde = txt(this, LARG - 16, 64, 'RECORDE ' + num(Save.d.infinito.dist) + ' M', 8, C.cinza, 1)
      .setScrollFactor(0).setDepth(100);
    this.hudCombo = txt(this, LARG / 2, 34, '', 16, C.perigo2).setScrollFactor(0).setDepth(100).setAlpha(0);
    this.gSolo = this.add.graphics().setScrollFactor(0).setDepth(100);
    this.hudHab = txt(this, 20, ALT - 40, '', 8, C.cinza, 0).setScrollFactor(0).setDepth(100);
    objs.push(r.hudDist, this.hudPontos, this.hudRecorde, this.hudCombo, this.gSolo, this.hudHab);
    r.aviso = this.add.rectangle(0, 0, 70, ALT, 0xef7d57, 0).setOrigin(0, 0).setScrollFactor(0).setDepth(99);
    r.avisoTxt = txt(this, LARG / 2, 74, 'CORRE! O IMPERADOR!', 12, C.perigo2).setScrollFactor(0).setDepth(100).setAlpha(0);
    r.txtFim = txt(this, LARG / 2, 190, '', 22, C.perigo).setScrollFactor(0).setDepth(101).setAlpha(0);
    r.txtFim2 = txt(this, LARG / 2, 232, '', 11, C.ui).setScrollFactor(0).setDepth(101).setAlpha(0);
    objs.push(r.aviso, r.avisoTxt, r.txtFim, r.txtFim2);
    return objs;
  },

  // ovo dourado espalhado pela pista do infinito (a pista da Perseguicao nao
  // tem ovos: la o que vale e chegar na frente)
  pegaOvo: function (m) {
    if (!m.active) return;
    this.placar.ovos++;
    this.placar.marca(PONT.OVO, m.x, m.y - 10, null, C.moeda, true);
    this.pMoeda.explode(POUCO_MOV ? 4 : 10, m.x, m.y);
    SOM.moeda();
    m.destroy();
  },

  criaHud: function (r, idx) {

    r.avisoTxt = txt(this, LARG / 2, 54, 'CORRE! O IMPERADOR!', 12, C.perigo2).setScrollFactor(0).setDepth(100).setAlpha(0);
    objs.push(r.aviso); objs.push(r.avisoTxt);
    r.txtFim = txt(this, LARG / 2, 110, '', 20, C.perigo).setScrollFactor(0).setDepth(101).setAlpha(0);
    r.txtFim2 = txt(this, LARG / 2, 145, '', 11, C.ui).setScrollFactor(0).setDepth(101).setAlpha(0);
    objs.push(r.txtFim); objs.push(r.txtFim2);
    // barra da habilidade e cargas de dash, no rodape da metade dele: cada
    // jogador precisa ver o proprio folego sem olhar a metade do outro
    r.gHab = this.add.graphics().setScrollFactor(0).setDepth(100);
    r.txtHab = txt(this, 20, ALT / 2 - 44, '', 7, C.cinza, 0).setScrollFactor(0).setDepth(100);
    objs.push(r.gHab); objs.push(r.txtHab);

  },

  // desenha a barra de habilidade de um jogador na metade dele
  pintaHabCorrida: function (r) {
    var g = r.gHab, pronta = 1, cor = r.luzN, rot = r.pf.habNome, k, y = ALT / 2 - 34;
    if (!g) return;
    if (r.pf.hab === 'escudo') {
      if (r.escudando) { pronta = limita(r.escudoT / r.pf.escudoDur, 0, 1); cor = N.ui; rot = 'ESCUDO ATIVO'; }
      else if (r.habCd > 0) { pronta = 1 - limita(r.habCd / (r.pf.escudoDur + r.pf.escudoCd), 0, 1); cor = N.painelLuz; rot = 'ESCUDO'; }
    } else if (r.habCd > 0) {
      pronta = 1 - limita(r.habCd / r.pf.piruetaCd, 0, 1); cor = N.painelLuz; rot = 'PIRUETA';
    }
    g.clear();
    g.fillStyle(N.escuro, 0.85); g.fillRect(18, y - 2, 148, 14);
    g.fillStyle(N.painel, 1);    g.fillRect(20, y, 144, 10);
    g.fillStyle(cor, 1);         g.fillRect(20, y, 144 * pronta, 10);
    for (k = 0; k < r.cargasMax; k++) {
      g.fillStyle(N.escuro, 0.85); g.fillRect(174 + k * 16, y - 2, 14, 14);
      g.fillStyle(k < r.cargas ? r.luzN : N.painel, 1); g.fillRect(176 + k * 16, y, 10, 10);
    }
    if (r.txtHab.text !== rot) r.txtHab.setText(rot);
  },

  // ---- montagem da pista -----------------------------------------------
  // Sorteia o proximo trecho: quanto mais longe, mais dificil, e nunca repete
  // o mesmo trecho duas vezes seguidas (ninguem decora o percurso).
  escolheTrecho: function () {
    var m = this.fimX * T, niveis, i;
    if (this.contaTrecho < 3) niveis = ['facil'];
    else if (m < 4200) niveis = ['facil', 'medio'];
    else if (m < 9000) niveis = ['medio', 'medio', 'dificil'];
    else niveis = ['medio', 'dificil', 'dificil'];
    var alvo = niveis[(Math.random() * niveis.length) | 0];
    var cand = [];
    for (i = 0; i < TRECHOS.length; i++) {
      if (TRECHOS[i].id === 'inicio') continue;
      if (TRECHOS[i].dif === alvo && TRECHOS[i].id !== this.ultimoId) cand.push(TRECHOS[i]);
    }
    if (!cand.length) {
      for (i = 0; i < TRECHOS.length; i++) if (TRECHOS[i].id !== 'inicio') cand.push(TRECHOS[i]);
    }
    var d = cand[(Math.random() * cand.length) | 0];
    this.ultimoId = d.id;
    return d;
  },

  addTrecho: function (def) {
    var g = normalizaMapa(def.map);
    var w = g[0].length, h = g.length, off = this.fimX * T, x, y, s, ch;
    // guarda a grade global (usada para achar lugar seguro no renascimento)
    for (x = 0; x < w; x++) {
      s = '';
      for (y = 0; y < h; y++) s += g[y].charAt(x);
      this.colunas.push(s);
    }
    var solidos = criaSolidos(this.solidos, juntaRetangulos(g), off, 0);
    var fat = montaFatias(this, g, 'pista_' + (this.contaTrecho++), off, 0, 4);
    var extras = [], perigos = [];
    for (y = 0; y < h; y++) {
      for (x = 0; x < w; x++) {
        ch = g[y].charAt(x);
        if (ch === '^' || ch === 'L') {
          var p = criaPerigo(this, this.perigos, ch, off + x * T, y * T);
          extras.push(p.img); perigos.push(p.corpo);
        }
      }
    }
    // No infinito a pista ganha ovos em cima do telhado: e o que alimenta o
    // combo e faz valer a pena arriscar a rota de cima.
    if (this.solo && this.contaTrecho > 1) {
      for (x = 2; x < w - 2; x += 3) {
        for (y = 1; y < h - 1; y++) {
          if (g[y].charAt(x) !== '#' || g[y - 1].charAt(x) !== '.') continue;
          if (Math.random() < 0.45) {
            var ov = criaItem(this, off + x * T + 16, (y - 1) * T + 16, 'moeda0', 'moeda_gira');
            this.moedas.add(ov);
            extras.push(ov);
          }
          break;
        }
      }
    }
    this.trechos.push({
      x1: off + w * T, solidos: solidos, perigos: perigos,
      imgs: fat.imgs.concat(extras), texs: fat.texs
    });
    this.fimX += w;
  },

  // descarta o que ja ficou para tras da parede
  limpaTrechos: function () {
    while (this.trechos.length > 2 && this.trechos[0].x1 < this.bordaX - 500) {
      var tr = this.trechos.shift(), i;
      for (i = 0; i < tr.solidos.length; i++) tr.solidos[i].destroy();
      for (i = 0; i < tr.perigos.length; i++) tr.perigos[i].destroy();
      for (i = 0; i < tr.imgs.length; i++) tr.imgs[i].destroy();
      for (i = 0; i < tr.texs.length; i++) removeTex(this, tr.texs[i]);
    }
  },

  // procura um chao livre logo a frente da parede para o jogador reaparecer
  achaLugarSeguro: function (xAlvo) {
    var c0 = Math.max(0, Math.floor(xAlvo / T)), c, col, y;
    for (c = c0; c < c0 + 45 && c < this.colunas.length; c++) {
      col = this.colunas[c];
      for (y = 2; y < col.length; y++) {
        if (col.charAt(y) === '#' && col.charAt(y - 1) === '.' && col.charAt(y - 2) === '.') {
          return { x: c * T + 16, y: y * T - 18 };
        }
      }
    }
    return { x: xAlvo, y: 60 };
  },

  camDe: function (r) { return r.id === 1 ? this.cam1 : this.cam2; },

  // ---- dash como sabotagem ---------------------------------------------
  checaDash: function () {
    if (this.acabou) return;
    if (this.r1.dashando && !this.r2.dashando) this.empurra(this.r1, this.r2);
    else if (this.r2.dashando && !this.r1.dashando) this.empurra(this.r2, this.r1);
  },
  empurra: function (atac, vit) {
    if (vit.invenc > 0 || vit.morto || vit.eliminado || atac.morto) return;
    // escudo levantado: em vez de levar o esbarrao, devolve o empurrao.
    // E o contra-golpe do Tobias (controle) contra a pressa do Koburo.
    if (vit.escudando) {
      escudoAparou(this, vit);
      atac.dashT = 0; atac.dashando = false;
      atac.corpo.setVelocity(-atac.dashDir * 320, -220);
      atac.atordoado = 220;
      balao(this, vit.corpo.x, vit.corpo.y - 26, 'APAREI!', vit.luz);
      return;
    }
    var d = atac.dashDir;
    vit.corpo.setVelocity(d * 430, -300);
    vit.atordoado = 280;
    vit.invenc = 450;          // evita ser empurrado varias vezes seguidas
    atac.dashT = 0; atac.dashando = false;
    atac.corpo.setVelocityX(d * 190);
    SOM.bater();
    // esbarrao de desenho animado: estrelinhas e um "EPA!", ninguem se machuca
    balao(this, vit.corpo.x, vit.corpo.y - 26, 'EPA!', C.ui);
    if (!POUCO_MOV) {
      this.pMoeda.explode(10, vit.corpo.x, vit.corpo.y - 8);
      this.camDe(vit).shake(160, 0.01);
    }
  },

  // ---- queda / eliminacao ----------------------------------------------
  cai: function (r, motivo) {
    if (r.morto || r.eliminado || this.acabou) return;
    var cena = this;
    r.morto = true; r.dashT = 0; r.dashando = false;
    r.vidas--;
    r.corpo.setVelocity(0, 0);
    r.corpo.body.setAllowGravity(false);
    explodeMorte(this, r, this.camDe(r));
    balao(this, r.corpo.x, r.corpo.y - 26,
          motivo === 'imperador' ? 'O IMPERADOR TE VIU!' : fraseQueda(), C.perigo2);
    this.pintaVidas(r);
    if (r.vidas <= 0) { this.elimina(r); return; }
    this.time.delayedCall(600, function () { cena.reaparece(r); });
  },

  reaparece: function (r) {
    var p = this.achaLugarSeguro(this.bordaX + 360);
    r.corpo.setPosition(p.x, p.y);
    r.corpo.setVelocity(0, 0);
    r.corpo.body.setAllowGravity(true);
    r.morto = false; r.dashCd = 0; r.cargas = r.cargasMax; r.atordoado = 0;
    r.escudando = false; r.escudoT = 0; r.habCd = 0; r.girando = 0;
    r.pisando = false; r.mergulhando = false; r.piruetaUsada = false;
    r.invenc = 1500; r.sx = 1; r.sy = 1; r.buffer = 0; r.coyote = 0;
    if (r.corpo.x > r.maxX) r.maxX = r.corpo.x;
    this.camDe(r).flash(160, 26, 28, 44);
  },

  elimina: function (r) {
    var cena = this;
    r.eliminado = true;
    r.corpo.body.enable = false;
    this.acabou = true;
    SOM.derrota();
    if (this.solo) {
      var dist = this.metros(r), pl = this.placar;
      pl.pontos += dist * 10;                     // a distancia tambem vale pontos
      r.txtFim.setText('FIM DA FUGA!').setAlpha(1);
      r.txtFim2.setText(num(dist) + ' METROS   /   ' + num(pl.pontos) + ' PONTOS').setAlpha(1);
      var rec = Save.recordeInfinito(dist, pl.pontos);
      var ganhas = Conquistas.checa({ infinito: true });
      Save.ganhaXP(60 + Math.round(pl.pontos / 40));
      this.time.delayedCall(1900, function () {
        cena.scene.start('GameOverScene', {
          modo: 'infinito', dist: dist, pontos: pl.pontos,
          combo: pl.comboMax, ovos: pl.ovos, recordes: rec, conquistas: ganhas
        });
      });
      return;
    }
    r.txtFim.setText('DEMITIDO!').setAlpha(1);
    r.txtFim2.setText('CORREU ' + this.metros(r) + ' METROS DE TELHADO').setAlpha(1);
    var outro = (r === this.r1) ? this.r2 : this.r1;
    Conquistas.checa({ corrida: true });
    this.time.delayedCall(1900, function () {
      cena.scene.start('GameOverScene', {
        modo: 'corrida', vencedor: outro.id,
        d1: cena.metros(cena.r1), d2: cena.metros(cena.r2)
      });
    });
  },

  metros: function (r) { return Math.max(0, Math.floor((r.maxX - r.x0) / T)); },

  pintaVidas: function (r) {
    for (var i = 0; i < r.coracoes.length; i++) {
      r.coracoes[i].setTexture(i < r.vidas ? 'coracao1' : 'coracao0');
    }
  },

  // ---- pausa ------------------------------------------------------------
  congela: function (c) { congelaCena(this, c); },

  // mesma pagina de pausa da Campanha; na tela dividida ela cabe na metade de
  // cima (por isso o subpainel tem altura fixa de 254px)
  abreSubPausa: function (pag) {
    var cena = this;
    if (this.sub) return;
    this.mostraMenuPausa(false);
    this.sub = new SubPainelPausa(this, 170, 6, 210);
    var aoSair = function (mudou) {
      cena.sub.destroi(); cena.sub = null;
      if (mudou) refazTeclasJogo(cena);
      cena.mostraMenuPausa(true);
    };
    if (pag === 'controles') this.sub.controles(aoSair); else this.sub.ajustes(aoSair);
    // na tela dividida a pagina so aparece na metade de cima
    if (!this.solo) this.cam2.ignore(this.sub.objs.concat(this.sub.lista.objetos()));
  },
  mostraMenuPausa: function (ver) {
    var i;
    for (i = 1; i < this.objsPausa.length; i++) this.objsPausa[i].setVisible(ver);
    if (this.listaPausa) {
      var o = this.listaPausa.objetos();
      for (i = 0; i < o.length; i++) o[i].setVisible(ver);
    }
  },

  alternaPausa: function () {
    var cena = this;
    if (this.acabou) return;
    if (this.sub) { this.sub.sai(); return; }
    this.pausado = !this.pausado;
    if (this.pausado) {
      this.congela(true);
      // o escurecido aparece nas duas metades; o menu so na metade de cima
      var fundo = this.add.rectangle(0, 0, LARG, ALT, 0x1a1c2c, 0.75).setOrigin(0)
        .setScrollFactor(0).setDepth(200);
      var p = painel(this, 320, 26, 320, 216).setScrollFactor(0).setDepth(200);
      var tit = tituloTela(this, LARG / 2, 56, 'PAUSA', 15, 300);
      tit[0].setScrollFactor(0).setDepth(201); tit[1].setScrollFactor(0).setDepth(201);
      var t2 = txt(this, LARG / 2, 120, 'PAUSA', 16, C.moeda).setScrollFactor(0).setDepth(201);
      this.listaPausa = new MenuLista(this, LARG / 2, 100, [
        { rot: 'CONTINUAR', acao: function () { cena.alternaPausa(); } },
        { rot: 'REINICIAR', acao: function () { trocaCena(cena, null, { solo: cena.solo }, true); } },
        { rot: 'CONTROLES', acao: function () { cena.abreSubPausa('controles'); } },
        { rot: 'AJUSTES',   acao: function () { cena.abreSubPausa('ajustes'); } },
        { rot: 'MENU',      acao: function () { trocaCena(cena, 'MenuScene'); } }
      ], 26, 11);
      this.listaPausa.fixa(201);
      // na tela dividida o menu so aparece na metade de cima; no infinito a
      // tela e uma so, entao nada precisa ser ignorado
      if (!this.solo) {
        var soCima = [p, tit[0], tit[1]].concat(this.listaPausa.objetos());
        this.cam2.ignore(soCima);
        this.cam1.ignore([t2]);
      } else {
        t2.setVisible(false);
      }
      this.objsPausa = [fundo, p, tit[0], tit[1], t2];
      surgir(this, this.objsPausa.concat(this.listaPausa.objetos()), 140);
    } else {
      for (var i = 0; i < this.objsPausa.length; i++) {
        this.tweens.killTweensOf(this.objsPausa[i]);
        this.objsPausa[i].destroy();
      }
      this.objsPausa = [];
      if (this.listaPausa) { this.listaPausa.destroi(); this.listaPausa = null; }
      if (this.sub) { this.sub.destroi(); this.sub = null; }
      this.congela(false);
    }
  },

  update: function (tempo, delta) {
    var dt = Math.min(delta, 34), t = this.teclas, i, r;
    checaMudo(t);
    if (this.pausado && this.sub) { this.sub.atualiza(t, dt); return; }
    var pesc = JD(t.esc) || TOQUE.ap('voltar'), pp = JD(t.p);
    if (pesc || pp) this.alternaPausa();
    if (this.pausado) {
      if (this.listaPausa) this.listaPausa.atualiza(t, dt);
      return;
    }

    // ---- entradas dos dois jogadores (mesmo teclado, mapas separados) ----
    // Cada um le SO o proprio mapa: em CONFIGURACOES > CONTROLES da para
    // trocar as teclas de qualquer um dos dois sem atrapalhar o outro.
    if (this.acabou) {
      for (i = 0; i < this.corredores.length; i++) this.corredores[i].entrada = SEM_ENTRADA;
    } else if (this.solo) {
      // sozinho valem as teclas dos dois perfis, como na campanha
      this.r1.entrada = leEntrada(this.tj, 1, 2);
      this.placar.passo(dt);
    } else {
      this.r1.entrada = leEntrada(this.tj, 1);
      this.r2.entrada = leEntrada(this.tj, 2);
    }

    // ---- a guarda do imperador: acelera com o tempo e "corre atras" do lider ----
    if (!this.acabou) {
      this.tempo += dt;
      this.bordaVel = Math.min(255, 58 + (this.tempo / 1000) * 3.0);
      this.bordaX += this.bordaVel * dt / 1000;
      var lider = this.solo ? this.r1.maxX : Math.max(this.r1.maxX, this.r2.maxX);
      if (lider - this.bordaX > 1300) {
        this.bordaX += (lider - this.bordaX - 1300) * 0.7 * dt / 1000;
      }
    }
    // a guarda marcha (pulinhos no ritmo dos passos e um balanco de leve: so o
    // deslocamento da textura), a poeira da frente ferve e o imperador pula
    // de raiva na frente
    this.parede.x = this.bordaX - 14; this.paredeLuz.x = this.bordaX;
    this.parede.tilePositionY = -Math.abs(Math.sin(tempo / 160)) * 3;
    this.parede.tilePositionX = Math.sin(tempo / 700) * 2;
    this.paredeLuz.tilePositionY = Math.sin(tempo / 300) * 4;
    this.imperador.x = this.bordaX + 6;
    this.imperador.y = 196 + Math.sin(tempo / 160) * 5;
    this.falaImperador.x = this.bordaX + 12;          // a fala sai para a direita
    this.falaImperador.y = 150 + Math.sin(tempo / 160) * 5;

    // ---- jogadores ----
    for (i = 0; i < this.corredores.length; i++) {
      r = this.corredores[i];
      atualizaCorredor(this, r, dt);
      sincronizaCorredor(r, tempo);
      if (!r.morto && !r.eliminado) {
        // alcancado pela guarda do imperador, ou escorregou para o vao
        if (r.corpo.x < this.bordaX) this.cai(r, 'imperador');
        else if (r.corpo.y > this.ALT_MUNDO + 110) this.cai(r);
      }
      // aviso visual quando a parede esta perto
      var d = r.corpo.x - this.bordaX;
      var perto = (!r.eliminado && d < 360) ? limita(1 - d / 360, 0, 1) : 0;
      var pulso = 0.45 + 0.55 * Math.sin(tempo / 90);
      r.aviso.setAlpha(perto * (0.35 + 0.5 * pulso));
      r.avisoTxt.setAlpha(perto > 0.3 ? 0.35 + 0.65 * pulso : 0);
      if (perto > 0.3) {                          // o aviso alterna as duas frases
        var frase = (Math.floor(tempo / 900) % 2) ? 'ELE TÁ VINDO!' : 'CORRE! O IMPERADOR!';
        if (r.avisoTxt.text !== frase) r.avisoTxt.setText(frase);
      }
      if (!r.eliminado) r.hudDist.setText(num(this.metros(r)) + ' M');
      if (!this.solo) this.pintaHabCorrida(r);
    }
    if (this.solo && !this.acabou) this.atualizaHudSolo();

    // ---- a Cócó foge na frente do lider, de telhado em telhado; sobre os
    //      vaos ela bate as asas (so visual: nao tem fisica) ----
    var alvoG = (this.solo ? this.r1.corpo.x : Math.max(this.r1.corpo.x, this.r2.corpo.x)) + 420;
    this.coco.x += (alvoG - this.coco.x) * Math.min(1, dt / 400);
    var colG = this.colunas[Math.floor(this.coco.x / T)], yChao = null, yy2;
    if (colG) {
      for (yy2 = 1; yy2 < colG.length; yy2++) {
        if (colG.charAt(yy2) === '#' && colG.charAt(yy2 - 1) !== '#') { yChao = yy2 * T + 2; break; }
      }
    }
    if (yChao !== null) this.cocoChao = yChao;
    var bate = (yChao === null) ? Math.abs(Math.sin(tempo / 70)) * 8 : 0;
    this.coco.y += (this.cocoChao - bate - this.coco.y) * Math.min(1, dt / 90);

    // ---- pista infinita: gera na frente e descarta atras ----
    var frente = this.solo ? this.r1.corpo.x : Math.max(this.r1.corpo.x, this.r2.corpo.x);
    var protecao = 0;
    while (this.fimX * T < frente + 2300 && protecao++ < 12) this.addTrecho(this.escolheTrecho());
    this.limpaTrechos();

    var i, L, ly;
    var altura = 122 + linhas.length * 24 + itens.length * 34;
    var topo = Math.max(50, (ALT - altura) / 2 - 30);
    var objs = [painel(this, 200, topo, 560, altura).setDepth(10)];
    var tit = tituloTela(this, LARG / 2, topo + 36, titulo, 17, 540);
    tit[0].setColor(corTitulo).setDepth(11); tit[1].setDepth(11);
    objs.push(tit[0], tit[1]);
    for (i = 0; i < linhas.length; i++) {
      ly = topo + 80 + i * 24; L = linhas[i];
      if (L.centro) {
        objs.push(txt(this, LARG / 2, ly, L.centro, 10, L.cor).setDepth(11));
      } else {
        objs.push(txt(this, LARG / 2 - 12, ly, L.rot, 10, C.cinza, 1).setDepth(11));
        objs.push(txt(this, LARG / 2 + 12, ly, L.val, 11, L.cor, 0).setDepth(11));
        if (L.selo) objs.push(this.selo(LARG / 2 + 190, ly, 'RECORDE!'));
      }
    }
    var sep = this.add.graphics().setDepth(11);
    sep.fillStyle(N.painelLuz, 1);
    sep.fillRect(270, topo + 78 + linhas.length * 24, 420, 1);
    objs.push(sep);
    this.lista = new MenuLista(this, LARG / 2, topo + 100 + linhas.length * 24, itens, 34, 12);
    this.lista.fixa(11);
    surgir(this, objs.concat(this.lista.objetos()), 320);
    if (!POUCO_MOV) {
      tit[0].setScale(0.7);
      this.tweens.add({ targets: tit[0], scale: 1, duration: 380, ease: 'Back.easeOut' });
    }
  },

  update: function (tempo, delta) {
    var dt = Math.min(delta, 34);
    checaMudo(this.teclas);
    this.mont.tilePositionX += dt * 0.004;
    this.morr.tilePositionX += dt * 0.010;
    if (this.lista) this.lista.atualiza(this.teclas, dt);
  }
});

// ============================================================================
//  CONFIGURACAO E INICIO DO JOGO
// ============================================================================
preparaFases();
Save.carregar();
Controles.carregar();

var config = {
  type: Phaser.AUTO,
  width: LARG,
  height: ALT,
  parent: 'jogo',
  backgroundColor: '#0d0e17',
  pixelArt: true,      // sem suavizacao: a pixel art fica nitida
  roundPixels: true,   // evita meio-pixel e tremulacao no scroll
  scale: {
    mode: Phaser.Scale.FIT,             // escala mantendo a proporcao 16:9
    autoCenter: Phaser.Scale.CENTER_BOTH,
    fullscreenTarget: 'jogo'            // a div que vai para a tela cheia
  },
  physics: {
    default: 'arcade',
    arcade: { gravity: { y: FIS.GRAV }, debug: false }
  },
  scene: [BootScene, MenuScene, CampaignScene, RaceScene, GameOverScene]
};

var jogo = new Phaser.Game(config);

// Os navegadores so liberam o audio depois de uma interacao do usuario.
var ligaAudio = function () { SOM.ligar(); };
window.addEventListener('keydown', ligaAudio);
window.addEventListener('pointerdown', ligaAudio);

// ---- Controle de toque ligado ao loop --------------------------------------
// "poststep" roda depois que TODAS as cenas atualizaram no quadro: e ali que
// os pulsos sao zerados, o que da a eles a mesma vida util de um JustDown.
TOQUE.liga();
jogo.events.on('poststep', function () {
  TOQUE.atualiza(jogo);
  TOQUE.limpaPulsos();
});
document.getElementById('tq-tela').addEventListener('pointerdown', function (ev) {
  ev.preventDefault();
  TOQUE.mostra();
  alternaTelaCheia();          // precisa sair do proprio evento do toque
});

// ============================================================================
//  TELA CHEIA
//  A tecla F (ou um duplo clique no jogo) liga/desliga a tela cheia de verdade
//  (Fullscreen API). A escala FIT mantem a proporcao 16:9, sem esticar a pixel
//  art. O pedido e feito dentro do proprio evento do teclado/mouse, que e o
//  que o navegador exige para liberar a tela cheia.
// ============================================================================
var saindoPeloF = false;
function alternaTelaCheia() {
  if (jogo.scale.isFullscreen) saindoPeloF = true;
  jogo.scale.toggleFullscreen();
}
window.addEventListener('keydown', function (e) {
  if ((e.key === 'f' || e.key === 'F') && !e.repeat) alternaTelaCheia();
});
document.getElementById('jogo').addEventListener('dblclick', alternaTelaCheia);
// Em tela cheia o navegador usa o ESC para sair dela, e esse ESC nao chega ao
// jogo. Se o jogador saiu assim no meio de uma fase, pausamos por ele (era o
// que ele queria). Se o ESC chegar ao jogo e ele ja pausar sozinho, nada muda.
jogo.scale.on('leavefullscreen', function () {
  if (saindoPeloF) { saindoPeloF = false; return; }
  setTimeout(function () {
    ['CampaignScene', 'RaceScene'].forEach(function (k) {
      var c = jogo.scene.getScene(k);
      if (c && c.scene.isActive() && !c.pausado && c.alternaPausa) c.alternaPausa();
    });
  }, 150);
});
jogo.scale.on('fullscreenfailed', function () { saindoPeloF = false; });

  } catch (e) {}

  var okN = 0, i;
  for (i = 0; i < resultados.length; i++) if (resultados[i].ok) okN++;
  var linha = '=== CADE A GALINHA?! - AUTOTESTE: ' + okN + '/' + resultados.length + ' ===';
  if (window.console) {
    console.log(linha);
    for (i = 0; i < resultados.length; i++) {
      console.log((resultados[i].ok ? '  ok   ' : '  FALHOU ') + resultados[i].nome +
                  (resultados[i].erro ? '  -> ' + resultados[i].erro : ''));
    }
    console.log(falhas.length ? 'PROBLEMAS: ' + falhas.length : 'TUDO CERTO. O save do jogador foi preservado.');
  }
  return { total: resultados.length, ok: okN, falhas: falhas };
}
window.runGameTests = runGameTests;

// ============================================================================
//  GANCHO DE TESTE
//  So existe quando a pagina e aberta com "?teste" no endereco. Serve para o
//  roteiro automatizado espiar o jogo de fora (conferir save, controles,
//  habilidades, fases). Numa partida normal nada disso e criado.
// ============================================================================
try {
  if (/[?&]teste\b/.test(window.location.search)) {
    window.__dbg = {
      jogo: jogo, Save: Save, Controles: Controles, SOM: SOM, MUSICA: MUSICA,
      FASES: FASES, PERFIS: PERFIS, ACOES: ACOES, HAB: HAB, FIS: FIS,
      PERSONAGENS: PERSONAGENS, TRECHOS: TRECHOS, BOSSES: BOSSES,
      usaHabilidade: usaHabilidade, atualizaCorredor: atualizaCorredor,
      normalizaMapa: normalizaMapa, Diario: Diario, Conquistas: Conquistas, ART: ART,
      CONQUISTAS: CONQUISTAS, Placar: Placar, PONT: PONT, DESAFIOS: DESAFIOS,
      tiraBicho: tiraBicho, BICHOS: BICHOS, ATAQUES_CHEFE: ATAQUES_CHEFE,
      VOLTA_PAGINA: VOLTA_PAGINA, Roteiro: Roteiro, FX: FX, FAIXAS: FAIXAS
    };
  }
} catch (e) {}

// ---- relatorio de quedas: console e tela "?relatorio" (veja RelQuedas) ----
window.relatorioQuedas = function () { var t = RelQuedas.texto(); console.log(t); return t; };
window.limpaRelatorioQuedas = function () { RelQuedas.limpa(); return 'relatorio apagado'; };
if (/[?&]relatorio\b/.test(window.location.search)) {
  (function () {
    var cx = document.createElement('div');
    cx.id = 'relatorio';
    cx.innerHTML = '<pre></pre><div><button data-a="copiar">COPIAR</button>' +
                   '<button data-a="limpar">APAGAR</button><button data-a="fechar">FECHAR</button></div>';
    var pre = cx.querySelector('pre');
    var mostra = function () { pre.textContent = RelQuedas.texto(); };
    cx.addEventListener('click', function (ev) {
      var a = ev.target && ev.target.getAttribute('data-a');
      if (a === 'fechar') cx.parentNode.removeChild(cx);
      else if (a === 'limpar' && window.confirm('Apagar o relatorio de quedas? O progresso do jogo nao e apagado.')) {
        RelQuedas.limpa(); mostra();
      } else if (a === 'copiar' && navigator.clipboard) {
        navigator.clipboard.writeText(RelQuedas.texto()).then(function () { ev.target.textContent = 'COPIADO!'; }, function () {});
      }
    });
    mostra();
    document.body.appendChild(cx);
  })();
}

})();
}
</script>
<script>
// ============================================================================
//  APP INSTALAVEL / OFFLINE: o service worker (sw.js) guarda o jogo no
//  aparelho na primeira visita. Depois disso abre sem internet, e o navegador
//  oferece "instalar" / "adicionar a tela inicial". So funciona servido por
//  http(s) - abrindo o index.html direto do disco (file://) o jogo roda
//  normal, so nao fica instalavel.
// ============================================================================
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
