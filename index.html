  // O lugar esta livre? Precisa valer para TUDO que ocupa espaco: o jogador,
  // as caixas e tambem os bichos - uma telha nao pode voltar por dentro de um
  // gato parado em cima dela.
  livreEm: function (x, y, w, h) {
    var corpos = [this.r.corpo.body], i, b, c;
    for (i = 0; i < this.caixas.length; i++) corpos.push(this.caixas[i].body);
    for (i = 0; i < corpos.length; i++) {
      b = corpos[i];
      if (b.right > x && b.left < x + w && b.bottom > y && b.top < y + h) return false;
    }
    for (i = 0; i < this.bichos.length; i++) {
      if (!this.bichos[i].vivo) continue;
      c = caixaBicho(this.bichos[i]);
      if (c.dir > x && c.esq < x + w && c.baixo > y && c.topo < y + h) return false;
    }
    return true;
  },
  voltaQ: function (q) {
    if (!this.livreEm(q.x, q.y, 32, 32)) { q.t = 300; return; }   // tenta de novo daqui a pouco
    q.estado = 'firme';
    q.corpo.body.enable = true;
    this.tweens.killTweensOf(q.img);
    q.img.setPosition(q.x + 16, q.y + 16).setAngle(0).setAlpha(0);
    this.tweens.add({ targets: q.img, alpha: 1, duration: 300 });
  },

  // ---- Caixa "B": corpo dinamico com gravidade que para logo (arrasto alto).
  //      Ela nao e empurrada pela colisao bruta entre dois corpos (instavel no
  //      Arcade): quem move a caixa e o codigo, quando o jogador anda contra
  //      ela. Assim da para subir nela sem tremer. Se cair do mapa, volta.
  criaCaixa: function (px, py) {
    var s = this.physics.add.image(px + 16, py + 17, 'caixa').setDepth(6);
    s.body.setDragX(900);
    s.body.setMaxVelocity(ELEM.EMPURRA, FIS.QUEDA_MAX);
    s.body.pushable = false;
    s.setData('origem', { x: px + 16, y: py + 17 });
    this.caixas.push(s);
  },
  encostouCaixa: function (cx) {
    var r = this.r, rb = r.corpo.body, e = r.entrada;
    if (r.morto || rb.bottom <= cx.body.top + 4) return;         // em cima dela: so apoio
    var lado = rb.center.x < cx.body.center.x ? 1 : -1;          // empurra para longe do jogador
    if ((lado > 0 && e.dir) || (lado < 0 && e.esq)) {
      cx.body.setVelocityX(lado * ELEM.EMPURRA);
      r.corpo.setVelocityX(lado * ELEM.EMPURRA);                 // os dois andam juntos, sem trancos
      if (!this.dicaCaixa) { this.dicaCaixa = true; balao(this, cx.x, cx.body.top - 30, 'EMPURRA!', C.ui); }
    }
  },
  voltaCaixa: function (cx) {
    var o = cx.getData('origem');
    if (Math.abs(cx.x - o.x) < 2 && Math.abs(cx.y - o.y) < 2) return;
    if (!this.livreEm(o.x - 15, o.y - 15, 30, 30)) return;
    cx.body.reset(o.x, o.y);
    cx.setAlpha(0);
    this.tweens.add({ targets: cx, alpha: 1, duration: 300 });
  },
  atualizaCaixas: function () {
    for (var i = 0; i < this.caixas.length; i++) {
      var cx = this.caixas[i], b = cx.body;
      if (cx.y > this.LH + 60) { this.voltaCaixa(cx); continue; }          // caiu do mapa
      // Apoiada num piso? Entao a gravidade dela desliga e ela fica parada de
      // verdade: se a caixa "caisse" junto com o jogador a cada passo, a
      // fisica deixava ele afundar 1px em quadros alternados (animacao
      // piscando). Empurrada para fora de uma borda, volta a cair.
      if (this.temPisoEmbaixo(b) && b.velocity.y >= 0) {
        b.setAllowGravity(false);
        b.setVelocityY(0);
      } else {
        b.setAllowGravity(true);
      }
    }
  },
  // existe algum corpo estatico ativo (telhado, telha rachada inteira,
  // trampolim, telha fantasma firme...) logo embaixo deste corpo?
  temPisoEmbaixo: function (b) {
    var achados = this.physics.overlapRect(b.left + 2, b.bottom, b.width - 4, 2, false, true);
    for (var k = 0; k < achados.length; k++) if (achados[k].enable) return true;
    return false;
  },

  // Encostou num perigo. A unica habilidade que resolve e o ESCUDO do Tobias,
  // que apara qualquer perigo do telhado. O dash NAO passa raspando: quem
  // encosta no mato escorrega igual, dashando ou nao.
  tocouPerigo: function (pg) {
    var r = this.r;
    if (r.morto || this.terminou || r.invenc > 0) return;
    if (r.escudando) {
      escudoAparou(this, r);
      balao(this, r.corpo.x, r.corpo.y - 28, 'APAREI!', r.luz);
      return;
    }
    this.mata(pg.getData('tipo') === '^' ? 'mato' : 'buraco');
  },

  // ---- PISAO do Tobias: o baque no telhado ---------------------------------
  // Quebra na hora as telhas rachadas por perto, empurra as caixas para longe
  // e, se o chefe estiver ao alcance, corta o ataque dele e o deixa tonto.
  // E a resposta "de controle" ao dash do Koburo: mais lenta, mas resolve.
  baqueDoPisao: function (r) {
    var raio = r.pf.pisaoRaio, i, q, cx, d, alvoY = r.corpo.body.bottom;
    SOM.pisaoBate();
    if (!POUCO_MOV) {
      this.pPoeira.explode(16, r.corpo.x, alvoY);
      this.cameras.main.shake(180, 0.010);
    }
    pontosVoando(this, r.corpo.x, r.corpo.y - 26, 'PISÃO!', r.luz, 10);
    for (i = 0; i < this.quebradicas.length; i++) {
      q = this.quebradicas[i];
      if (q.estado !== 'firme') continue;
      if (Math.abs(q.x + 16 - r.corpo.x) > raio || Math.abs(q.y - alvoY) > 48) continue;
      q.estado = 'treme'; q.t = 1;              // cede na hora, sem esperar
    }
    for (i = 0; i < this.caixas.length; i++) {
      cx = this.caixas[i];
      d = cx.x - r.corpo.x;
      if (Math.abs(d) > raio + 20 || Math.abs(cx.y - alvoY) > 60) continue;
      cx.body.setVelocityX((d >= 0 ? 1 : -1) * ELEM.EMPURRA * 3.2);
      cx.body.setVelocityY(-180);
      SOM.quebra();
    }
    if (this.boss) this.boss.levaBaque(r.corpo.x, raio + 40);
    if (this.quebraTrincadas) this.quebraTrincadas(r.corpo.x, alvoY, raio);
  },

  // conta o uso de habilidade (desafios e pontuacao olham isto)
  contaHabilidade: function () {
    this.usosHab = (this.usosHab || 0) + 1;
    if (this.placar) this.placar.usosHab = this.usosHab;
  },

  // ---- Ovo secreto "s": vale 5 ovos e conta para o desafio dos segredos.
  //      Fica escondido em rota alternativa; quando o jogador chega perto, ele
  //      brilha um pouco (recompensa quem explorou, sem entregar de graca).
  criaOvoSecreto: function (px, py) {
    var o = criaItem(this, px + 16, py + 16, 'ovo_sec', null, 7);
    o.setData('secreto', true);
    this.moedas.add(o);
    if (!POUCO_MOV) {
      this.tweens.add({ targets: o, y: o.y - 5, duration: 900, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
      this.tweens.add({ targets: o, alpha: 0.7, duration: 600, yoyo: true, repeat: -1 });
    }
  },

  // ---- Telha fantasma "D": aparece e some no ritmo, sempre avisando antes.
  //      As colunas alternam o compasso, entao formam um caminho que "anda".
  criaFantasma: function (px, py, col, len) {
    var imgs = [], i;
    for (i = 0; i < len; i++) imgs.push(this.add.image(px + 16 + i * T, py + 16, 'fantasma_on').setDepth(4));
    // UM corpo para o grupo inteiro: sem emendas, sem engatar ao correr
    var corpo = this.grupoD.create(px + len * T / 2, py + 16, 'branco');
    corpo.setVisible(false).setDisplaySize(len * T, T).refreshBody();
    // grupos de 4 colunas entram em contratempo: da para atravessar pulando
    var ciclo = ELEM.FANTASMA_ON + ELEM.FANTASMA_OFF;
    this.fantasmas.push({
      imgs: imgs, corpo: corpo, t: (Math.floor(col / 4) % 2) * (ciclo / 2), firme: true,
      rx: px, ry: py, rw: len * T, rh: T        // retangulo, para checar se esta livre
    });
  },
  atualizaFantasmas: function (dt) {
    var ciclo = ELEM.FANTASMA_ON + ELEM.FANTASMA_OFF, i, f, fase, firme, aviso;
    for (i = 0; i < this.fantasmas.length; i++) {
      f = this.fantasmas[i];
      f.t = (f.t + dt) % ciclo;
      firme = f.t < ELEM.FANTASMA_ON;
      // Voltar a ser solida com alguem DENTRO empurraria o corpo para fora
      // pelo menor eixo - o jogador podia ser cuspido para dentro do telhado.
      // A telha rachada ja esperava o lugar ficar livre (veja voltaQ); aqui
      // valia o mesmo cuidado, porque a piscada so avisa antes de SUMIR, nunca
      // antes de voltar.
      if (firme && !f.firme && !this.livreEm(f.rx, f.ry, f.rw, f.rh)) firme = false;
      aviso = firme && f.t > ELEM.FANTASMA_ON - ELEM.FANTASMA_AVISO;
      var k;
      if (firme !== f.firme) {
        f.firme = firme;
        f.corpo.body.enable = firme;
        for (k = 0; k < f.imgs.length; k++) f.imgs[k].setTexture(firme ? 'fantasma_on' : 'fantasma_off');
        SOM.fantasma(firme);
      }
      // piscada de aviso (com POUCO_MOV fica so mais apagada, sem piscar)
      var al = firme ? (aviso ? (POUCO_MOV ? 0.6 : (Math.floor(f.t / 90) % 2 ? 0.45 : 1)) : 1) : 0.45;
      for (k = 0; k < f.imgs.length; k++) f.imgs[k].setAlpha(al);
    }
  },

  // ---- Telha trincada ":": so cede para quem BATE nela - o dash do Koburo
  //      ou o pisao do Tobias. E o obstaculo que pede habilidade especifica,
  //      e cada personagem tem a sua resposta. Atras dela costuma ter atalho.
  criaTrincada: function (px, py) {
    var img = this.add.image(px + 16, py + 16, 'trincada').setDepth(4);
    var corpo = this.grupoTr.create(px + 16, py + 16, 'branco');
    corpo.setVisible(false).setDisplaySize(T, T).refreshBody();
    var tr = { img: img, corpo: corpo, x: px + 16, y: py + 16, quebrada: false };
    corpo.setData('tr', tr);
    this.trincadas.push(tr);
  },
  bateuTrincada: function (corpo) {
    var tr = corpo.getData('tr'), r = this.r;
    if (!tr || tr.quebrada) return;
    if (r.dashando || r.pisando) { this.quebraTrincada(tr); return; }
    if (!this.dicaTrincada) {
      this.dicaTrincada = true;
      balao(this, tr.x, tr.y - 30, r.pf.hab === 'escudo' ? 'PISÃO QUEBRA!' : 'DASH QUEBRA!', C.perigo2);
    }
  },
  quebraTrincada: function (tr) {
    tr.quebrada = true;
    tr.corpo.body.enable = false;
    SOM.quebra();
    if (!POUCO_MOV) this.pPoeira.explode(12, tr.x, tr.y);
    if (this.placar) this.placar.marca(PONT.SEGREDO / 3, tr.x, tr.y - 16, 'PASSAGEM!', C.p1luz, false);
    this.tweens.add({ targets: tr.img, alpha: 0, scale: 1.4, angle: 25, duration: 340,
                      onComplete: function () { tr.img.setVisible(false); } });
  },
  // chamado pelo baque do pisao: quebra tudo o que estiver ao alcance
  quebraTrincadas: function (x, y, raio) {
    for (var i = 0; i < this.trincadas.length; i++) {
      var tr = this.trincadas[i];
      if (tr.quebrada) continue;
      if (Math.abs(tr.x - x) <= raio + 16 && Math.abs(tr.y - y) <= 52) this.quebraTrincada(tr);
    }
  },

  // ---- Telha escorregadia "A": empurra quem esta em cima. Usada para ganhar
  //      velocidade de graca (fases de corrida) ou para complicar a mira.
  criaEscorrega: function (px, py, len) {
    for (var i = 0; i < len; i++) this.add.image(px + 16 + i * T, py + 16, 'escorrega').setDepth(4);
    // faixa inteira num corpo so: correndo em cima nao ha emenda para engatar
    var corpo = this.grupoAs.create(px + len * T / 2, py + 16, 'branco');
    corpo.setVisible(false).setDisplaySize(len * T, T).refreshBody();
  },
  pisouEscorrega: function (es) {
    var r = this.r;
    if (r.morto || r.corpo.body.bottom > es.body.top + 8) return;
    r.escorregando = true;
  },

  // ---- Corrente de ar "~": sopro que empurra para cima. E a rota alta do
  //      Tobias (que nao tem pirueta) e um atalho para os dois.
  criaVento: function (px, py) {
    var img = this.add.image(px + 16, py + 16, 'vento').setDepth(5).setAlpha(0.75);
    if (!POUCO_MOV) {
      this.tweens.add({ targets: img, y: img.y - 10, alpha: 0.35, duration: 700,
                        yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
    }
    this.ventos.push({ x: px, y: py, img: img });
  },
  atualizaVentos: function (dt) {
    var r = this.r, b = r.corpo.body, i, v;
    // morto ou pisando nao sofre vento - mas o "ja toquei o som" precisa ser
    // zerado aqui, senao quem morre dentro da corrente volta sem o som dela
    if (r.morto || r.pisando) { this.ventouSom = false; return; }
    for (i = 0; i < this.ventos.length; i++) {
      v = this.ventos[i];
      if (b.right < v.x || b.left > v.x + T || b.bottom < v.y || b.top > v.y + T) continue;
      b.velocity.y = Math.max(ELEM.VENTO_MAX, b.velocity.y - ELEM.VENTO * dt / 1000);
      r.cargas = r.cargasMax;              // o vento devolve o folego do dash
      r.piruetaUsada = false;
      if (!POUCO_MOV && Math.random() < 0.3) this.pPoeira.explode(1, r.corpo.x, r.corpo.y + 14);
      if (!this.ventouSom) { this.ventouSom = true; SOM.vento(); }
      return;
    }
    this.ventouSom = false;
  },

  // ---- Bichos do telhado ----------------------------------------------------
  atualizaBichos: function (dt) {
    var r = this.r, i, b, res;
    for (i = 0; i < this.bichos.length; i++) {
      b = this.bichos[i];
      atualizaBicho(this, b, dt, r);
      if (!b.vivo || this.terminou) continue;
      res = checaBicho(this, b, r);
      if (res === 'pegou') { this.mata(b.tipo); return; }
    }
  },
  reviveBichos: function () {
    for (var i = 0; i < this.bichos.length; i++) reviveBicho(this, this.bichos[i]);
  },

  pegaMoeda: function (m) {
    if (!m.active) return;
    var secreto = !!m.getData('secreto');
    if (secreto) { this.secretosPegos++; this.placar.secretos = this.secretosPegos; }
    else this.moedasPegas++;
    this.placar.ovos = this.moedasPegas;
    this.pMoeda.explode(POUCO_MOV ? 4 : (secreto ? 22 : 12), m.x, m.y);
    // clarao rapido no lugar do ovo
    var f = this.add.image(m.x, m.y, 'pixel').setScale(3).setDepth(12).setTint(0xffffff);
    this.tweens.add({ targets: f, scale: secreto ? 16 : 9, alpha: 0, duration: 260,
                      onComplete: function () { f.destroy(); } });
    this.tweens.add({ targets: this.hud.ovos, scale: 1.35, duration: 90, yoyo: true });
    // ovo secreto vale 5x e sempre encadeia o combo
    this.placar.marca(secreto ? PONT.OVO_SEC : PONT.OVO, m.x, m.y - 10,
                      secreto ? 'OVO SECRETO!' : null, secreto ? C.p1luz : C.moeda, true);
    if (secreto) {
      SOM.segredo();
      this.cameras.main.flash(180, 80, 120, 200);
      legenda(this, 'OVO SECRETO ENCONTRADO', C.p1luz);
    }
    else SOM.moeda();
    m.destroy();
    this.atualizaHud();
  },

  ativaCheck: function (c) {
    if (c.getData('ativo')) return;
    c.setData('ativo', true);
    c.setTexture('check1');
    var luz = this.add.image(c.x + 2, c.y + 5, 'luz_rad').setBlendMode('ADD').setTint(0xffb050)
      .setDepth(5.5).setScale(0.55).setAlpha(0.5);
    if (!POUCO_MOV) this.tweens.add({ targets: luz, alpha: 0.28, scale: 0.62, duration: 900, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
    this.ponto = c.getData('pos');
    this.placar.marca(PONT.CHECK, c.x, c.y - 14, null, C.p1luz, false);
    SOM.checkpoint();
    legenda(this, 'CHECKPOINT ACESO', C.p1luz);
    this.tweens.add({ targets: c, scaleY: 1.25, duration: 140, yoyo: true });
    var av = txt(this, LARG / 2, 130, 'CHECKPOINT!', 12, C.p1luz).setScrollFactor(0).setDepth(100);
    this.tweens.add({ targets: av, alpha: 0, y: 110, delay: 700, duration: 600,
                      onComplete: function () { av.destroy(); } });
  },

  // "causa" vai so para o relatorio de quedas (mato, buraco, vao, chefe ou
  // o tipo do bicho)
  mata: function (causa) {
    var cena = this, r = this.r;
    if (r.morto || this.terminou || this.perdeu || this.emCena) return;
    RelQuedas.anota(this.iFase, causa || '?', Math.floor(r.corpo.x / T));
    r.morto = true;
    r.dashT = 0; r.dashando = false; r.pisando = false; r.mergulhando = false;
    r.escudando = false; r.escudoT = 0;
    this.mortes++;
    this.placar.mortes = this.mortes;
    this.placar.zera();
    r.corpo.setVelocity(0, 0);
    r.corpo.body.setAllowGravity(false);
    explodeMorte(this, r, this.cameras.main);
    balao(this, r.corpo.x, r.corpo.y - 26, fraseQueda(), C.perigo2);
    if (this.boss) this.boss.jogadorCaiu();     // o chefe para tudo e comemora
    this.atualizaHud();
    this.time.delayedCall(650, function () { cena.renasce(); });
  },

  renasce: function () {
    var r = this.r, p = this.ponto;
    r.corpo.setPosition(p.x, p.y);
    r.corpo.setVelocity(0, 0);
    r.corpo.body.setAllowGravity(true);
    r.morto = false; r.dashT = 0; r.dashando = false; r.dashCd = 0;
    r.cargas = r.cargasMax; r.invenc = 700; r.sx = 1; r.sy = 1; r.buffer = 0; r.coyote = 0;
    r.quique = null; r.molaPendente = false; r.pisaoPendente = false;
    r.escudando = false; r.escudoT = 0; r.habCd = 0; r.girando = 0;
    r.pisando = false; r.mergulhando = false; r.piruetaUsada = false;
    this.cameras.main.flash(160, 26, 28, 44);
    // o chefe se afasta do ponto de renascimento e recomeca a rodada
    if (this.boss) this.boss.jogadorVoltou(p);
    // se escorregou, as caixas voltam ao lugar (nenhuma fica presa num canto)
    for (var i = 0; i < this.caixas.length; i++) this.voltaCaixa(this.caixas[i]);
    this.reviveBichos();
  },

  // Junta tudo o que aconteceu na fase: bonus de fim, desafios cumpridos,
  // estrelas, medalha e XP. Devolve o pacote que a tela de resultado mostra.
  fechaConta: function () {
    var f = FASES[this.iFase], pl = this.placar, i, d, lista;
    var res = { tempo: this.tempoMs, ovos: this.moedasPegas, secretos: this.secretosPegos,
                mortes: this.mortes, combo: pl.comboMax, usosHab: this.usosHab };
    var bonus = [];
    // bonus de tempo: so nas fases que tem alvo de tempo
    var sobra = Math.max(0, f.alvoTempo - this.tempoMs);
    if (sobra > 0) bonus.push(['RAPIDEZ', Math.round(sobra / 1000) * PONT.BONUS_TEMPO]);
    if (this.totalMoedas > 0 && this.moedasPegas >= this.totalMoedas) bonus.push(['TODOS OS OVOS', PONT.BONUS_COLETA]);
    if (this.mortes === 0) bonus.push(['SEM QUEDAS', PONT.BONUS_LIMPO]);
    var perfeito = this.mortes === 0 && this.totalMoedas > 0 && this.moedasPegas >= this.totalMoedas
                   && (f.totalSecretos === 0 || this.secretosPegos >= f.totalSecretos);
    if (perfeito) bonus.push(['PERFEITO!', PONT.BONUS_PERF]);
    for (i = 0; i < bonus.length; i++) pl.pontos += bonus[i][1];
    res.pontos = pl.pontos;

    // desafios: 1 estrela por terminar + 1 por desafio cumprido
    lista = desafiosDaFase(f);
    var feitos = {}, nEstrelas = 1, detalhes = [];
    for (i = 0; i < lista.length; i++) {
      d = lista[i];
      var ok = !!d.checa(res, f);
      if (ok) { feitos[d.id] = true; nEstrelas++; }
      detalhes.push({ id: d.id, texto: d.texto, feito: ok, jaTinha: !!(Save.fase(this.iFase) || {}).desafios });
    }
    var med = medalhaDe(res.pontos, f.alvoOuro);
    // XP: um tanto fixo por terminar, mais um pedaco da pontuacao
    var xp = 120 + Math.round(res.pontos / 25) + (nEstrelas - 1) * 60 + (perfeito ? 150 : 0);
    return { res: res, bonus: bonus, desafios: detalhes, feitos: feitos,
             estrelas: nEstrelas, medalha: med, perfeito: perfeito, xp: xp, alvoOuro: f.alvoOuro };
  },

  termina: function (motivo) {
    if (this.terminou || this.perdeu) return;
    if (!this.scene.isActive() || !this.r || !this.r.corpo.body) return;
    var cena = this;
    this.terminou = true;
    this.r.entrada = SEM_ENTRADA;
    this.r.corpo.setVelocity(0, 0);
    var conta = this.fechaConta();
    if (conta.perfeito) SOM.perfeito(); else SOM.vitoria();
    this.comemora(conta.perfeito);
    var nivelAntes = Save.nivel(), destravadasAntes = Save.d.desbloqueadas;
    RelQuedas.anota(this.iFase, 'concluiu');
    var recordes = Save.concluir(this.iFase, {
      tempo: this.tempoMs, moedas: this.moedasPegas, mortes: this.mortes,
      pontos: conta.res.pontos, combo: conta.res.combo, secretos: this.secretosPegos,
      estrelas: conta.estrelas, desafios: conta.feitos, xp: conta.xp
    });
    if (Save.personagem() === 1) Save.d.usouKoburo = true; else Save.d.usouTobias = true;
    // desafio do dia: confere o objetivo antes das conquistas (uma delas o olha)
    this.diarioOk = this.diario ? Diario.confere(this.diario, conta.res) : null;
    var ganhas = Conquistas.checa({
      terminou: true, mortes: this.mortes, perfeito: conta.perfeito,
      combo: conta.res.combo, secretos: this.secretosPegos, usosHab: this.usosHab,
      medalha: conta.medalha ? conta.medalha.id : null,
      venceuChefe: FASES[this.iFase].chefe || null
    });
    this.desbloqueouFim = Save.d.desbloqueadas > destravadasAntes;
    this.contaFim = conta;
    this.recordesFim = recordes;
    this.conquistasFim = ganhas;
    this.subiuNivel = Save.nivel() - nivelAntes;
    if (this.bandeira) {
      this.tweens.add({ targets: this.bandeira, scaleY: 1.2, duration: 200, yoyo: true, repeat: 2 });
    }
    // ...e a Cócó escapa de novo, rindo, para o proximo telhado
    if (this.coco) {
      var cc = this.coco, pos = cocoRoboNa(this.iFase);
      cc.flipX = false;
      cc.play(pos ? 'cocoR_corre' : 'coco_corre');
      if (pos) SOM.cocoRoboRi(); else SOM.cacarejo();
      balao(this, cc.x, cc.y - 44, pos ? 'CÓ-CÓ! BIP-BIP! ATÉ A PRÓXIMA!' : 'CÓ CÓ! ATÉ A PRÓXIMA!', pos ? '#9fe8ff' : C.ui);
      this.tweens.add({ targets: cc, x: cc.x + 460, duration: 1300 });
      // saindo do poleiro da arena ela ainda plana para baixo, batendo as asas
      if (FASES[this.iFase].poleiro) {
        this.tweens.add({ targets: cc, y: cc.y + 90, duration: 1300, ease: 'Quad.easeIn' });
      }
    }
    this.time.delayedCall(950, function () {
      cena.scene.start('GameOverScene', {
        modo: 'fase', fase: cena.iFase, tempo: cena.tempoMs,
        moedas: cena.moedasPegas, total: cena.totalMoedas, mortes: cena.mortes,
        secretos: cena.secretosPegos, totalSecretos: FASES[cena.iFase].totalSecretos || 0,
        conta: cena.contaFim, recordes: cena.recordesFim, subiuNivel: cena.subiuNivel,
        conquistas: cena.conquistasFim, desbloqueou: cena.desbloqueouFim,
        diario: cena.diario, diarioOk: cena.diarioOk,
        ultima: cena.iFase >= NUM_FASES - 1
      });
    });
  },

  // Comemoracao de fim de fase: um pulinho, a pirueta de vitoria e o grito
  // do personagem. Reaproveita as animacoes que ja existem.
  comemora: function (perfeito) {
    var r = this.r, cena = this, eu = PERSONAGENS[r.id - 1];
    if (POUCO_MOV) { balao(this, r.corpo.x, r.corpo.y - 30, eu.grito, r.luz); return; }
    r.girando = 420;                       // gira uma vez, de alegria
    r.sx = 0.75; r.sy = 1.3;
    balao(this, r.corpo.x, r.corpo.y - 34, perfeito ? 'PERFEITO!' : eu.grito, r.luz);
    this.pMoeda.explode(perfeito ? 20 : 10, r.corpo.x, r.corpo.y);
    this.time.delayedCall(360, function () {
      if (cena.pPoeira) cena.pPoeira.explode(8, r.corpo.x, r.corpo.body.bottom - 2);
    });
  },

  atualizaHud: function () {
    var f = FASES[this.iFase], pl = this.placar;
    if (!this.hud || !pl) return;
    atualizaHudFase(this, this.hud, {
      r: this.r, pontos: pl.pontos, mortes: this.mortes,
      ovos: this.moedasPegas, totalOvos: this.totalMoedas,
      secretos: this.secretosPegos, totalSecretos: f.totalSecretos || 0,
      combo: pl.combo, mult: pl.mult, janela: pl.janela,
      tempo: this.tempoMs, limite: f.limite || 0,
      progresso: this.LW ? limita((this.r.maxX - 32) / ((this.fimX || this.LW) - 96), 0, 1) : 0
    });
  },

  // ===========================================================================
  //  CUTSCENES, ARENAS E CLIMA
  //  As cenas usam so o que a fase ja tem: a camera principal (pan/zoom), os
  //  sprites, as particulas e os sons. O Roteiro anda no update, entao a
  //  pausa congela a cena junto com o resto.
  // ===========================================================================

  // cartao de entrada da fase: numero, nome e a novidade que ela traz
  cartaoFase: function (fase) {
    var cena = this, y = 248, objs = [];
    var g = this.add.graphics().setScrollFactor(0).setDepth(150);
    g.fillStyle(N.escuro, 0.8); g.fillRect(0, y - 36, LARG, 78);
    g.fillStyle(fase.ameaca ? 0xd7192c : N.moeda, 1); g.fillRect(0, y - 36, LARG, 2); g.fillRect(0, y + 40, LARG, 2);
    objs.push(g);
    objs.push(txt(this, LARG / 2, y - 20, 'FASE ' + (fase.indice + 1) + ' DE ' + NUM_FASES, 8, C.cinza).setScrollFactor(0).setDepth(151));
    objs.push(txt(this, LARG / 2, y + 2, fase.nome, 18, fase.ameaca ? '#ff6a6a' : C.moeda).setScrollFactor(0).setDepth(151));
    if (fase.novidade) objs.push(txt(this, LARG / 2, y + 26, fase.novidade, 8, C.p1luz).setScrollFactor(0).setDepth(151));
    if (!POUCO_MOV) {
      for (var i = 0; i < objs.length; i++) { objs[i].x -= 60; objs[i].setAlpha(0); }
      this.tweens.add({ targets: objs, x: '+=60', alpha: 1, duration: 360, ease: 'Cubic.easeOut' });
    }
    this.tweens.add({ targets: objs, alpha: 0, delay: 2500, duration: 450,
                      onComplete: function () { for (var k = 0; k < objs.length; k++) objs[k].destroy(); } });
  },

  // campo de energia que acompanha um sprite (a Cócó robo pequena)
  poeAura: function (spr, alt, larg, forca) {
    var a = new Aura(this, 0xff1f35, (spr.depth || 8));
    a.forca = a.alvoForca = (forca === undefined ? 0.35 : forca);
    this.auras.push({ a: a, spr: spr, alt: alt, larg: larg });
    return a;
  },
  atualizaAuras: function (dt) {
    for (var i = this.auras.length - 1; i >= 0; i--) {
      var it = this.auras[i];
      if (!it.spr.active) { it.a.destroi(); this.auras.splice(i, 1); continue; }
      it.a.visivel = it.spr.visible && it.spr.alpha > 0.25;
      it.a.atualiza(dt, it.spr.x, it.spr.y, it.alt * Math.abs(it.spr.scaleY), it.larg * Math.abs(it.spr.scaleX));
    }
  },

  // parede invisivel (no mesmo grupo de solidos de sempre)
  criaMuro: function (cx) {
    var s = this.solidos.create(cx, this.LH / 2 - 200, 'branco');
    s.setVisible(false);
    s.setDisplaySize(32, this.LH + 400);
    s.refreshBody();
    return s;
  },
  // objetos criados por uma cutscene (somem juntos no fim, ou se ela for pulada)
  objCena: function (o) { this.objsCena.push(o); return o; },
  limpaObjsCena: function () {
    for (var i = 0; i < this.objsCena.length; i++) {
      var o = this.objsCena[i];
      if (o && o.active) { this.tweens.killTweensOf(o); o.destroy(); }
    }
    this.objsCena = [];
  },
  mostraHud: function (v) {
    var i, h = this.hud;
    if (h) for (i = 0; i < h.lista.length; i++) h.lista[i].setVisible(v);
    if (this.dica) this.dica.setVisible(v);
    if (this.hudDiario) this.hudDiario.setVisible(v);
    if (this.tutorial) { this.tutorial.texto.setVisible(v); this.tutorial.caixa.setVisible(v); }
  },
  // camera: foca um ponto (com zoom) / volta a seguir o jogador
  camFoca: function (x, y, zoom, ms) {
    var cam = this.cameras.main, d = (ms === undefined) ? 600 : ms;
    cam.stopFollow();
    if (d <= 0 || POUCO_MOV) { cam.centerOn(x, y); if (zoom) cam.setZoom(zoom); return; }
    cam.pan(x, y, d, 'Sine.easeInOut', true);
    if (zoom) cam.zoomTo(zoom, d, 'Sine.easeInOut', true);
  },
  camVolta: function (ms) {
    var cam = this.cameras.main;
    if (POUCO_MOV) cam.setZoom(1); else cam.zoomTo(1, ms || 500, 'Sine.easeInOut', true);
    cam.startFollow(this.r.corpo, true, 0.14, 0.16);
  },

  // Comeca uma cutscene. def = { passos, fim, pular }: "fim" deixa o mundo no
  // estado final (e chamado tambem quando a cena e pulada, depois de "pular").
  // id = nome da cena no save: a primeira vez e obrigatoria, depois ENTER pula.
  iniciaRoteiro: function (def, id) {
    var cena = this;
    this.emCena = true;
    this.mostraHud(false);
    if (!this.cinema) this.cinema = new Cinema(this);
    var acaba = function () {
      cena.roteiro = null;
      if (id) Save.marcaCena(id);
      if (cena.cinema) cena.cinema.limpaDica();
      if (def.fim) def.fim.call(cena);
      cena.limpaObjsCena();
    };
    this.roteiro = new Roteiro(this, def.passos, acaba, function () {
      if (cena.cinema) cena.cinema.limpaTextos();
      if (def.pular) def.pular.call(cena);
      acaba();
    });
    if (this.roteiro && this.roteiro.fim) this.roteiro = null;
    if (this.roteiro) {
      this.roteiro.podePular = !!(id && Save.viuCena(id));
      if (this.roteiro.podePular) this.cinema.dica('ENTER: PULAR');
    }
  },

  // ---- ARENAS NO FIM DO TELHADO --------------------------------------------
  // A Ventania (fase 5) abre a arena quando o jogador ENTRA nela; a Ronda
  // (fase 7) so quando ele toca o estandarte, que parecia o fim da fase.
  entraArena: function () {
    var a = this.arenaDef;
    this.arena = { x0: a.x0, x1: a.x1 };
    this.criaMuro(a.x0 - 16); this.criaMuro(a.x1 + 16);
    // quem cair na luta volta do comeco da arena, nunca do meio do telhado
    this.ponto = { x: a.x0 + 80, y: (this.g.length - 5) * T + 17 };
    this.boss = new Boss(this, BOSSES[a.boss], this.pontoBoss.x, this.pontoBoss.y, { intro: true });
    this.boss.spr.setVisible(false);
    if (this.boss.aura) this.boss.aura.visivel = false;
    if (a.gatilho === 'bandeira') this.iniciaRoteiro(this.roteiroSurpresaGigante(), 'gigante');
    else this.iniciaRoteiro(this.roteiroEntradaSamurai(), 'samuraiEntrada');
  },
  // o estandarte: normalmente termina a fase; na Ronda e a armadilha
  tocouBandeira: function () {
    if (this.emCena || this.terminou) return;
    var a = this.arenaDef;
    if (a && a.gatilho === 'bandeira') {
      if (!this.arena) this.entraArena();
      return;                          // durante a luta o estandarte nao termina nada
    }
    this.termina();
  },
  // fumaca e chama dos propulsores de um robo voando
  propulsor: function (x, y) {
    if (POUCO_MOV) return;
    FX.solta(this, 'jato', 2, x, y);
    if (Math.random() < 0.3) FX.solta(this, 'vapor', 1, x, y + 6);
  },

  // ---- SURPRESA DA RONDA: O GIGANTE REAL -------------------------------------
  // O jogador toca o estandarte e comemora como sempre... o telhado treme,
  // o Gigante Real cai do ceu, derruba o estandarte e grita a fala dele.
  roteiroSurpresaGigante: function () {
    var cena = this, b = this.boss, a = this.arenaDef, cam = this.cameras.main, r = this.r;
    var eu = PERSONAGENS[r.id - 1], band = this.bandeira, cc = this.coco, xQueda = b.x;
    var cx = (a.x0 + a.x1) / 2, cy = cam.midPoint.y, robo = cocoRoboNa(this.iFase);
    var baques = 0;
    return {
      passos: [
        // 1. parece o fim de sempre
        { ms: 1400, ini: function () {
            r.corpo.setVelocityX(0);
            r.girando = 420; r.sx = 0.75; r.sy = 1.3;
            SOM.vitoria(); balao(cena, r.corpo.x, r.corpo.y - 34, eu.grito, r.luz);
            if (band) cena.tweens.add({ targets: band, scaleY: 1.2, duration: 200, yoyo: true, repeat: 2 });
            cena.cinema.titulo('', 'FASE CONCLUÍDA!', '', C.moeda, 1100);
          } },
        // 2. ...o telhado comeca a tremer
        { ms: 1500, ini: function () {
            MUSICA.para(); SOM.comboPerde();
            cena.cinema.barras(true, 400);
            cena.camFoca(cx, cy, 1, 700);
            balao(cena, r.corpo.x, r.corpo.y - 34, '...?', r.luz);
          }, passo: function (dt, p) {
            if (p > [0.15, 0.5, 0.85][baques] ) {
              baques++; SOM.chefePisao();
              if (!POUCO_MOV) cam.shake(180 + baques * 60, 0.004 + baques * 0.003);
            }
          } },
        // 3. ele cai do ceu
        { ms: 650, ini: function () {
            b.x = xQueda; b.y = b.chao - 440; b.face = (r.corpo.x < b.x) ? -1 : 1;
            b.poe('pulo'); b.spr.setVisible(true);
            SOM.chefeGrito();
            var o = { p: 0 };
            cena.tweens.add({ targets: o, p: 1, duration: 620, ease: 'Quad.easeIn',
                              onUpdate: function () { b.y = (b.chao - 440) + 440 * o.p; } });
          } },
        // 4. aterrissa: o estandarte cai e a Cócó corre para o canto
        { ms: 900, ini: function () {
            b.y = b.chao; b.poe('parado');
            SOM.chefePisao(); SOM.chefeBonk();
            FX.impacto(cena, b.x, b.chao - 4, 0xffcd75, 1.6);
            if (!POUCO_MOV) { cena.pPoeira.explode(20, b.x, b.chao - 2); cam.shake(400, 0.016); }
            if (band) cena.tweens.add({ targets: band, angle: -80, y: band.y + 20, alpha: 0.6, duration: 380, ease: 'Quad.easeIn' });
            if (cc) {
              cc.play(robo ? 'cocoR_corre' : 'coco_corre'); cc.flipX = false;
              balao(cena, cc.x, cc.y - 40, 'CÓ?!', C.ui);
              cena.tweens.add({ targets: cc, x: a.x1 - 26, duration: 600 });
            }
          } },
        // 5. a fala
        { ms: 2700, ini: function () {
            b.poe('avisa'); SOM.chefeGrito(); MUSICA.toca('chefe');
            balao(cena, b.x, b.caixa().topo - 30, 'ME DÁ A GALINHAAA!!!!', C.perigo2);
            cena.cinema.fala('ACHOU QUE TINHA ACABADO, NÉ? ME DÁ A GALINHAAA!!!!', C.perigo2, 2500);
            cena.camFoca(b.x, b.chao - 70, 1.4, 500);
            if (cc) { cc.play(robo ? 'cocoR_parada' : 'coco_parada'); cc.flipX = true; }
          } },
        { ms: 1800, ini: function () {
            b.poe('parado');
            cena.cinema.titulo('CHEFE  -  FASE 7', 'O GIGANTE REAL', 'O GUARDA MAIS ALTO DO IMPERADOR', C.perigo2, 1600);
            legenda(cena, 'CHEFE: O GIGANTE REAL', C.perigo2);
            cena.camFoca(cx, cy, 1, 500);
          } }
      ],
      pular: function () {
        b.x = xQueda; b.y = b.chao; b.spr.setVisible(true); b.poe('parado');
        if (band) band.setAngle(-80).setAlpha(0.6);
        if (cc) { cc.x = a.x1 - 26; cc.play(robo ? 'cocoR_parada' : 'coco_parada'); cc.flipX = true; }
      },
      fim: function () {
        cam.setBounds(a.x0, 0, a.x1 - a.x0, cena.LH);
        cena.camVolta(300);
        cena.cinema.barras(false, 400);
        cena.mostraHud(true);
        cena.emCena = false;
        b.comecaLuta();
        if (MUSICA.faixa !== 'chefe') MUSICA.toca('chefe');
      }
    };
  },

  // ---- ENTRADA DO SAMURAI ROBO -----------------------------------------------
  // A camera para na arena, um relampago, e ele desce do ceu nos
  // propulsores. Pousa desligado, o visor acende, os servos o levantam e a
  // katana de plasma liga. Ele mira a Cócó e se apresenta.
  roteiroEntradaSamurai: function () {
    var cena = this, b = this.boss, a = this.arenaDef, cam = this.cameras.main;
    var cx = (a.x0 + a.x1) / 2, cy = (this.g.length - 4) * T - ALT / 2 + 124;
    return {
      passos: [
        { ms: 700, ini: function () { cena.cinema.barras(true, 500); MUSICA.para(); cena.r.corpo.setVelocityX(0); } },
        { ms: 1000, ini: function () { cena.camFoca(cx, cy, 1, 1000); } },
        { ms: 800, ini: function () { relampago(cena, true); SOM.faseChefe(); legenda(cena, 'ALERTA: ALGO DESCENDO', C.perigo); } },
        // desce nos propulsores
        { ms: 900, ini: function () {
            b.spr.setVisible(true).setAlpha(1); b.poe('pulo'); b.y = b.chao - 460; SOM.jato();
            var o = { p: 0 };
            cena.tweens.add({ targets: o, p: 1, duration: 850, ease: 'Quad.easeIn',
                              onUpdate: function () { b.y = (b.chao - 460) + 460 * o.p; } });
          }, passo: function () { cena.propulsor(b.x - 8, b.y); cena.propulsor(b.x + 14, b.y); } },
        // pousa ajoelhado e desligado
        { ms: 800, ini: function () {
            b.y = b.chao; b.poe('apaga');
            SOM.katanaImpacto(); SOM.clank(); SOM.chefePisao();
            FX.impacto(cena, b.x, b.chao - 4, 0xffcd75, 1.6);
            FX.solta(cena, 'vapor', 10, b.x - 18, b.chao - 70);
            if (!POUCO_MOV) { cena.pPoeira.explode(18, b.x, b.chao - 2); cam.shake(380, 0.016); }
          } },
        // liga: o visor acende
        { ms: 900, ini: function () {
            SOM.liga(); b.poe('ajoelha');
            if (b.aura) { b.aura.visivel = true; b.aura.forca = 0; b.aura.alvoForca = 0.35; }
            FX.brilho(cena, b.x + 12, b.chao - 62, 0xff2438, 0.4, 500);
          }, passo: function () { if (!POUCO_MOV && Math.random() < 0.15) FX.solta(cena, 'vapor', 1, b.x - 22, b.chao - 86); } },
        // os servos o levantam
        { ms: 800, ini: function () { b.poe('levanta'); SOM.servo(); } },
        // a katana de plasma liga
        { ms: 900, ini: function () {
            b.poe('carrega'); SOM.katanaPrepara(); SOM.gongo(); SOM.roboVoz();
            FX.impacto(cena, b.x, b.chao - 60, 0xff2438, 1.6); FX.flash(cena, 160, 255, 60, 60);
            if (b.aura) b.aura.alvoForca = 0.95;
            cena.camFoca(b.x, b.chao - 80, 1.35, 500);
            cena.cinema.fala('ALVO DETECTADO: A GALINHA DO IMPERADOR.', '#9fe8ff', 1700);
          } },
        { ms: 2300, ini: function () {
            cena.cinema.titulo('CHEFE  -  NÍVEL 5', 'SAMURAI ROBÔ', 'A MÁQUINA DE GUERRA DOS TELHADOS', '#ff2438', 2100);
            legenda(cena, 'CHEFE: SAMURAI ROBÔ', C.perigo);
          } },
        { ms: 500, ini: function () {
            b.poe('parado'); if (b.aura) b.aura.alvoForca = b.def.auraFase[1];
            cena.camFoca(cx, cy, 1, 500);
          } }
      ],
      pular: function () {
        b.y = b.chao; b.spr.setVisible(true).setAlpha(1).clearTint(); b.poe('parado');
        if (b.aura) { b.aura.visivel = true; b.aura.alvoForca = b.def.auraFase[1]; }
      },
      fim: function () {
        cam.setBounds(a.x0, 0, a.x1 - a.x0, cena.LH);   // a camera fica presa na arena
        cena.camVolta(300);
        cena.cinema.barras(false, 400);
        cena.mostraHud(true);
        cena.emCena = false;
        b.comecaLuta();
        MUSICA.toca('samurai');
      }
    };
  },

  // Virada de fase de um chefe robo (chamada pelo Boss.acerta). Tres jeitos:
  //   rugido      - SOBRECARGA: alarme, vapor, o campo de energia cresce e a
  //                 musica acelera
  //   descontrole - PANE: a camera chega perto, ele cai faiscando, o reator
  //                 apaga... e reinicia no modo furia
  //   instavel    - (Cócó) CURTO-CIRCUITO: o dispositivo no pescoco pisca
  //                 e falha - a deixa de que e ele o problema
  mudaFaseBoss: function (b, fase) {
    var cena = this, d = b.def, tipo = (d.cenaFase || {})[fase] || 'rugido';
    var cam = this.cameras.main, cx = (b.ax0 + b.ax1) / 2, cy = cam.midPoint.y;
    var poseRugido = d.pre === 'sr_' ? 'carrega' : 'grito';
    var nomeFase = (d.nomesFase || {})[fase] || '';
    var voz = function () { SOM[d.somVoz || 'chefeGrito'](); };
    var explode = function () {
      FX.flash(cena, 200, 255, 60, 60);
      FX.anel(cena, b.x, b.chao - 50, d.corAura, 220, 500, 0.8);
      FX.solta(cena, 'faisca', 24, b.x, b.chao - 50);
      FX.solta(cena, 'vapor', 12, b.x, b.chao - 60);
      if (!POUCO_MOV) cam.shake(600, 0.012);
    };
    // o que muda de verdade na luta: campo de energia, musica e o aviso escrito
    var vira = function () {
      if (b.aura) { b.aura.alvoForca = (d.auraFase || {})[fase] || 0.8; b.aura.instavel = fase >= 3; }
      if (d.musicaFase && d.musicaFase[fase]) MUSICA.toca(d.musicaFase[fase]);
      legenda(cena, nomeFase || 'O CHEFE MUDOU', C.perigo);
    };
    var titulo = function () { cena.cinema.titulo('', nomeFase, '', '#ff2438', 1300); };
    var faisca = function () {
      if (POUCO_MOV) return;
      if (Math.random() < 0.35) FX.solta(cena, 'faisca', 2, b.x + (Math.random() - 0.5) * 40, b.chao - Math.random() * 80);
      if (Math.random() < 0.08) FX.solta(cena, 'pecas', 1, b.x, b.chao - 50);
    };
    b.limpaAtaque(); b.escondeEstrelas();
    var centra = { ms: 520, ini: function (rt) { if (!b.vaiProCentro(480)) rt.t = 520; } };
    var passos;
    if (tipo === 'descontrole') {
      passos = [
        { ms: 0, ini: function () { cena.cinema.barras(true, 350); MUSICA.para(); b.hudVisivel(false); } },
        centra,
        { ms: 1200, ini: function () {
            b.poe(d.pre === 'sr_' ? 'ajoelha' : 'tonto'); if (b.aura) b.aura.alvoForca = 0.08;
            cena.camFoca(b.x, b.chao - 60, 1.45, 900); SOM.curto(); SOM.desliga();
            cena.cinema.fala('ERRO... ERRO... REINICIANDO...', '#9fe8ff', 1600);
          }, passo: faisca },
        { ms: 1000, ini: function () { SOM.liga(); },
          passo: function (dt, p) { faisca(); if (!POUCO_MOV) b.spr.setAlpha(Math.floor(p * 12) % 2 ? 0.6 : 1); } },
        { ms: 1200, ini: function () { b.spr.setAlpha(1); b.poe(poseRugido); voz(); SOM.faseChefe(); vira(); explode(); } },
        { ms: 1400, ini: function () { titulo(); cena.camFoca(cx, cy, 1, 600); } }
      ];
    } else if (tipo === 'instavel') {
      passos = [
        { ms: 0, ini: function () { cena.cinema.barras(true, 350); b.hudVisivel(false); } },
        centra,
        { ms: 1500, ini: function () {
            b.poe('tonto'); cena.camFoca(b.x, b.chao - 50, 1.4, 700); SOM.curto();
            cena.cinema.fala('O DISPOSITIVO NO PESCOÇO DELA ESTÁ FALHANDO!', C.p2luz, 1500);
          }, passo: function (dt, p) {
            faisca();
            if (!POUCO_MOV && Math.random() < 0.12) FX.brilho(cena, b.x + (b.face < 0 ? -10 : 10), b.chao - 30, 0x73eff7, 0.25, 160);
            if (POUCO_MOV) return;
            if (Math.floor(p * 16) % 3 === 0) b.spr.setTintFill(0xffffff); else b.spr.clearTint();
          } },
        { ms: 1100, ini: function () { b.spr.clearTint(); b.poe(poseRugido); voz(); SOM.faseChefe(); vira(); explode(); } },
        { ms: 1300, ini: function () { titulo(); cena.camFoca(cx, cy, 1, 600); } }
      ];
    } else {
      passos = [
        { ms: 0, ini: function () { cena.cinema.barras(true, 300); b.hudVisivel(false); } },
        centra,
        { ms: 1400, ini: function () { b.poe(poseRugido); voz(); SOM.faseChefe(); vira(); explode(); titulo(); } }
      ];
    }
    this.iniciaRoteiro({ passos: passos, fim: function () {
      b.spr.setAlpha(1).clearTint();
      cena.cinema.barras(false, 350);
      cena.camVolta(400);
      cena.mostraHud(true);
      cena.emCena = false;
      b.retoma();
    } }, null);
  },

  // ---- DERROTA DO SAMURAI ROBO -------------------------------------------------
  // Ele cai de joelhos, tenta levantar, entra em pane e desliga... pausa...
  // religa uma ultima vez, ergue o DISPOSITIVO e o lanca para longe. A camera
  // segue o dispositivo ate a Cócó: ele gruda no pescoco dela, as chapas de
  // aco se encaixam e nasce a GALINHA ROBO, que foge voando nos propulsores.
  derrotaSamurai: function (b) {
    var cena = this, cam = this.cameras.main, a = this.arenaDef, cc = this.coco;
    var disp = null, grande = null, auraC = null;
    if (!cc) cc = this.add.sprite(a.coco.c * T + 16, a.coco.l * T + 2, 'coco4').setOrigin(0.5, 1).setDepth(8);
    this.coco = null;                 // a fuga de fim de fase nao vale aqui: a cena cuida dela
    var pane = function (q) {          // faiscas, vapor e pecas saindo da carcaca
      if (POUCO_MOV) return;
      FX.solta(cena, 'faisca', q, b.x + (Math.random() - 0.5) * 50, b.chao - 20 - Math.random() * 60);
      if (Math.random() < 0.2) FX.solta(cena, 'vapor', 1, b.x - 18, b.chao - 80);
      if (Math.random() < 0.06) FX.solta(cena, 'pecas', 1, b.x, b.chao - 50);
    };
    var passos = [
      // 1. o golpe final
      { ms: 0, ini: function () {
          FX.hitstop(cena, 160); FX.flash(cena, 200); SOM.katanaImpacto(); SOM.curto();
          if (!POUCO_MOV) cam.shake(420, 0.016);
          MUSICA.para(); cena.cinema.barras(true, 400); cena.mostraHud(false); b.hudVisivel(false);
          b.poe('atingido'); b.icone.setVisible(false);
          FX.solta(cena, 'faisca', 30, b.x, b.chao - 60); FX.solta(cena, 'pecas', 6, b.x, b.chao - 60);
        } },
      // 2. perde o equilibrio (o tranco o leva para longe da parede)
      { ms: 600, ini: function () { b.vaiProCentro(560, 'atingido'); } },
      // 3. cai de joelhos; a musica muda
      { ms: 1200, ini: function () {
          b.poe('ajoelha'); SOM.clank(); SOM.chefePisao(); FX.solta(cena, 'vapor', 10, b.x, b.chao - 30);
          cena.camFoca(b.x, b.chao - 70, 1.6, 900); MUSICA.toca('drama');
        } },
      // 4. tenta ficar de pe... os servos nao aguentam
      { ms: 800, ini: function () { b.poe('levanta'); SOM.servo(); },
        passo: function () { pane(1); if (!POUCO_MOV) b.x += (Math.random() - 0.5) * 1.2; } },
      { ms: 700, ini: function () { b.poe('ajoelha'); SOM.clank(); if (!POUCO_MOV) cam.shake(160, 0.006); } },
      // 5. sistema critico: pane geral
      { ms: 1700, ini: function () {
          SOM.curto(); FX.solta(cena, 'pecas', 6, b.x, b.chao - 60);
          if (b.aura) { b.aura.instavel = true; b.aura.alvoForca = 0.4; }
          cena.cinema.fala('ERRO... ERRO... SISTEMA CRÍTICO...', '#9fe8ff', 1500);
        }, passo: function (dt, p) {
          pane(2);
          b.spr.setTexture(Math.floor(p * 10) % 2 ? 'sr_ajoelha1' : 'sr_ajoelha0');   // o visor falhando
        } },
      // 6. desliga. Silencio: parece o fim.
      { ms: 1600, ini: function () {
          b.poe('apaga'); SOM.desliga(); MUSICA.para();
          if (b.aura) b.aura.visivel = false;
        }, passo: function () { if (!POUCO_MOV && Math.random() < 0.05) FX.solta(cena, 'vapor', 1, b.x - 18, b.chao - 70); } },
      // 7. ...mas ele religa uma ultima vez e ergue o dispositivo
      { ms: 1800, ini: function () {
          SOM.liga(); SOM.servo();
          b.spr.setTexture('sr_arremessa0');
          if (b.aura) { b.aura.visivel = true; b.aura.instavel = true; b.aura.alvoForca = 0.7; }
          cena.cinema.fala('...PROTOCOLO FINAL: GALINHA ROBÔ.', '#9fe8ff', 1600);
          disp = cena.objCena(cena.add.image(b.x + b.face * 44, b.chao - 96, 'dispositivo').setDepth(14).setScale(0.2));
          cena.tweens.add({ targets: disp, scale: 1.4, duration: 700, ease: 'Back.easeOut' });
          SOM.energiaCarrega(1.6);
          cena.camFoca(b.x, b.chao - 90, 1.8, 700);
        }, passo: function () {
          pane(1);
          if (!POUCO_MOV && Math.random() < 0.3) FX.brilho(cena, disp.x, disp.y, 0x73eff7, 0.25, 200);
        } },
      // 8. lanca o dispositivo para fora da cena; a camera vai junto
      { ms: 1600, ini: function () {
          SOM.energiaDispara(); SOM.roboVoz(); FX.flash(cena, 100);
          cam.setBounds(0, 0, cena.LW, cena.LH);
          var ax = disp.x, ay = disp.y, bx2 = cc.x - 6, by2 = cc.y - 14, vai = { p: 0 };
          cena.tweens.add({ targets: vai, p: 1, duration: 1500, ease: 'Sine.easeIn', onUpdate: function () {
            if (!disp.active) return;
            disp.x = ax + (bx2 - ax) * vai.p;
            disp.y = ay + (by2 - ay) * vai.p - Math.sin(vai.p * PI) * 140;
            disp.angle = vai.p * 720;
            disp.setScale(1.4 - 0.6 * vai.p);
          } });
          cam.startFollow(disp, false, 0.1, 0.1);
          if (!POUCO_MOV) cam.zoomTo(1.2, 600, 'Sine.easeInOut', true); else cam.setZoom(1.2);
          // o samurai gastou o que restava: desliga de vez
          b.poe('apaga'); SOM.desliga();
          if (b.aura) b.aura.visivel = false;
          FX.solta(cena, 'pecas', 8, b.x, b.chao - 60); FX.solta(cena, 'vapor', 8, b.x, b.chao - 50);
        }, passo: function () { if (disp && disp.active && !POUCO_MOV) FX.solta(cena, 'faisca', 1, disp.x, disp.y); } },
      // 9. o dispositivo gruda no pescoco da galinha
      { ms: 900, ini: function () {
          disp.setAngle(0).setScale(0.7).setPosition(cc.x - 6, cc.y - 14);
          SOM.clank(); SOM.curto();
          FX.impacto(cena, cc.x, cc.y - 16, 0x73eff7, 1.2);
          cam.stopFollow(); cena.camFoca(cc.x, cc.y - 40, 1.8, 400);
          cc.anims.stop(); cc.setTexture('coco6'); cc.flipX = true;
          balao(cena, cc.x, cc.y - 50, '?!', C.ui); SOM.cacarejo();
        }, passo: function (dt, p) { if (!POUCO_MOV) cc.x += Math.sin(p * 60) * 0.6; disp.x = cc.x - 6; } },
      // 10. a energia do dispositivo percorre o corpo dela
      { ms: 1300, ini: function () {
          cc.setTexture('coco4');
          auraC = cena.poeAura(cc, 28, 24, 0); auraC.alvoForca = 0.9;
          SOM.mecaniza();
        }, passo: function (dt, p) {
          cc.setTint(Math.floor(p * 14) % 2 ? 0x9fe8ff : 0xffffff);
          if (!POUCO_MOV && Math.random() < 0.5) FX.solta(cena, 'faisca', 2, cc.x + (Math.random() - 0.5) * 40, cc.y - Math.random() * 30);
        } },
      // 11. o olho vira LED
      { ms: 900, passo: function (dt, p) { cc.clearTint(); cc.setTexture(Math.floor(p * 9) % 2 ? 'cocoR4' : 'coco4'); } },
      // 12. a transformacao: ela cresce e as chapas de aco se encaixam
      { ms: 1700, ini: function () {
          grande = cena.objCena(cena.add.sprite(cc.x, cc.y + 2, 'cn_meio0').setOrigin(0.5, 1).setDepth(9).setScale(0.36));
          grande.flipX = true;
          cc.setVisible(false); disp.setVisible(false);
          cena.poeAura(grande, 72, 52, 0.5).alvoForca = 1;
          if (!POUCO_MOV) cam.shake(1700, 0.004);
          SOM.mecaniza();
        }, passo: function (dt, p) {
          grande.setScale(0.36 + 0.34 * p);
          if (p > 0.55 && grande.texture.key !== 'cr_avisa0') { grande.setTexture('cr_avisa0'); SOM.clank(); }
          if (!POUCO_MOV && Math.random() < 0.3) FX.solta(cena, 'faisca', 2, grande.x + (Math.random() - 0.5) * 60, grande.y - 40 * grande.scaleY);
        } },
      // 13. ela liga: nasce a GALINHA ROBO
      { ms: 900, ini: function () {
          FX.flash(cena, 260, 255, 80, 80);
          grande.setTexture('cr_grito0').setScale(0.8);
          cena.tweens.add({ targets: grande, scale: 1, duration: 500, ease: 'Back.easeOut' });
          SOM.cocoRobo(); SOM.liga(); SOM.clank();
          FX.anel(cena, grande.x, grande.y - 40, 0xff2438, 200, 500, 0.8);
          FX.solta(cena, 'faisca', 30, grande.x, grande.y - 40); FX.solta(cena, 'vapor', 10, grande.x, grande.y - 30);
          if (!POUCO_MOV) cam.shake(500, 0.02);
          MUSICA.toca('robo');
          cena.camFoca(grande.x, grande.y - 60, 1.5, 500);
        } },
      // 14. a apresentacao do chefe final
      { ms: 2800, ini: function () {
          grande.play('cr_grito');
          cena.cinema.titulo('CHEFE FINAL', 'A GALINHA ROBÔ', 'VOCÊ DERROTOU O SAMURAI... MAS O DISPOSITIVO TRANSFORMOU A CÓCÓ!', '#ff2438', 2600);
          legenda(cena, 'A CÓCÓ VIROU ROBÔ', C.perigo);
        } },
      // 15. ela liga os propulsores e foge voando para dentro da tempestade
      { ms: 1300, ini: function () {
          grande.play('cr_pulo'); SOM.cocoRoboRi(); SOM.jato();
          balao(cena, grande.x, grande.y - 100, 'CÓ-CÓ-CÓ! MODO ROBÔ ATIVADO!', '#9fe8ff');
          cena.tweens.add({ targets: grande, y: grande.y - 420, x: grande.x + 160, duration: 1300, ease: 'Quad.easeIn' });
        }, passo: function () { cena.propulsor(grande.x - 10, grande.y); cena.propulsor(grande.x + 10, grande.y); } },
      { ms: 800, ini: function () { cam.fadeOut(700, 26, 28, 44); } }
    ];
    this.iniciaRoteiro({ passos: passos,
      pular: function () { cam.stopFollow(); cam.fadeOut(300, 26, 28, 44); },
      fim: function () { cena.termina(); } }, 'samuraiFim');
  },

  // ---- ENTRADA DO CHEFE FINAL ----------------------------------------------
  // A Galinha Robo encara o jogador do alto do poleiro: zoom, o LED acende,
  // ela mira, grita no alto-falante e desce nos propulsores.
  roteiroEntradaCoco: function (b) {
    var cena = this, cam = this.cameras.main, f = FASES[this.iFase], r = this.r;
    var px = f.poleiroBoss.c * T, py = f.poleiroBoss.l * T, xFinal = b.x;
    var cx = this.LW / 2, cy = cam.midPoint.y;
    b.x = px; b.y = py; b.face = -1; b.poe('parado');
    if (b.aura) b.aura.forca = b.aura.alvoForca = 0.25;
    var desce = function () { b.x = xFinal; b.y = b.chao; };
    return {
      passos: [
        { ms: 1300, ini: function () { cena.cinema.barras(true, 500); SOM.bipe(); cam.setBounds(0, -200, cena.LW, cena.LH + 200); } },
        { ms: 1500, ini: function () {
            cena.cinema.fala(r.id === 1 ? '...CÓCÓ? O QUE FIZERAM COM VOCÊ?' : 'C-CÓCÓ...? VOCÊ VIROU UM ROBÔ?!', r.luz, 1300);
          } },
        { ms: 1300, ini: function () { cena.camFoca(b.x, b.y - 40, 1.5, 1100); } },
        { ms: 1300, ini: function () {
            SOM.liga(); FX.brilho(cena, b.x - 12, b.y - 52, 0xff2438, 0.5, 900);
            if (b.aura) b.aura.alvoForca = 0.9;
            cena.cinema.fala('CÓ. ALVO: O TRATADOR. MODO COMBATE.', '#9fe8ff', 1200);
            if (!POUCO_MOV) cam.shake(1200, 0.003);
          }, passo: function () {
            if (!POUCO_MOV && Math.random() < 0.4) FX.solta(cena, 'faisca', 1, b.x + (Math.random() - 0.5) * 60, b.y - Math.random() * 70);
          } },
        { ms: 1200, ini: function () {
            b.poe('grito'); SOM.cocoRobo(); SOM.faseChefe();
            FX.flash(cena, 200, 255, 60, 60); FX.anel(cena, b.x, b.y - 40, 0xff2438, 180, 500, 0.8);
            if (!POUCO_MOV) cam.shake(600, 0.014);
            MUSICA.toca('robo');
          } },
        { ms: 2400, ini: function () {
            cena.cinema.titulo('CHEFE FINAL', 'A GALINHA ROBÔ', 'TIRE O DISPOSITIVO DO PESCOÇO DELA!', '#ff2438', 2200);
            legenda(cena, 'CHEFE FINAL: A GALINHA ROBÔ', C.perigo);
            cena.camFoca(cx, cy, 1, 1000);
          } },
        { ms: 800, ini: function () {
            b.poe('pulo'); SOM.jato();
            var x0 = b.x, y0 = b.y, o = { p: 0 };
            cena.tweens.add({ targets: o, p: 1, duration: 780, ease: 'Sine.easeIn', onUpdate: function () {
              b.x = x0 + (xFinal - x0) * o.p;
              b.y = y0 + (b.chao - y0) * o.p - Math.sin(o.p * PI) * 60;
            } });
          }, passo: function () { cena.propulsor(b.x - 10, b.y); cena.propulsor(b.x + 10, b.y); } },
        { ms: 500, ini: function () {
            desce(); b.poe('parado'); SOM.chefePisao(); SOM.clank();
            FX.impacto(cena, b.x, b.chao - 4, 0xffcd75, 1.2); FX.solta(cena, 'vapor', 6, b.x, b.chao - 10);
          } }
      ],
      pular: function () { desce(); b.poe('parado'); if (b.aura) b.aura.alvoForca = b.def.auraFase[1]; },
      fim: function () {
        cam.setBounds(0, 0, cena.LW, cena.LH);
        cena.cinema.barras(false, 400);
        cena.camVolta(300);
        cena.mostraHud(true);
        cena.emCena = false;
        b.comecaLuta();
        if (MUSICA.faixa !== 'robo') MUSICA.toca('robo');
      }
    };
  },

  // ---- DERROTA DA GALINHA ROBO: O TRATADOR TIRA O DISPOSITIVO ---------------
  // Ela entra em pane e senta. O tratador vai ate ela, segura o dispositivo
  // do pescoco e puxa ate arrancar: a luz azul apaga, as chapas de aco caem,
  // e a Cócó volta a ser ela mesma - cansada e confusa, mas bem. Depois,
  // "finalmente acabou": ela bota um ovo dourado e os dois comemoram.
  derrotaCoco: function (b) {
    var cena = this, cam = this.cameras.main, r = this.r, eu = PERSONAGENS[r.id - 1];
    var disp = null, peq = null, lado = 1;
    var posDisp = function () {        // onde o dispositivo esta desenhado no quadro dela
      return { x: b.x + (b.face < 0 ? -1 : 1) * 10, y: b.chao - 28 };
    };
    var pane = function () {
      if (POUCO_MOV) return;
      if (Math.random() < 0.3) FX.solta(cena, 'faisca', 2, b.x + (Math.random() - 0.5) * 50, b.chao - Math.random() * 60);
      if (Math.random() < 0.06) FX.solta(cena, 'vapor', 1, b.x, b.chao - 50);
    };
    var passos = [
      // 1. o golpe final (e o tranco que a tira de perto da parede)
      { ms: 520, ini: function () {
          FX.hitstop(cena, 200); FX.flash(cena, 220); SOM.chefeAcerto(); SOM.curto();
          if (!POUCO_MOV) cam.shake(420, 0.014);
          MUSICA.para(); cena.cinema.barras(true, 400); cena.mostraHud(false); b.hudVisivel(false);
          b.icone.setVisible(false); b.y = b.chao;
          FX.solta(cena, 'pecas', 6, b.x, b.chao - 50);
          if (!b.vaiProCentro(500, 'atingido')) b.poe('atingido');
        } },
      // 2. pane: ela senta, o LED fica em "x"
      { ms: 1300, ini: function () {
          b.poe('pane'); b.spr.anims.stop(); SOM.desliga();
          cena.camFoca(b.x, b.chao - 50, 1.6, 900);
          if (b.aura) { b.aura.instavel = true; b.aura.alvoForca = 0.35; }
        }, passo: pane },
      { ms: 1400, ini: function () {
          SOM.curto();
          cena.cinema.fala('CÓ... BZZT... CÓ... ERRO...', '#9fe8ff', 1300);
        }, passo: function () {
          pane();
          if (!POUCO_MOV && Math.random() < 0.15) { var pd = posDisp(); FX.brilho(cena, pd.x, pd.y, 0x73eff7, 0.25, 180); }
        } },
      // 3. agora: tirar o dispositivo
      { ms: 0, ini: function () {
          cena.camFoca(b.x, b.chao - 50, 1.3, 800);
          cena.cinema.fala(r.id === 1 ? 'É AGORA! DEIXA COMIGO!' : 'É-É AGORA! O DISPOSITIVO!', r.luz, 1400);
          lado = (r.corpo.x < b.x) ? -1 : 1;           // de que lado o tratador chega
        } },
      // o tratador vai ate ela
      { max: 5000, ate: function () {
          var alvo = b.x + lado * 40, d = alvo - r.corpo.x;
          if (Math.abs(d) < 8) { cena.entradaCena = null; return true; }
          cena.entradaCena = { esq: d < 0, dir: d > 0, pulo: false, puloAgora: false, dashAgora: false,
                               habAgora: false, baixo: false, baixoAgora: false };
          return false;
        }, passo: pane },
      // 4. segura o dispositivo e puxa...
      { ms: 1400, ini: function () {
          cena.entradaCena = null;
          r.face = -lado;
          var pd = posDisp();
          disp = cena.objCena(cena.add.image(pd.x, pd.y, 'dispositivo').setDepth(12));
          balao(cena, r.corpo.x, r.corpo.y - 34, 'NHHHHH...!', r.luz);
          SOM.servo();
        }, passo: function (dt, p) {
          pane();
          var t = Math.floor(p * 14) % 2;
          r.sx = t ? 1.25 : 0.85; r.sy = t ? 0.85 : 1.2;   // o tratador fazendo forca
          if (!POUCO_MOV) { b.x += t ? 0.6 : -0.6; disp.x = posDisp().x + (t ? -1 : 1); }
          if (p > 0.6 && !POUCO_MOV && Math.random() < 0.4) FX.solta(cena, 'faisca', 1, disp.x, disp.y);
        } },
      // 5. ...POP! o dispositivo sai voando e apaga
      { ms: 900, ini: function () {
          SOM.arranca(); FX.flash(cena, 150);
          FX.solta(cena, 'faisca', 24, disp.x, disp.y);
          r.sx = 1.4; r.sy = 0.7;
          b.spr.setTexture('cn_meio1');                     // o dispositivo sumiu do pescoco dela
          if (b.aura) { b.aura.alvoForca = 0; b.aura.visivel = false; }
          var x0 = disp.x, y0 = disp.y, xF = disp.x - lado * 150, o = { p: 0 };
          cena.tweens.add({ targets: o, p: 1, duration: 800, ease: 'Linear', onUpdate: function () {
            if (!disp.active) return;
            disp.x = x0 + (xF - x0) * o.p;
            disp.y = y0 + (b.chao - 6 - y0) * o.p - Math.sin(o.p * PI) * 110;
            disp.angle = -lado * o.p * 540;
          }, onComplete: function () {
            if (!disp.active) return;
            disp.setTexture('dispositivo_off').setAngle(0);
            SOM.clank(); SOM.desliga();
            FX.solta(cena, 'faisca', 8, disp.x, disp.y); FX.solta(cena, 'vapor', 4, disp.x, disp.y);
          } });
        } },
      // 6. as chapas de aco caem e a Cócó volta a ser ela mesma
      { ms: 1600, ini: function () { MUSICA.toca('alivio'); SOM.alivio(); },
        passo: function (dt, p) {
          if (!POUCO_MOV && Math.random() < 0.25) { FX.solta(cena, 'pecas', 2, b.x, b.chao - 40); }
          if (p > 0.3 && Math.random() < 0.1) SOM.clank();
          if (p > 0.55 && b.spr.texture.key !== 'cn_parado0') { b.spr.setTexture('cn_parado0'); FX.solta(cena, 'pena', 10, b.x, b.chao - 40); }
        } },
      // 7. e volta ao tamanho de sempre (um "puf" de penas)
      { ms: 700, ini: function () {
          var o = { e: 1 };
          cena.tweens.add({ targets: o, e: 0.36, duration: 600, ease: 'Quad.easeIn',
                            onUpdate: function () { b.spr.setScale(o.e); } });
        } },
      { ms: 0, ini: function () {
          FX.flash(cena, 200); FX.solta(cena, 'pena', 16, b.x, b.chao - 20); SOM.cacarejo();
          b.spr.setVisible(false);
          peq = cena.objCena(cena.add.sprite(b.x, b.chao + 2, 'coco4').setOrigin(0.5, 1).setDepth(9));
          peq.flipX = r.corpo.x < b.x;
          MUSICA.toca('final');
        } },
      // 8. cansada e confusa, ela olha em volta
      { ms: 1800, ini: function () { SOM.cacarejoFraco(); balao(cena, peq.x, peq.y - 40, '?', C.ui); },
        passo: function (dt, p) {
          peq.flipX = Math.floor(p * 4) % 2 === 0;
          peq.angle = POUCO_MOV ? 0 : Math.sin(p * PI * 6) * 4;
        } },
      // ---- CENA FINAL: finalmente acabou ----
      { ms: 1600, ini: function () {
          peq.angle = 0; peq.setTexture('coco4'); peq.flipX = r.corpo.x < peq.x;
          r.face = (peq.x < r.corpo.x) ? -1 : 1;
          cena.camFoca((peq.x + r.corpo.x) / 2, peq.y - 40, 1.5, 700);
          cena.cinema.fala(r.id === 1 ? 'PRONTO, CÓCÓ. VIU? DEIXA COMIGO.' : 'V-VOCÊ TÁ BEM, CÓCÓ?', r.luz, 1400);
        } },
      // ela faz o que sabe fazer: bota um ovo dourado de susto
      { ms: 1500, ini: function () {
          peq.play('coco_ovo'); SOM.cacarejo();
          balao(cena, peq.x, peq.y - 44, 'CÓ CÓ!', C.ui);
          var ovoF = cena.objCena(cena.add.sprite(peq.x + (peq.flipX ? 12 : -12), peq.y - 2, 'moeda0').setOrigin(0.5, 1)
            .setDepth(8).setScale(0.3).play('moeda_gira'));
          cena.tweens.add({ targets: ovoF, scale: 1, duration: 260, ease: 'Back.easeOut' });
          cena.pMoeda.explode(POUCO_MOV ? 3 : 12, peq.x, peq.y - 10);
        } },
      // comemoracao leve depois de tudo
      { ms: 1700, ini: function () {
          peq.play('coco_parada');
          r.girando = 420; r.sx = 0.75; r.sy = 1.3; SOM.vitoriaFinal();
          balao(cena, r.corpo.x, r.corpo.y - 34, eu.grito, r.luz);
          if (!POUCO_MOV) cena.tweens.add({ targets: peq, y: peq.y - 14, duration: 160, yoyo: true, repeat: 2, ease: 'Quad.easeOut' });
        } },
      { ms: 2800, ini: function () {
          cena.cinema.titulo('', 'FINALMENTE ACABOU.', 'A CÓCÓ ESTÁ DE VOLTA - E O SEU EMPREGO TAMBÉM.', C.moeda, 2500);
        } },
      { ms: 900, ini: function () { cam.fadeOut(800, 26, 28, 44); } }
    ];
    this.iniciaRoteiro({ passos: passos,
      pular: function () { cena.entradaCena = null; cam.fadeOut(300, 26, 28, 44); },
      fim: function () { cena.termina(); } }, 'cocoFim');
  },

  // ---- pausa ----
  congela: function (c) { congelaCena(this, c); },

  // ---- paginas de CONTROLES / AJUSTES dentro da pausa ----
  // O menu de pausa some enquanto a pagina esta aberta e volta ao fechar.
  // Se o jogador trocou alguma tecla, o mapa da cena e refeito na hora.
  abreSubPausa: function (pag) {
    var cena = this;
    if (this.sub) return;
    this.mostraMenuPausa(false);
    this.sub = new SubPainelPausa(this, 170, 140, 210);
    var aoSair = function (mudou) {
      cena.sub.destroi(); cena.sub = null;
      if (mudou) refazTeclasJogo(cena);
      cena.mostraMenuPausa(true);
    };
    if (pag === 'controles') this.sub.controles(aoSair); else this.sub.ajustes(aoSair);
  },
  mostraMenuPausa: function (ver) {
    var i;
    // o objsPausa[0] e o escurecido: ele fica, para o jogo atras nao competir
    for (i = 1; i < this.objsPausa.length; i++) this.objsPausa[i].setVisible(ver);
    if (this.listaPausa) {
      var o = this.listaPausa.objetos();
      for (i = 0; i < o.length; i++) o[i].setVisible(ver);
    }
  },

  alternaPausa: function () {
    var cena = this;
    if (this.terminou || this.perdeu) return;
    if (this.sub) { this.sub.sai(); return; }      // ESC fecha a pagina, nao a pausa
    this.pausado = !this.pausado;
    if (this.pausado) {
      this.congela(true);
      var fundo = this.add.rectangle(LARG / 2, ALT / 2, LARG, ALT, N.escuro, 0.75)
        .setScrollFactor(0).setDepth(200);
      var p = painel(this, 310, 140, 340, 264).setScrollFactor(0).setDepth(200);
      var tit = tituloTela(this, LARG / 2, 176, 'PAUSA', 17, 320);
      tit[0].setScrollFactor(0).setDepth(201); tit[1].setScrollFactor(0).setDepth(201);
      var dicaP = txt(this, LARG / 2, 380, 'P OU ESC CONTINUA', 8, C.cinza).setScrollFactor(0).setDepth(201);
      this.objsPausa = [fundo, p, tit[0], tit[1], dicaP];
      this.listaPausa = new MenuLista(this, LARG / 2, 228, [
        { rot: 'CONTINUAR',  acao: function () { cena.alternaPausa(); } },
        { rot: 'REINICIAR',  acao: function () { trocaCena(cena, null, { fase: cena.iFase, diario: cena.diario }, true); } },
        { rot: 'CONTROLES',  acao: function () { cena.abreSubPausa('controles'); } },
        { rot: 'AJUSTES',    acao: function () { cena.abreSubPausa('ajustes'); } },
        { rot: 'MENU',       acao: function () { trocaCena(cena, 'MenuScene'); } }
      ], 30, 12);
      this.listaPausa.fixa(201);
      surgir(this, this.objsPausa.concat(this.listaPausa.objetos()), 140);
    } else {
      for (var i = 0; i < this.objsPausa.length; i++) {
        this.tweens.killTweensOf(this.objsPausa[i]);
        this.objsPausa[i].destroy();
      }
      this.objsPausa = [];
      if (this.listaPausa) { this.listaPausa.destroi(); this.listaPausa = null; }
      if (this.sub) { this.sub.destroi(); this.sub = null; }
      this.congela(false);
    }
  },

  update: function (tempo, delta) {
    var dt = Math.min(delta, 34), t = this.teclas, r = this.r;
    checaMudo(t);
    if (this.pausado && this.sub) { this.sub.atualiza(t, dt); return; }
    var pesc = JD(t.esc) || TOQUE.ap('voltar'), pp = JD(t.p);
    if (pesc || pp) this.alternaPausa();
    if (this.pausado) {
      if (this.listaPausa) this.listaPausa.atualiza(t, dt);
      return;
    }
    // hitstop: a fisica fica parada alguns ms depois de um golpe forte
    if (this.hitstopT > 0) {
      this.hitstopT -= dt;
      if (this.hitstopT > 0) { if (this.cinema) this.cinema.atualiza(); return; }
      this.physics.resume();
    }
    // cutscene: o roteiro anda; ENTER pula as que ja foram vistas uma vez
    if (this.roteiro) {
      if (this.roteiro.podePular && (JD(t.enter) || TOQUE.ap('ok'))) this.roteiro.pula();
      else this.roteiro.atualiza(dt);
    }
    // o relogio da fase nao corre durante as cutscenes
    if (!this.terminou && !this.emCena) {
      this.tempoMs += dt;
      this.placar.passo(dt);
      this.checaLimite();
    }

    this.aplicaCarona();
    this.atualizaMoveis();
    this.atualizaQuebradicas(dt);
    this.atualizaFantasmas(dt);
    this.atualizaCaixas();
    if (this.boss) this.boss.atualiza(dt, r);      // chefe: estados e ataques

    // ---- entrada do jogador (na campanha valem as teclas dos DOIS
    //      perfis, como sempre foi: quem joga sozinho usa a que preferir) ----
    if (this.terminou || r.morto) {
      r.entrada = SEM_ENTRADA;
    } else if (this.emCena) {
      leEntrada(this.tj, 1, 2);        // le e descarta: nada apertado na cena vaza depois
      r.entrada = this.entradaCena || SEM_ENTRADA;
    } else {
      r.entrada = leEntrada(this.tj, 1, 2);
    }
    // chegou na arena do fim do telhado: comeca a luta
    if (this.arenaDef && this.arenaDef.gatilho === 'entrada' && !this.arena && !r.morto && !this.emCena &&
        !this.terminou && r.corpo.x > this.arenaDef.x0 + 80) this.entraArena();
    atualizaCorredor(this, r, dt);
    // pisao: o baque tambem entra depois da fisica, pelo mesmo motivo
    if (r.pisaoPendente) { r.pisaoPendente = false; if (!r.morto) this.baqueDoPisao(r); }
    // trampolim: o impulso entra depois da fisica do jogador, por cima dela
    // (FIS nao muda). Super-pulo que tambem recarrega o dash.
    if (r.molaPendente) {
      r.molaPendente = false;
      if (!r.morto) {
        r.corpo.setVelocityY(ELEM.MOLA);
        r.pulando = false;             // o pulo variavel nao corta o super-pulo
        r.cargas = r.cargasMax;
        r.coyote = 0; r.buffer = 0;
        r.sx = 0.7; r.sy = 1.35;       // estica subindo
      }
    }
    // quique ao pular na cabeca do chefe: mesma ideia do trampolim, aplicado
    // por cima da fisica (que continua intacta)
    if (r.quique) {
      var qq = r.quique;
      r.quique = null;
      if (!r.morto) {
        r.corpo.setVelocityY(qq.vy);
        r.corpo.setVelocityX(qq.vx);
        r.pulando = false;
        r.cargas = r.cargasMax;
        r.coyote = 0; r.buffer = 0;
        r.sx = 0.8; r.sy = 1.25;
      }
    }
    // telha escorregadia: o empurrao entra depois da fisica (e uma forca de
    // fora, como o trampolim; FIS continua igual para todo mundo)
    if (r.escorregando) {
      r.escorregando = false;
      if (!r.morto) r.corpo.body.velocity.x += ELEM.ESCORREGA * dt / 1000;
    }
    // rajada de asas da Cócó: outra forca de fora, aplicada do mesmo jeito
    if (r.vento) {
      if (!r.morto) r.corpo.body.velocity.x += r.vento * dt / 1000;
      r.vento = 0;
    }
    this.atualizaVentos(dt);
    this.atualizaBichos(dt);
    if (this.tutorial && !this.terminou) atualizaTutorial(this, this.tutorial, dt);
    sincronizaCorredor(r, tempo);

    // cair para fora do nivel tambem conta como queda
    if (!r.morto && !this.terminou && r.corpo.y > this.LH + 120) this.mata('vao');

    this.atualizaHud();
    this.atualizaAuras(dt);
    atualizaAmbiente(this, this.ambiente, dt);
    if (this.cinema) this.cinema.atualiza();

    // parallax acompanha a camera
    var sx = this.cameras.main.scrollX;
    this.mont.tilePositionX = sx * 0.25;
    this.morr.tilePositionX = sx * 0.5;
  },

  // Fases com limite de tempo: a contagem regressiva bipa no fim e, se o
  // tempo acabar, o jogador volta ao checkpoint com o combo zerado (nao
  // perde a fase inteira: e uma pressao, nao uma punicao).
  checaLimite: function () {
    var f = FASES[this.iFase];
    if (!f.limite || this.terminou) return;
    var resta = f.limite - this.tempoMs;
    var seg = Math.ceil(resta / 1000);
    if (seg <= 10 && seg > 0 && seg !== this.ultimoTique) {
      this.ultimoTique = seg;
      SOM.tique(seg <= 3);
      legenda(this, 'FALTAM ' + seg + ' SEGUNDOS', C.perigo2);
      if (seg <= 5) {
        pontosVoando(this, this.r.corpo.x, this.r.corpo.y - 46, seg + '!', C.perigo, 16);
      }
    }
    if (resta <= 0 && !this.tempoAcabou) {
      this.tempoAcabou = true;
      this.perde('tempo');
    }
  },

  // ---- DERROTA -------------------------------------------------------------
  // So as fases com limite de tempo podem ser perdidas; nas outras, cair custa
  // tempo e combo, mas nunca a fase. Aqui o jogador para de controlar o
  // boneco, ve o motivo e vai para a tela de GAME OVER.
  perde: function (motivo) {
    var cena = this;
    if (this.terminou || this.perdeu) return;
    if (!this.scene.isActive() || !this.r || !this.r.corpo.body) return;
    this.perdeu = true;
    this.r.entrada = SEM_ENTRADA;
    this.r.corpo.setVelocity(0, 0);
    this.r.corpo.body.setAllowGravity(false);
    SOM.tempoAcabou();
    MUSICA.para();
    legenda(this, 'O TEMPO ACABOU', C.perigo);
    balao(this, this.r.corpo.x, this.r.corpo.y - 34, 'O TEMPO ACABOU!', C.perigo);
    if (!POUCO_MOV) this.cameras.main.shake(260, 0.008);
    this.cameras.main.fadeOut(900, 26, 28, 44);
    this.time.delayedCall(1100, function () {
      cena.scene.start('GameOverScene', {
        modo: 'derrota', motivo: motivo, fase: cena.iFase,
        tempo: FASES[cena.iFase].limite || cena.tempoMs,
        pontos: cena.placar.pontos, moedas: cena.moedasPegas,
        total: cena.totalMoedas, mortes: cena.mortes,
        diario: cena.diario
      });
    });
  }
});

// ============================================================================
//  CENA 4 - PERSEGUICAO (2 jogadores no mesmo teclado, tela dividida)
//  Pista infinita montada com trechos embaralhados + a guarda do imperador
//  avancando atras dos dois (no codigo ainda chamada de "parede"/"borda").
// ============================================================================
var RaceScene = new Phaser.Class({
  Extends: Phaser.Scene,
  initialize: function RaceScene() { Phaser.Scene.call(this, { key: 'RaceScene' }); },

  init: function (dados) {
    this.solo = !!(dados && dados.solo);     // true = MODO INFINITO (1 jogador)
    this.colunas = [];      // grade global da pista: 1 string por coluna
    this.trechos = [];      // pedacos vivos (para descartar os que ficaram atras)
    this.fimX = 0;          // ate que coluna a pista ja foi montada
    this.contaTrecho = 0; this.ultimoId = '';
    this.bordaX = -520; this.bordaVel = 58; this.tempo = 0;
    this.acabou = false; this.pausado = false;
    this.objsPausa = []; this.listaPausa = null;
    this.placar = null; this.moedas = null; this.usosHab = 0;
    this.r1 = null; this.r2 = null; this.corredores = []; this.sub = null;
  },

  create: function () {
    var cena = this, i;
    this.teclas = criarTeclas(this);
    this.tj = criarTeclasJogo(this);
    criaParticulas(this);
    this.ALT_MUNDO = ALT_TRECHO * T;

    this.solidos = this.physics.add.staticGroup();
    this.perigos = this.physics.add.staticGroup();
    if (this.solo) this.moedas = this.add.group();   // ovos semeados na pista

    // ---- ceu ----
    // Perseguicao: ceu de meia tela (cada camera desenha no seu pedaco).
    // Infinito: tela inteira, entao vale o ceu grande da Campanha.
    this.add.image(0, 0, this.solo ? 'ceu' : 'ceu_corrida').setOrigin(0)
      .setScrollFactor(0).setDepth(0);

    // ---- parallax (na tela dividida cada metade tem o seu) ----
    this.par1 = this.criaParallax(this.solo);
    this.par2 = this.criaParallax(this.solo);
    // sombra das vielas entre as casas (acompanha as cameras no update)
    this.viela = this.add.rectangle(0, CHAO_TRECHO * T + 6, 9000, 900, N.escuro).setOrigin(0).setDepth(3);

    // ---- monta o comeco da pista ----
    for (i = 0; i < TRECHOS.length; i++) if (TRECHOS[i].id === 'inicio') this.addTrecho(TRECHOS[i]);
    for (i = 0; i < 4; i++) this.addTrecho(this.escolheTrecho());

    // ---- jogadores ----
    // Na Perseguicao sao dois (Koburo em cima, Tobias embaixo). No Infinito e
    // so um: o personagem escolhido no menu, com a tela inteira para ele.
    var chaoY = CHAO_TRECHO * T;
    if (this.solo) {
      this.r1 = criaCorredor(this, 4 * T + 16, chaoY - 15, Save.personagem());
      this.corredores = [this.r1];
      this.placar = new Placar(this);
    } else {
      this.r1 = criaCorredor(this, 3 * T + 16, chaoY - 15, 1);
      this.r2 = criaCorredor(this, 6 * T + 16, chaoY - 15, 2);
      this.corredores = [this.r1, this.r2];
    }

    // a Cócó foge sempre um pouco a frente de quem lidera (so decoracao)
    this.coco = this.add.sprite(12 * T, CHAO_TRECHO * T + 2, 'coco0').setOrigin(0.5, 1).setDepth(8).play('coco_corre');
    this.cocoChao = CHAO_TRECHO * T + 2;
    this.cocoChao = CHAO_TRECHO * T + 2;
    SOM.cacarejo();

    for (i = 0; i < this.corredores.length; i++) {
      var r = this.corredores[i];
      this.physics.add.collider(r.corpo, this.solidos);
      (function (rr) {
        cena.physics.add.overlap(rr.corpo, cena.perigos, function (a, pg) {
          if (rr.invenc > 0 || rr.morto || rr.eliminado) return;
          if (rr.escudando) { escudoAparou(cena, rr); return; }
          cena.cai(rr);
        });
      })(r);
    }
    // dash como sabotagem: os jogadores se atravessam, mas o dash empurra
    if (!this.solo) {
      this.physics.add.overlap(this.r1.corpo, this.r2.corpo, function () { cena.checaDash(); });
    } else {
      this.physics.add.overlap(this.r1.corpo, this.moedas, function (a, m) { cena.pegaOvo(m); });
    }

    // ---- a guarda do imperador (a antiga parede): nuvem de poeira,
    //      borda fofa, o imperador bravo e a fala dele. So visual: quem manda
    //      e o this.bordaX, exatamente como antes ----
    this.parede = this.add.tileSprite(0, -160, 3000, 760, 'parede').setOrigin(1, 0).setDepth(12);
    this.paredeLuz = this.add.tileSprite(0, -160, 24, 760, 'parede_borda').setOrigin(1, 0).setDepth(13);
    this.imperador = this.add.image(0, 196, 'imperador').setOrigin(1, 0.5).setDepth(14);
    this.falaImperador = txt(this, 0, 150, 'CADÊ MINHA GALINHA?!', 9, C.perigo2, 0).setDepth(14);

    // ---- cameras ----
    // Infinito: uma camera so, tela cheia. Perseguicao: P1 em cima, P2 embaixo.
    if (this.solo) {
      this.cam1 = this.cameras.main;
      this.cam1.setViewport(0, 0, LARG, ALT);
      // O trecho tem 384px de altura e a tela tem 540: em vez de sobrar uma
      // faixa vazia embaixo, o mundo encosta no rodape e sobra CEU em cima.
      this.cam1.setBounds(0, this.ALT_MUNDO - ALT, 1e7, ALT);
      this.cam1.startFollow(this.r1.corpo, true, 0.16, 0.16, -140, 0);
      this.cam1.setDeadzone(120, ALT);
      this.cam2 = this.cam1;                      // camDe() continua valendo
      this.par2.m.setVisible(false); this.par2.h.setVisible(false);
      this.hud1 = this.criaHudSolo();
      this.cameras.main.fadeIn(280, 26, 28, 44);
    } else {
      var h = ALT / 2;
      this.cam1 = this.cameras.main;
      this.cam1.setViewport(0, 0, LARG, h);
      this.cam2 = this.cameras.add(0, h, LARG, h);
      for (i = 0; i < 2; i++) {
        var cam = i ? this.cam2 : this.cam1;
        cam.setBounds(0, 0, 1e7, this.ALT_MUNDO);
        // deslocamento negativo em X deixa o jogador a esquerda do centro,
        // mostrando mais pista a frente
        cam.startFollow(this.corredores[i].corpo, true, 0.16, 0.16, -120, 30);
        cam.setDeadzone(90, 60);
      }
      // faixa divisoria desenhada no rodape da metade de cima
      this.divisoria = this.add.rectangle(0, h - 6, LARG, 6, N.escuro)
        .setOrigin(0).setScrollFactor(0).setDepth(150);
      this.divisoriaLuz = this.add.rectangle(0, h - 6, LARG, 2, 0x566c86)
        .setOrigin(0).setScrollFactor(0).setDepth(151);
      this.cam2.ignore([this.divisoria, this.divisoriaLuz]);

      // ---- HUD de cada jogador (so aparece na metade dele) ----
      this.hud1 = this.criaHud(this.r1, 1);
      this.hud2 = this.criaHud(this.r2, 2);
      this.cam1.ignore(this.hud2.concat(this.par2.objs));
      this.cam2.ignore(this.hud1.concat(this.par1.objs));

      this.cameras.main.fadeIn(280, 26, 28, 44);
      this.cam2.fadeIn(280, 26, 28, 44);
    }
    MUSICA.toca('corrida');

    this.events.once('shutdown', function () {
      for (var k = 0; k < cena.trechos.length; k++) {
        var tx = cena.trechos[k].texs;
        for (var j = 0; j < tx.length; j++) removeTex(cena, tx[j]);
      }
    });
  },

  contaHabilidade: function () {
    this.usosHab = (this.usosHab || 0) + 1;
    if (this.placar) this.placar.usosHab = this.usosHab;
  },

  // barras e combo do modo infinito
  atualizaHudSolo: function () {
    var pl = this.placar, r = this.r1, g = this.gSolo, f;
    this.hudPontos.setText(num(pl.pontos + this.metros(r) * 10));
    if (pl.combo >= 2) {
      this.hudCombo.setText('COMBO x' + pl.combo +
        (pl.mult > 1 ? '   x' + pl.mult : '')).setAlpha(1);
      f = limita(pl.janela / PONT.JANELA, 0, 1);
    } else { this.hudCombo.setAlpha(0); f = 0; }
    g.clear();
    if (f > 0) {
      g.fillStyle(N.escuro, 0.8); g.fillRect(LARG / 2 - 91, 56, 182, 7);
      g.fillStyle(f < 0.3 ? N.perigo : N.moeda, 1); g.fillRect(LARG / 2 - 90, 57, 180 * f, 5);
    }
    var pronta = 1, cor = r.luzN, rot = r.pf.habNome;
    if (r.pf.hab === 'escudo') {
      if (r.escudando) { pronta = limita(r.escudoT / r.pf.escudoDur, 0, 1); cor = N.ui; rot = 'ESCUDO ATIVO'; }
      else if (r.habCd > 0) { pronta = 1 - limita(r.habCd / (r.pf.escudoDur + r.pf.escudoCd), 0, 1); cor = N.painelLuz; rot = 'ESCUDO CARREGANDO'; }
    } else if (r.habCd > 0) {
      pronta = 1 - limita(r.habCd / r.pf.piruetaCd, 0, 1); cor = N.painelLuz; rot = 'PIRUETA CARREGANDO';
    }
    g.fillStyle(N.escuro, 0.85); g.fillRect(18, ALT - 30, 184, 14);
    g.fillStyle(N.painel, 1);    g.fillRect(20, ALT - 28, 180, 10);
    g.fillStyle(cor, 1);         g.fillRect(20, ALT - 28, 180 * pronta, 10);
    if (this.hudHab.text !== rot) this.hudHab.setText(rot);
    for (var k = 0; k < r.cargasMax; k++) {
      g.fillStyle(N.escuro, 0.85); g.fillRect(210 + k * 16, ALT - 30, 14, 14);
      g.fillStyle(k < r.cargas ? r.luzN : N.painel, 1); g.fillRect(212 + k * 16, ALT - 28, 10, 10);
    }
  },

  criaParallax: function (telaCheia) {
    // na tela cheia o horizonte desce: e a mesma composicao da Campanha
    var ym = telaCheia ? 190 : 16, yh = telaCheia ? 300 : 92;
    var m = this.add.tileSprite(0, ym, LARG, 170, 'montanhas').setOrigin(0).setScrollFactor(0).setDepth(1);
    var h = this.add.tileSprite(0, yh, LARG, 140, 'morros').setOrigin(0).setScrollFactor(0).setDepth(2);
