//  TEXTURAS DE EFEITO (cortes, energia, luz, clima, cenario das arenas)
//  Tudo em degraus, sem gradiente suave: o mesmo jeito do ceu em faixas.
// ============================================================================
function geraArteFx(cena) {
  var i;
  // luz: circulo em degraus (com blendMode ADD vira brilho; o tint da a cor)
  criaTex(cena, 'luz_rad', 128, 128, function (ctx) {
    for (var k = 0; k < 8; k++) { ctx.globalAlpha = 0.12; elipse(ctx, 64, 64, 63 - k * 8, 63 - k * 8, '#ffffff'); }
    ctx.globalAlpha = 1;
  });
  // fumaca: bolota macia em dois degraus (o tint escurece)
  criaTex(cena, 'fumaca', 16, 16, function (ctx) {
    ctx.globalAlpha = 0.5; elipse(ctx, 8, 8, 7, 7, '#ffffff');
    ctx.globalAlpha = 0.6; elipse(ctx, 8, 8, 4, 4, '#ffffff'); ctx.globalAlpha = 1;
  });
  // anel de choque (o tint da a cor)
  criaTex(cena, 'anel', 96, 96, function (ctx) {
    elipse(ctx, 48, 48, 47, 47, '#ffffff');
    ctx.globalCompositeOperation = 'destination-out';
    elipse(ctx, 48, 48, 42, 42, '#ffffff');
    ctx.globalCompositeOperation = 'source-over';
  });
  // meia-lua do corte horizontal (aponta para a direita)
  var meiaLua = function (ctx, w, h, a, bb, corte, cores) {
    var x, y, da, db;
    for (y = 0; y < h; y++) {
      for (x = 0; x < w; x++) {
        da = Math.pow((x - a[0]) / a[2], 2) + Math.pow((y - a[1]) / a[3], 2);
        db = Math.pow((x - bb[0]) / bb[2], 2) + Math.pow((y - bb[1]) / bb[3], 2);
        if (da > 1 || db <= 1 || x < corte) continue;
        ctx.globalAlpha = Math.min(1, (x - corte) / (w * 0.35));
        rect(ctx, x, y, 1, 1, db < 1.18 ? cores[0] : (db < 1.7 ? cores[1] : cores[2]));
      }
    }
    ctx.globalAlpha = 1;
  };
  criaTex(cena, 'arco_h', 120, 52, function (ctx) {
    meiaLua(ctx, 120, 52, [52, 26, 67, 25], [38, 31, 64, 20], 30, ['#ffffff', '#FF2438', '#D7192C']);
  });
  // risco vertical do corte de cima para baixo
  criaTex(cena, 'arco_v', 44, 140, function (ctx) {
    var x, y, da, db;
    for (y = 0; y < 140; y++) {
      for (x = 0; x < 44; x++) {
        da = Math.pow((x - 18) / 22, 2) + Math.pow((y - 70) / 69, 2);
        db = Math.pow((x - 7) / 20, 2) + Math.pow((y - 70) / 64, 2);
        if (da > 1 || db <= 1) continue;
        rect(ctx, x, y, 1, 1, db < 1.25 ? '#ffffff' : (db < 1.9 ? '#FF2438' : '#D7192C'));
      }
    }
  });
  // onda de plasma que corre rente ao telhado (2 quadros: o brilho treme)
  for (i = 0; i < 2; i++) {
    (function (f) {
      criaTex(cena, 'onda_plasma' + f, 34, 46, function (ctx) {
        var x, y, da, db;
        for (y = 0; y < 46; y++) {
          for (x = 0; x < 34; x++) {
            da = Math.pow((x - 12) / 20, 2) + Math.pow((y - 46) / (44 - f * 3), 2);
            db = Math.pow((x - 3) / 17, 2) + Math.pow((y - 46) / (34 - f * 3), 2);
            if (da > 1 || db <= 1) continue;
            rect(ctx, x, y, 1, 1, db < 1.22 ? '#ffd2d6' : (db < 1.8 ? '#FF2438' : '#D7192C'));
          }
        }
        for (y = 4; y < 44; y += 7) rect(ctx, 22 + ((y + f * 3) % 5), y, 2, 2, '#ffffff');    // faiscas
      });
    })(i);
  }
  // ovo-bomba: o projetil da Galinha Robo (e uma galinha, afinal). Ovo de
  // metal rebitado com a luz vermelha piscando (2 quadros: acesa/apagada)
  for (i = 0; i < 2; i++) {
    (function (f) {
      criaTex(cena, 'ovo_bomba' + f, 24, 24, function (ctx) {
        ovo(ctx, 12, 13, 8, 10, C.escuro);
        ovo(ctx, 12, 13, 7, 9, CR.metalSombra);
        ovo(ctx, 10, 11, 4, 6, CR.metal);
        rect(ctx, 5, 14, 14, 2, CR.metalEsc);                           // cinta
        rect(ctx, 8, 14, 1, 1, C.moeda); rect(ctx, 15, 14, 1, 1, C.moeda);
        rect(ctx, 10, 2, 4, 3, C.escuro);
        rect(ctx, 11, 3, 2, 1, f ? CR.led : CR.ledEsc);                 // luz piscando
        if (f) rect(ctx, 11, 3, 1, 1, '#ffffff');
      });
    })(i);
  }
  // pena de aco (projetil da rajada de asas): lamina com o fio vermelho
  criaTex(cena, 'pena_metal', 26, 10, function (ctx) {
    triangulo(ctx, 0, 5, 24, 1, 24, 9, C.escuro);
    triangulo(ctx, 2, 5, 23, 2, 23, 8, CR.metal);
    linhaGrossa(ctx, [3, 6], [23, 6], 1, CR.metalSombra);
    linhaGrossa(ctx, [3, 4], [25, 4], 1, CR.led);
    rect(ctx, 21, 3, 3, 4, CR.metalEsc);
  });
  // o DISPOSITIVO do Samurai Robo: caixinha com garras e a luz azul. A
  // versao "off" e como ele fica depois de arrancado (luz apagada, rachado)
  for (i = 0; i < 2; i++) {
    (function (on) {
      criaTex(cena, on ? 'dispositivo' : 'dispositivo_off', 18, 16, function (ctx) {
        rect(ctx, 0, 2, 18, 2, C.escuro); rect(ctx, 0, 1, 2, 5, C.escuro); rect(ctx, 16, 1, 2, 5, C.escuro);   // garras
        rect(ctx, 3, 3, 12, 12, C.escuro);
        rect(ctx, 4, 4, 10, 10, CR.disp);
        rect(ctx, 4, 4, 10, 1, CR.metalEsc);
        rect(ctx, 6, 7, 6, 5, on ? CR.dispLuz : CR.metalEsc);
        if (on) rect(ctx, 7, 8, 2, 1, '#ffffff');
        else { rect(ctx, 9, 4, 1, 3, C.escuro); rect(ctx, 10, 6, 1, 2, C.escuro); }   // rachadura
      });
    })(i);
  }
  // pecas soltas (chapinha e parafuso) para as faiscas de pane dos robos
  criaTex(cena, 'peca', 6, 4, function (ctx) { rect(ctx, 0, 0, 6, 4, CR.metalEsc); rect(ctx, 0, 0, 6, 1, CR.metal); });
  criaTex(cena, 'parafuso', 3, 3, function (ctx) { rect(ctx, 0, 0, 3, 3, C.moedaEsc); rect(ctx, 1, 0, 1, 3, C.moeda); });
  // peninha branca (particula)
  criaTex(cena, 'pena_branca', 8, 4, function (ctx) {
    rect(ctx, 0, 1, 8, 2, '#ffffff'); rect(ctx, 2, 0, 4, 1, '#ffffff'); rect(ctx, 0, 2, 8, 1, '#d7dee8');
  });
  // marca de aviso no chao (onde algo vai cair ou explodir)
  criaTex(cena, 'marca', 64, 12, function (ctx) {
    elipse(ctx, 32, 6, 31, 5, '#1a0508');
    elipse(ctx, 32, 6, 28, 4, '#D7192C');
    elipse(ctx, 32, 6, 18, 2, '#ff8a8a');
  });
  // vinheta: as bordas da tela escurecem em degraus (foco no centro)
  criaTex(cena, 'vinheta', LARG, ALT, function (ctx) {
    for (var k = 0; k < 12; k++) {
      var d = (12 - k) * 15;
      ctx.globalAlpha = 0.07;
      rect(ctx, 0, 0, LARG, d * 0.7, '#000000');
      rect(ctx, 0, ALT - d * 0.7, LARG, d * 0.7, '#000000');
      rect(ctx, 0, 0, d, ALT, '#000000');
      rect(ctx, LARG - d, 0, d, ALT, '#000000');
    }
    ctx.globalAlpha = 1;
  });
  // clima: gota de chuva, floco de neve, petala de cerejeira
  criaTex(cena, 'chuva', 2, 12, function (ctx) { rect(ctx, 0, 0, 2, 12, '#b9c4d9'); rect(ctx, 0, 8, 2, 4, '#ffffff'); });
  criaTex(cena, 'floco', 3, 3, function (ctx) { rect(ctx, 1, 0, 1, 3, '#ffffff'); rect(ctx, 0, 1, 3, 1, '#ffffff'); });
  criaTex(cena, 'petala', 5, 4, function (ctx) { rect(ctx, 1, 0, 3, 4, '#f4a6c0'); rect(ctx, 0, 1, 5, 2, '#f4a6c0'); rect(ctx, 1, 1, 2, 1, '#ffd6e4'); });
  // raio da tempestade (2 formatos)
  for (i = 0; i < 2; i++) {
    (function (f) {
      criaTex(cena, 'raio' + f, 90, 300, function (ctx) {
        var r = semente(77 + f * 13), x = 45, y = 0, pts = [[x, y]];
        while (y < 300) { y += 14 + r() * 22; x = limita(x + (r() - 0.5) * 34, 6, 84); pts.push([x, y]); }
        for (var k = 0; k < pts.length - 1; k++) {
          ctx.globalAlpha = 0.25; linhaGrossa(ctx, pts[k], pts[k + 1], 7, '#9fc6ff');
          ctx.globalAlpha = 1; linhaGrossa(ctx, pts[k], pts[k + 1], 2, '#ffffff');
        }
        var g = Math.floor(pts.length / 2);                            // galho
        linhaGrossa(ctx, pts[g], [limita(pts[g][0] + 26, 0, 88), pts[g][1] + 40], 1, '#ffffff');
      });
    })(i);
  }
  // portal torii do palacio na entrada da arena do Samurai
  criaTex(cena, 'torii', 176, 150, function (ctx) {
    var pil = '#5C0A12', luz = '#8e1a24', k;
    var pilar = function (x) {
      rect(ctx, x - 1, 22, 16, 128, C.escuro);
      rect(ctx, x, 22, 14, 128, pil);
      rect(ctx, x + 2, 22, 2, 128, luz);

    pilar(28); pilar(134);
    poligonoC(ctx, [[0, 6], [16, 12], [160, 12], [176, 6], [172, 20], [4, 20]], '#0A090D', C.escuro);   // kasagi
    rect(ctx, 6, 13, 164, 2, '#5C0A12');
    rect(ctx, 14, 36, 148, 9, C.escuro); rect(ctx, 15, 37, 146, 7, pil);          // nuki
    rect(ctx, 80, 18, 16, 22, C.escuro); rect(ctx, 81, 19, 14, 20, '#0A090D');     // placa

  // estandarte imperial (vermelho, borda dourada e o ovo da Galinha Imperial)

  // retratos para a barra de vida dos chefes novos (recorte do proprio quadro)
  criaTex(cena, 'ret_samurai', 40, 40, function (ctx) {

    rect(ctx, 0, 0, 40, 40, '#22263a');
    ctx.drawImage(ART['sr_parado0'], 80, 46, 40, 40, 0, 0, 40, 40);

  criaTex(cena, 'ret_coco', 40, 40, function (ctx) {

// ---- Animacoes -------------------------------------------------------------
function quadros(pre, nome, n) {
  var a = [], i;
  for (i = 0; i < n; i++) a.push({ key: pre + nome + i });
  return a;
}
function criaAnimacoes(cena) {
  for (var p = 1; p <= 2; p++) {
    var pre = 'p' + p + '_';
    cena.anims.create({ key: pre + 'parado', frames: quadros(pre, 'parado', 4), frameRate: 5,  repeat: -1 });
    cena.anims.create({ key: pre + 'corre',  frames: quadros(pre, 'corre', 6),  frameRate: 14, repeat: -1 });
    cena.anims.create({ key: pre + 'pula',   frames: quadros(pre, 'pula', 1),   frameRate: 1,  repeat: -1 });
    cena.anims.create({ key: pre + 'cai',    frames: quadros(pre, 'cai', 1),    frameRate: 1,  repeat: -1 });
    cena.anims.create({ key: pre + 'dash',   frames: quadros(pre, 'dash', 3),   frameRate: 20, repeat: -1 });
    // habilidades: pirueta (gira) e mergulho/pisao (desce reto)
    cena.anims.create({ key: pre + 'gira',   frames: quadros(pre, 'gira', 2),   frameRate: 18, repeat: -1 });
    cena.anims.create({ key: pre + 'pisao',  frames: quadros(pre, 'pisao', 2),  frameRate: 16, repeat: -1 });
  }
  cena.anims.create({ key: 'moeda_gira', frames: quadros('', 'moeda', 4), frameRate: 10, repeat: -1 });
  cena.anims.create({ key: 'bandeira_bal', frames: quadros('', 'bandeira', 2), frameRate: 4, repeat: -1 });
  cena.anims.create({ key: 'coco_corre', frames: quadros('', 'coco', 4), frameRate: 12, repeat: -1 });
  // ciscando: fica debochando e de vez em quando bica o chao
  cena.anims.create({ key: 'coco_parada', frames: [{ key: 'coco4' }, { key: 'coco4' }, { key: 'coco5' }, { key: 'coco4' },
                                                    { key: 'coco5' }, { key: 'coco5' }, { key: 'coco4' }, { key: 'coco4' }],
                      frameRate: 6, repeat: -1 });
  // botando ovo: pulinho de susto e pouso orgulhoso (toca uma vez)
  cena.anims.create({ key: 'coco_ovo', frames: [{ key: 'coco6' }, { key: 'coco6' }, { key: 'coco7' }, { key: 'coco7' }],
                      frameRate: 10, repeat: 0 });
  // ---- chefes: uma animacao por estado, com o prefixo do chefe ("bg_" = o
  //      guarda gigante). Outro chefe so precisa repetir esta lista com o
  //      proprio prefixo.
  var animChefe = function (pre, nome, quadros2, fps) {
    var f = [], i;
    for (i = 0; i < quadros2.length; i++) f.push({ key: pre + quadros2[i] });
    cena.anims.create({ key: pre + nome, frames: f, frameRate: fps, repeat: -1 });
  };
  var listaChefes = [['bg_', 1]];
  for (var ic = 0; ic < listaChefes.length; ic++) {
    (function (pre, vel) {
      animChefe(pre, 'parado',   ['parado0', 'parado1'],   Math.round(3 * vel));
      animChefe(pre, 'avisa',    ['avisa0', 'avisa1'],     Math.round(8 * vel));
      animChefe(pre, 'corre',    ['corre0', 'corre1'],     Math.round(12 * vel));
      animChefe(pre, 'pulo',     ['pulo0'],                1);
      animChefe(pre, 'tonto',    ['tonto0', 'tonto1'],     Math.round(4 * vel));
      animChefe(pre, 'atingido', ['atingido0'],            1);
      animChefe(pre, 'rendido',  ['rendido0', 'rendido1'], 3);
    })(listaChefes[ic][0], listaChefes[ic][1]);
  }
  cena.anims.create({ key: 'onda_anda', frames: [{ key: 'onda0' }, { key: 'onda1' }], frameRate: 12, repeat: -1 });
  // bichos do telhado
  cena.anims.create({ key: 'gato_anda', frames: [{ key: 'gato0' }, { key: 'gato1' }], frameRate: 6, repeat: -1 });
  cena.anims.create({ key: 'corvo_voa', frames: [{ key: 'corvo0' }, { key: 'corvo1' }], frameRate: 9, repeat: -1 });
  cena.anims.create({ key: 'guardinha_anda', frames: [{ key: 'guardinha0' }, { key: 'guardinha1' }], frameRate: 5, repeat: -1 });
  cena.anims.create({ key: 'guardinha_corre', frames: [{ key: 'guardinha2' }, { key: 'guardinha3' }], frameRate: 11, repeat: -1 });
  cena.anims.create({ key: 'ovo_sec_gira', frames: [{ key: 'ovo_sec' }], frameRate: 1, repeat: -1 });

var BootScene = new Phaser.Class({
  Extends: Phaser.Scene,
  initialize: function BootScene() { Phaser.Scene.call(this, { key: 'BootScene' }); },
  create: function () {
    var cena = this;
    this.add.rectangle(LARG / 2, ALT / 2, LARG, ALT, N.escuro);
    this.add.text(LARG / 2, ALT / 2, 'CARREGANDO...', {
      fontFamily: FONTE, fontSize: '24px', color: C.cinza
    }).setOrigin(0.5);

    geraArte(this);
    criaAnimacoes(this);

    // O jogo so comeca depois que a fonte estiver pronta (limite de 2.5s para
    // funcionar tambem offline, caindo na fonte monoespacada do sistema).
    var foi = false;
    var seguir = function () {
      if (foi) return;
      foi = true;
      cena.scene.start('MenuScene');
    };
    try {
      if (document.fonts && document.fonts.load) {
        document.fonts.load('24px "Silkscreen"').then(seguir, seguir);
      }

    this.time.delayedCall(2500, seguir);
  }
});

// ============================================================================
//  INTERFACE - atalhos para texto, paineis e listas de menu
// ============================================================================
function txt(cena, x, y, s, tam, cor, orx, ory) {
  var t = cena.add.text(x, y, s, {
    fontFamily: FONTE,
    fontSize: Math.round((tam || 12) * ESCALA_FONTE) + 'px',
    color: cor || C.ui
  });
  t.setOrigin(orx === undefined ? 0.5 : orx, ory === undefined ? 0.5 : ory);
  t.setShadow(0, 3, C.escuro, 0, false, true);
  return t;
}
// Janela padrao de TODAS as telas (menu, pausa, resultado): sombra suave em
// dois degraus, contorno escuro, faixa clara no topo, filete interno e
// cantoneiras douradas nos cantos - o mesmo acabamento do retrato dos
// personagens, para tudo parecer do mesmo jogo.
function painel(cena, x, y, w, h) {
  var g = cena.add.graphics(), k;
  g.fillStyle(0x000000, 0.20); g.fillRect(x + 9, y + 11, w, h);          // sombra longe
  g.fillStyle(0x000000, 0.30); g.fillRect(x + 4, y + 5, w, h);           // sombra perto
  g.fillStyle(N.escuro, 1);    g.fillRect(x - 3, y - 3, w + 6, h + 6);   // contorno
  g.fillStyle(N.painel, 1);    g.fillRect(x, y, w, h);
  g.fillStyle(N.painelLuz, 0.28); g.fillRect(x, y, w, 7);                // faixa clara no topo
  g.fillStyle(N.painelLuz, 1);    g.fillRect(x, y, w, 1);                // brilho da borda
  g.fillStyle(N.escuro, 0.55);    g.fillRect(x, y + h - 2, w, 2);        // sombra da borda de baixo
  g.lineStyle(2, N.painelLuz, 1); g.strokeRect(x + 6, y + 9, w - 12, h - 15);   // filete interno
  var cantos = [[x + 1, y + 1], [x + w - 6, y + 1], [x + 1, y + h - 6], [x + w - 6, y + h - 6]];
  for (k = 0; k < cantos.length; k++) {                                  // cantoneiras douradas
    g.fillStyle(N.escuro, 1); g.fillRect(cantos[k][0] - 1, cantos[k][1] - 1, 7, 7);
    g.fillStyle(N.moeda, 1);  g.fillRect(cantos[k][0], cantos[k][1], 5, 5);
    g.fillStyle(N.ui, 0.6);   g.fillRect(cantos[k][0] + 1, cantos[k][1] + 1, 2, 1);
  }
  return g;
}

// losango de pixel (enfeite dos titulos), desenhado linha a linha
function losango(g, cx, cy, r) {
  for (var dy = -r; dy <= r; dy++) {
    var w = 2 * (r - Math.abs(dy)) + 1;
    g.fillRect(cx - (w >> 1), cy + dy, w, 1);
  }
}

// Titulo de tela: texto grande dourado com um filete e um losango de cada
// lado (o enfeite encolhe se o titulo for comprido). Devolve [texto, enfeite].
function tituloTela(cena, x, y, s, tam, larguraMax) {
  var t = txt(cena, x, y, s, tam || 16, C.moeda);
  var g = cena.add.graphics(), meia = Math.round(t.width / 2) + 14;
  var comp = Math.max(8, Math.min(40, Math.floor((larguraMax || 600) / 2 - meia - 12)));
  g.fillStyle(N.painelLuz, 1);
  g.fillRect(x - meia - comp, y - 1, comp, 2);
  g.fillRect(x + meia, y - 1, comp, 2);
  g.fillStyle(N.moeda, 1);
  losango(g, x - meia - comp - 5, y, 3);
  losango(g, x + meia + comp + 5, y, 3);
  return [t, g];
}

// Tecla desenhada (tela "Como Jogar"): botaozinho em relevo com o nome da
// tecla. Devolve { objs, w } (w = largura, para enfileirar varias).
function teclaVisual(cena, x, y, rotulo) {
  var g = cena.add.graphics();
  var t = txt(cena, 0, y + 1, rotulo, 8, C.escuro);
  t.setShadow(0, 0, C.escuro, 0, false, false);
  var w = Math.max(22, Math.round(t.width) + 12), h = 22, y0 = Math.round(y - h / 2);
  t.setX(Math.round(x + w / 2));
  g.fillStyle(N.escuro, 1);    g.fillRect(x, y0, w, h + 3);              // contorno e base
  g.fillStyle(N.cinza, 1);     g.fillRect(x + 1, y0 + 1, w - 2, h - 2);  // face da tecla
  g.fillStyle(N.ui, 0.9);      g.fillRect(x + 1, y0 + 1, w - 2, 2);      // brilho de cima
  g.fillStyle(N.painelLuz, 1); g.fillRect(x + 1, y0 + h - 1, w - 2, 3);  // lateral (relevo)
  return { objs: [g, t], w: w };
}

// Fileira de estrelas do resultado / selecao de fases. "n" acesas de "tot".
// As acesas entram uma a uma, com um tinido cada (o momento de recompensa).
function fileiraEstrelas(cena, x, y, n, tot, esc, anima) {
  var objs = [], i, e, dx = (tot - 1) / 2;
  for (i = 0; i < tot; i++) {
    e = cena.add.image(x + (i - dx) * 34 * (esc || 1), y, 'estrela_g')
      .setScale(esc || 1).setDepth(12).setTint(i < n ? N.moeda : N.painel);
    objs.push(e);
    if (i < n && anima && !POUCO_MOV) {
      e.setScale((esc || 1) * 2.2).setAlpha(0);
      (function (im, k) {
        cena.tweens.add({ targets: im, scale: esc || 1, alpha: 1, duration: 260,
                          delay: 380 + k * 240, ease: 'Back.easeOut',
                          onStart: function () { cena.time.delayedCall(240 + k * 0, function () {}); },
                          onComplete: function () { SOM.estrela(k); } });
      })(e, i);
    }
  }
  return objs;
}
// medalha com o nome embaixo
function desenhaMedalha(cena, x, y, med, esc) {
  var objs = [];
  if (!med) {
    objs.push(txt(cena, x, y + 6, 'SEM MEDALHA', 9, C.cinza).setDepth(12));
    return objs;
  }
  var im = cena.add.image(x - 52, y, 'medalha').setScale(esc || 1.3).setDepth(12);
  im.setTint(med.id === 'ouro' ? N.moeda : (med.id === 'prata' ? 0xdfe9f5 : 0xd08b4a));
  objs.push(im, txt(cena, x + 10, y, med.nome, 14, med.cor).setDepth(12));
  if (!POUCO_MOV) {
    im.setScale((esc || 1.3) * 2.4).setAlpha(0);
    cena.tweens.add({ targets: im, scale: esc || 1.3, alpha: 1, duration: 320, delay: 200, ease: 'Back.easeOut' });
  }
  return objs;
}
// "8.450" contando do zero ate o valor final
function contaAte(cena, alvoTexto, valor, ms) {
  if (POUCO_MOV || valor <= 0) { alvoTexto.setText(num(valor)); return; }
  var cont = { v: 0 }, ultimo = 0;
  cena.tweens.add({ targets: cont, v: valor, duration: ms || 900, ease: 'Cubic.easeOut',
    onUpdate: function () {
      alvoTexto.setText(num(cont.v));
      if (cont.v - ultimo > valor / 14) { ultimo = cont.v; SOM.contando(); }
    },
    onComplete: function () { alvoTexto.setText(num(valor)); }
  });
}

// cadeadinho de pixel (fase trancada); (x, y) = centro
function cadeado(g, x, y) {
  g.fillStyle(N.cinza, 1);
  g.fillRect(x - 3, y - 8, 6, 2);                                        // arco
  g.fillRect(x - 5, y - 6, 2, 5); g.fillRect(x + 3, y - 6, 2, 5);
  g.fillRect(x - 6, y - 2, 12, 9);                                       // corpo
  g.fillStyle(N.escuro, 1); g.fillRect(x - 1, y + 1, 2, 3);              // buraco da chave
}

// Congela (ou solta) TUDO o que anda sozinho numa cena de jogo: fisica,
// relogio (delayedCall) e tweens. So a fisica nao bastava - o respawn e as
// telhas caindo sao agendados no relogio e continuavam rodando na pausa.
function congelaCena(cena, congelar) {
  var i, lista;
  if (congelar) {
    cena.physics.pause();
    cena.time.paused = true;
    // Congela CADA tween que ja existia, e nao o gerenciador inteiro: a
    // propria tela de pausa entra com tween, e pausar o gerenciador deixava
    // o menu invisivel (so o alpha 0 do surgir, sem a animacao que o traz).
    lista = cena.tweens.getTweens();
    cena._tweensGelados = [];
    for (i = 0; i < lista.length; i++) {
      if (lista[i].isPlaying && lista[i].isPlaying()) {
        lista[i].pause();
        cena._tweensGelados.push(lista[i]);
      }
    }
  } else {
    lista = cena._tweensGelados || [];
    for (i = 0; i < lista.length; i++) {
      if (lista[i] && lista[i].resume) lista[i].resume();
    }
    cena._tweensGelados = null;
    cena.time.paused = false;
    cena.physics.resume();
  }
}

// Troca de cena com um escurecer rapido (sem corte seco). Com POUCO_MOV troca
// na hora. Se o jogador apertar duas vezes, so a primeira vale.
function trocaCena(cena, chave, dados, reinicia) {
  if (cena.trocandoCena) return;
  cena.trocandoCena = true;
  cena.events.once('shutdown', function () { cena.trocandoCena = false; });
  var vai = function () {
    if (reinicia) cena.scene.restart(dados); else cena.scene.start(chave, dados);
  };
  if (POUCO_MOV) { vai(); return; }
  var cor = hex2rgb(C.escuro), cams = cena.cameras.cameras;
  for (var i = 0; i < cams.length; i++) cams[i].fadeOut(170, cor.r, cor.g, cor.b);
  cena.time.delayedCall(180, vai);
}

// Faz os objetos de uma tela aparecerem suavemente (cada um volta para a
// transparencia que tinha). Com POUCO_MOV ficam visiveis na hora.
function surgir(cena, objs, ms) {
  if (POUCO_MOV) return;
  for (var i = 0; i < objs.length; i++) {
    var o = objs[i];
    if (!o || o.alpha === undefined || cena.tweens.isTweening(o)) continue;
    var a = o.alpha;
    o.setAlpha(0);
    cena.tweens.add({ targets: o, alpha: a, duration: ms || 180, ease: 'Quad.easeOut' });
  }
}

// ============================================================================
//  CONTROLES - teclas de cada jogador, remapeaveis e salvas no navegador
//  ---------------------------------------------------------------------------
//  Duas camadas separadas de proposito:
//   1) TECLAS DE INTERFACE (criarTeclas): setas, WASD, ENTER, ESC... Elas NAO
//      sao remapeaveis. Assim, mesmo que o jogador configure algo estranho nos
//      controles do jogo, ele sempre consegue navegar no menu e desfazer.
//   2) TECLAS DE JOGO (criarTeclasJogo): as do mapa do jogador, montadas a
//      partir de Controles.mapa. Sao estas que a Campanha e a Perseguicao leem.
//  Cada acao aceita ate DUAS teclas (a principal e uma alternativa).
// ============================================================================
var MAX_TECLAS = 2;                          // teclas por acao
var ACOES = [
  { id: 'esq',   nome: 'MOVER PARA ESQUERDA' },
  { id: 'dir',   nome: 'MOVER PARA DIREITA' },
  { id: 'pulo',  nome: 'PULAR' },
  { id: 'baixo', nome: 'ABAIXAR / NO AR: DESCER' },
  { id: 'dash',  nome: 'DASH' },
  { id: 'hab',   nome: 'HABILIDADE' }
];
// Os controles de sempre (setas + Z/SHIFT para o P1, A D W + L/K para o P2),
// agora com uma tecla para a habilidade nova de cada um.
var TECLAS_PADRAO = {
  p1: { esq: [37], dir: [39], pulo: [38], baixo: [40], dash: [90, 16], hab: [67] },
  p2: { esq: [65], dir: [68], pulo: [87], baixo: [83], dash: [76, 75], hab: [74] }
};
// Atalhos do jogo inteiro. Nao entram no remapeamento, mas ENTRAM na checagem
// de conflito: ninguem consegue colocar o dash no ESC e travar a pausa.
var ATALHOS_FIXOS = {
  pausa:     { teclas: [27, 80], nome: 'PAUSAR' },
  som:       { teclas: [77],     nome: 'LIGAR/DESLIGAR SOM' },
  telaCheia: { teclas: [70],     nome: 'TELA CHEIA' },
  confirmar: { teclas: [13],     nome: 'CONFIRMAR NOS MENUS' }
};

// nome curto (na tecla desenhada) e nome por extenso de cada tecla especial
var NOME_TECLA = {
  37: ['<', 'SETA ESQ'], 39: ['>', 'SETA DIR'], 38: ['^', 'SETA CIMA'], 40: ['v', 'SETA BAIXO'],
  32: ['ESPAÇO', 'ESPAÇO'], 16: ['SHIFT', 'SHIFT'], 17: ['CTRL', 'CTRL'], 18: ['ALT', 'ALT'],
  13: ['ENTER', 'ENTER'], 27: ['ESC', 'ESC'], 9: ['TAB', 'TAB'], 8: ['<-', 'BACKSPACE'],
  188: [',', 'VÍRGULA'], 190: ['.', 'PONTO'], 186: [';', 'PONTO E VÍRGULA'],
  191: ['/', 'BARRA'], 189: ['-', 'MENOS'], 187: ['=', 'IGUAL'], 192: ['´', 'CRASE'],
  219: ['[', 'COLCHETE ['], 221: [']', 'COLCHETE ]'], 220: ['\\', 'BARRA INVERTIDA'],
  226: ['\\', 'BARRA INVERTIDA'], 106: ['NUM *', 'NUM *'], 107: ['NUM +', 'NUM +'],
  109: ['NUM -', 'NUM -'], 110: ['NUM .', 'NUM .'], 111: ['NUM /', 'NUM /']
};
function nomeTecla(cod, curto) {
  var n = NOME_TECLA[cod];
  if (n) return curto ? n[0] : n[1];
  if ((cod >= 65 && cod <= 90) || (cod >= 48 && cod <= 57)) return String.fromCharCode(cod);
  if (cod >= 96 && cod <= 105) return 'NUM ' + (cod - 96);
  if (cod >= 112 && cod <= 123) return 'F' + (cod - 111);
  return 'TECLA ' + cod;
}
// teclas que o jogo NUNCA deixa mapear (o navegador precisa delas, ou elas
// deixariam o jogador preso sem conseguir voltar)
var TECLAS_PROIBIDAS = { 27: 1, 9: 1, 116: 1, 122: 1, 123: 1, 91: 1, 92: 1, 93: 1 };

var Controles = {
  mapa: null,

  copiaPadrao: function () {
    var m = { p1: {}, p2: {} }, j, i, a;
    for (j = 1; j <= 2; j++) {
      for (i = 0; i < ACOES.length; i++) {
        a = ACOES[i].id;
        m['p' + j][a] = TECLAS_PADRAO['p' + j][a].slice();
      }
    }
    return m;
  },

  // Le o que estava salvo, peneirando tudo: acao que sumiu volta ao padrao,
  // tecla invalida e descartada, acao que ficou sem nenhuma tecla volta ao
  // padrao. Um save estragado nunca deixa o jogador sem controles.
  carregar: function () {
    var sal = Save.d.teclas, m = this.copiaPadrao(), j, i, a, lista, k, saida;
    if (sal && typeof sal === 'object') {
      for (j = 1; j <= 2; j++) {
        if (!sal['p' + j]) continue;
        for (i = 0; i < ACOES.length; i++) {
          a = ACOES[i].id;
          lista = sal['p' + j][a];
          if (!lista || !lista.length) continue;     // ausente: fica o padrao
          if (lista.length === 1 && lista[0] === 0) { m['p' + j][a] = []; continue; }
          saida = [];
          for (k = 0; k < lista.length && saida.length < MAX_TECLAS; k++) {
            var c = Number(lista[k]);
            if (isFinite(c) && c > 0 && c < 300 && !TECLAS_PROIBIDAS[c] && saida.indexOf(c) < 0) saida.push(c);
          }
          if (saida.length) m['p' + j][a] = saida;
        }
      }
    }
    this.mapa = m;
    return m;
  },

  salvar: function () {
    // acao sem tecla e salva como [0]: assim, ao recarregar, o jogo sabe que
    // foi escolha do jogador e nao devolve o padrao por cima
    var copia = { p1: {}, p2: {} }, j, i, a, lista;
    for (j = 1; j <= 2; j++) {
      for (i = 0; i < ACOES.length; i++) {
        a = ACOES[i].id;
        lista = this.mapa['p' + j][a];
        copia['p' + j][a] = lista.length ? lista.slice() : [0];
      }
    }
    Save.d.teclas = copia;
    Save.salvar();
  },
  // alguma acao deste jogador ficou sem tecla nenhuma?
  temVazio: function (jog) {
    for (var i = 0; i < ACOES.length; i++) {
      if (!this.mapa['p' + jog][ACOES[i].id].length) return ACOES[i].nome;
    }
    return null;
  },
  teclasDe: function (jog, acao) { return this.mapa['p' + jog][acao] || []; },

  // Quem ja usa esta tecla? Devolve { onde, nome } ou null.
  // Olha os dois jogadores E os atalhos fixos (§ conflito de teclas).
  conflito: function (cod, jogIgnora, acaoIgnora) {
    var j, i, a, lista, k;
    for (k in ATALHOS_FIXOS) {
      if (ATALHOS_FIXOS[k].teclas.indexOf(cod) >= 0) {
        return { fixo: true, onde: 'ATALHO DO JOGO', nome: ATALHOS_FIXOS[k].nome };
      }
    }
    for (j = 1; j <= 2; j++) {
      for (i = 0; i < ACOES.length; i++) {
        a = ACOES[i].id;
        if (j === jogIgnora && a === acaoIgnora) continue;
        lista = this.mapa['p' + j][a];
        if (lista.indexOf(cod) >= 0) {
          return { fixo: false, jog: j, acao: a,
                   onde: 'JOGADOR ' + j, nome: ACOES[i].nome };
        }
      }
    }
    return null;
  },

  // Coloca a tecla no lugar pedido. "substituir" tira a tecla de quem a tinha
  // (nunca deixando a outra acao sem nenhuma tecla: se era a ultima, aquela
  // acao volta ao padrao dela).
  define: function (jog, acao, slot, cod, substituir) {
    var c = this.conflito(cod, jog, acao), lista, outra;
    if (c && c.fixo) return false;
    if (c && !substituir) return false;
    if (c) {
      // A outra acao perde essa tecla. Se era a unica que ela tinha, ela fica
      // SEM TECLA de proposito - a tela mostra isso em vermelho e o jogador
      // escolhe outra (ou usa RESTAURAR PADRAO). Nada e inventado por baixo.
      outra = this.mapa['p' + c.jog][c.acao];
      outra.splice(outra.indexOf(cod), 1);
    }
    lista = this.mapa['p' + jog][acao];
    var jaTem = lista.indexOf(cod);
    if (jaTem >= 0 && jaTem !== slot) lista.splice(jaTem, 1);
    while (lista.length <= slot) lista.push(0);
    lista[slot] = cod;
    this.mapa['p' + jog][acao] = this.limpaLista(lista);
    this.salvar();
    return true;
  },
  limpaLista: function (lista) {
    var saida = [], i;
    for (i = 0; i < lista.length && saida.length < MAX_TECLAS; i++) {
      if (lista[i] && saida.indexOf(lista[i]) < 0) saida.push(lista[i]);
    }
    return saida;
  },
  // tira uma tecla (nunca deixa a acao sem nenhuma)
  limpa: function (jog, acao, slot) {
    var lista = this.mapa['p' + jog][acao];
    if (lista.length <= 1) return false;
    lista.splice(slot, 1);
    this.salvar();
    return true;
  },
  restaura: function (jog) {
    var pad = this.copiaPadrao(), i, a;
    if (jog) {
      for (i = 0; i < ACOES.length; i++) { a = ACOES[i].id; this.mapa['p' + jog][a] = pad['p' + jog][a]; }
    } else {
      this.mapa = pad;
    }
    this.salvar();
  },
  // a acao esta com as teclas de fabrica?
  ehPadrao: function (jog, acao) {
    var a = this.mapa['p' + jog][acao], b = TECLAS_PADRAO['p' + jog][acao], i;
    if (a.length !== b.length) return false;
    for (i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
    return true;
  }
};

// ---- Teclas de INTERFACE (fixas): menu, pausa e atalhos --------------------
function criarTeclas(cena) {
  var K = Phaser.Input.Keyboard.KeyCodes;
  return cena.input.keyboard.addKeys({
    esq: K.LEFT, dir: K.RIGHT, cima: K.UP, baixo: K.DOWN,
    a: K.A, d: K.D, w: K.W, s: K.S,
    z: K.Z, x: K.X, l: K.L, k: K.K,
    shift: K.SHIFT, espaco: K.SPACE, enter: K.ENTER,
    esc: K.ESC, p: K.P, r: K.R, m: K.M
  });
}

// ---- Teclas de JOGO: montadas do mapa do jogador ---------------------------
// Devolve { p1: { esq: [Key, Key], ... }, p2: {...} }. Como as cenas de jogo
// sao criadas do zero ao entrar numa fase, basta montar isso no create().
function criarTeclasJogo(cena) {
  var t = {}, j, i, a, cods, k, chave;
  for (j = 1; j <= 2; j++) {
    t['p' + j] = {};
    for (i = 0; i < ACOES.length; i++) {
      a = ACOES[i].id;
      cods = Controles.teclasDe(j, a);
      chave = [];
      for (k = 0; k < cods.length; k++) chave.push(cena.input.keyboard.addKey(cods[k], true, false));
      t['p' + j][a] = chave;
    }
  }
  return t;
}
// Depois de trocar teclas no meio da partida, a cena precisa reler o mapa:
// senao o jogador so veria a mudanca na proxima fase. addKey devolve a mesma
// tecla quando ela ja existe, entao refazer e barato e nao duplica nada.
function refazTeclasJogo(cena) { cena.tj = criarTeclasJogo(cena); }

var JD = Phaser.Input.Keyboard.JustDown;
// alguma das teclas da acao esta pressionada?
function segura(lista) {
  for (var i = 0; i < lista.length; i++) if (lista[i].isDown) return true;
  return false;
}
// alguma delas foi apertada AGORA? (JustDown precisa ser chamado em todas,
// senao a segunda tecla da acao guarda um "apertei" antigo)
function apertou(lista) {
  var achou = false;
  for (var i = 0; i < lista.length; i++) if (JD(lista[i])) achou = true;
  return achou;
}
// ============================================================================
//  CONTROLE DE TOQUE  -  o jogo no celular
//  ---------------------------------------------------------------------------
//  O jogo le entrada por poucos gargalos: leEntrada() na partida e
//  MenuLista.atualiza() / SubPainelPausa.atualiza() nas telas. Este modulo
//  guarda o estado dos botoes de toque e e SOMADO nesses gargalos, entao
//  nenhuma cena precisa saber que o celular existe.
//
//  Duas leituras, iguais as do teclado:
//    seg(a)  o dedo esta no botao AGORA   (andar, segurar o pulo mais alto)
//    ap(a)   o botao acabou de ser tocado (vale UM quadro, igual ao JustDown)
//  Quem zera os pulsos e o "poststep" do Phaser, depois que todas as cenas ja
//  atualizaram no quadro - e o que garante o "um quadro" sem gambiarra.
//
//  Um botao pode acionar MAIS DE UMA entrada (data-acao="pulo ok"): partida e
//  menu leem entradas diferentes e nunca estao ativos ao mesmo tempo, entao
//  o mesmo polegar serve para pular e para confirmar.
// ============================================================================
var VIBRA_TOQUE = { pulo: 1, dash: 1, hab: 1, ok: 1, voltar: 1 };
var TOQUE = {
  ativo: false,            // so liga depois de um toque de verdade
  emJogo: null,            // null = ainda nao decidiu (forca a 1a pintura)
  segs: {},
  pulsos: {},
  dedos: {},               // pointerId -> acoes (multitoque: cada dedo o seu)
  // ultimos valores escritos no DOM: so mexer quando mudam de verdade
  ultDash: null, ultCargas: null, ultCargasMax: null,
  ultHab: null, ultHabNome: null,

  seg: function (a) { return this.ativo === true && this.segs[a] === true; },
  ap:  function (a) { return this.ativo === true && this.pulsos[a] === true; },

  cache: {},
  el: function (id) {
    if (!this.cache[id]) this.cache[id] = document.getElementById(id);
    return this.cache[id];
  },

  pressiona: function (acoes) {
    var vibra = false;
    for (var i = 0; i < acoes.length; i++) {
      this.segs[acoes[i]] = true;
      this.pulsos[acoes[i]] = true;
      if (VIBRA_TOQUE[acoes[i]]) vibra = true;
    }
    // Tiquinho tatil so nas ACOES. Andar e segurado o tempo todo; vibrar a
    // cada passo viraria ruido (e gasta bateria a toa).
    if (vibra) { try { if (navigator.vibrate) navigator.vibrate(8); } catch (e) {} }
  },
  solta: function (acoes) {
    for (var i = 0; i < acoes.length; i++) this.segs[acoes[i]] = false;
  },
  limpaPulsos: function () {
    if (!this.ativo) return;
    for (var k in this.pulsos) this.pulsos[k] = false;
  },

  // Aparece no primeiro toque e some se alguem usar o teclado de verdade.
  // Assim um notebook com tela sensivel nao ganha pad sem pedir.
  mostra: function () {
    if (this.ativo) return;
    this.ativo = true;
    document.body.classList.add('toque');
    this.posiciona();
  },
  esconde: function () {
    if (!this.ativo) return;
    this.ativo = false;
    this.segs = {}; this.pulsos = {}; this.dedos = {};
    document.body.classList.remove('toque');
    var b = document.querySelectorAll('#toque .tq-bt.on');
    for (var i = 0; i < b.length; i++) b[i].classList.remove('on');
  },

  // Na partida vale o balancim + dash/especial; nas telas, a cruz de navegacao
  // e o botao grande vira OK. Decidido sozinho, olhando as cenas ativas - as
  // cenas seguem sem saber que o celular existe.
  atualiza: function (jogo) {
    if (!this.ativo) return;
    var dentro = false, r = null, i, k = ['CampaignScene', 'RaceScene'], c;
    for (i = 0; i < k.length; i++) {
      c = jogo.scene.getScene(k[i]);
      if (!c || !c.scene.isActive() || c.pausado) continue;
      dentro = true;
      r = c.r || c.r1 || null;          // Campanha tem "r"; Perseguicao, "r1"
    }
    if (dentro !== this.emJogo) {
      this.emJogo = dentro;
      document.body.classList.toggle('tq-menu', !dentro);
      this.rotulo('tq-pulo', dentro ? 'PULO' : 'OK');
      this.posiciona();
    }
    if (dentro && r && r.pf) this.pintaAcoes(r);
  },
  // Encaixa os grupos nas tarjas pretas das laterais quando eles cabem la:
  // o pad deixa de cobrir a area jogavel. Em tela 16:9 (sem tarja) nada muda
  // e vale a margem de sempre.
  posiciona: function () {
    if (!this.ativo) return;
    var cv = document.querySelector('#jogo canvas');
    if (!cv) return;
    var r = cv.getBoundingClientRect(), W = window.innerWidth;
    var lado = this.emJogo ? this.el('tq-mov') : this.el('tq-nav');
    var cabe = function (folga, w) {
      return (w > 0 && folga >= w + 16) ? Math.round((folga - w) / 2) : 0;
    };
    var raiz = document.documentElement;
    raiz.style.setProperty('--tq-esq', cabe(r.left, lado ? lado.offsetWidth : 0) + 'px');
    raiz.style.setProperty('--tq-dir', cabe(W - r.right, this.el('tq-acoes').offsetWidth) + 'px');
  },
  rotulo: function (id, txt) {
    var s = this.el(id) && this.el(id).querySelector('.tq-rot');
    if (s && s.textContent !== txt) s.textContent = txt;
  },

  // O botao mostra a propria recarga. Com os dois polegares ocupados ninguem
  // le a barra no canto da tela: a informacao tem de estar onde o dedo esta.
  // As contas sao as MESMAS do HUD (veja a barra da habilidade), para os dois
  // nunca discordarem.
  pintaAcoes: function (r) {
    // ---- DASH: so serve se ha carga E a recarga passou ----
    var temDash = (r.cargas > 0 && r.dashCd <= 0);
    if (temDash !== this.ultDash) {
      this.ultDash = temDash;
      this.el('tq-dash').classList.toggle('vazio', !temDash);
    }
    if (r.cargas !== this.ultCargas || r.cargasMax !== this.ultCargasMax) {
      this.ultCargas = r.cargas; this.ultCargasMax = r.cargasMax;
      var s = '', i;
      // com uma carga so o pontinho nao informa nada: o botao ja diz tudo
      if (r.cargasMax > 1) {
        for (i = 0; i < r.cargasMax; i++) {
          s += '<i class="' + (i < r.cargas ? 'cheio' : '') + '"></i>';
        }
      }
      this.el('tq-dash').querySelector('.tq-pips').innerHTML = s;
    }
    // ---- ESPECIAL: pirueta ou escudo, conforme o personagem ----
    var pronta = 1;
    if (r.pf.hab === 'escudo') {
      if (r.escudando) pronta = limita(r.escudoT / r.pf.escudoDur, 0, 1);
      else if (r.habCd > 0) pronta = 1 - limita(r.habCd / (r.pf.escudoDur + r.pf.escudoCd), 0, 1);
    } else {
      if (r.habCd > 0) pronta = 1 - limita(r.habCd / r.pf.piruetaCd, 0, 1);
      else if (r.piruetaUsada && !r.noChao) pronta = 0;
    }
    var passo = Math.round(pronta * 20) / 20;     // 20 degraus: o olho nao ve mais
    if (passo !== this.ultHab) {
      this.ultHab = passo;
      var hab = this.el('tq-hab');
      hab.style.setProperty('--carga', passo);
      hab.classList.toggle('vazio', passo < 1);
    }
    if (r.pf.habNome !== this.ultHabNome) {
      this.ultHabNome = r.pf.habNome;
      this.rotulo('tq-hab', r.pf.habNome);        // PIRUETA ou ESCUDO
    }
  },

  liga: function () {
    var self = this, els = document.querySelectorAll('#toque .tq-bt[data-acao]'), i;
    var pega = function (el) { return el.getAttribute('data-acao').split(' '); };
    for (i = 0; i < els.length; i++) {
      (function (el) {
        el.addEventListener('pointerdown', function (ev) {
          ev.preventDefault();           // sem foco, sem clique fantasma
          self.mostra();
          var acoes = pega(el);
          self.dedos[ev.pointerId] = { acoes: acoes, el: el };
          self.pressiona(acoes);
          el.classList.add('on');
        });
      })(els[i]);
    }
    // Soltar e ouvido na JANELA, nao no botao: se o dedo escorregar para fora
    // antes de levantar, o botao tem de soltar do mesmo jeito (senao o boneco
    // sai andando sozinho). Cada dedo solta so o que ele estava segurando.
    var largou = function (ev) {
      var d = self.dedos[ev.pointerId];
      if (!d) return;
      self.solta(d.acoes);
      d.el.classList.remove('on');
      delete self.dedos[ev.pointerId];
    };
    window.addEventListener('pointerup', largou);
    window.addEventListener('pointercancel', largou);
    // a aba foi para segundo plano com o dedo apertado: solta tudo
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) {
        for (var id in self.dedos) {
          self.solta(self.dedos[id].acoes);
          self.dedos[id].el.classList.remove('on');
        }
        self.dedos = {};
      }
    });
    var repoe = function () { self.posiciona(); };
    window.addEventListener('resize', repoe);
    window.addEventListener('orientationchange', repoe);
    window.addEventListener('touchstart', function () { self.mostra(); }, { passive: true });
    window.addEventListener('keydown', function () { self.esconde(); });
  }
};

// Monta a entrada de um jogador a partir das teclas dele.
// "extra" permite somar outro conjunto (na Campanha, um jogador so, valem as
// teclas dos DOIS perfis - foi sempre assim e continua sendo).
// O TOQUE entra aqui, e so para o jogador 1: num celular ha um par de
// polegares, entao a Perseguicao de dois continua pedindo teclado.
function leEntrada(tj, jog, extra) {
  var m = tj['p' + jog], e = extra ? tj['p' + extra] : null, toq = (jog === 1);
  var seg = function (a) { return segura(m[a]) || (e ? segura(e[a]) : false) || (toq && TOQUE.seg(a)); };
  var ap  = function (a) {
    // apertou() precisa rodar nas duas listas SEMPRE (JustDown so zera quando
    // e lido), por isso o toque entra depois, sem curto-circuitar nada
    var x = apertou(m[a]), y = e ? apertou(e[a]) : false;
    return x || y || (toq && TOQUE.ap(a));
  };
  return {
    esq: seg('esq'), dir: seg('dir'), pulo: seg('pulo'), baixo: seg('baixo'),
    puloAgora: ap('pulo'), dashAgora: ap('dash'), habAgora: ap('hab'), baixoAgora: ap('baixo')
  };
}

// Lista de opcoes navegavel com as setas (usada no menu, na pausa e nos
// resultados). itens = [{ rot, acao, bloq }]
// Com uma camera so, as opcoes tambem aceitam o mouse: passar por cima
// seleciona e clicar confirma. Na tela dividida da Perseguicao (duas
// cameras) a lista fica so no teclado, como sempre foi.
function MenuLista(cena, x, y, itens, espac, tam, esq) {
  this.cena = cena; this.itens = itens; this.i = 0; this.esq = !!esq;
  this.espac = espac || 34; this.textos = []; this.trava = 220; this.morta = false;
  for (var k = 0; k < itens.length; k++) {
    if (!itens[k].bloq) { this.i = k; break; }
  }
  var mouse = cena.cameras && cena.cameras.cameras.length === 1;
  // faixa de realce atras da opcao escolhida (criada antes: fica embaixo)
  this.realce = cena.add.graphics();
  var yy = y;
  for (var j = 0; j < itens.length; j++) {
    if (j > 0) yy += this.espac + (itens[j].gap || 0);   // "gap": espaco extra antes do item
    var t = txt(cena, x, yy, itens[j].rot, tam || 14,
                itens[j].bloq ? C.cinza : C.ui, this.esq ? 0 : 0.5);
    if (mouse) this.ligaMouse(t, j);
    this.textos.push(t);
  }
  this.seta = cena.add.image(x - 24, y, 'seta').setOrigin(0.5);
  // a setinha "respira" (sem piscar se o jogador pediu menos movimento)
  if (!POUCO_MOV) cena.tweens.add({ targets: this.seta, alpha: 0.45, duration: 420, yoyo: true, repeat: -1 });
  this.x = x;
  this.pinta();
}
MenuLista.prototype.ligaMouse = function (t, j) {
  var lista = this;
  t.setInteractive({ useHandCursor: true });
  t.on('pointerover', function () {
    if (lista.morta || lista.itens[j].bloq || lista.i === j) return;
    lista.i = j; SOM.mover(); lista.pinta();
    if (lista.aoMover) lista.aoMover(j);
  });
  t.on('pointerdown', function () { lista.clica(j); });
};
MenuLista.prototype.clica = function (j) {
  if (this.morta || this.trava > 0) return;
  var it = this.itens[j];
  if (it.bloq || !it.acao) { SOM.voltar(); return; }
  this.i = j; this.pinta();
  SOM.ok(); it.acao();
};
MenuLista.prototype.pinta = function () {
  for (var j = 0; j < this.itens.length; j++) {
    var sel = (j === this.i);
    this.textos[j].setColor(this.itens[j].bloq ? C.cinza : (sel ? C.moeda : C.ui));
  }
  var t = this.textos[this.i];
  this.seta.x = this.esq ? (t.x - 20) : (t.x - t.width / 2 - 20);
  this.seta.y = t.y;
  // realce: faixa dourada translucida com filetes em cima e embaixo
  var x0 = Math.round(this.esq ? t.x - 34 : t.x - t.width / 2 - 34);
  var w = Math.round(t.width + (this.esq ? 50 : 68)), h = Math.round(t.height) + 4;
  var y0 = Math.round(t.y - h / 2), g = this.realce;
  g.clear();
  g.fillStyle(N.moeda, 0.14); g.fillRect(x0, y0, w, h);
  g.fillStyle(N.moeda, 0.45); g.fillRect(x0, y0, w, 1); g.fillRect(x0, y0 + h - 1, w, 1);
};
MenuLista.prototype.move = function (d) {
  var n = this.itens.length, tent = 0;
  do { this.i = (this.i + d + n) % n; tent++; } while (this.itens[this.i].bloq && tent < n);
  SOM.mover(); this.pinta();
  if (this.aoMover) this.aoMover(this.i);
};
MenuLista.prototype.atualiza = function (teclas, dt) {
  if (this.trava > 0) { this.trava -= dt; }
  var sobe = JD(teclas.cima) || JD(teclas.w) || TOQUE.ap('cima');
  var desce = JD(teclas.baixo) || JD(teclas.s) || TOQUE.ap('baixo');
  var ok = JD(teclas.enter) || JD(teclas.espaco) || TOQUE.ap('ok');
  if (sobe) this.move(-1);
  if (desce) this.move(1);
  // opcoes com "ajusta" (ex.: volume) mudam com as setas esquerda/direita
  var itA = this.itens[this.i];
  if (itA && itA.ajusta && !itA.bloq) {
    var vaiEsq = JD(teclas.esq) || JD(teclas.a) || TOQUE.ap('esq');
    var vaiDir = JD(teclas.dir) || JD(teclas.d) || TOQUE.ap('dir');
    if (vaiEsq) itA.ajusta(-1);
    if (vaiDir) itA.ajusta(1);
  }
  if (ok && this.trava <= 0) {
    var it = this.itens[this.i];
    if (!it.bloq && it.acao) { SOM.ok(); it.acao(); return true; }
    SOM.voltar();
  }
  return false;
};
// prende a lista na tela (nao rola com a camera) e define a profundidade
MenuLista.prototype.fixa = function (prof) {
  for (var j = 0; j < this.textos.length; j++) {
    this.textos[j].setScrollFactor(0).setDepth(prof);
  }
  this.seta.setScrollFactor(0).setDepth(prof);
  this.realce.setScrollFactor(0).setDepth(prof - 0.5);
  return this;
};
// todos os objetos de tela da lista (para uma camera ignorar, por exemplo)
MenuLista.prototype.objetos = function () {
  return this.textos.concat([this.seta, this.realce]);
};
MenuLista.prototype.destroi = function () {
  this.morta = true;
  for (var j = 0; j < this.textos.length; j++) this.textos[j].destroy();
  this.cena.tweens.killTweensOf(this.seta);
  this.seta.destroy();
  this.realce.destroy();
};

// Liga/desliga o som com a tecla M (funciona em qualquer cena)
function checaMudo(teclas) {
  if (JD(teclas.m)) {
    SOM.mudo = !SOM.mudo;
    Save.d.mudo = SOM.mudo; Save.salvar();
    if (!SOM.mudo) SOM.ok();
    return true;
  }
  return false;
}

// ============================================================================
//  SUBPAINEL DA PAUSA  -  CONTROLES e AJUSTES sem sair da partida
//  ---------------------------------------------------------------------------
//  As duas cenas de jogo usam o mesmo painel. Ele cabe em 254px de altura de
//  proposito: na Perseguicao o menu so pode ocupar a metade de cima da tela.
//  Trocar uma tecla aqui vale NA HORA - o mapa de teclas da cena e refeito
//  assim que a pagina fecha (veja refazTeclasJogo).
// ============================================================================
function SubPainelPausa(cena, x, y, prof) {
  this.cena = cena; this.x = x; this.y = y; this.prof = prof || 210;
  this.larg = 620; this.alt = 254;
  this.objs = []; this.lista = null; this.pagina = null;
  this.jog = 1; this.col = 0;
  this.captura = null; this.dlg = null; this.aviso = null;
  this.mudouTeclas = false;
  var sp = this;
  this.ouvinte = function (ev) { sp.recebeTecla(ev); };
  cena.input.keyboard.on('keydown', this.ouvinte);
}

SubPainelPausa.prototype.limpa = function () {
  var i;
  for (i = 0; i < this.objs.length; i++) {
    this.cena.tweens.killTweensOf(this.objs[i]);
    this.objs[i].destroy();
  }
  this.objs = [];
  if (this.lista) { this.lista.destroi(); this.lista = null; }
  if (this.dlg) { this.dlg.destroi(); this.dlg = null; }
  this.captura = null;
};

SubPainelPausa.prototype.destroi = function () {
  this.limpa();
  this.cena.input.keyboard.off('keydown', this.ouvinte);
};

// Todo objeto do painel passa por aqui: fica preso na camera (scrollFactor 0)
// e na profundidade certa. E o que mantem painel e texto sempre juntos.
SubPainelPausa.prototype.poe = function (lista, prof) {
  for (var i = 0; i < lista.length; i++) {
    if (lista[i].setScrollFactor) lista[i].setScrollFactor(0);
    if (lista[i].setDepth) lista[i].setDepth(prof === undefined ? this.prof + 1 : prof);
    this.objs.push(lista[i]);
  }
};
SubPainelPausa.prototype.fundo = function (titulo) {
  this.poe([painel(this.cena, this.x, this.y, this.larg, this.alt)], this.prof);
  this.poe(tituloTela(this.cena, this.x + this.larg / 2, this.y + 22, titulo, 12, this.larg - 40));
};

// ---- pagina CONTROLES ------------------------------------------------------
SubPainelPausa.prototype.controles = function (aoSair) {
  var sp = this, cena = this.cena, i;
  this.limpa();
  this.pagina = 'controles';
  this.aoSair = aoSair;
  this.fundo('CONTROLES');
  // abas dos dois jogadores
  this.gAbas = cena.add.graphics();
  this.poe([this.gAbas]);
  this.tAbas = [];
  for (i = 1; i <= 2; i++) {
    (function (j) {
      var tx = txt(cena, sp.x + sp.larg / 2 + (j === 1 ? -84 : 84), sp.y + 46, 'JOGADOR ' + j, 8, C.ui);
      tx.setInteractive({ useHandCursor: true });
      tx.on('pointerdown', function () { sp.trocaJog(j); });
      sp.tAbas.push(tx);
      sp.poe([tx]);
    })(i);
  }
  var itens = [];
  for (i = 0; i < ACOES.length; i++) {
    (function (idx) {
      itens.push({ rot: ACOES[idx].nome,

                   acao: function () { sp.pedeTecla(idx); } });

  }

  } });
  itens.push({ rot: 'VOLTAR', acao: function () { sp.sai(); } });
  this.lista = new MenuLista(cena, this.x + 26, this.y + 74, itens, 20, 8, true);

  this.lista.aoMover = function () { sp.pinta(); };
  this.gTeclas = cena.add.graphics();
  this.poe([this.gTeclas]);
  this.txTeclas = [];
  this.rodape = txt(cena, this.x + this.larg / 2, this.y + this.alt - 12,
                    'ENTER TROCA    < >  COLUNA    ESC VOLTA', 7, C.cinza);
  this.poe([this.rodape]);

SubPainelPausa.prototype.trocaJog = function (j) {
  if (this.jog === j || this.captura || this.dlg) return;
  this.jog = j; SOM.mover(); this.pinta();
};
SubPainelPausa.prototype.moveCol = function (d) {
  var novo = limita(this.col + d, 0, MAX_TECLAS - 1);
  if (novo === this.col) { this.trocaJog(d < 0 ? 1 : 2); return; }
  this.col = novo; SOM.mover(); this.pinta();
};

SubPainelPausa.prototype.pinta = function () {
  var sp = this, cena = this.cena, g = this.gTeclas, i, k, cods, bx, by, idx, tem, sel;
  if (this.pagina !== 'controles' || !g) return;
  // abas
  this.gAbas.clear();
  for (i = 0; i < 2; i++) {
    var ativa = (this.jog === i + 1), tx = this.tAbas[i];
    var w = 140, ax = Math.round(tx.x - w / 2);
    this.gAbas.fillStyle(N.escuro, 1); this.gAbas.fillRect(ax - 1, this.y + 34, w + 2, 24);
    this.gAbas.fillStyle(ativa ? (i ? N.p2 : N.p1) : N.painel, 1);
    this.gAbas.fillRect(ax, this.y + 35, w, 22);
    tx.setColor(ativa ? C.ui : C.cinza);
  }
  g.clear();
  for (i = 0; i < ACOES.length; i++) {
    cods = Controles.teclasDe(this.jog, ACOES[i].id);
    by = Math.round(this.lista.textos[i].y);
    for (k = 0; k < MAX_TECLAS; k++) {
      bx = this.x + 330 + k * 132;
      tem = cods[k] !== undefined;
      sel = (this.lista.i === i && this.col === k);
      g.fillStyle(N.escuro, 1); g.fillRect(bx - 2, by - 11, 120, 22);
      g.fillStyle(tem ? N.cinza : N.painel, 1); g.fillRect(bx, by - 9, 116, 18);
      if (sel) { g.lineStyle(2, N.moeda, 1); g.strokeRect(bx - 3, by - 12, 122, 24); }
      idx = i * MAX_TECLAS + k;
      if (!this.txTeclas[idx]) {
        var tv = txt(cena, bx + 58, by, '', 7, C.escuro);
        tv.setShadow(0, 0, C.escuro, 0, false, false);
        this.txTeclas[idx] = tv;
        this.poe([tv], this.prof + 2);
      }
      this.txTeclas[idx].setPosition(bx + 58, by)
        .setText(tem ? nomeTecla(cods[k], true) : (k === 0 && !cods.length ? 'SEM TECLA' : '- - -'))
        .setColor(tem ? C.escuro : (k === 0 && !cods.length ? C.perigo : C.painelLuz));
    }
  }
  var vazia = Controles.temVazio(this.jog);
  this.rodape.setText(vazia ? 'ATENÇÃO: "' + vazia + '" ESTÁ SEM TECLA'
                            : 'ENTER TROCA    < >  COLUNA    ESC VOLTA');
  this.rodape.setColor(vazia ? C.perigo : C.cinza);
};

// ---- captura de tecla dentro da pausa --------------------------------------
SubPainelPausa.prototype.pedeTecla = function (iAcao) {
  if (this.captura || this.dlg) return;
  this.captura = { acao: ACOES[iAcao].id, slot: this.col, trava: 220 };
  SOM.ok();
  this.mostraAviso('PRESSIONE UMA TECLA...   (ESC CANCELA)', C.moeda);
};
SubPainelPausa.prototype.mostraAviso = function (texto, cor) {
  if (!this.aviso) {
    this.aviso = txt(this.cena, this.x + this.larg / 2, this.y + this.alt - 28, '', 8, C.moeda);
    this.poe([this.aviso]);
  }
  this.cena.tweens.killTweensOf(this.aviso);
  this.aviso.setText(texto).setColor(cor || C.moeda).setAlpha(1);
};
SubPainelPausa.prototype.escondeAviso = function () {
  if (this.aviso) this.aviso.setText('');
};

SubPainelPausa.prototype.recebeTecla = function (ev) {
  var sp = this, cap = this.captura, cod;
  if (!cap || cap.trava > 0 || this.dlg) return;
  cod = ev.keyCode;
  if (ev.preventDefault) ev.preventDefault();
  if (cod === 27) { this.captura = null; this.escondeAviso(); SOM.voltar(); return; }
  if (cod === 8) {
    if (Controles.limpa(this.jog, cap.acao, cap.slot)) {
      this.mudouTeclas = true; SOM.ok(); this.captura = null; this.escondeAviso(); this.pinta();
    } else this.mostraAviso('CADA AÇÃO PRECISA DE UMA TECLA', C.perigo);
    return;
  }
  if (TECLAS_PROIBIDAS[cod]) {
    this.mostraAviso('A TECLA ' + nomeTecla(cod) + ' NÃO PODE SER USADA', C.perigo);
    SOM.voltar(); return;
  }
  var conf = Controles.conflito(cod, this.jog, cap.acao);
  if (conf && conf.fixo) {
    this.mostraAviso(nomeTecla(cod) + ' JÁ É ATALHO DO JOGO (' + conf.nome + ')', C.perigo);
    SOM.voltar(); return;
  }
  if (conf) { this.perguntaTroca(cod, conf); return; }
  this.aplica(cod, false);
};

SubPainelPausa.prototype.perguntaTroca = function (cod, conf) {
  var sp = this;
  SOM.voltar();
  this.mostraAviso(nomeTecla(cod) + ' JÁ É DE ' + conf.onde + ' / ' + conf.nome, C.perigo);
  this.dlg = new MenuLista(this.cena, this.x + this.larg / 2, this.y + this.alt - 11, [
    { rot: 'SUBSTITUIR', acao: function () { sp.aplica(cod, true); } },
    { rot: 'CANCELAR', acao: function () {
      sp.captura = null; sp.escondeAviso();
      if (sp.dlg) { sp.dlg.destroi(); sp.dlg = null; }
      SOM.voltar();
    } }
  ], 0, 8);
  // as duas opcoes lado a lado (espaco 0 = mesma linha): reposiciona na mao
  this.dlg.textos[0].setPosition(this.x + this.larg / 2 - 80, this.y + this.alt - 11);
  this.dlg.textos[1].setPosition(this.x + this.larg / 2 + 80, this.y + this.alt - 11);
  this.dlg.fixa(this.prof + 3);
  this.dlg.pinta();
};

SubPainelPausa.prototype.aplica = function (cod, substituir) {
  var cap = this.captura;
  if (!cap) return;
  var ok = Controles.define(this.jog, cap.acao, cap.slot, cod, substituir);
  this.captura = null;
  if (this.dlg) { this.dlg.destroi(); this.dlg = null; }
  if (ok) { this.mudouTeclas = true; SOM.ok(); this.escondeAviso(); }
  else { SOM.voltar(); this.mostraAviso('NÃO FOI POSSÍVEL USAR ESSA TECLA', C.perigo); }
  this.pinta();
};

SubPainelPausa.prototype.mexeAjuste = function (id, d, circular) {
  if (id === 'som') { SOM.mudo = !SOM.mudo; Save.d.mudo = SOM.mudo; Save.aplica(); Save.salvar(); if (!SOM.mudo) SOM.ok(); }
  else if (id === 'movimento') {
    var v = Save.d.poucoMov;
    Save.mudaPoucoMov(v === null ? true : (v === true ? false : null)); SOM.ok();
  } else if (id === 'legendas') { Save.mudaLegendas(!Save.d.legendas); SOM.ok(); }
  else {
    var atual = id === 'musica' ? Save.d.volMusica : (id === 'efeitos' ? Save.d.volEfeitos : Save.d.volume);
    var nv = atual + d * 10;
    if (circular && nv > 100) nv = 0;
    if (id === 'musica') Save.mudaMusica(nv);
    else if (id === 'efeitos') Save.mudaEfeitos(nv);
    else Save.mudaVolume(nv);
    if (SOM.mudo && Save.d.volume > 0) { SOM.mudo = false; Save.d.mudo = false; Save.aplica(); Save.salvar(); }
    SOM.bipVolume();
  }
  this.pintaAjustes();
};

SubPainelPausa.prototype.pintaAjustes = function () {
  var g = this.gBarra, i, k, x, y, lin, v;
  if (this.pagina !== 'ajustes' || !g) return;
  g.clear();
  for (i = 0; i < this.linhasAj.length; i++) {
    lin = this.linhasAj[i];
    y = Math.round(this.lista.textos[i].y);
    if (lin.id === 'volume' || lin.id === 'musica' || lin.id === 'efeitos') {
      v = lin.id === 'musica' ? Save.d.volMusica : (lin.id === 'efeitos' ? Save.d.volEfeitos : Save.d.volume);
      for (k = 0; k < 10; k++) {
        x = this.x + 300 + k * 13;
        g.fillStyle(N.escuro, 1); g.fillRect(x - 1, y - 7, 11, 14);
        g.fillStyle(k < v / 10 ? (SOM.mudo ? N.cinza : N.moeda) : N.painel, 1);
        g.fillRect(x, y - 6, 9, 12);
      }
      this.valores[i].setText(v + '%').setColor(SOM.mudo ? C.cinza : C.ui);
    } else if (lin.id === 'som') {
      this.valores[i].setText(SOM.mudo ? 'DESLIGADO' : 'LIGADO').setColor(SOM.mudo ? C.perigo : C.p2luz);
    } else if (lin.id === 'movimento') {
      var pm = Save.d.poucoMov;
      this.valores[i].setText(pm === null ? 'AUTOMÁTICO' : (pm ? 'LIGADO' : 'DESLIGADO'))
        .setColor(pm === null ? C.cinza : (pm ? C.p2luz : C.ui));
    } else {
      this.valores[i].setText(Save.d.legendas ? 'LIGADO' : 'DESLIGADO')
        .setColor(Save.d.legendas ? C.p2luz : C.ui);
    }
  }
};

// ---- navegacao -------------------------------------------------------------
SubPainelPausa.prototype.sai = function () {
  var f = this.aoSair;
  SOM.voltar();
  this.limpa();
  this.pagina = null;
  if (f) f(this.mudouTeclas);
};

// devolve true se consumiu a entrada (a cena nao deve fazer mais nada)
SubPainelPausa.prototype.atualiza = function (teclas, dt) {
  if (!this.pagina) return false;
  if (this.captura) {
    if (this.captura.trava > 0) this.captura.trava -= dt;
    return true;                       // qualquer tecla agora e resposta
  }
  if (this.dlg) {
    // dialogo lado a lado: < > escolhem, ENTER confirma
    if (JD(teclas.esq) || JD(teclas.a) || TOQUE.ap('esq')) this.dlg.move(-1);
    if (JD(teclas.dir) || JD(teclas.d) || TOQUE.ap('dir')) this.dlg.move(1);
    if (JD(teclas.enter) || JD(teclas.espaco) || TOQUE.ap('ok')) {
      var it = this.dlg.itens[this.dlg.i];
      SOM.ok(); if (it.acao) it.acao();
    }
    if (JD(teclas.esc) || TOQUE.ap('voltar')) {
      this.captura = null; this.escondeAviso();
      this.dlg.destroi(); this.dlg = null; SOM.voltar();
    }
    return true;
  }
  if (this.lista) this.lista.atualiza(teclas, dt);
  if (this.pagina && (JD(teclas.esc) || TOQUE.ap('voltar'))) this.sai();
  return true;
};

// ============================================================================
//  PONTUACAO, COMBO E MULTIPLICADOR
//  ---------------------------------------------------------------------------
//  A ideia e premiar quem joga BEM, nao quem joga muito: pegar ovos em
//  sequencia mantem o combo vivo; parar, errar ou cair zera. O multiplicador
//  sobe junto com o combo, entao a mesma fase rende muito mais para quem
//  encadeia. No fim da fase entram os bonus (tempo, coleta, sem queda).
// ============================================================================
var PONT = {
  OVO:        100,    // ovo dourado comum
  OVO_SEC:    500,    // ovo secreto (escondido)
  CHECK:      50,     // acender uma lanterna
  CHEFE:     1000,    // cada folego tirado do chefe
  SEGREDO:    750,    // achar uma area secreta
  BICHO:      150,    // tirar um bicho do caminho
  JANELA:    3200,    // ms para manter o combo vivo
  PASSO_MULT:   4,    // a cada 4 do combo, sobe 1 no multiplicador
  MULT_MAX:     5,
  BONUS_TEMPO:  40,   // pontos por segundo que sobrou do limite
  BONUS_COLETA: 1500, // pegou todos os ovos
  BONUS_LIMPO:  1200, // terminou sem cair nenhuma vez
  BONUS_PERF:   2500  // execucao perfeita: tudo + sem cair
};

// medalhas por pontuacao (a fase diz qual e a marca do ouro)
var MEDALHAS = [
  { id: 'ouro',   nome: 'OURO',   cor: C.moeda,  fatia: 1.00 },
  { id: 'prata',  nome: 'PRATA',  cor: C.cinza,  fatia: 0.70 },
  { id: 'bronze', nome: 'BRONZE', cor: C.perigo, fatia: 0.38 }
];
function medalhaDe(pontos, alvoOuro) {
  for (var i = 0; i < MEDALHAS.length; i++) {
    if (pontos >= alvoOuro * MEDALHAS[i].fatia) return MEDALHAS[i];
  }
  return null;
}

// Placar de uma partida. Vive dentro da cena e nao sabe nada de desenho:
// quem mostra na tela e o HUD.
function Placar(cena) {
  this.cena = cena;
  this.pontos = 0;
  this.combo = 0; this.comboMax = 0; this.mult = 1;
  this.janela = 0;
  this.ovos = 0; this.secretos = 0; this.mortes = 0;
  this.usosHab = 0; this.perfeitos = 0;
}
Placar.prototype.multDo = function (combo) {
  return limita(1 + Math.floor(combo / PONT.PASSO_MULT), 1, PONT.MULT_MAX);
};
// marca ganha pontos e (se "encadeia") empurra o combo para cima
Placar.prototype.marca = function (base, x, y, rotulo, cor, encadeia) {
  var ganho, antesMult = this.mult;
  if (encadeia) {
    this.combo++;
    if (this.combo > this.comboMax) this.comboMax = this.combo;
    this.mult = this.multDo(this.combo);
    this.janela = PONT.JANELA;
    SOM.combo(this.combo);
  }
  ganho = Math.round(base * this.mult);
  this.pontos += ganho;
  // Sem posicao na tela (chamada de teste), so contabiliza: nada de desenho.
  if (x !== undefined) {
    pontosVoando(this.cena, x, y, '+' + ganho + (this.mult > 1 ? '  x' + this.mult : ''),
                 cor || C.moeda, 10);
    if (encadeia && this.mult > antesMult) {
      pontosVoando(this.cena, x, y - 22, 'MULTIPLICADOR x' + this.mult, C.perigo2, 12);
    }
    if (rotulo) pontosVoando(this.cena, x, y - 40, rotulo, cor || C.p1luz, 9);
  }
  return ganho;
};
// o combo morre sozinho quando o jogador para de encadear
Placar.prototype.passo = function (dt) {
  if (this.combo <= 0) return;
  this.janela -= dt;
  if (this.janela <= 0) this.zera(true);
};
Placar.prototype.zera = function (porTempo) {
  if (this.combo >= PONT.PASSO_MULT) SOM.comboPerde();
  this.combo = 0; this.mult = 1; this.janela = 0;
};
// ============================================================================
//  CONQUISTAS
//  ---------------------------------------------------------------------------
//  Marcos de longo prazo, conferidos depois de cada partida. Cada um so e
//  ganho uma vez e fica salvo. "checa" recebe um contexto com o que acabou de
//  acontecer (ou nada, quando a checagem e so sobre o progresso guardado).
//  XP e a recompensa: elas alimentam o nivel do jogador.
// ============================================================================
var CONQUISTAS = [
  { id: 'primeiro',  nome: 'PRIMEIRO TELHADO',  desc: 'TERMINE UMA FASE',              xp: 100,
    checa: function () { return Save.fasesFeitas() >= 1; } },
  { id: 'metade',    nome: 'MEIO CAMINHO',      desc: 'TERMINE 5 FASES',               xp: 250,
    checa: function () { return Save.fasesFeitas() >= 5; } },
  { id: 'campanha',  nome: 'EMPREGO SALVO',     desc: 'TERMINE TODAS AS FASES',        xp: 800,
    checa: function () { return Save.fasesFeitas() >= NUM_FASES; } },
  { id: 'chefe1',    nome: 'MAIOR QUE ELE',     desc: 'FAÇA O GIGANTE REAL SE RENDER', xp: 300,
    checa: function (c) { return c.venceuChefe === 'guarda'; } },
  { id: 'semqueda',  nome: 'PÉ FIRME',          desc: 'TERMINE UMA FASE SEM CAIR',     xp: 150,
    checa: function (c) { return c.mortes === 0 && c.terminou; } },
  { id: 'perfeito',  nome: 'IMPECÁVEL',         desc: 'TERMINE UMA FASE COM NOTA PERFEITA', xp: 300,
    checa: function (c) { return !!c.perfeito; } },
  { id: 'combo10',   nome: 'MÃO CHEIA',         desc: 'FAÇA UM COMBO x10',             xp: 200,
    checa: function (c) { return c.combo >= 10; } },
  { id: 'combo20',   nome: 'SEM PARAR',         desc: 'FAÇA UM COMBO x20',             xp: 400,
    checa: function (c) { return c.combo >= 20; } },
  { id: 'segredo1',  nome: 'BISBILHOTEIRO',     desc: 'ACHE UM OVO SECRETO',           xp: 150,
    checa: function (c) { return c.secretos >= 1; } },
  { id: 'segredos',  nome: 'NADA ESCAPA',       desc: 'ACHE TODOS OS OVOS SECRETOS',   xp: 600,
    checa: function () {
      var t = 0, i;
      for (i = 0; i < NUM_FASES; i++) t += ((Save.fase(i) || {}).secretos || 0);
      return t >= totalSecretosDoJogo();
    } },
  { id: 'ouro1',     nome: 'MEDALHA DE OURO',   desc: 'GANHE UMA MEDALHA DE OURO',     xp: 250,
    checa: function (c) { return c.medalha === 'ouro'; } },

// ============================================================================
//  DESAFIO DIARIO
//  ---------------------------------------------------------------------------
//  Um objetivo por dia, igual para a mesma data: a data vira semente, entao a
//  fase e o objetivo sao sorteados sem precisar de servidor nenhum. O
//  resultado fica salvo para aquele dia; no dia seguinte ele se renova.
// ============================================================================
var OBJETIVOS_DIARIOS = ['rapido', 'limpo', 'tudo', 'combo', 'hab'];

var Diario = {
  hoje: function () {
    var d = new Date();
    return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
  },
  // sorteio preso na data: todo mundo pega o mesmo desafio no mesmo dia
  doDia: function () {
    var dia = this.hoje(), n = 0, i;
    for (i = 0; i < dia.length; i++) n = (n * 31 + dia.charCodeAt(i)) | 0;
    var rnd = semente(Math.abs(n));
    // so entram fases ja desbloqueadas (o desafio nunca pede o impossivel)
    var maxFase = Math.max(1, Math.min(NUM_FASES, Save.d.desbloqueadas));
    var iFase = Math.floor(rnd() * maxFase);
    var obj = OBJETIVOS_DIARIOS[Math.floor(rnd() * OBJETIVOS_DIARIOS.length)];
    var f = FASES[iFase];
    // o objetivo do dia e um pouco mais duro que o desafio normal da fase
    var alvo = { rapido: Math.round(f.alvoTempo * 0.85), combo: f.alvoCombo + 2,
                 hab: f.alvoHab + 3 };
    return { dia: dia, fase: iFase, objetivo: obj, alvo: alvo,
             texto: this.texto(obj, f, alvo) };
  },
  texto: function (obj, f, alvo) {
    if (obj === 'rapido') return 'TERMINE EM MENOS DE ' + Math.round(alvo.rapido / 1000) + 'S';
    if (obj === 'limpo')  return 'TERMINE SEM CAIR NENHUMA VEZ';
    if (obj === 'tudo')   return 'PEGUE OS ' + f.totalOvos + ' OVOS';
    if (obj === 'combo')  return 'FAÇA COMBO x' + alvo.combo;
    return 'USE SUA HABILIDADE ' + alvo.hab + ' VEZES';
  },
  // ja foi feito hoje?
  feitoHoje: function () {
    return Save.d.diario.dia === this.hoje() && !!Save.d.diario.feito;
  },
  tentativasHoje: function () {
    return Save.d.diario.dia === this.hoje() ? (Save.d.diario.tentativas || 0) : 0;
  },
  registraTentativa: function () {
    var dia = this.hoje();
    if (Save.d.diario.dia !== dia) Save.d.diario = { dia: dia, pontos: 0, feito: false, tentativas: 0 };
    Save.d.diario.tentativas++;
    Save.salvar();
  },
  // confere o resultado de uma partida contra o objetivo do dia
  confere: function (d, res) {
    var f = FASES[d.fase], ok = false;
    if (d.objetivo === 'rapido') ok = res.tempo <= d.alvo.rapido;
    else if (d.objetivo === 'limpo') ok = res.mortes === 0;
    else if (d.objetivo === 'tudo') ok = f.totalOvos > 0 && res.ovos >= f.totalOvos;
    else if (d.objetivo === 'combo') ok = res.combo >= d.alvo.combo;
    else ok = res.usosHab >= d.alvo.hab;
    if (Save.d.diario.dia !== d.dia) Save.d.diario = { dia: d.dia, pontos: 0, feito: false, tentativas: 1 };
    if (res.pontos > (Save.d.diario.pontos || 0)) Save.d.diario.pontos = res.pontos;
    if (ok && !Save.d.diario.feito) {
      Save.d.diario.feito = true;
      Save.ganhaXP(400);
    }
    Save.salvar();
    return ok;
  }
};

var Conquistas = {
  // Confere tudo e devolve a LISTA das que foram ganhas agora (para a cena
  // mostrar uma de cada vez). Nada e mostrado duas vezes: fica salvo.
  checa: function (ctx) {
    var ganhas = [], i, c;
    ctx = ctx || {};
    for (i = 0; i < CONQUISTAS.length; i++) {
      c = CONQUISTAS[i];
      if (Save.d.conquistas[c.id]) continue;
      var ok = false;
      try { ok = !!c.checa(ctx); } catch (e) { ok = false; }
      if (!ok) continue;
      Save.d.conquistas[c.id] = true;
      Save.ganhaXP(c.xp);
      ganhas.push(c);
    }
    if (ganhas.length) Save.salvar();
    return ganhas;
  },
  quantas: function () {
    var t = 0, i;
    for (i = 0; i < CONQUISTAS.length; i++) if (Save.d.conquistas[CONQUISTAS[i].id]) t++;
    return t;
  }
};

// Aviso de conquista: uma faixa que entra pelo lado direito, fica um pouco e
// sai. Varias conquistas entram em fila, uma depois da outra.
function mostraConquista(cena, lista, i) {
  i = i || 0;
  if (!lista || i >= lista.length) return;
  var c = lista[i], y = 96 + (POUCO_MOV ? i * 64 : 0);
  var g = cena.add.graphics().setScrollFactor(0).setDepth(300);
  g.fillStyle(N.escuro, 0.94); g.fillRect(0, y - 26, 360, 56);
  g.fillStyle(N.moeda, 1); g.fillRect(0, y - 26, 4, 56);
  g.fillStyle(N.painelLuz, 1); g.fillRect(0, y + 29, 360, 1);
  var est = cena.add.image(32, y, 'estrela_g').setTint(N.moeda).setScrollFactor(0).setDepth(301);
  var t1 = txt(cena, 58, y - 10, 'CONQUISTA!', 8, C.moeda, 0).setScrollFactor(0).setDepth(301);
  var t2 = txt(cena, 58, y + 8, c.nome, 10, C.ui, 0).setScrollFactor(0).setDepth(301);
  var t3 = txt(cena, 348, y + 8, '+' + c.xp + ' XP', 8, C.p1luz, 1).setScrollFactor(0).setDepth(301);
  var objs = [g, est, t1, t2, t3];
  SOM.conquista();
  var k, sai = function () {
    for (k = 0; k < objs.length; k++) objs[k].destroy();
    mostraConquista(cena, lista, i + 1);
  };
  if (POUCO_MOV) { cena.time.delayedCall(2200, sai); return; }
  for (k = 0; k < objs.length; k++) objs[k].x -= 380;
  cena.tweens.add({ targets: objs, x: '+=380', duration: 320, ease: 'Back.easeOut' });
  cena.time.delayedCall(2400, function () {
    cena.tweens.add({ targets: objs, x: '-=380', duration: 260, onComplete: sai });
  });
}

// os tres desafios de uma fase, ja com o texto montado
function desafiosDaFase(f) {
  var lista = f.desafios || ['tudo', 'limpo', 'rapido'], saida = [], i, d;
  for (i = 0; i < lista.length; i++) {

// ============================================================================
//  PARTICULAS - poeira ao pousar, rastro do dash, brilho da moeda

function criaParticulas(cena) {
  var cfg = function (tint, vmin, vmax, vida, esc) {

      lifespan: vida, speed: { min: vmin, max: vmax },
      scale: { start: esc, end: 0 }, alpha: { start: 1, end: 0 },

    };

  cena.pDash = {
    1: cena.add.particles(0, 0, 'pixel', dash(N.p1luz)).setDepth(9),

// ============================================================================

//  ---------------------------------------------------------------------------
//  Cada passo aparece quando o jogador CHEGA no ponto em que aquilo importa,
//  com a tecla que ele realmente configurou, e sai de cena assim que ele faz
//  a coisa certa. Quem ja sabe jogar passa reto e quase nao ve os avisos.
//  Um passo tem:
//    x     coluna do mapa onde ele acende
//    texto o que fazer ("{pulo}" vira a tecla configurada)
//    feito funcao que diz se o jogador ja aprendeu aquilo
// ============================================================================
var TUTORIAL = {
  andar:    { texto: '{esq} {dir}  ANDAR PELO TELHADO',
              feito: function (c) { return Math.abs(c.r.corpo.body.velocity.x) > 60; } },
  pular:    { texto: '{pulo}  PULAR',

  ovo:      { texto: 'PEGUE OS OVOS SEGUIDOS PARA FAZER COMBO',

  mola:     { texto: 'O TRAMPOLIM JOGA VOCÊ BEM MAIS ALTO',

  hab:      { texto: '{hab}  SUA HABILIDADE',
              feito: function (c) { return c.usosHab > 0; } },
  dash:     { texto: '{dash}  DASH: ATRAVESSA VÃOS QUE O PULO NÃO ALCANÇA',
              feito: function (c) { return c.r.cargas < c.r.cargasMax || c.r.dashando; } },
  dashAr:   { texto: 'PULE E DÊ DASH NO AR PARA CRUZAR',

  descer:   { texto: '{baixo}  NO AR: DESCER RÁPIDO',

  check:    { texto: 'ACENDA A LANTERNA: É DE LÁ QUE VOCÊ VOLTA',

// Cria o aviso do tutorial da fase (se ela tiver um) e devolve o controlador.
function criaTutorial(cena, fase) {
  if (!fase.tutorial || !fase.tutorial.length) return null;
  var t = {
    passos: [], i: 0, atual: null, tOk: 0,
    texto: txt(cena, LARG / 2, 150, '', 10, C.perigo2).setScrollFactor(0).setDepth(101).setAlpha(0),
    caixa: cena.add.graphics().setScrollFactor(0).setDepth(100).setAlpha(0)
  };
  for (var i = 0; i < fase.tutorial.length; i++) {
    var d = fase.tutorial[i], base = TUTORIAL[d.id];
    if (!base) continue;
    t.passos.push({ x: d.x * T, texto: comTeclas(base.texto, 1), feito: base.feito, usado: false });
  }
  return t;
}

// Mostra o passo certo para onde o jogador esta, e apaga quando ele acerta.
function atualizaTutorial(cena, t, dt) {
  if (!t) return;
  var px = cena.r.corpo.x, p, i;
  // acende o passo mais avancado que o jogador ja alcancou
  for (i = t.passos.length - 1; i >= 0; i--) {
    p = t.passos[i];
    if (p.usado || px < p.x) continue;
    if (t.atual !== p) { t.atual = p; t.tOk = 0; mostraPasso(cena, t, p); }
    break;
  }
  if (!t.atual) return;
  // o passo some quando o jogador faz a coisa (com meio segundo de sobra,
  // para ele ver que era aquilo mesmo) ou quando ja deixou o trecho para tras
  if (t.atual.feito(cena)) {
    t.tOk += dt;
    if (t.tOk > 500) { t.atual.usado = true; escondePasso(cena, t); t.atual = null; }
  } else if (px > t.atual.x + 520) {
    t.atual.usado = true; escondePasso(cena, t); t.atual = null;
  }
}

function mostraPasso(cena, t, p) {
  t.texto.setText(p.texto);
  var w = Math.round(t.texto.width) + 44, h = 30;
  var x0 = Math.round(LARG / 2 - w / 2), y0 = Math.round(t.texto.y - h / 2);
  t.caixa.clear();
  t.caixa.fillStyle(N.escuro, 0.9); t.caixa.fillRect(x0, y0, w, h);
  t.caixa.fillStyle(N.perigo2, 1); t.caixa.fillRect(x0, y0, w, 2);
  t.caixa.fillStyle(N.perigo2, 1); t.caixa.fillRect(x0, y0 + h - 2, w, 2);
  cena.tweens.killTweensOf(t.texto); cena.tweens.killTweensOf(t.caixa);
  if (POUCO_MOV) { t.texto.setAlpha(1); t.caixa.setAlpha(1); return; }
  t.texto.setAlpha(0); t.caixa.setAlpha(0);
  cena.tweens.add({ targets: [t.texto, t.caixa], alpha: 1, duration: 220 });
  SOM.fantasma(true);
}
function escondePasso(cena, t) {
  cena.tweens.killTweensOf(t.texto); cena.tweens.killTweensOf(t.caixa);
  if (POUCO_MOV) { t.texto.setAlpha(0); t.caixa.setAlpha(0); return; }
  cena.tweens.add({ targets: [t.texto, t.caixa], alpha: 0, duration: 300 });
  SOM.dashPronto();
}

//  HUD DA FASE
//  Tudo ancorado nos cantos da tela base (960x540) e preso na camera, entao
