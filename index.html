// ---- Ataques: cada um tem "inicia" (telegrafe) e "passo" (o que acontece a
//      cada quadro). Todo ataque termina chamando b.fimAtaque(), que decide
//      se vem outro ataque ou se o chefe fica tonto. -------------------------
var ATAQUES_CHEFE = {
  // 1) INVESTIDA: agacha e pisca avisando, depois corre ate a parede e se
  //    estabaca. Da para pular por cima (ele corre abaixado) ou atravessar de
  //    dash, que e a "passagem por baixo".
  investida: {
    inicia: function (b, r) {
      var d = (r.corpo.x < b.x) ? -1 : 1;
      if (d < 0 && b.x - b.esq < 170) d = 1;          // ja esta colado na parede
      if (d > 0 && b.dir - b.x < 170) d = -1;
      b.face = d;
      b.fase2 = 'avisa'; b.t2 = b.par('aviso');
      b.poe('avisa'); b.icone.setVisible(true);
      b.fala(b.def.falas.investida); SOM.chefeAviso();
    },
    passo: function (b, dt) {
      if (b.fase2 === 'avisa') {
        b.t2 -= dt;
        if (b.t2 <= 0) {
          b.fase2 = 'corre'; b.poe('corre');
          b.icone.setVisible(false); SOM.chefeGrito();
        }
      } else if (b.fase2 === 'corre') {
        b.x += b.face * b.par('velInvestida') * dt / 1000;
        b.rastro(dt);
        if (b.x <= b.esq || b.x >= b.dir) {           // trombou na parede
          b.x = limita(b.x, b.esq, b.dir);
          b.fase2 = 'bate'; b.t2 = 550; b.poe('parado');
          SOM.chefeBonk(); b.tremeTela(220, 0.01); b.poeira(10);
          b.fala(b.def.falas.bateu);
        }
      } else {
        b.t2 -= dt;
        if (b.t2 <= 0) b.fimAtaque();
      }
    }
  },

  // 2) PISAO: pula (com sombra marcando onde vai cair) e ao aterrissar solta
  //    duas ondas de poeira e telhas que correm pelo chao. Basta pular.
  pisao: {
    inicia: function (b, r) {
      b.fase2 = 'avisa'; b.t2 = b.par('aviso');
      b.poe('avisa'); b.icone.setVisible(true);
      b.face = (r.corpo.x < b.x) ? -1 : 1;
      b.alvoPisao = limita(limita(r.corpo.x, b.x - 380, b.x + 380), b.esq, b.dir);
      b.fala(b.def.falas.pisao); SOM.chefeAviso();
    },
    passo: function (b, dt) {
      if (b.fase2 === 'avisa') {
        b.t2 -= dt;
        if (b.t2 <= 0) {
          b.fase2 = 'voa'; b.icone.setVisible(false);
          b.iniciaVoo(b.alvoPisao, 800, b.def.alturaPulo);
          b.sombraPulo.setPosition(b.alvo, b.chao + 2).setVisible(true).setScale(0.5).setAlpha(0.45);
          SOM.pulo();
        }
      } else if (b.fase2 === 'voa') {
        var p = Math.min(1, b.tv / b.dur);
        b.sombraPulo.setScale(0.5 + 0.6 * p).setAlpha(0.45 + 0.45 * p);
        if (b.passoVoo(dt)) {
          b.fase2 = 'caiu'; b.t2 = 560; b.poe('parado');
          b.sombraPulo.setVisible(false);
          SOM.chefePisao(); b.tremeTela(260, 0.014); b.poeira(14);
          b.criaOndas();
        }
      } else {
        b.t2 -= dt;
        if (b.t2 <= 0) b.fimAtaque();
      }
    }
  },

  // 3) TELHAS: ele sacode o telhado e caem telhas nos lugares marcados por
  //    sombras. Uma das sombras nasce em cima do jogador, para obrigar a sair
  //    do lugar; sempre sobra telhado de sobra para se esconder.
  telhas: {
    inicia: function (b, r) {
      b.fase2 = 'avisa'; b.t2 = 1000;
      b.poe('avisa'); b.icone.setVisible(true);
      b.marcaTelhas(r);
      b.fala(b.def.falas.telhas); SOM.chefeAviso(); b.tremeTela(300, 0.006);
    },
    passo: function (b, dt) {
      var i, p;
      if (b.fase2 === 'avisa') {
        b.t2 -= dt;
        p = 1 - Math.max(0, b.t2) / 1000;
        for (i = 0; i < b.sombras.length; i++) b.sombras[i].setScale(0.4 + 0.6 * p).setAlpha(0.35 + 0.5 * p);
        if (b.t2 <= 0) {
          b.fase2 = 'caindo'; b.icone.setVisible(false); b.poe('parado');
          b.soltaTelhas();
        }
      } else if (b.fase2 === 'caindo') {
        if (!b.telhas.length) { b.fase2 = 'fim'; b.t2 = 450; b.limpaSombras(); }
      } else {
        b.t2 -= dt;
        if (b.t2 <= 0) b.fimAtaque();
      }
    }
  },


  // ===========================================================================
  //  ATAQUES DOS CHEFES NOVOS (Samurai Robo e Galinha Robo)
  //  Mesmo contrato: inicia + passo, fim com b.fimAtaque(). Todos seguem o
  //  ritmo PREPARO (pose + "!" + marca) -> EXECUCAO -> RECUPERACAO, e os
  //  tempos encolhem com b.ms() conforme a fase da luta.
  // ===========================================================================

  // INVESTIDA (os dois): pausa curta piscando e atravessa a arena deixando
  // rastro. Corre abaixado: da para pular por cima. Na fase 3 volta uma vez.
  disparada: {
    inicia: function (b, r) {
      var d = (r.corpo.x < b.x) ? -1 : 1;
      if (d < 0 && b.x - b.esq < 170) d = 1;
      if (d > 0 && b.dir - b.x < 170) d = -1;
      b.face = d; b.voltas = b.faseAtual() >= 3 ? 2 : 1;
      b.fase2 = 'avisa'; b.t2 = b.ms(720);
      b.poe('avisa'); b.icone.setVisible(true); b.somAviso();
    },
    passo: function (b, dt) {
      if (b.fase2 === 'avisa') {
        b.t2 -= dt;
        if (b.t2 <= 0) {
          b.fase2 = 'corre'; b.poe('corre'); b.icone.setVisible(false);
          SOM[b.def.somVoz || 'chefeGrito']();
        }
      } else if (b.fase2 === 'corre') {
        b.x += b.face * b.def.velInvestida * b.vel() * dt / 1000;
        b.tRastro -= dt;
        if (b.tRastro <= 0) { b.tRastro = 45; FX.rastro(b.cena, b.spr, b.def.corAura, 240); }
        if (b.x <= b.esq || b.x >= b.dir) {
          b.x = b.limX(b.x); b.voltas--;
          FX.solta(b.cena, 'faisca', 10, b.x + b.face * b.def.larg / 2, b.chao - 30);
          b.tremeTela(200, 0.008); SOM.katanaImpacto();
          if (b.voltas > 0) {
            b.face = -b.face; b.fase2 = 'avisa'; b.t2 = b.ms(380);
            b.poe('avisa'); b.icone.setVisible(true); b.somAviso();
          } else { b.fase2 = 'freia'; b.t2 = b.ms(520); b.poe('parado'); }
        }
      } else {
        b.t2 -= dt;
        if (b.t2 <= 0) b.fimAtaque();
      }
    }
  },

  // CORTE HORIZONTAL (Samurai): chega perto, puxa a katana para tras e corta
  // na altura das pernas. Pule (ou fique longe).
  corteH: {
    inicia: function (b, r) { b.olha(r); b.fase2 = 'chega'; b.t2 = 1300; b.poe('anda'); },
    passo: function (b, dt, r) {
      if (b.fase2 === 'chega') {
        b.t2 -= dt;
        if (b.chega(dt, r, 110) || b.t2 <= 0) {
          b.olha(r); b.fase2 = 'avisa'; b.t2 = b.ms(640);
          b.poe('prepH'); b.icone.setVisible(true); SOM.katanaPrepara();
          b.marca(b.x + b.face * 84, 1.9);
        }
      } else if (b.fase2 === 'avisa') {
        b.t2 -= dt;
        if (b.t2 <= 0) {
          b.fase2 = 'golpe'; b.t2 = b.ms(520); b.icone.setVisible(false); b.limpaSombras();
          b.poe('golpeH'); b.x = b.limX(b.x + b.face * 22);
          SOM.katanaCorte();
          b.efeito('arco_h', b.x + b.face * 78, b.chao - 34, { flip: b.face < 0, escX: 1.2, escY: 1.05, ms: 260 });
          b.golpeFrente(150, 58, 54, 120);
          FX.solta(b.cena, 'brasa', 8, b.x + b.face * 90, b.chao - 36);
        }
      } else {
        b.t2 -= dt;
        if (b.t2 <= 0) b.fimAtaque();
      }
    }
  },

  // CORTE VERTICAL (Samurai): escolhe um ponto a frente (marca no chao),
  // ergue a katana e desce com tudo. Saia da marca. Da fase 2 em diante o
  // impacto ainda solta duas ondas rasteiras.
  corteV: {
    inicia: function (b, r) { b.olha(r); b.fase2 = 'chega'; b.t2 = 1100; b.poe('anda'); },
    passo: function (b, dt, r) {
      var i;
      if (b.fase2 === 'chega') {
        b.t2 -= dt;
        if (b.chega(dt, r, 190) || b.t2 <= 0) {
          b.olha(r);
          var perto = b.x + b.face * 50, longe = b.x + b.face * 200;
          b.alvoV = limita(limita(r.corpo.x, Math.min(perto, longe), Math.max(perto, longe)), b.ax0 + 30, b.ax1 - 30);
          b.marca(b.alvoV, 1);
          b.fase2 = 'avisa'; b.t2 = b.dur2 = b.ms(820);
          b.poe('prepV'); b.icone.setVisible(true); SOM.katanaPrepara();
        }
      } else if (b.fase2 === 'avisa') {
        b.t2 -= dt;
        var p = 1 - Math.max(0, b.t2) / b.dur2;
        for (i = 0; i < b.sombras.length; i++) b.sombras[i].setAlpha(0.35 + 0.6 * p).setScale(0.6 + 0.5 * p, 1);
        if (b.t2 <= 0) {
          b.fase2 = 'golpe'; b.t2 = b.ms(620); b.icone.setVisible(false); b.limpaSombras();
          b.poe('golpeV');
          SOM.katanaCorte(); SOM.katanaImpacto();
          b.efeito('arco_v', b.alvoV, b.chao - 70, { flip: b.face < 0, ms: 320 });
          b.golpe(b.alvoV - 30, b.chao - 170, 60, 170, 130);
          FX.impacto(b.cena, b.alvoV, b.chao - 6, 0xff2438, 1);
          FX.solta(b.cena, 'fumaca', 6, b.alvoV, b.chao - 8);
          if (b.faseAtual() >= 2) { b.onda(b.alvoV - 24, -1, 300); b.onda(b.alvoV + 24, 1, 300); }
        }
      } else {
        b.t2 -= dt;
        if (b.t2 <= 0) b.fimAtaque();
      }
    }
  },

  // COMBO (Samurai): 4 cortes seguidos, avancando. Cada corte avisa a
  // altura: BAIXO (marca vermelha no chao) = pule; ALTO (marca amarela no ar)
  // = fique no chao. A sequencia de cada fase e sempre a mesma (def.combos).
  combo: {
    inicia: function (b, r) {
      b.olha(r); b.fase2 = 'chega'; b.t2 = 1200; b.poe('anda');
      b.seq = ((b.def.combos || {})[b.faseAtual()] || ['B', 'A', 'B', 'B']).slice();
      b.iGolpe = 0;
    },
    prepara: function (b, r) {
      var alto = b.seq[b.iGolpe] === 'A';
      b.olha(r);
      b.fase2 = 'avisa'; b.t2 = b.ms(b.iGolpe === 0 ? 580 : 400);
      b.poe(alto ? 'prepA' : 'prepB'); b.icone.setVisible(true); SOM.katanaPrepara();
      var m = b.marca(b.x + b.face * 84, 1.7);
      if (alto) { m.setY(b.chao - 66).setTint(0xffcd75); }
      legenda(b.cena, alto ? 'CORTE ALTO: FIQUE NO CHÃO' : 'CORTE BAIXO: PULE', alto ? C.perigo2 : C.perigo);
    },
    passo: function (b, dt, r) {
      if (b.fase2 === 'chega') {
        b.t2 -= dt;
        if (b.chega(dt, r, 130) || b.t2 <= 0) ATAQUES_CHEFE.combo.prepara(b, r);
      } else if (b.fase2 === 'avisa') {
        b.t2 -= dt;
        if (b.t2 <= 0) {
          var alto = b.seq[b.iGolpe] === 'A';
          b.fase2 = 'golpe'; b.t2 = b.ms(320); b.icone.setVisible(false); b.limpaSombras();
          b.poe(alto ? 'golpeA' : 'golpeB'); b.x = b.limX(b.x + b.face * 30);
          SOM.katanaCorte();
          if (alto) {
            b.golpeFrente(140, 112, 72, 110);
            b.efeito('arco_h', b.x + b.face * 74, b.chao - 80, { flip: b.face < 0, escX: 1.1, ms: 220 });
          } else {
            b.golpeFrente(140, 44, 42, 110);
            b.efeito('arco_h', b.x + b.face * 74, b.chao - 22, { flip: b.face < 0, escX: 1.1, escY: 0.8, ms: 220 });
          }
          b.iGolpe++;
        }
      } else if (b.fase2 === 'golpe') {
        b.t2 -= dt;
        if (b.t2 <= 0) {
          if (b.iGolpe < b.seq.length) ATAQUES_CHEFE.combo.prepara(b, r);
          else { b.fase2 = 'fim'; b.t2 = b.ms(680); b.poe('parado'); }
        }
      } else {
        b.t2 -= dt;
        if (b.t2 <= 0) b.fimAtaque();
      }
    }
  },

  // CORTE DE PLASMA (Samurai, fase 2+): a lamina acende e o corte vira uma
  // onda que atravessa a arena. Baixa = pule; alta = fique no chao.
  energia: {
    inicia: function (b, r) {
      b.olha(r);
      b.ondasFila = ((b.def.ondas || {})[b.faseAtual()] || ['B']).slice();
      b.iOnda = 0;
      ATAQUES_CHEFE.energia.prepara(b);
    },
    prepara: function (b) {
      var alta = b.ondasFila[b.iOnda] === 'A';
      b.fase2 = 'avisa'; b.t2 = b.ms(b.iOnda ? 440 : 700);
      b.poe(alta ? 'prepA' : 'prepH'); b.icone.setVisible(true);
      SOM.energiaCarrega(b.t2 / 1000);
      FX.brilho(b.cena, b.x - b.face * 18, b.chao - (alta ? 92 : 50), 0xff2438, 0.6, b.t2);
      legenda(b.cena, alta ? 'ONDA ALTA: FIQUE NO CHÃO' : 'ONDA BAIXA: PULE', alta ? C.perigo2 : C.perigo);
    },
    passo: function (b, dt) {
      if (b.fase2 === 'avisa') {
        b.t2 -= dt;
        if (!POUCO_MOV && Math.random() < 0.4) FX.solta(b.cena, 'brasa', 1, b.x - b.face * 20 + (Math.random() - 0.5) * 30, b.chao - 60);
        if (b.t2 <= 0) {
          var alta = b.ondasFila[b.iOnda] === 'A';
          b.poe(alta ? 'golpeA' : 'golpeH'); b.icone.setVisible(false);
          SOM.katanaCorte(); SOM.energiaDispara();
          b.efeito('arco_h', b.x + b.face * 70, b.chao - (alta ? 84 : 36), { flip: b.face < 0, ms: 220 });
          b.onda(b.x + b.face * 50, b.face, b.def.velOnda * b.vel(), alta);
          b.iOnda++;
          b.fase2 = 'tiro'; b.t2 = b.ms(440);
        }
      } else if (b.fase2 === 'tiro') {
        b.t2 -= dt;
        if (b.t2 <= 0) {
          if (b.iOnda < b.ondasFila.length) ATAQUES_CHEFE.energia.prepara(b);
          else { b.fase2 = 'fim'; b.t2 = b.ms(520); b.poe('parado'); }
        }
      } else {
        b.t2 -= dt;
        if (b.t2 <= 0) b.fimAtaque();
      }
    }
  },

  // SALTO (Samurai): pula no ponto marcado e cai com a katana, soltando
  // duas ondas rasteiras. Saia da marca e pule as ondas.
  salto: {
    inicia: function (b, r) {
      b.olha(r); b.fase2 = 'avisa'; b.t2 = b.ms(640);
      b.poe('avisa'); b.icone.setVisible(true); b.somAviso();
      b.alvoPisao = b.limX(r.corpo.x);
      b.marca(b.alvoPisao, 1.3);
    },
    passo: function (b, dt) {
      var i;
      if (b.fase2 === 'avisa') {
        b.t2 -= dt;
        if (b.t2 <= 0) {
          b.fase2 = 'voa'; b.icone.setVisible(false);
          b.iniciaVoo(b.alvoPisao, b.ms(760), b.def.alturaPulo); SOM.pulo(); SOM.katanaPrepara();
        }
      } else if (b.fase2 === 'voa') {
        var p = Math.min(1, b.tv / b.dur);
        for (i = 0; i < b.sombras.length; i++) b.sombras[i].setAlpha(0.4 + 0.55 * p);
        if (b.passoVoo(dt)) {
          b.limpaSombras();
          b.fase2 = 'caiu'; b.t2 = b.ms(560); b.poe(b.def.poseAterrissa || 'golpeV');
          SOM.katanaImpacto(); SOM.chefePisao(); b.tremeTela(260, 0.014);
          FX.impacto(b.cena, b.x, b.chao - 4, b.def.corAura, 1.2);
          b.golpe(b.x - 60, b.chao - 50, 120, 50, 120);
          b.onda(b.x - 30, -1, 300); b.onda(b.x + 30, 1, 300);
        }
      } else {
        b.t2 -= dt;
        if (b.t2 <= 0) b.fimAtaque();
      }
    }
  },

  // DESCARGA TOTAL (Samurai, fase 3): crava a katana no telhado, o reator
  // sobrecarrega, o circulo vermelho cresce no chao e explode. Fuja do
  // circulo e depois pule as duas ondas.
  furia: {
    inicia: function (b) {
      b.fase2 = 'carrega'; b.t2 = b.dur2 = b.ms(1400); b.poe('carrega'); b.icone.setVisible(true);
      SOM.energiaCarrega(b.t2 / 1000);
      b.fala(b.def.falas.furia);
      b.raioFuria = 170;
      b.anelFuria = b.cena.add.graphics().setDepth(5);
      b.extras.push(b.anelFuria);
      if (b.aura) b.aura.alvoForca = 1;
      legenda(b.cena, 'DESCARGA TOTAL: SAIA DO CÍRCULO', C.perigo);
    },
    passo: function (b, dt) {
      if (b.fase2 === 'carrega') {
        b.t2 -= dt;
        var p = 1 - Math.max(0, b.t2) / b.dur2, g = b.anelFuria;
        g.clear();
        g.fillStyle(0xd7192c, 0.15 + 0.25 * p); g.fillEllipse(b.x, b.chao, b.raioFuria * 2 * p, 24 * p);
        g.lineStyle(2, 0xff2438, 0.9); g.strokeEllipse(b.x, b.chao, b.raioFuria * 2, 24);
        if (!POUCO_MOV && Math.random() < 0.6) FX.solta(b.cena, 'brasa', 2, b.x + (Math.random() - 0.5) * b.raioFuria * 2 * p, b.chao - 4);
        if (b.t2 <= 0) {
          g.clear(); b.icone.setVisible(false);
          b.fase2 = 'explode'; b.t2 = b.ms(900); b.poe('golpeV');
          SOM.explosao(); FX.flash(b.cena, 120, 255, 70, 70);
          FX.anel(b.cena, b.x, b.chao - 40, 0xff2438, b.raioFuria + 30, 440, 1);
          FX.brilho(b.cena, b.x, b.chao - 40, 0xff2438, 2.6, 500);
          FX.solta(b.cena, 'faisca', 30, b.x, b.chao - 40); FX.solta(b.cena, 'fumaca', 12, b.x, b.chao - 20);
          b.tremeTela(380, 0.018);
          b.golpe(b.x - b.raioFuria, b.chao - 130, b.raioFuria * 2, 130, 170);
          b.onda(b.x - b.raioFuria, -1, 320); b.onda(b.x + b.raioFuria, 1, 320);
          if (b.aura) b.aura.alvoForca = (b.def.auraFase || {})[b.faseAtual()] || 0.7;
        }
      } else {
        b.t2 -= dt;
        if (b.t2 <= 0) b.fimAtaque();
      }
    }
  },

  // BICADA (Cócó): encolhe o pescoco e da um bote para a frente.
  // Fases mais altas emendam 2 ou 3 botes. Pule ou fique a distancia.
  bica: {
    inicia: function (b, r) {
      b.nBicadas = ({ 1: 1, 2: 2, 3: 2, 4: 3 })[b.faseAtual()] || 1;
      b.primeira = true;
      ATAQUES_CHEFE.bica.prepara(b, r);
    },
    prepara: function (b, r) {
      b.olha(r);
      b.fase2 = 'avisa'; b.t2 = b.ms(b.primeira ? 580 : 380); b.primeira = false;
      b.poe('avisa'); b.icone.setVisible(true); SOM.chefeAviso();
      b.alvoBica = b.limX(b.x + b.face * 190);
      b.marca((b.x + b.alvoBica) / 2 + b.face * 30, 2.4);
    },
    passo: function (b, dt, r) {
      if (b.fase2 === 'avisa') {
        b.t2 -= dt;
        if (b.t2 <= 0) {
          b.fase2 = 'bica'; b.poe('bica'); b.icone.setVisible(false); b.limpaSombras();
          SOM.bicada(); b.t2 = 240; b.xBica = b.x;
        }
      } else if (b.fase2 === 'bica') {
        b.t2 -= dt;
        var p = 1 - Math.max(0, b.t2) / 240;
        b.x = b.xBica + (b.alvoBica - b.xBica) * p;
        b.golpeFrente(56, 50, 40, 30);
        b.tRastro -= dt;
        if (b.tRastro <= 0) { b.tRastro = 50; FX.rastro(b.cena, b.spr, b.def.corAura, 200); }
        if (b.t2 <= 0) {
          FX.solta(b.cena, 'faisca', 6, b.x + b.face * 40, b.chao - 30);
          b.nBicadas--;
          if (b.nBicadas > 0) ATAQUES_CHEFE.bica.prepara(b, r);
          else { b.fase2 = 'fim'; b.t2 = b.ms(520); b.poe('parado'); }
        }
      } else {
        b.t2 -= dt;
        if (b.t2 <= 0) b.fimAtaque();
      }
    }
  },

  // GARRAS (Cócó): salta no ponto marcado e cai rasgando o chao com as
  // garras. Da fase 2 em diante, o impacto solta ondas rasteiras.
  garras: {
    inicia: function (b, r) {
      b.olha(r); b.fase2 = 'avisa'; b.t2 = b.ms(640);
      b.poe('avisa'); b.icone.setVisible(true); SOM.chefeAviso();
      b.alvoPisao = b.limX(r.corpo.x);
      b.marca(b.alvoPisao, 1.2);
    },
    passo: function (b, dt) {
      var i;
      if (b.fase2 === 'avisa') {
        b.t2 -= dt;
        if (b.t2 <= 0) {
          b.fase2 = 'voa'; b.icone.setVisible(false);
          b.iniciaVoo(b.alvoPisao, b.ms(700), b.def.alturaPulo); SOM.asas();
        }
      } else if (b.fase2 === 'voa') {
        var p = Math.min(1, b.tv / b.dur);
        for (i = 0; i < b.sombras.length; i++) b.sombras[i].setAlpha(0.4 + 0.55 * p);
        if (b.passoVoo(dt)) {
          b.limpaSombras();
          b.fase2 = 'caiu'; b.t2 = b.ms(560); b.poe('asas');
          SOM.bicada(); SOM.chefePisao(); b.tremeTela(220, 0.012);
          for (i = -1; i <= 1; i++) b.efeito('arco_v', b.x + i * 22, b.chao - 36, { escY: 0.55, ang: 24, ms: 300 });
          FX.solta(b.cena, 'pena', 8, b.x, b.chao - 30);
          b.golpe(b.x - 64, b.chao - 56, 128, 56, 130);
          if (b.faseAtual() >= 2) { b.onda(b.x - 40, -1, 290); b.onda(b.x + 40, 1, 290); }
        }
      } else {
        b.t2 -= dt;
        if (b.t2 <= 0) b.fimAtaque();
      }
    }
  },

  // RAJADA DE ASAS (Cócó, area): abre as asas-turbina e sopra - o vento
  // EMPURRA o jogador para longe (sem derrubar) enquanto penas de aco cruzam a arena
  // em alturas alternadas: baixa = pule, alta = fique no chao.
  rajada: {
    inicia: function (b, r) {
      b.olha(r); b.fase2 = 'avisa'; b.t2 = b.ms(820);
      b.poe('asas'); b.icone.setVisible(true); SOM.asas();
      var f = b.faseAtual();
      b.penasFila = f >= 3 ? ['B', 'A', 'B'] : (f >= 2 ? ['B', 'A'] : ['B']);
      b.iPena = 0;
      legenda(b.cena, 'RAJADA DE ASAS: O VENTO EMPURRA', C.perigo2);
    },
    passo: function (b, dt, r) {
      if (b.fase2 === 'avisa') {
        b.t2 -= dt;
        if (!POUCO_MOV && Math.random() < 0.3) FX.solta(b.cena, 'pena', 1, b.x + (Math.random() - 0.5) * 80, b.chao - 40 - Math.random() * 40);
        if (b.t2 <= 0) {
          b.fase2 = 'sopra'; b.t2 = b.ms(1150); b.tPena = 0; b.icone.setVisible(false);
          SOM.asas(); FX.anel(b.cena, b.x + b.face * 30, b.chao - 40, 0xffffff, 90, 400, 0.7);
        }
      } else if (b.fase2 === 'sopra') {
        b.t2 -= dt;
        if (!r.morto) r.vento = b.face * 560;       // forca de fora, aplicada pela fase
        b.tPena -= dt;
        if (b.tPena <= 0 && b.iPena < b.penasFila.length) {
          b.tPena = b.ms(400);
          var alta = b.penasFila[b.iPena++] === 'A';
          b.pena(b.x + b.face * 40, alta ? b.chao - 66 : b.chao - 12, b.face * 330 * b.vel());
          SOM.bicada();
        }
        if (!POUCO_MOV && Math.random() < 0.5) FX.solta(b.cena, 'pena', 1, b.x + b.face * 50, b.chao - 30 - Math.random() * 50);
        if (b.t2 <= 0) { b.fase2 = 'fim'; b.t2 = b.ms(520); b.poe('parado'); }
      } else {
        b.t2 -= dt;
        if (b.t2 <= 0) b.fimAtaque();
      }
    }
  },

  // OVOS-BOMBA (Cócó): abre o bico, carrega e dispara ovos de metal na
  // direcao de onde o jogador ESTAVA (nao perseguem: e so sair do lugar).
  // No curto-circuito vira um anel de ovos com uma brecha.
  projetil: {
    inicia: function (b, r) {
      b.olha(r); b.fase2 = 'avisa'; b.t2 = b.ms(720);
      b.poe('grito'); b.icone.setVisible(true); SOM.orbe(); SOM.cocoRobo();
      var f = b.faseAtual();
      b.nOrbes = f === 1 ? 2 : (f === 2 ? 3 : 4);
      b.anelOrbes = f >= 4;
      b.mira = { x: r.corpo.x, y: r.corpo.y };
    },
    passo: function (b, dt, r) {
      var k;
      if (b.fase2 === 'avisa') {
        b.t2 -= dt;
        b.mira = { x: r.corpo.x, y: r.corpo.y };
        if (!POUCO_MOV && Math.random() < 0.5) FX.solta(b.cena, 'brasa', 1, b.x + b.face * 34, b.chao - 60);
        if (b.t2 <= 0) {
          var bx = b.x + b.face * 34, by = b.chao - 58, vel = 230 * b.vel();
          b.icone.setVisible(false);
          if (b.anelOrbes) {
            var brecha = Math.floor(Math.random() * 10);
            for (k = 0; k < 10; k++) {
              if (k === brecha || k === (brecha + 1) % 10) continue;
              var a = k * PI * 2 / 10;
              b.ovoBomba(bx, by, Math.cos(a) * vel * 0.75, Math.sin(a) * vel * 0.75);
            }
          } else {
            var base = Math.atan2(b.mira.y - by, b.mira.x - bx);
            for (k = 0; k < b.nOrbes; k++) {
              var ang = base + (k - (b.nOrbes - 1) / 2) * 0.24;
              b.ovoBomba(bx, by, Math.cos(ang) * vel, Math.sin(ang) * vel);
            }
          }
          SOM.energiaDispara();
          FX.brilho(b.cena, bx, by, 0xff1f35, 0.7, 260);
          b.fase2 = 'tiro'; b.t2 = b.ms(900);
        }
      } else if (b.fase2 === 'tiro') {
        b.t2 -= dt;
        if (b.t2 <= 0) { b.fase2 = 'fim'; b.t2 = b.ms(380); b.poe('parado'); }
      } else {
        b.t2 -= dt;
        if (b.t2 <= 0) b.fimAtaque();
      }
    }
  },

  // BOMBARDEIO (Cócó, fase 3+): liga os propulsores, sobe para o alto da
  // arena, marca o chao e mergulha: explosao no centro, ondas para os lados
  // e penas de aco caindo nas sombras. Fique longe do centro e das sombras.
  furiaFinal: {
    inicia: function (b) {
      b.fase2 = 'sobe'; b.xIni = b.x; b.yIni = b.y; b.t2 = b.dur2 = b.ms(650);
      b.alvoFX = (b.ax0 + b.ax1) / 2;
      b.poe('pulo'); SOM.asas(); b.icone.setVisible(false);
      b.fala(b.def.falas.furia);
      legenda(b.cena, 'BOMBARDEIO: FUJA DO CENTRO E DAS SOMBRAS', C.perigo);
    },
    passo: function (b, dt, r) {
      var i;
      if (b.fase2 === 'sobe') {
        b.t2 -= dt;
        var p = 1 - Math.max(0, b.t2) / b.dur2;
        b.x = b.xIni + (b.alvoFX - b.xIni) * p;
        b.y = b.yIni + ((b.chao - 210) - b.yIni) * Math.sin(p * PI / 2);
        if (b.t2 <= 0) {
          b.fase2 = 'carrega'; b.t2 = b.dur2 = b.ms(1150);
          b.poe('grito'); b.icone.setVisible(true);
          SOM.energiaCarrega(1.1); SOM.cocoRobo();
          b.marcaTelhas(r);
          for (i = 0; i < b.sombras.length; i++) b.sombras[i].setTint(0xff6a6a);
          b.marca(b.alvoFX, 2.6);
          if (b.aura) b.aura.alvoForca = 1;
        }
      } else if (b.fase2 === 'carrega') {
        b.t2 -= dt;
        var q = 1 - Math.max(0, b.t2) / b.dur2;
        b.y = b.chao - 210 + Math.sin(q * PI * 6) * 4;
        if (!POUCO_MOV && Math.random() < 0.7) FX.solta(b.cena, 'jato', 1, b.x - b.face * 10, b.y + 2);
        for (i = 0; i < b.sombras.length; i++) b.sombras[i].setAlpha(0.35 + 0.55 * q);
        if (!POUCO_MOV && Math.random() < 0.6) FX.solta(b.cena, 'brasa', 2, b.x + (Math.random() - 0.5) * 60, b.y - 30);
        if (b.t2 <= 0) {
          b.fase2 = 'mergulho'; b.t2 = 260; b.icone.setVisible(false);
          b.poe('corre'); SOM.energiaDispara();
          b.soltaTelhas();
        }
      } else if (b.fase2 === 'mergulho') {
        b.t2 -= dt;
        var m = 1 - Math.max(0, b.t2) / 260;
        b.y = (b.chao - 210) + 210 * m * m;
        if (b.t2 <= 0) {
          b.y = b.chao;
          var sombrasPenas = b.sombras.slice(0, b.pontosTelha.length);
          b.sombras[b.sombras.length - 1].destroy(); b.sombras = sombrasPenas;
          SOM.explosao(); FX.flash(b.cena, 140, 255, 60, 80);
          FX.anel(b.cena, b.x, b.chao - 30, 0xff1f35, 170, 440, 0.8);
          FX.brilho(b.cena, b.x, b.chao - 30, 0xff1f35, 2.4, 500);
          FX.solta(b.cena, 'faisca', 26, b.x, b.chao - 30); FX.solta(b.cena, 'pena', 14, b.x, b.chao - 40);
          b.tremeTela(400, 0.018);
          b.golpe(b.x - 140, b.chao - 90, 280, 90, 160);
          b.onda(b.x - 140, -1, 320); b.onda(b.x + 140, 1, 320);
          b.poe('asas');
          b.fase2 = 'fim'; b.t2 = b.ms(900);
          if (b.aura) b.aura.alvoForca = (b.def.auraFase || {})[b.faseAtual()] || 0.7;
        }
      } else {
        b.t2 -= dt;
        if (!b.telhas.length) b.limpaSombras();
        if (b.t2 <= 0 && !b.telhas.length) b.fimAtaque();
      }
    }
  }
};

// ---- O chefe em si --------------------------------------------------------
function Boss(cena, def, x, chaoY, opcoes) {
  var i;
  this.cena = cena; this.def = def;
  this.chao = chaoY;
  this.x = x; this.y = chaoY;
  // limites da arena (paredes). Numa fase de chefe a arena e o mapa todo; na
  // Ventania ela e so o trecho final do telhado (cena.arena diz qual)
  this.ax0 = cena.arena ? cena.arena.x0 : 0;
  this.ax1 = cena.arena ? cena.arena.x1 : cena.LW;
  this.esq = this.ax0 + def.larg / 2 + 2;
  this.dir = this.ax1 - def.larg / 2 - 2;
  this.folegoMax = def.folego;
  this.projs = []; this.golpes = []; this.extras = [];   // ataques dos chefes novos
  this.tRastro = 0;
  this.face = -1;                              // -1 = olhando para a esquerda
  this.folego = def.folego;
  this.pose = 'parado'; this.estado = 'entrada';
  this.fila = []; this.iAtaque = 0; this.nomeAtaque = null; this.fase2 = '';
  this.t = 0; this.t2 = 0; this.tv = 0; this.dur = 1; this.altura = 0;
  this.x0 = x; this.alvo = x; this.alvoPisao = x;
  this.ondas = []; this.telhas = []; this.sombras = []; this.pontosTelha = [];
  this.perigoso = true; this.calmo = 0; this.acabou = false;
  this.baqueUsado = false;                   // pisao do Tobias: 1 por rodada
  this.giro = 0; this.tPasso = 0;
  this.peAnterior = chaoY; this.topoAnterior = chaoY - def.alt.parado;

  this.spr = cena.add.sprite(x, chaoY + 4, def.pre + 'parado0').setOrigin(0.5, 1).setDepth(7);
  if (def.escala) this.spr.setScale(def.escala);
  this.spr.play(def.pre + 'parado');
  this.icone = cena.add.image(x, chaoY - 120, 'aviso').setDepth(13).setVisible(false);
  this.sombraPulo = cena.add.image(x, chaoY + 2, 'sombra_boss').setOrigin(0.5, 1).setDepth(5).setVisible(false);
  this.estrelas = [];
  for (i = 0; i < 3; i++) {
    this.estrelas.push(cena.add.image(x, chaoY, 'estrela').setDepth(13).setVisible(false));
  }
  // campo de energia (Samurai Robo e Galinha Robo)
  this.aura = def.aura ? new Aura(cena, def.corAura, 7) : null;
  if (this.aura) this.aura.alvoForca = this.aura.forca = (def.auraFase || {})[1] || 0.5;
  this.criaHud();
  if (def.intro || (opcoes && opcoes.intro)) {
    // chefe com apresentacao: fica quieto ate a cutscene mandar comecar
    this.mudaEstado('cena', 0);
    this.hudVisivel(false);
  } else {
    this.mudaEstado('entrada', 1700);
    this.fala(def.falas.entrada);
    SOM.chefeGrito();
  }
}

// parametro que muda conforme o folego que resta (numero simples tambem vale)
Boss.prototype.par = function (nome) {
  var v = this.def[nome];
  if (v && typeof v === 'object') return v[this.folego] !== undefined ? v[this.folego] : v[1];
  return v;
};
Boss.prototype.caixa = function () {
  var h = this.def.alt[this.pose] || this.def.alt.parado;
  return { esq: this.x - this.def.larg / 2, dir: this.x + this.def.larg / 2,
           topo: this.y - h, baixo: this.y };
};
Boss.prototype.mudaEstado = function (nome, ms) { this.estado = nome; this.t = ms || 0; };
Boss.prototype.poe = function (pose) {
  if (this.pose === pose) return;
  this.pose = pose;
  this.spr.play(this.def.pre + pose, true);
};
Boss.prototype.fala = function (s) {
  if (!s) return;
  balao(this.cena, this.x, this.caixa().topo - 30, s, this.def.corFala || C.perigo2);
};
// aviso escrito do que o chefe vai fazer (acessibilidade)
Boss.prototype.avisa = function (s, cor) { legenda(this.cena, s, cor); };
Boss.prototype.tremeTela = function (ms, f) { if (!POUCO_MOV) this.cena.cameras.main.shake(ms, f); };
Boss.prototype.poeira = function (n) { if (!POUCO_MOV) this.cena.pPoeira.explode(n, this.x, this.chao - 2); };
Boss.prototype.rastro = function (dt) {                 // poeirinha enquanto corre
  this.tPasso -= dt;
  if (this.tPasso > 0) return;
  this.tPasso = 110;
  this.poeira(3);
};

// ---- HUD: o folego do chefe, em chapeuzinhos ----
Boss.prototype.criaHud = function () {
  if (this.def.hud === 'barra') { this.criaBarra(); return; }
  var cena = this.cena, i, n = this.def.folego;
  this.hudRot = txt(cena, LARG / 2, 20, this.def.rotulo, 9, C.cinza).setScrollFactor(0).setDepth(100);
  this.pips = [];
  for (i = 0; i < n; i++) {
    this.pips.push(cena.add.image(LARG / 2 + (i - (n - 1) / 2) * 34, 44, 'pip_cheio')
      .setScrollFactor(0).setDepth(100).setScale(1.4));
  }
};
Boss.prototype.pintaHud = function () {
  if (this.barra) return;                        // a barra se pinta sozinha a cada quadro
  for (var i = 0; i < this.pips.length; i++) {
    this.pips[i].setTexture(i < this.folego ? 'pip_cheio' : 'pip_vazio');
  }
};

// ---- voo (usado pelo pisao e pela fuga para o outro lado da arena) ----
Boss.prototype.iniciaVoo = function (alvo, dur, altura) {
  this.x0 = this.x; this.alvo = limita(alvo, this.esq, this.dir);
  this.tv = 0; this.dur = dur; this.altura = altura;
  this.poe('pulo');
};
Boss.prototype.passoVoo = function (dt) {
  this.tv += dt;
  var p = Math.min(1, this.tv / this.dur);
  this.x = this.x0 + (this.alvo - this.x0) * p;
  this.y = this.chao - 4 * this.altura * p * (1 - p);      // parabola simples
  if (p >= 1) { this.y = this.chao; return true; }
  return false;
};

// ---- rodadas e ataques ----
Boss.prototype.comecaRodada = function (ms) {
  var lista = this.def.rodadas[this.folego] || this.def.rodadas[1];
  this.fila = lista.slice();
  this.iAtaque = 0;
  this.baqueUsado = false;                 // o pisao volta a valer nesta rodada
  this.perigoso = true;
  this.calmo = 450;                        // meio segundo sem pegar ninguem
  this.poe('parado');
  this.mudaEstado('espera', ms || 700);
  if (this.aura) this.aura.alvoForca = (this.def.auraFase || {})[this.faseAtual()] || 0.6;
};
Boss.prototype.proximoAtaque = function () {
  if (this.iAtaque >= this.fila.length) { this.ficaTonto(); return; }
  var nome = this.fila[this.iAtaque++];
  if (!ATAQUES_CHEFE[nome]) { this.ficaTonto(); return; }   // nome errado nao trava a luta
  this.nomeAtaque = nome;
  this.perigoso = true;
  this.avisa('ATAQUE: ' + nome.toUpperCase(), C.perigo2);
  this.mudaEstado('ataque', 0);
  ATAQUES_CHEFE[nome].inicia(this, this.cena.r);
};
Boss.prototype.fimAtaque = function () {
  this.icone.setVisible(false);
  this.nomeAtaque = null;
  this.fase2 = '';
  if (this.iAtaque >= this.fila.length) this.ficaTonto();
  else { this.poe('parado'); this.mudaEstado('espera', 650); }
};
Boss.prototype.ficaTonto = function () {
  this.avisa('CHEFE TONTO: ATAQUE AGORA!', C.p2luz);
  this.perigoso = false;
  this.nomeAtaque = null; this.fase2 = '';
  this.icone.setVisible(false);
  this.poe('tonto');
  this.mudaEstado('tonto', this.par('tonto'));
  this.fala(this.def.falas.tonto);
  // o guarda ve estrelinhas; os robos superaquecem: o reator quase apaga e
  // sai vapor (e a deixa visual de "agora da para acertar")
  if (this.aura) {
    this.aura.alvoForca = 0.12;
    SOM.desliga();
    legenda(this.cena, 'SUPERAQUECEU: PULE NA CABEÇA!', C.p2luz);
  }
  else for (var i = 0; i < this.estrelas.length; i++) this.estrelas[i].setVisible(true);
};
Boss.prototype.escondeEstrelas = function () {
  for (var i = 0; i < this.estrelas.length; i++) this.estrelas[i].setVisible(false);
};
Boss.prototype.giraEstrelas = function (dt) {
  this.giro += dt * 0.005;
  var c = this.caixa(), i, a;
  for (i = 0; i < this.estrelas.length; i++) {
    a = this.giro + i * 2.09;
    this.estrelas[i].setPosition(this.x + Math.cos(a) * 26, c.topo - 4 + Math.sin(a) * 7);
    this.estrelas[i].setScale(0.8 + 0.3 * Math.sin(a));
  }
};

// ---- objetos dos ataques ----
Boss.prototype.criaOndas = function () {
  var i, d, s, px;
  for (i = 0; i < 2; i++) {
    d = i ? 1 : -1;
    px = this.x + d * 24;
    s = this.cena.add.sprite(px, this.chao + 2, 'onda0').setOrigin(0.5, 1).setDepth(6);
    s.play('onda_anda');
    s.flipX = d < 0;
    this.ondas.push({ x: px, dir: d, spr: s });
  }
};
Boss.prototype.marcaTelhas = function (r) {
  var n = this.def.telhas, pts = [], i, j, x, ok;
  var min = this.esq + 30, max = this.dir - 110;      // longe do poleiro da Cócó
  pts.push(limita(r.corpo.x, min, max));
  for (i = 0; i < 60 && pts.length < n; i++) {
    x = min + Math.random() * (max - min);
    ok = Math.abs(x - this.x) > 80;                   // nao cai em cima dele
    for (j = 0; j < pts.length && ok; j++) if (Math.abs(x - pts[j]) < 86) ok = false;
    if (ok) pts.push(x);
  }
  this.pontosTelha = pts;
  this.limpaSombras();
  for (i = 0; i < pts.length; i++) {
    this.sombras.push(this.cena.add.image(pts[i], this.chao + 2, 'sombra_boss')
      .setOrigin(0.5, 1).setDepth(5).setAlpha(0.35).setScale(0.4));
  }
};
Boss.prototype.soltaTelhas = function () {
  var i, p = this.pontosTelha || [];
  for (i = 0; i < p.length; i++) {
    var tt = this.cena.add.image(p[i], -40, this.def.texTelha || 'telha_solta').setDepth(11);
    if (this.def.texTelha) tt.setAngle(90);       // a pena-lamina cai de ponta
    this.telhas.push({ x: p[i], y: -40, v: 300, spr: tt });
  }
  if (this.def.texTelha) SOM.asas(); else SOM.racha();
};

Boss.prototype.limpaSombras = function () {
  for (var i = 0; i < this.sombras.length; i++) this.sombras[i].destroy();
  this.sombras = [];
};
Boss.prototype.limpaAtaque = function () {
  var i;
  for (i = 0; i < this.ondas.length; i++) this.ondas[i].spr.destroy();
  for (i = 0; i < this.telhas.length; i++) this.telhas[i].spr.destroy();
  for (i = 0; i < this.projs.length; i++) this.projs[i].spr.destroy();
  for (i = 0; i < this.extras.length; i++) if (this.extras[i] && this.extras[i].destroy) this.extras[i].destroy();
  this.ondas = []; this.telhas = []; this.projs = []; this.golpes = []; this.extras = [];
  this.limpaSombras();
  this.sombraPulo.setVisible(false);
  this.icone.setVisible(false);
  this.nomeAtaque = null; this.fase2 = '';
};

// ---- o quadro a quadro ----
Boss.prototype.atualiza = function (dt, r) {
  var e = this.estado;
  // o dash NAO atravessa mais o chefe nem os ataques: quem quiser passar
  // ileso levanta o ESCUDO do Tobias, o resto leva o tombo
  if (this.calmo > 0) this.calmo -= dt;
  this.t -= dt;

  if (e === 'cena') {
    // cutscene no comando: o chefe nao ataca nem e atacado
  } else if (e === 'entrada') {
    if (this.t <= 0) this.comecaRodada(600);
  } else if (e === 'espera') {
    if (this.t <= 0) this.proximoAtaque();
  } else if (e === 'ataque') {
    if (ATAQUES_CHEFE[this.nomeAtaque]) ATAQUES_CHEFE[this.nomeAtaque].passo(this, dt, r);
    else this.fimAtaque();
  } else if (e === 'tonto') {
    this.giraEstrelas(dt);
    if (this.def.robo && !POUCO_MOV && Math.random() < 0.12) FX.solta(this.cena, 'vapor', 1, this.x + (Math.random() - 0.5) * 30, this.caixa().topo + 10);
    if (this.t <= 0) { this.escondeEstrelas(); this.fala(this.def.falas.volta); this.comecaRodada(800); }
  } else if (e === 'atingido') {
    if (this.t <= 0) this.recua(r.corpo.x);
  } else if (e === 'recua') {
    if (this.passoVoo(dt)) { this.poe('parado'); this.poeira(8); this.comecaRodada(700); }
  } else if (e === 'rendido') {
    if (this.t <= 0 && !this.acabou) { this.acabou = true; this.cena.termina(); }
  }
  // 'comemora': fica parado esperando o jogador voltar

  this.spr.x = Math.round(this.x);
  this.spr.y = Math.round(this.y) + 4;
  this.spr.flipX = this.face < 0;
  this.spr.anims.timeScale = this.vel();         // fases mais rapidas animam mais rapido
  this.icone.setPosition(this.x, this.caixa().topo - 22);
  // telegrafe: enquanto o "!" esta no ar ele tambem pisca (com POUCO_MOV fica
  // um tom fixo, sem piscada)
  if (this.icone.visible) {
    this.spr.setTint(POUCO_MOV || (Math.floor(this.t2 / 120) % 2) ? (this.def.corAviso || 0xffcd75) : 0xffffff);
    this.tintado = true;
  } else if (this.tintado) {
    this.spr.clearTint();
    this.tintado = false;
  }
  if (this.aura) {
    this.aura.atualiza(dt, this.x, this.y, this.def.alt[this.pose] || this.def.alt.parado, this.def.larg);
  }
  this.pintaBarra(dt);

  this.atualizaObjetos(dt, r);
  if (e !== 'cena') this.checaJogador(r);
  this.peAnterior = r.corpo.body.bottom;
  this.topoAnterior = this.caixa().topo;
};

// ondas de choque e telhas caindo (continuam andando mesmo se o chefe mudar
// de estado, entao nunca ficam presas na tela)
Boss.prototype.atualizaObjetos = function (dt, r) {
  var cena = this.cena, i, o, t, pego = false;
  for (i = this.ondas.length - 1; i >= 0; i--) {
    o = this.ondas[i];
    o.x += o.dir * this.def.velOnda * dt / 1000;
    o.spr.x = Math.round(o.x);
    if (o.x < this.ax0 - 30 || o.x > this.ax1 + 30) { o.spr.destroy(); this.ondas.splice(i, 1); continue; }
    if (this.pegaEm(r, o.x - 11, this.chao - 22, 22, 22)) pego = true;
  }
  for (i = this.telhas.length - 1; i >= 0; i--) {
    t = this.telhas[i];
    t.v += 1500 * dt / 1000;
    t.y += t.v * dt / 1000;
    t.spr.y = Math.round(t.y);
    if (this.pegaEm(r, t.x - 11, t.y - 8, 22, 16)) pego = true;
    if (t.y >= this.chao - 6) {                       // espatifou no telhado
      if (!POUCO_MOV) cena.pPoeira.explode(6, t.x, this.chao - 6);
      SOM.telhaCai();
      t.spr.destroy();
      this.telhas.splice(i, 1);
    }
  }
  // golpes de espada/garra: um retangulo que fica "quente" por alguns ms
  for (i = this.golpes.length - 1; i >= 0; i--) {
    var gp = this.golpes[i];
    gp.t -= dt;
    if (this.pegaEm(r, gp.x, gp.y, gp.w, gp.h)) pego = true;
    if (gp.t <= 0) this.golpes.splice(i, 1);
  }
  // projeteis: ondas de plasma, ovos-bomba e penas de aco
  for (i = this.projs.length - 1; i >= 0; i--) {
    var pj = this.projs[i];
    pj.x += pj.vx * dt / 1000; pj.y += pj.vy * dt / 1000; pj.vida -= dt;
    pj.spr.setPosition(Math.round(pj.x), Math.round(pj.y + (pj.oy || 0)));
    if (pj.rastro && !POUCO_MOV && Math.random() < 0.45) FX.solta(cena, 'brasa', 1, pj.x, pj.y);
    var bateu = pj.chao && pj.y >= this.chao - 6;
    if (bateu || pj.vida <= 0 || pj.x < this.ax0 - 60 || pj.x > this.ax1 + 60 || pj.y < -220) {
      if (bateu) FX.solta(cena, 'faisca', 5, pj.x, this.chao - 4);
      pj.spr.destroy(); this.projs.splice(i, 1); continue;
    }
    if (this.pegaEm(r, pj.x - pj.w / 2, pj.y - pj.h / 2, pj.w, pj.h)) pego = true;
  }
  if (pego) this.pega(r);
};
// o retangulo do ataque encostou no jogador? (so o escudo e a invencibilidade
// salvam: o dash nao)
Boss.prototype.pegaEm = function (r, x, y, w, h) {
  if (r.morto || this.cena.terminou || r.invenc > 0) return false;
  if (r.escudando) {
    var bb = r.corpo.body;
    if (bb.right > x && bb.left < x + w && bb.bottom > y && bb.top < y + h) escudoAparou(this.cena, r);
    return false;
  }
  var b = r.corpo.body;
  return b.right > x && b.left < x + w && b.bottom > y && b.top < y + h;
};

// contato com o corpo do chefe: pisou na cabeca? levou um tombo?
Boss.prototype.checaJogador = function (r) {
  if (r.morto || this.cena.terminou || this.estado === 'rendido') return;
  var rb = r.corpo.body, c = this.caixa();
  var toca = rb.right > c.esq + 6 && rb.left < c.dir - 6 && rb.bottom > c.topo && rb.top < c.baixo;
  if (!toca) return;
  // "pisou na cabeca" = no quadro anterior o pe ainda estava acima do topo
  // dele (funciona mesmo caindo rapido, sem depender de uma faixa de pixels)
  var pisou = this.peAnterior <= this.topoAnterior + 10 && rb.velocity.y > -60;
  if (this.estado === 'tonto' && (pisou || r.dashando)) { this.acerta(r, pisou); return; }
  if (pisou) { this.quica(r); return; }               // quique de cortesia, sem acerto
  if (this.perigoso && this.calmo <= 0 && r.invenc <= 0) this.pega(r);
};

// impulso de saida de cima do chefe: so marca o pedido; quem aplica e o
// update da fase, DEPOIS da fisica do jogador (igual ao trampolim)
Boss.prototype.quica = function (r) {
  var lado = (r.corpo.x < this.x) ? -1 : 1;
  r.dashT = 0; r.dashando = false;
  r.corpo.body.setAllowGravity(true);
  r.quique = { vy: ELEM.QUIQUE, vx: lado * ELEM.QUIQUE_X };
  SOM.bater();
  if (!POUCO_MOV) this.cena.pPoeira.explode(5, r.corpo.x, this.caixa().topo);
};

Boss.prototype.pega = function (r) {
  if (r.morto || this.cena.terminou) return;
  if (r.escudando) {                   // de escudo, ele so empurra
    escudoAparou(this.cena, r);
    r.corpo.setVelocity((r.corpo.x < this.x ? -1 : 1) * 320, -260);
    return;
  }
  this.cena.mata('chefe');             // tombo comico de sempre (mata/renasce)
};

Boss.prototype.acerta = function (r, pisou) {
  var cena = this.cena, f = this.def.falas.acerto, faseAntes = this.faseAtual();
  this.folego--;
  // cada folego tirado vale pontos (PONT.CHEFE, ja contado no alvo de ouro)
  if (cena.placar) cena.placar.marca(PONT.CHEFE, this.x, this.caixa().topo - 10, null, C.perigo2, false);
  if (this.aura) {
    FX.hitstop(cena, 90);
    FX.impacto(cena, this.x, this.caixa().topo + 10, 0xffffff, 1.2);
  }
  this.pintaHud();
  this.escondeEstrelas();
  this.limpaAtaque();
  SOM.chefeAcerto();
  if (!POUCO_MOV) {
    cena.pMoeda.explode(14, this.x, this.caixa().topo + 6);
    cena.cameras.main.shake(180, 0.008);
  }
  if (this.pips[this.folego]) {
    cena.tweens.add({ targets: this.pips[this.folego], scale: 2.1, duration: 120, yoyo: true });
  }
  if (pisou) this.quica(r);
  this.fala(f[(Math.random() * f.length) | 0]);
  if (this.folego <= 0) { this.rende(); return; }
  this.perigoso = false;
  this.poe('atingido');
  // virou de fase (chefes novos): a cena conduz a mudanca e depois chama retoma()
  if (this.def.fasesFolego && this.faseAtual() !== faseAntes && cena.mudaFaseBoss) {
    this.mudaEstado('cena', 0);
    cena.mudaFaseBoss(this, this.faseAtual());
    return;
  }
  this.mudaEstado('atingido', 950);
};

Boss.prototype.rende = function () {
  this.perigoso = false;
  this.limpaAtaque();
  this.escondeEstrelas();
  // chefes com cutscene de derrota: a cena assume (e chama termina() no fim)
  if (this.def.derrota && this.cena[this.def.derrota]) {
    this.mudaEstado('cena', 0);
    this.cena[this.def.derrota](this);
    return;
  }
  this.poe('rendido');
  this.mudaEstado('rendido', 2000);
  this.fala(this.def.falas.rende);
  SOM.chefeRende();
  this.hudRot.setText('CAMINHO LIVRE!');
  this.hudRot.setColor(C.p1luz);
};

// pula para o lado oposto ao do jogador: assim ele nunca fica em cima de quem
// acabou de renascer, nem prende o jogador contra a parede
Boss.prototype.recua = function (refX) {
  var alvo = (refX < (this.ax0 + this.ax1) / 2) ? this.dir - 20 : this.esq + 20;
  this.face = (alvo < this.x) ? -1 : 1;
  this.perigoso = false;
  this.limpaAtaque();
  this.iniciaVoo(alvo, 700, 110);
  this.mudaEstado('recua', 0);
  SOM.pulo();
};

// PISAO do Tobias perto do chefe: corta o ataque e deixa ele tonto mais cedo.
// Vale UMA vez por rodada (a bandeira volta quando ele recomeca), entao e uma
// abertura de verdade, nao um jeito de anular a luta.
Boss.prototype.levaBaque = function (x, alcance) {
  if (this.estado === 'rendido' || this.estado === 'tonto' || this.estado === 'atingido') return false;
  if (this.baqueUsado) return false;
  if (Math.abs(x - this.x) > alcance) return false;
  this.baqueUsado = true;
  this.limpaAtaque();
  this.tremeTela(240, 0.012);
  this.poeira(12);
  this.fala('EI! O TELHADO!');
  this.ficaTonto();
  return true;
};

// ---- ganchos chamados pela fase ----
Boss.prototype.jogadorCaiu = function () {          // o tratador levou um tombo
  if (this.estado === 'rendido') return;
  this.limpaAtaque();
  this.escondeEstrelas();
  this.perigoso = false;
  this.poe('parado');
  this.mudaEstado('comemora', 999999);
  this.fala(this.def.falas.pegou);
};
Boss.prototype.jogadorVoltou = function (ponto) {   // ...e voltou do checkpoint
  if (this.estado === 'rendido' || this.estado === 'cena') return;
  if (Math.abs(this.x - ponto.x) < 300) this.recua(ponto.x);
  else this.comecaRodada(900);
};

// ---- FASES DA LUTA (chefes novos) -------------------------------------------
// "fasesFolego" diz em que fase o chefe esta para cada folego que resta; a
// fase muda a velocidade (velFase), a aura, a musica e a lista de ataques
// (as rodadas continuam por folego, como no guardao: a luta e decoravel).
Boss.prototype.faseAtual = function () {
  var m = this.def.fasesFolego;
  return m ? (m[this.folego] || 1) : 1;
};
Boss.prototype.vel = function () {
  var v = this.def.velFase;
  return v ? (v[this.faseAtual()] || 1) : 1;
};
// telegrafe e recuperacao encurtam com a velocidade da fase
Boss.prototype.ms = function (base) { return Math.round(base / this.vel()); };
Boss.prototype.olha = function (r) { this.face = (r.corpo.x < this.x) ? -1 : 1; };
Boss.prototype.limX = function (x) { return limita(x, this.esq, this.dir); };
Boss.prototype.somAviso = function () {
  if (this.def.somAviso && SOM[this.def.somAviso]) SOM[this.def.somAviso](); else SOM.chefeAviso();
};
// salta para longe da parede antes de um close de camera (colado na parede o
// zoom o deixaria cortado na borda da tela). Devolve false se ja esta bem.
Boss.prototype.vaiProCentro = function (ms, pose) {
  var b = this, alvo = limita(this.x, this.ax0 + 240, this.ax1 - 240), x0 = this.x, o = { p: 0 };
  if (Math.abs(alvo - this.x) < 8) return false;
  this.face = alvo < this.x ? -1 : 1;
  this.poe(pose || 'pulo');
  this.cena.tweens.add({ targets: o, p: 1, duration: ms || 450, ease: 'Sine.easeInOut',
    onUpdate: function () { b.x = x0 + (alvo - x0) * o.p; b.y = b.chao - Math.sin(o.p * PI) * 70; },
    onComplete: function () { b.y = b.chao; } });
  return true;
};
// cutscene acabou: comeca a luta / volta para a luta
Boss.prototype.comecaLuta = function () {
  this.spr.setVisible(true).setAlpha(1).clearTint();
  this.hudVisivel(true);
  this.mudaEstado('entrada', 500);
};
Boss.prototype.retoma = function () {
  this.hudVisivel(true);
  this.recua(this.cena.r.corpo.x);
};
// anda ate ficar a "alcance" px do jogador (devolve true quando chegou ou
// quando bateu na parede). Andar tambem e perigoso: encostar derruba.
Boss.prototype.chega = function (dt, r, alcance) {
  var d = r.corpo.x - this.x;
  if (Math.abs(d) <= alcance) return true;
  this.face = d < 0 ? -1 : 1;
  var nx = this.limX(this.x + this.face * (this.def.velAnda || 150) * this.vel() * dt / 1000);
  var parou = (nx === this.x);
  this.x = nx;
  return parou;
};
// area de golpe que fica ativa por "ms" (x, y = canto de cima a esquerda)
Boss.prototype.golpe = function (x, y, w, h, ms) {
  this.golpes.push({ x: x, y: y, w: w, h: h, t: ms || 110 });
};
// golpe na frente do chefe: do centro dele ate "ate" px, de "topo" px acima do
// chao com altura "alt". Golpe baixo = pule; golpe alto = fique no chao.
Boss.prototype.golpeFrente = function (ate, topo, alt, ms) {
  this.golpe(this.face > 0 ? this.x : this.x - ate, this.chao - topo, ate, alt, ms);
};
// efeito visual que some sozinho (meia-lua do corte, garras...)
Boss.prototype.efeito = function (chave, x, y, o) {
  o = o || {};
  var im = this.cena.add.image(x, y, chave).setDepth(o.prof || 12).setBlendMode('ADD');
  im.setFlipX(!!o.flip).setScale(o.escX || 1, o.escY || 1);
  if (o.ang) im.setAngle(o.ang);
  if (o.cor) im.setTint(o.cor);
  this.cena.tweens.add({ targets: im, alpha: 0, scaleX: im.scaleX * 1.18, duration: o.ms || 260, ease: 'Quad.easeOut',
                         onComplete: function () { im.destroy(); } });
  return im;
};
// marca de aviso no chao (some junto com as sombras)
Boss.prototype.marca = function (x, esc) {
  var m = this.cena.add.image(x, this.chao + 2, 'marca').setOrigin(0.5, 1).setDepth(5).setScale(esc || 1, 1).setAlpha(0.45);
  this.sombras.push(m);
  return m;
};
// onda de energia que corre rente ao telhado (baixa: pule) ou na altura da
// cabeca (alta: fique no chao)
Boss.prototype.onda = function (x, dir, vel, alta) {
  var y = alta ? this.chao - 82 : this.chao - 21;
  var s = this.cena.add.sprite(x, y, 'onda_plasma0').setDepth(11).setBlendMode('ADD').play('onda_plasma_anda');
  s.flipX = dir < 0;

// ---- HUD dos chefes novos: retrato + barra de vida com as marcas de fase ----
Boss.prototype.criaBarra = function () {
  var cena = this.cena, d = this.def, x0 = LARG / 2 - 170, w = 400, y = 40, i;
  var g = cena.add.graphics().setScrollFactor(0).setDepth(100);
  var mold = cena.add.graphics().setScrollFactor(0).setDepth(100);
  mold.fillStyle(0x000000, 0.6); mold.fillRect(x0 - 57, y - 25, 50, 50);
  mold.fillStyle(N.escuro, 1); mold.fillRect(x0 - 56, y - 24, 48, 48);
  mold.fillStyle(0xd7192c, 1); mold.fillRect(x0 - 54, y - 22, 44, 44);
  var ret = cena.add.image(x0 - 32, y, d.retrato).setScrollFactor(0).setDepth(101);
  var nome = txt(cena, x0, y - 16, d.nome, 9, d.corNome || '#ff6a6a', 0).setScrollFactor(0).setDepth(101);
  var faseT = txt(cena, x0 + w, y - 16, '', 7, C.cinza, 1).setScrollFactor(0).setDepth(101);
  // marcas: o ponto da barra em que cada fase nova comeca

  for (i = 0; i < this.barra.objs.length; i++) this.barra.objs[i].setVisible(true);
};
Boss.prototype.pintaBarra = function (dt) {
  var b = this.barra, i;
  if (!b) return;
  var alvo = this.folego / this.folegoMax;
  b.mostra += (alvo - b.mostra) * Math.min(1, dt / 90);
  if (b.atraso < b.mostra) b.atraso = b.mostra;
  else b.atraso += (b.mostra - b.atraso) * Math.min(1, dt / 700);    // o pedaco perdido escorre
  var g = b.g, x = b.x, y = b.y - 7, w = b.w, h = 14;
  g.clear();

  g.fillStyle(0x2a0a10, 1);   g.fillRect(x, y, w, h);
  g.fillStyle(0xffffff, 0.85); g.fillRect(x, y, Math.round(w * b.atraso), h);
  g.fillStyle(0xd7192c, 1);   g.fillRect(x, y, Math.round(w * b.mostra), h);
  g.fillStyle(0xff2438, 1);   g.fillRect(x, y, Math.round(w * b.mostra), 4);
  g.fillStyle(0x5c0a12, 1);   g.fillRect(x, y + h - 3, Math.round(w * b.mostra), 3);
  for (i = 0; i < b.marcas.length; i++) {
    var mx = x + Math.round(w * b.marcas[i]);
    g.fillStyle(N.escuro, 1); g.fillRect(mx - 1, y - 4, 3, h + 8);
    g.fillStyle(N.moeda, 1);  g.fillRect(mx, y - 4, 1, 3);
  }
  var fs = this.faseAtual();
  if (b.fase !== fs) { b.fase = fs; b.faseT.setText((this.def.nomesFase || {})[fs] || ''); b.faseT.setColor(fs > 1 ? C.perigo2 : C.cinza); }
};
// mostra/esconde o HUD do chefe (as cutscenes escondem)
Boss.prototype.hudVisivel = function (v) {

// ============================================================================
//  BICHOS DO TELHADO (inimigos)
//  ---------------------------------------------------------------------------
//  Mesma ideia do chefe: NADA de corpo de fisica. Cada bicho e um sprite e um
//  retangulo; a fase chama atualizaBicho() por quadro. Isso mantem a fisica do
//  jogador intocada e deixa o comportamento explicito.
//
//  Cada bicho existe por um MOTIVO de jogo, nao para encher o mapa:
//    GATO   - patrulha uma plataforma: obriga a escolher a hora de passar.
//    CORVO  - voa num vaivem previsivel: e um obstaculo de ritmo no ar.
//    GUARDA - patrulha e PERSEGUE quando te ve: tira o jogador do lugar.
//
//  Todo bicho pode ser resolvido pelos DOIS personagens: pulando na cabeca
//  (qualquer um) ou, com o Tobias, de pisao / protegido pelo escudo. O DASH
//  NAO resolve: atravessar correndo custa o tombo, igual a quem nao dashou.
//  Ninguem se machuca: o bicho sai correndo ofendido.
// ============================================================================
var BICHOS = {
  gato: {
    tex: 'gato0', anim: 'gato_anda', larg: 24, alt: 18, vel: 58,
    som: 'gato', grito: 'FSSSH!', pontos: PONT.BICHO,
    comporta: 'patrulha'
  },
  corvo: {
    tex: 'corvo0', anim: 'corvo_voa', larg: 24, alt: 18, vel: 96,
    som: 'corvo', grito: 'CRÁÁ!', pontos: PONT.BICHO,
    comporta: 'voa', alcance: 128, sobe: 26
  },
  guarda: {
    tex: 'guardinha0', anim: 'guardinha_anda', larg: 22, alt: 28, vel: 52,
    som: 'apito', grito: 'PARADO AÍ!', pontos: PONT.BICHO * 2,
    comporta: 'persegue', velCorrida: 138, vista: 210, folego: 2600, descanso: 900
  }
};

// Onde este bicho pode andar sem cair? Anda para os lados a partir do ponto de
// nascimento enquanto houver chao embaixo e nao houver parede na frente.
function limitesDaPatrulha(g, cx, cl, alcanceMax) {
  var solido = function (x, y) {
    if (y < 0 || y >= g.length || x < 0 || x >= g[0].length) return false;
    var ch = g[y].charAt(x);
    return ch === '#' || ch === 'Q' || ch === ':' || ch === 'A';
  };
  var livre = function (x, y) { return !solido(x, y); };
  var esq = cx, dir = cx, n = alcanceMax || 14;
  while (esq - 1 >= 0 && n-- > 0 && solido(esq - 1, cl + 1) && livre(esq - 1, cl)) esq--;
  n = alcanceMax || 14;
  while (dir + 1 < g[0].length && n-- > 0 && solido(dir + 1, cl + 1) && livre(dir + 1, cl)) dir++;
  return { esq: esq * T + 4, dir: dir * T + T - 4 };
}

function criaBicho(cena, tipo, px, py, g, col, lin) {
  var def = BICHOS[tipo];
  if (!def) return null;
  var spr = cena.add.sprite(px + 16, py + T, def.tex).setOrigin(0.5, 1).setDepth(8);
  spr.play(def.anim);
  var b = {
    tipo: tipo, def: def, spr: spr,
    x: px + 16, y: py + T, x0: px + 16, y0: py + T,
    face: -1, estado: 'anda', t: 0, vivo: true, fase: Math.random() * 6.28,
    alerta: null
  };
  if (def.comporta === 'voa') {
    b.esq = b.x0 - def.alcance; b.dir = b.x0 + def.alcance;
  } else {
    var lim = limitesDaPatrulha(g, col, lin);
    b.esq = lim.esq; b.dir = lim.dir;
    // plataforma minuscula: fica no lugar balançando, em vez de tremer
    if (b.dir - b.esq < 40) { b.esq = b.x0 - 12; b.dir = b.x0 + 12; }
  }
  if (tipo === 'guarda') {
    b.alerta = cena.add.image(b.x, b.y - 44, 'alerta').setDepth(13).setVisible(false);
  }
  return b;
}

// retangulo de colisao do bicho (o mesmo jeito do chefe)
function caixaBicho(b) {
  return { esq: b.x - b.def.larg / 2, dir: b.x + b.def.larg / 2,
           topo: b.y - b.def.alt, baixo: b.y };
}

function atualizaBicho(cena, b, dt, r) {
  if (!b.vivo) return;
  var def = b.def, d = def.comporta, passo = dt / 1000;

  if (d === 'patrulha') {
    b.x += b.face * def.vel * passo;
    if (b.x <= b.esq) { b.x = b.esq; b.face = 1; }
    if (b.x >= b.dir) { b.x = b.dir; b.face = -1; }

  } else if (d === 'voa') {
    // vaivem suave + sobe e desce: da para prever e passar no ritmo
    b.fase += passo * (def.vel / def.alcance);
    b.x = b.x0 + Math.sin(b.fase) * def.alcance;
    b.y = b.y0 + Math.cos(b.fase * 2) * def.sobe;
    b.face = Math.cos(b.fase) >= 0 ? 1 : -1;

  } else if (d === 'persegue') {
    var dx = r.corpo.x - b.x, dy = Math.abs(r.corpo.body.bottom - b.y);
    var vePerto = !r.morto && Math.abs(dx) < def.vista && dy < 70;
    if (b.estado === 'anda') {
      b.x += b.face * def.vel * passo;
      if (b.x <= b.esq) { b.x = b.esq; b.face = 1; }
      if (b.x >= b.dir) { b.x = b.dir; b.face = -1; }
      if (vePerto) {
        b.estado = 'corre'; b.t = def.folego;
        b.spr.play('guardinha_corre', true);
        b.alerta.setVisible(true);
        SOM.apito();
        balao(cena, b.x, b.y - 52, 'PARADO AÍ!', C.perigo2);
      }
    } else if (b.estado === 'corre') {
      b.t -= dt;
      b.face = dx >= 0 ? 1 : -1;
      // persegue sem sair da propria plataforma: nao cai nem some do mapa
      b.x = limita(b.x + b.face * def.velCorrida * passo, b.esq, b.dir);
      if (b.t <= 0 || !vePerto) {
        b.estado = 'cansado'; b.t = def.descanso;
        b.spr.play('guardinha_anda', true);
        b.alerta.setVisible(false);
      }
    } else {
      b.t -= dt;
      if (b.t <= 0) b.estado = 'anda';
    }
    if (b.alerta) b.alerta.setPosition(b.x, b.y - def.alt - 16);
  }

  b.spr.x = Math.round(b.x);
  b.spr.y = Math.round(b.y);
  b.spr.flipX = b.face < 0;          // os desenhos olham para a DIREITA
}

// Encostou no bicho? Decide o que acontece e devolve:
//   'tirou'  - o bicho saiu do caminho (pulo na cabeca, dash, pisao)
//   'aparou' - o escudo segurou
//   'pegou'  - o jogador escorregou
//   null     - nao encostou
function checaBicho(cena, b, r) {
  if (!b.vivo || r.morto || r.invenc > 0) return null;
  var c = caixaBicho(b), rb = r.corpo.body;
  if (!(rb.right > c.esq && rb.left < c.dir && rb.bottom > c.topo && rb.top < c.baixo)) return null;
  // pisou em cima: vale para qualquer personagem (a saida "de graca")
  var pisou = rb.bottom <= c.topo + 14 && rb.velocity.y > 20;
  if (pisou) { tiraBicho(cena, b, r, true); return 'tirou'; }
  if (r.pisando) { tiraBicho(cena, b, r, true); return 'tirou'; }
  if (r.escudando) {
    escudoAparou(cena, r);
    tiraBicho(cena, b, r, false);
    return 'aparou';
  }
  return 'pegou';
}

// O bicho sai correndo ofendido (ninguem se machuca). "quica" devolve o
// impulso de pulo para quem acertou de cima.
function tiraBicho(cena, b, r, quica) {
  b.vivo = false;
  if (b.alerta) b.alerta.setVisible(false);
  SOM[b.def.som]();
  SOM.chefeAcerto();
  balao(cena, b.x, b.y - b.def.alt - 12, b.def.grito, C.perigo2);
  if (cena.placar) cena.placar.marca(b.def.pontos, b.x, b.y - b.def.alt, null, C.p2luz, true);
  if (!POUCO_MOV) cena.pPoeira.explode(8, b.x, b.y - 6);
  var lado = (r.corpo.x < b.x) ? 1 : -1;
  cena.tweens.add({ targets: b.spr, x: b.x + lado * 130, y: b.y - 60, alpha: 0,
                    angle: lado * 240, duration: 620, ease: 'Quad.easeOut',
                    onComplete: function () { b.spr.setVisible(false); } });
  if (quica) {
    r.dashT = 0; r.dashando = false; r.pisando = false;
    r.corpo.body.setAllowGravity(true);
    r.quique = { vy: ELEM.QUIQUE, vx: r.corpo.body.velocity.x * 0.5 };
  }
}

// devolve o bicho ao lugar (quando o jogador volta do checkpoint)
function reviveBicho(cena, b) {
  cena.tweens.killTweensOf(b.spr);
  b.vivo = true;
  b.x = b.x0; b.y = b.y0; b.face = -1; b.estado = 'anda'; b.t = 0; b.fase = 0;
  b.spr.setVisible(true).setAlpha(1).setAngle(0).setPosition(b.x, b.y);
  b.spr.play(b.def.anim, true);
  if (b.alerta) b.alerta.setVisible(false);
}

// ============================================================================
//  CENA 3 - CAMPANHA (1 jogador, fases fixas)
//  Vidas infinitas: escorregar devolve a ultima lanterna/checkpoint (ou ao inicio).
// ============================================================================
var CampaignScene = new Phaser.Class({
  Extends: Phaser.Scene,
  initialize: function CampaignScene() { Phaser.Scene.call(this, { key: 'CampaignScene' }); },

  init: function (dados) {
    this.iFase = (dados && dados.fase) || 0;
    this.diario = (dados && dados.diario) || null;   // desafio do dia, se veio de la
    RelQuedas.anota(this.iFase, 'comecou');
    this.tempoMs = 0; this.mortes = 0; this.moedasPegas = 0; this.totalMoedas = 0;
    this.terminou = false; this.pausado = false;
    this.moveis = []; this.texsCriadas = []; this.listaPausa = null; this.objsPausa = [];
    this.quebradicas = []; this.caixas = []; this.dicaMola = false; this.dicaCaixa = false;
    this.boss = null; this.pontoBoss = null;
    // A CENA E REAPROVEITADA de uma fase para outra: tudo o que so existe em
    // algumas fases precisa ser zerado aqui, senao sobra referencia morta.
    this.bandeira = null; this.coco = null; this.hud = null; this.dica = null;
    this.sub = null; this.tutorial = null;
    this.placar = null; this.secretosPegos = 0; this.usosHab = 0;
    this.bichos = []; this.fantasmas = []; this.trincadas = [];
    this.escorregas = []; this.ventos = []; this.dicaTrincada = false;
    this.ventouSom = false; this.hudDiario = null;
    this.tempoAcabou = false; this.ultimoTique = -1; this.perdeu = false;
    // chefes novos, cutscenes e clima
    this.arena = null; this.arenaDef = null; this.fimX = 0;
    this.roteiro = null; this.cinema = null; this.emCena = false; this.entradaCena = null;
    this.objsCena = []; this.auras = []; this.ambiente = null; this.hitstopT = 0;
  },

  create: function () {
    var cena = this, x, y, ch, px, py;
    var fase = FASES[this.iFase];
    var g = normalizaMapa(fase.mapa);
    this.g = g;
    var cols = g[0].length, lins = g.length;
    this.LW = cols * T; this.LH = lins * T;
    // fase com arena de chefe no fim do telhado (a Ventania): a luta comeca
    // quando o jogador entra nela (veja entraArena)
    this.arenaDef = fase.arena ? { boss: fase.arena.boss, x0: fase.arena.c0 * T, x1: fase.arena.c1 * T,
                                   gatilho: fase.arena.gatilho || 'entrada', coco: fase.arena.coco } : null;
    this.fimX = this.arenaDef ? this.arenaDef.x1 : this.LW;

    this.teclas = criarTeclas(this);
    this.tj = criarTeclasJogo(this);
    criaParticulas(this);

    // ---- fundo (parallax preso na camera) ----
    // Cenario da fase: cada uma escolhe o clima/hora em "cenario" (veja
    // CENARIOS no BootScene). Sem essa chave, ou com um id que nao existe,
    // cai no fim de tarde de sempre - nenhuma fase antiga quebra.
    var cen = FASES[this.iFase].cenario;
    this.ventoForte = (cen === 'tempestade');   // o mato enverga (criaPerigo)
    var suf = (cen && this.textures.exists('ceu_' + cen)) ? '_' + cen : '';
    this.add.image(0, 0, 'ceu' + suf).setOrigin(0).setScrollFactor(0).setDepth(0);
    this.mont = this.add.tileSprite(0, 190, LARG, 170, 'montanhas' + suf).setOrigin(0).setScrollFactor(0).setDepth(1);
    this.morr = this.add.tileSprite(0, 300, LARG, 140, 'morros' + suf).setOrigin(0).setScrollFactor(0).setDepth(2);
    // sombra das vielas entre as casas: o vao fica escuro, deixando claro que
    // cair ali e ruim (as fases tem o chao dos telhados na linha lins-4)
    var yViela = (lins - 4) * T + 6;
    this.add.rectangle(0, yViela, this.LW, this.LH - yViela + 240, N.escuro).setOrigin(0).setDepth(3);

    // ---- blocos: colisao em poucos retangulos + desenho em fatias ----
    this.solidos = this.physics.add.staticGroup();
    criaSolidos(this.solidos, juntaRetangulos(g), 0, 0);
    var fat = montaFatias(this, g, 'fase' + this.iFase, 0, 0, 4);
    this.texsCriadas = fat.texs.slice();
    // cenario das arenas dos chefes: o torii do palacio e os estandartes imperiais
    var yChao = (lins - 4) * T;
    if (this.arenaDef && this.arenaDef.gatilho === 'entrada') {
      this.add.image(this.arenaDef.x0 + 8, yChao + 4, 'torii').setOrigin(0.5, 1).setDepth(3.6);
      this.add.image(this.arenaDef.x0 + 140, yChao + 2, 'flamula').setOrigin(0.5, 1).setDepth(3.6);
      this.add.image(this.arenaDef.x1 - 70, yChao + 2, 'flamula').setOrigin(0.5, 1).setDepth(3.6);
    }
    if (fase.final) {
      this.add.image(this.LW / 2, yChao + 4, 'torii').setOrigin(0.5, 1).setDepth(3.6).setScale(1.3).setAlpha(0.85);
      this.add.image(70, yChao + 2, 'flamula').setOrigin(0.5, 1).setDepth(3.6);
      this.add.image(this.LW - 70, yChao + 2, 'flamula').setOrigin(0.5, 1).setDepth(3.6);
    }

    // ---- itens, perigos e plataformas moveis ----
    this.perigos = this.physics.add.staticGroup();
    this.moedas = this.add.group();
    this.checks = this.add.group();
    this.trampolins = this.physics.add.staticGroup();   // T
    this.grupoQ = this.physics.add.staticGroup();       // Q
    this.grupoD = this.physics.add.staticGroup();       // D (telha fantasma)
    this.grupoTr = this.physics.add.staticGroup();      // : (telha trincada)
    this.grupoAs = this.physics.add.staticGroup();      // A (escorregadia)
    this.nasce = { x: 64, y: 64 };
    for (y = 0; y < lins; y++) {
      for (x = 0; x < cols; x++) {
        ch = g[y].charAt(x); px = x * T; py = y * T;
        if (ch === '^' || ch === 'L') {
          criaPerigo(this, this.perigos, ch, px, py);
        } else if (ch === 'o') {
          this.moedas.add(criaItem(this, px + 16, py + 16, 'moeda0', 'moeda_gira'));
          this.totalMoedas++;
        } else if (ch === 'P') {
          this.nasce = { x: px + 16, y: py + 17 };
        } else if (ch === 'F') {
          this.bandeira = criaItem(this, px + 16, py, 'bandeira0', 'bandeira_bal', 6);
        } else if (ch === 'C') {
          var c = criaItem(this, px + 12, py + 12, 'check0', null, 6);
          c.setData('ativo', false);
          c.setData('pos', { x: px + 16, y: py + 17 });
          this.checks.add(c);
        } else if (ch === '-' && (x === 0 || g[y].charAt(x - 1) !== '-')) {
          this.criaMovel(fase, px, py, this.tamRun(g[y], x, '-'), 'h');
        } else if (ch === '|' && (x === 0 || g[y].charAt(x - 1) !== '|')) {
          this.criaMovel(fase, px, py, this.tamRun(g[y], x, '|'), 'v');
        } else if (ch === 'T') {
          this.criaTrampolim(px, py);
        } else if (ch === 'Q') {
          this.criaQuebradica(px, py);
        } else if (ch === 'B') {
          this.criaCaixa(px, py);
        } else if (ch === 'X') {
          this.pontoBoss = { x: px + 16, y: py + T };    // pes do chefe
        } else if (ch === 's') {
          this.criaOvoSecreto(px, py);
        } else if (ch === 'D' && (x === 0 || g[y].charAt(x - 1) !== 'D'
                   || Math.floor(x / 4) !== Math.floor((x - 1) / 4))) {
          this.criaFantasma(px, py, x, this.tamRunGrupo(g[y], x, 'D'));
        } else if (ch === ':') {
          this.criaTrincada(px, py);
        } else if (ch === 'A' && (x === 0 || g[y].charAt(x - 1) !== 'A')) {
          this.criaEscorrega(px, py, this.tamRun(g[y], x, 'A'));
        } else if (ch === '~') {
          this.criaVento(px, py);
        } else if (ch === 'E' || ch === 'V' || ch === 'G') {
          var qual = ch === 'E' ? 'gato' : (ch === 'V' ? 'corvo' : 'guarda');
          var bb = criaBicho(this, qual, px, py, g, x, y);
          if (bb) this.bichos.push(bb);
        }
      }
    }

    // ---- a Cócó: aparece fugindo no comeco da fase e depois fica esperando,
    //      debochada, ao lado do estandarte (so decoracao, sem fisica) ----
    var chaoY = (lins - 4) * T;
    // depois da luta com o Samurai Robo a Cócó virou robo: foge com o olho de
    // LED, o corpo de metal e o dispositivo no pescoco (veja cocoRoboNa)
    var robo = cocoRoboNa(this.iFase) && !fase.final, cp = robo ? 'cocoR' : 'coco';
    if (!fase.boss) {                  // na arena do chefe ela ja esta no poleiro
      var fuga = this.add.sprite(this.nasce.x + 90, chaoY + 2, cp + '0').setOrigin(0.5, 1).setDepth(8).play(cp + '_corre');
      balao(this, this.nasce.x + 90, chaoY - 40, robo ? 'CÓ-CÓ! BIP! PEGA EU!' : 'CÓ CÓ! PEGA EU!', robo ? '#9fe8ff' : C.ui);
      if (robo) { this.poeAura(fuga, 28, 24); SOM.cocoRoboRi(); }
      this.tweens.add({ targets: fuga, x: fuga.x + 520, duration: 2200, delay: 350,
                        onComplete: function () { fuga.destroy(); } });
      this.tweens.add({ targets: fuga, alpha: 0, delay: 1900, duration: 650 });
    }
    this.coco = null;
    if (this.bandeira) {
      this.coco = this.add.sprite(this.bandeira.x + 40, chaoY + 2, cp + '4').setOrigin(0.5, 1).setDepth(8).play(cp + '_parada');
      this.coco.flipX = true;         // olhando para quem vem chegando
    } else if (fase.poleiro) {
      // fase de chefe: a Cócó assiste a confusao de um poleiro alto
      this.coco = this.add.sprite(fase.poleiro.c * T, fase.poleiro.l * T, gp + '4')
        .setOrigin(0.5, 1).setDepth(8).play(gp + '_parada');
      this.coco.flipX = true;
    } else if (this.arenaDef && this.arenaDef.coco) {
      // Ventania: a Cócó cisca num telhado distante, sem saber de nada. So a
      // camera da cutscene depois da luta chega la.
      var cl = this.arenaDef.coco;
      this.coco = this.add.sprite(cl.c * T + 16, cl.l * T + 2, 'coco4').setOrigin(0.5, 1).setDepth(8).play('coco_parada');
      this.coco.flipX = true;
    }
    if (this.coco && robo) this.poeAura(this.coco, 28, 24);
    // o estandarte de chegada brilha de leve: e o objetivo da fase
    if (this.bandeira) {
      var luzB = this.add.image(this.bandeira.x + 4, this.bandeira.y - 6, 'luz_rad').setBlendMode('ADD')
        .setTint(0xffcd75).setDepth(5.5).setScale(0.9).setAlpha(0.28);
      if (!POUCO_MOV) this.tweens.add({ targets: luzB, alpha: 0.12, duration: 1100, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
    }

    // ---- jogador ----
    // o personagem escolhido na tela PERSONAGENS (so muda o desenho: a
    // fisica e a mesma para os dois)
    this.r = criaCorredor(this, this.nasce.x, this.nasce.y, Save.personagem());
    this.corredores = [this.r];
    this.ponto = { x: this.nasce.x, y: this.nasce.y };

    this.physics.add.collider(this.r.corpo, this.solidos);
    for (var i = 0; i < this.moveis.length; i++) this.physics.add.collider(this.r.corpo, this.moveis[i].spr);
    this.physics.add.overlap(this.r.corpo, this.perigos, function (a, pg) { cena.tocouPerigo(pg); });
    this.physics.add.overlap(this.r.corpo, this.moedas, function (a, m) { cena.pegaMoeda(m); });
    this.physics.add.overlap(this.r.corpo, this.checks, function (a, c) { cena.ativaCheck(c); });
    if (this.bandeira) this.physics.add.overlap(this.r.corpo, this.bandeira, function () { cena.tocouBandeira(); });
    // elementos fisicos novos (as colisoes do jogador acima continuam iguais)
    this.physics.add.collider(this.r.corpo, this.trampolins, function (a, t) { cena.pisouMola(t); });
    this.physics.add.collider(this.r.corpo, this.grupoQ, function (a, q) { cena.pisouQ(q); });
    this.physics.add.collider(this.r.corpo, this.grupoD);
    this.physics.add.collider(this.r.corpo, this.grupoTr, function (a, tr) { cena.bateuTrincada(tr); });
    this.physics.add.collider(this.r.corpo, this.grupoAs, function (a, es) { cena.pisouEscorrega(es); });
    if (this.caixas.length) {
      this.physics.add.collider(this.caixas, this.solidos);
      this.physics.add.collider(this.caixas, this.grupoQ);
      this.physics.add.collider(this.caixas, this.grupoD);
      this.physics.add.collider(this.caixas, this.grupoTr);
      this.physics.add.collider(this.caixas, this.grupoAs);
      this.physics.add.collider(this.caixas, this.trampolins);
      this.physics.add.collider(this.r.corpo, this.caixas, function (a, cx) { cena.encostouCaixa(cx); });
    }

    // ---- camera ----
    var cam = this.cameras.main;
    cam.setZoom(1);                    // uma cutscene interrompida nao deixa zoom para tras
    cam.setBounds(0, 0, this.LW, this.LH);
    cam.startFollow(this.r.corpo, true, 0.14, 0.16);
    cam.setDeadzone(150, 90);

    // ---- placar e HUD ----
    this.placar = new Placar(this);
    this.hud = criaHudFase(this, fase);
    this.dica = txt(this, LARG / 2, 108, comTeclas(fase.dica, 1), 9, C.p1luz)
      .setScrollFactor(0).setDepth(100);
    this.tweens.add({ targets: this.dica, alpha: 0, delay: 4600, duration: 1400 });
    // fases com limite de tempo avisam logo de cara
    if (fase.limite) {
      var avTempo = txt(this, LARG / 2, 132, 'CORRA! ' + Math.round(fase.limite / 1000) + ' SEGUNDOS',
                        10, C.perigo2).setScrollFactor(0).setDepth(100);
      this.tweens.add({ targets: avTempo, alpha: 0, delay: 3200, duration: 1200,
                        onComplete: function () { avTempo.destroy(); } });
    }
    // objetivo do dia fica escrito no alto enquanto a fase acontece
    if (this.diario) {
      this.hudDiario = txt(this, LARG / 2, 88, 'DESAFIO DO DIA:  ' + this.diario.texto, 9, C.perigo2)
        .setScrollFactor(0).setDepth(100);
    }
    this.tutorial = criaTutorial(this, fase);
    this.atualizaHud();
    var bdef = fase.boss ? BOSSES[fase.boss] : null;
    if (bdef && bdef.intro) MUSICA.para();          // a apresentacao do chefe cuida da musica
    else MUSICA.toca(fase.boss ? 'chefe' : (fase.tipo === 'velocidade' ? 'corrida' : 'fase'));
    // o clima vivo do cenario
    this.ambiente = criaAmbiente(this, cen);
    if (!(bdef && bdef.intro)) this.cartaoFase(fase);

    // ---- fase de chefe: arena fechada + o chefe no lugar do "X" ----
    if (fase.boss && BOSSES[fase.boss] && this.pontoBoss) {
      // paredes invisiveis nas laterais: entram no mesmo grupo de solidos que
      // ja existia, entao a colisao do jogador continua exatamente a mesma
      var muro = function (cx) {
        var s = cena.solidos.create(cx, cena.LH / 2 - 200, 'branco');
        s.setVisible(false);
        s.setDisplaySize(32, cena.LH + 400);
        s.refreshBody();
      };
      muro(-16); muro(this.LW + 16);
      this.arena = { x0: 0, x1: this.LW };
      this.boss = new Boss(this, BOSSES[fase.boss], this.pontoBoss.x, this.pontoBoss.y);
      // chefe final: apresentacao antes da luta
      if (this.boss.def.intro) this.iniciaRoteiro(this.roteiroEntradaCoco(this.boss), 'cocoEntrada');
    }

    this.cameras.main.fadeIn(280, 26, 28, 44);

    // libera as texturas geradas para esta fase ao sair da cena
    this.events.once('shutdown', function () {
      for (var k = 0; k < cena.texsCriadas.length; k++) removeTex(cena, cena.texsCriadas[k]);
    });
  },

  // conta quantos caracteres iguais seguidos existem a partir de x
  tamRun: function (linha, x, ch) {
    var n = 1;
    while (x + n < linha.length && linha.charAt(x + n) === ch) n++;
    return n;
  },
  // igual ao tamRun, mas parando na virada do grupo de 4 colunas (as telhas
  // fantasma ligam e desligam de 4 em 4: cada grupo precisa do proprio corpo)
  tamRunGrupo: function (linha, x, ch) {
    var n = 1, grupo = Math.floor(x / 4);
    while (x + n < linha.length && linha.charAt(x + n) === ch
           && Math.floor((x + n) / 4) === grupo) n++;
    return n;
  },

  // Plataforma movel (uma tabua levada pelo vento): corpo imovel sem gravidade
  // que vai e volta.
  criaMovel: function (fase, px, py, len, eixo) {
    var cfg = (eixo === 'h' ? fase.moverH : fase.moverV) || { alcance: 128, vel: 70 };
    var chave = 'movel_' + len;
    if (!this.textures.exists(chave)) {
      criaTex(this, chave, len * T, T, function (ctx) {
        for (var i = 0; i < len; i++) ctx.drawImage(ART['tabua'], i * T, 0);
      });
      this.texsCriadas.push(chave);
    }
    var s = this.physics.add.image(px + len * T / 2, py + T / 2, chave).setDepth(5);
    s.body.setAllowGravity(false);
    s.setImmovable(true);
    this.moveis.push({
      spr: s, eixo: eixo, x0: s.x, y0: s.y,
      alc: cfg.alcance, vel: cfg.vel, dir: 1, prevX: s.x, prevY: s.y
    });
  },

  atualizaMoveis: function () {
    for (var i = 0; i < this.moveis.length; i++) {
      var m = this.moveis[i], s = m.spr;
      if (m.eixo === 'h') {
        if (m.dir > 0 && s.x >= m.x0 + m.alc) m.dir = -1;
        if (m.dir < 0 && s.x <= m.x0) m.dir = 1;
        s.setVelocity(m.dir * m.vel, 0);
      } else {
        if (m.dir > 0 && s.y <= m.y0 - m.alc) m.dir = -1;   // dir>0 = subindo
        if (m.dir < 0 && s.y >= m.y0) m.dir = 1;
        s.setVelocity(0, -m.dir * m.vel);
      }
    }
  },

  // Leva junto quem estiver em cima da plataforma (a fisica arcade nao faz isso
  // sozinha): soma o deslocamento do ultimo passo ao jogador.
  aplicaCarona: function () {
    for (var i = 0; i < this.moveis.length; i++) {
      var m = this.moveis[i], b = m.spr.body;
      var dx = m.spr.x - m.prevX, dy = m.spr.y - m.prevY;
      for (var j = 0; j < this.corredores.length; j++) {
        var r = this.corredores[j];
        if (r.morto || r.eliminado) continue;
        var rb = r.corpo.body;
        if (rb.velocity.y >= -1 && Math.abs(rb.bottom - b.top) < 9 &&
            rb.right > b.left + 2 && rb.left < b.right - 2) {
          r.corpo.x += dx;
          if (dy > 0) r.corpo.y += dy;
        }
      }
      m.prevX = m.spr.x; m.prevY = m.spr.y;
    }
  },

  // ===========================================================================
  //  ELEMENTOS FISICOS (so na Campanha). Todos agem sobre o jogador "por
  //  fora" (impulso, colisao), sem mexer em FIS nem em atualizaCorredor.
  // ===========================================================================

  // ---- Trampolim "T": corpo estatico baixo; quem cai em cima ganha um
  //      super-pulo. O impulso e marcado aqui e aplicado no update, depois da
  //      fisica do jogador, para nada sobrescrever.
  criaTrampolim: function (px, py) {
    var img = this.add.image(px + 16, py + 32, 'trampolim').setOrigin(0.5, 1).setDepth(6);
    var corpo = this.trampolins.create(px + 16, py + 22, 'branco');
    corpo.setVisible(false).setDisplaySize(28, 20).refreshBody();
    corpo.setData('img', img);
  },
  pisouMola: function (t) {
    var r = this.r, rb = r.corpo.body;
    if (r.morto || r.molaPendente) return;
    if (rb.bottom > t.body.top + 6) return;              // encostou do lado: nao pula
    r.molaPendente = true;
    var img = t.getData('img');
    this.tweens.killTweensOf(img);
    img.setScale(1.15, 0.6);                               // a lona afunda e volta
    this.tweens.add({ targets: img, scaleX: 1, scaleY: 1, duration: POUCO_MOV ? 200 : 420,
                      ease: POUCO_MOV ? 'Quad.easeOut' : 'Elastic.easeOut' });
    SOM.mola();
    if (!POUCO_MOV) this.pPoeira.explode(6, t.x, t.body.top);
    if (!this.dicaMola) { this.dicaMola = true; balao(this, t.x, t.body.top - 34, 'BOING!', C.perigo2); }
  },

  // ---- Telha rachada "Q": piso normal ate alguem pisar; ai treme um
  //      instante, perde a colisao e so o desenho despenca (nao empurra nem
  //      prende ninguem). Volta sozinha depois, entao nunca trava a fase.
  criaQuebradica: function (px, py) {
    var img = this.add.image(px + 16, py + 16, 'quebradica').setDepth(4);
    var corpo = this.grupoQ.create(px + 16, py + 16, 'branco');
    corpo.setVisible(false).setDisplaySize(32, 32).refreshBody();
    var q = { img: img, corpo: corpo, x: px, y: py, estado: 'firme', t: 0 };
    corpo.setData('q', q);
    this.quebradicas.push(q);
  },
  pisouQ: function (corpo) {
    var q = corpo.getData('q');
    if (q.estado !== 'firme' || this.r.morto) return;
    if (this.r.corpo.body.bottom > corpo.body.top + 4) return;     // so pisando por cima
    q.estado = 'treme'; q.t = ELEM.TREME_Q;
    SOM.racha();
  },
  atualizaQuebradicas: function (dt) {
    for (var i = 0; i < this.quebradicas.length; i++) {
      var q = this.quebradicas[i];
      if (q.estado === 'treme') {
        q.t -= dt;
        if (!POUCO_MOV) q.img.x = q.x + 16 + (Math.random() < 0.5 ? -1 : 1);   // tremidinha
        if (q.t <= 0) this.derrubaQ(q);
      } else if (q.estado === 'caiu') {
        q.t -= dt;
        if (q.t <= 0) this.voltaQ(q);
      }
    }
  },
  derrubaQ: function (q) {
    q.estado = 'caiu'; q.t = ELEM.VOLTA_Q;
    q.corpo.body.enable = false;                           // vira nao-solida
    q.img.x = q.x + 16;
    this.tweens.add({ targets: q.img, y: q.y + 16 + 260, alpha: 0, duration: 700, ease: 'Quad.easeIn',
                      angle: POUCO_MOV ? 0 : (Math.random() < 0.5 ? -25 : 25) });
    if (!POUCO_MOV) this.pPoeira.explode(8, q.x + 16, q.y + 8);
    SOM.telhaCai();
  },
