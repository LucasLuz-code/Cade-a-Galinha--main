<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title> Cadê a Galinha?! </title>
<!-- Instalavel como app (manifest + service worker no fim da pagina) -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1a1c2c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Cadê a Galinha">
<link rel="icon" href="imgs/icone-192.png">
<link rel="apple-touch-icon" href="imgs/icone-192.png">
<style>
  /* Fonte pixelada servida junto com o jogo (e nao pelo Google Fonts) para
     funcionar sem internet. So o subconjunto "latin", que ja tem os acentos
     do portugues. Licenca em fonts/OFL.txt. */
  @font-face {
    font-family: 'Silkscreen';
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url(fonts/silkscreen.woff2) format('woff2');
  }
  /* ---- CSS minimo: o jogo ocupa a janela inteira e a arte fica nitida ---- */
  html, body { height: 100%; margin: 0; background: #000; overflow: hidden; }
  body {
    font-family: "Silkscreen", "Courier New", monospace;
    color: #f4f4f4;
    /* No celular o dedo nao deve rolar a pagina, dar zoom, "puxar para
       recarregar" nem selecionar texto: todo toque e comando de jogo. */
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  /* quem centraliza o canvas e o proprio Phaser (autoCenter, via margens);
     centralizar tambem por CSS somava os dois e deslocava o jogo */
  #jogo {
    width: 100vw; height: 100vh;
    height: 100dvh;   /* no celular a barra do navegador nao rouba altura */
    background: #000;
  }
  /* image-rendering: pixelated evita borrar a pixel art ao escalar. Sem
     moldura: o jogo cresce ate encostar nas bordas (a escala FIT mantem 16:9,
     entao sobram faixas pretas so onde a tela tiver outro formato) */
  #jogo canvas {
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
    display: block;
  }
  #jogo:fullscreen { background: #000; }
  /* tela do relatorio de quedas ("?relatorio" no endereco): por cima de tudo,
     e o unico lugar da pagina onde da para rolar e selecionar texto */
  #relatorio {
    position: fixed; inset: 0; z-index: 10000; background: #1a1c2c;
    display: flex; flex-direction: column; padding: 12px 16px; box-sizing: border-box;
    touch-action: pan-y; -webkit-user-select: text; user-select: text;
  }
  #relatorio pre {
    flex: 1; overflow: auto; margin: 0 0 12px; font: 13px/1.5 "Courier New", monospace;
    color: #f4f4f4; white-space: pre-wrap;
  }
  #relatorio button {
    font-family: inherit; font-size: 12px; margin-right: 8px; padding: 10px 14px;
    background: #333c57; color: #ffcd75; border: 2px solid #566c86; cursor: pointer;
  }

  /* ---- CONTROLE DE TOQUE -------------------------------------------------
     Os botoes sao HTML por cima do canvas, nao objetos do Phaser. Assim eles
     nao entram nas cameras (a Perseguicao tem tela dividida e desenharia o
     pad duas vezes), nao dependem da cena ativa e o multitoque fica por
     conta do navegador. O overlay so aparece depois do primeiro toque de
     verdade (veja TOQUE.detecta), entao no PC nada muda. */
  :root {
    --tq:  62px;   /* seta / botao comum */
    --tqA: 68px;   /* botao de acao (circulo) */
  }
  @media (min-width: 820px) { :root { --tq: 70px; --tqA: 76px; } }
  @media (max-height: 400px) { :root { --tq: 54px; --tqA: 60px; } }

  #toque { display: none; }
  body.toque #toque { display: block; }
  #toque .tq-grupo {
    position: fixed; bottom: calc(10px + env(safe-area-inset-bottom));
    pointer-events: none;                /* so os botoes recebem o dedo */
  }
  /* O jogo e 16:9 e a tela do celular costuma ser mais larga, sobrando
     tarjas pretas. Quando o grupo CABE na tarja, o JS poe --tq-esq/--tq-dir
     e o pad sai de cima da area jogavel (veja TOQUE.posiciona). Se nao
     couber, o max() devolve a margem segura de sempre. */
  #tq-mov, #tq-nav { left:  max(calc(10px + env(safe-area-inset-left)),  var(--tq-esq, 0px)); }
  #tq-acoes        { right: max(calc(10px + env(safe-area-inset-right)), var(--tq-dir, 0px)); }

  .tq-bt {
    pointer-events: auto;                /* <- o unico que capta o toque */
    touch-action: none;
    position: relative;
    font-family: inherit;
    font-size: 11px;
    line-height: 1;
    color: #ffcd75;
    background: rgba(13, 14, 23, 0.46);
    border: 2px solid rgba(255, 205, 117, 0.45);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    width: var(--tq); height: var(--tq);
    padding: 0;
    /* parado o pad fica discreto para nao brigar com a arte; ao tocar,
       acende. Em tela 16:9 sem tarjas pretas isso faz diferenca. */
    opacity: 0.62;
    transition: opacity .1s linear, background .06s linear;
    -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
  }
  /* A area que responde ao dedo e MAIOR do que o desenho: no celular o
     toque quase nunca cai no centro, e errar por 5px e frustrante. */
  .tq-bt::after { content: ''; position: absolute; inset: -9px; border-radius: 16px; }
  /* o realce e posto pelo JS (.on), nao por :active: com multitoque o
     :active do navegador solta sozinho e o botao "pisca" errado */
  .tq-bt.on {
    opacity: 1;
    background: rgba(255, 205, 117, 0.34);
    border-color: #ffcd75;
  }
  .tq-seta { font-size: 21px; }

  /* ---- movimento (PARTIDA): balancim largo, o polegar descansa no meio.
     Andar e o que mais se faz no jogo, entao ganha os dois maiores alvos. */
  #tq-mov { display: grid; gap: 8px; justify-items: start; }
  .tq-rocker { display: flex; gap: 7px; }
  .tq-rocker .tq-bt { width: calc(var(--tq) * 1.24); }
  #tq-baixo2 { margin-left: calc(var(--tq) * 0.72); }   /* acima do lado direito */

  /* ---- navegacao (TELAS): cruz completa, listas sobem e descem ---- */
  #tq-nav {
    display: grid;
    grid-template-columns: repeat(3, var(--tq));
    grid-template-rows: repeat(3, var(--tq));
  }
  #tq-cima  { grid-column: 2; grid-row: 1; }
  #tq-esq   { grid-column: 1; grid-row: 2; }
  #tq-dir   { grid-column: 3; grid-row: 2; }
  #tq-baixo { grid-column: 2; grid-row: 3; }

  /* ---- acoes: arco de polegar, com PULO (o mais usado) no canto ---- */
  #tq-acoes {
    display: grid; gap: 9px;
    grid-template-columns: auto auto;
    align-items: end; justify-items: center;
  }
  #tq-hab  { grid-column: 2; grid-row: 1; }
  #tq-dash { grid-column: 1; grid-row: 2; }
  #tq-pulo { grid-column: 2; grid-row: 2; }
  .tq-red {
    border-radius: 50%;
    width: var(--tqA); height: var(--tqA);
    font-size: 10px;
    flex-direction: column; gap: 3px;
  }
  .tq-red::after { border-radius: 50%; inset: -10px; }
  #tq-pulo { width: calc(var(--tqA) * 1.22); height: calc(var(--tqA) * 1.22); font-size: 12px; }

  /* Recarga espelhada do HUD: a parte escura e o que ainda falta. Com os
     polegares ocupados ninguem olha o canto da tela - o botao avisa. */
  .tq-red .tq-carga {
    position: absolute; inset: -2px; border-radius: 50%;
    background: conic-gradient(transparent calc(var(--carga, 1) * 360deg), rgba(0, 0, 0, 0.62) 0);
    pointer-events: none;
  }
  .tq-bt.vazio { filter: grayscale(1) brightness(0.72); }
  /* pontinhos de carga do dash (o Koburo tem 2): mesma leitura do HUD */
  .tq-pips { display: flex; gap: 3px; }
  .tq-pips i { width: 5px; height: 5px; border-radius: 50%; background: rgba(255, 205, 117, 0.25); }
  .tq-pips i.cheio { background: #ffcd75; }
  .tq-rot { letter-spacing: 0.5px; }

  /* PAUSA fica em cima, longe dos polegares: nao da para pausar sem querer */
  #tq-topo {
    position: fixed; top: calc(8px + env(safe-area-inset-top));
    right: calc(10px + env(safe-area-inset-right));
    display: flex; gap: 8px; pointer-events: none;
  }
  #tq-topo .tq-bt { width: 44px; height: 40px; font-size: 14px; border-radius: 9px; }
  #tq-topo .tq-bt::after { inset: -7px; }

  /* Troca de contexto: na partida some a cruz de navegacao; nas telas somem
     dash/especial e o balancim (veja TOQUE.atualiza) */
  body:not(.tq-menu) #tq-nav { display: none; }
  body.tq-menu #tq-mov, body.tq-menu #tq-dash, body.tq-menu #tq-hab { display: none; }

  /* ---- "vire o celular": o jogo e 16:9, em pe fica pequeno demais ---- */
  #girar { display: none; }
  body.toque #girar {
    position: fixed; inset: 0; z-index: 10;
    background: #0d0e17;
    align-items: center; justify-content: center; text-align: center;
    padding: 30px; font-size: 13px; line-height: 2.2;
  }
  @media (orientation: portrait) { body.toque #girar { display: flex; } }
  #girar b { color: #ffcd75; font-size: 15px; }
  #girar span { color: #8b8fa3; font-size: 11px; }
  /* ---- TELA DE ABERTURA -------------------------------------------------
     Cobre a espera inteira desde o primeiro byte: o download do Phaser, a
     fonte e a geracao de toda a arte no BootScene. Sai no clique - e e esse
     clique que libera o audio, porque o navegador exige uma interacao do
     usuario antes de deixar tocar qualquer som. */
  #abertura {
    position: fixed; inset: 0; z-index: 40;
    background: #1a1c2c;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    outline: none;
    transition: opacity .38s ease;
  }
  #abertura.pronto { cursor: pointer; }
  #abertura.saindo { opacity: 0; pointer-events: none; }
  /* a arte e ilustrada, nao pixel art 1:1 - deixa o navegador suavizar */
  #abertura-img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
  #abertura-rodape {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 30px 20px calc(24px + env(safe-area-inset-bottom));
    text-align: center;
    background: linear-gradient(to top, rgba(26, 28, 44, 0.92) 40%, rgba(26, 28, 44, 0));
    pointer-events: none;                /* o clique e do overlay inteiro */
  }
  #abertura-barra {
    width: min(260px, 60vw); height: 6px; margin: 0 auto 14px;
    background: rgba(244, 244, 244, 0.14);
    border: 1px solid rgba(255, 205, 117, 0.35);
    overflow: hidden;
  }
  #abertura-barra i {                    /* vaivem: nao ha progresso real a mostrar */
    display: block; width: 40%; height: 100%;
    background: #ffcd75;
    animation: aberturaCarrega 1.1s ease-in-out infinite;
  }
  @keyframes aberturaCarrega {
    from { transform: translateX(-110%); }
    to   { transform: translateX(260%); }
  }
  #abertura-txt { margin: 0; font-size: 12px; letter-spacing: 1px; color: #94b0c2; }
  #abertura.pronto #abertura-barra { display: none; }
  #abertura.pronto #abertura-txt {
    color: #ffcd75; font-size: 15px;
    animation: aberturaPisca 1.15s ease-in-out infinite;
  }
  @keyframes aberturaPisca { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  @media (prefers-reduced-motion: reduce) {
    #abertura-barra i, #abertura.pronto #abertura-txt { animation: none; }
  }

  #erro {
    z-index: 60;                         /* acima da abertura: erro sempre visivel */
    position: fixed; inset: 0; display: none;
    align-items: center; justify-content: center; text-align: center;
    padding: 40px; line-height: 2; font-size: 13px;
  }
  #erro b { color: #ffcd75; }
</style>
</head>
<body>

<!-- Tela de abertura: primeira coisa do body, para aparecer antes de tudo. -->
<div id="abertura" role="button" tabindex="0" aria-label="Cadê a Galinha?! - clique para começar">
  <img id="abertura-img" src="imgs/banner-tela.webp" alt="Cadê a Galinha?!">
  <div id="abertura-rodape">
    <div id="abertura-barra"><i></i></div>
    <p id="abertura-txt">CARREGANDO...</p>
  </div>
</div>

<div id="jogo"></div>
<div id="erro">
  <div>
    <b>CADÊ A GALINHA?!</b><br><br>
    Nao foi possivel carregar a biblioteca Phaser 3 (vendor/phaser.min.js).<br>
    Confira se o arquivo esta na pasta do jogo e recarregue a pagina.
  </div>
</div>

<!-- Controle de toque. Cada botao declara em data-acao quais entradas ele
     aciona; um mesmo botao pode acionar mais de uma, porque jogo e menu leem
     entradas diferentes e nunca os dois ao mesmo tempo (veja TOQUE). -->
<div id="toque" aria-hidden="true">
  <!-- movimento na PARTIDA: balancim largo (andar e o que mais se faz) -->
  <div class="tq-grupo" id="tq-mov">
    <button class="tq-bt tq-seta" id="tq-baixo2" data-acao="baixo" aria-label="descer">▼</button>
    <div class="tq-rocker">
      <button class="tq-bt tq-seta" id="tq-esq2" data-acao="esq" aria-label="esquerda">◀</button>
      <button class="tq-bt tq-seta" id="tq-dir2" data-acao="dir" aria-label="direita">▶</button>
    </div>
  </div>
  <!-- navegacao nas TELAS: cruz completa, as listas sobem e descem -->
  <div class="tq-grupo" id="tq-nav">
    <button class="tq-bt tq-seta" id="tq-cima"  data-acao="cima"  aria-label="cima">▲</button>
    <button class="tq-bt tq-seta" id="tq-esq"   data-acao="esq"   aria-label="esquerda">◀</button>
    <button class="tq-bt tq-seta" id="tq-dir"   data-acao="dir"   aria-label="direita">▶</button>
    <button class="tq-bt tq-seta" id="tq-baixo" data-acao="baixo" aria-label="baixo">▼</button>
  </div>
  <div class="tq-grupo" id="tq-acoes">
    <button class="tq-bt tq-red" id="tq-hab" data-acao="hab">
      <span class="tq-carga"></span><span class="tq-rot">ESP</span>
    </button>
    <button class="tq-bt tq-red" id="tq-dash" data-acao="dash">
      <span class="tq-carga"></span><span class="tq-rot">DASH</span>
      <span class="tq-pips"></span>
    </button>
    <button class="tq-bt tq-red" id="tq-pulo" data-acao="pulo ok">
      <span class="tq-rot">PULO</span>
    </button>
  </div>
  <div id="tq-topo">
    <button class="tq-bt" id="tq-tela" aria-label="tela cheia">⛶</button>
    <button class="tq-bt" id="tq-pausa" data-acao="voltar" aria-label="pausar">❚❚</button>
  </div>
</div>

<div id="girar">
  <div>
    <b>VIRE O CELULAR</b><br>
    <span>O JOGO É EM PAISAGEM</span>
  </div>
</div>

<script>
// ============================================================================
//  TELA DE ABERTURA
//  Roda ANTES do Phaser de proposito: se o Phaser nao carregar, ela ainda sabe sair do
//  caminho para a mensagem de erro aparecer.
//    .pronto()  o jogo terminou de carregar -> troca o texto para o convite
//    .some()    o jogador clicou (ou deu erro) -> esmaece e se remove
//  O clique tambem e o que libera o audio: o navegador so deixa tocar som
//  depois de uma interacao, e "ligaAudio" escuta pointerdown na janela.
// ============================================================================
(function () {
  var el = document.getElementById('abertura');
  var txt = document.getElementById('abertura-txt');
  var img = document.getElementById('abertura-img');
  if (!el) return;
  var pronto = false, saiu = false;

  // Banner faltando nao pode travar a entrada nem mostrar icone de imagem
  // quebrada: fica so o fundo escuro. Este script roda DEPOIS do markup,
  // entao a imagem pode ja ter falhado antes de o ouvinte existir - por isso
  // o estado tambem e conferido na hora.
  var escondeImg = function () { if (img) img.style.display = 'none'; };
  if (img) {
    img.addEventListener('error', escondeImg);
    if (img.complete && img.naturalWidth === 0) escondeImg();
  }

  var ehToque = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

  window.__abertura = {
    pronto: function () {
      if (pronto || saiu) return;
      pronto = true;
      el.classList.add('pronto');
      txt.textContent = ehToque ? 'TOQUE PARA COMEÇAR' : 'CLIQUE PARA COMEÇAR';
    },
    some: function () {
      if (saiu) return;
      saiu = true;
      el.classList.add('saindo');
      setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 420);
    }
  };

  var comeca = function (ev) {
    if (!pronto) return;               // ainda carregando: o clique nao vale
    if (ev) ev.preventDefault();
    window.__abertura.some();
  };
  el.addEventListener('pointerdown', comeca);
  el.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter' || ev.key === ' ' || ev.key === 'Spacebar') comeca(ev);
  });
  try { el.focus(); } catch (e) {}      // ja da para comecar pelo teclado
})();
</script>
<!-- Phaser 3.90.0 guardado na pasta do jogo: versao fixa (uma atualizacao
     do CDN nao muda o jogo sem aviso) e funciona sem internet -->
<script src="vendor/phaser.min.js"></script>
<script>
"use strict";
if (!window.Phaser) {
  document.getElementById('erro').style.display = 'flex';
  if (window.__abertura) window.__abertura.some();
} else {
(function () {

// ============================================================================
//  CADE A GALINHA?!  -  plataforma 2D em arquivo unico (Phaser 3)
//  Dois tratadores atrapalhados (Mestre Koburo e Tobias) perseguem a Cócó,
//  a galinha de estimacao do imperador, pelos telhados de um vilarejo feudal
//  japones. Comedia leve: ninguem se machuca, "perder" e escorregar do
//  telhado ou perder o emprego.
//
//  MODOS
//    CAMPANHA        10 fases, 3 chefes, com pontuacao, estrelas e desafios.
//                    A fase 5 termina na luta com o SAMURAI ROBO, que lanca
//                    um dispositivo e transforma a Cócó em robo; a fase 7
//                    acaba com o GIGANTE REAL de surpresa; a 10 e a GALINHA
//                    ROBO, e no fim o tratador arranca o dispositivo.
//    DESAFIO DO DIA  um objetivo novo por dia, sorteado pela data
//    MODO INFINITO   telhado sem fim, sozinho, correndo da guarda imperial
//    PERSEGUICAO     2 jogadores no mesmo teclado, tela dividida
//
//  OS DOIS PERSONAGENS JOGAM DIFERENTE (veja PERSONAGENS e PERFIS):
//    KOBURO = mobilidade (dash duplo, pirueta, mergulho)
//    TOBIAS = controle   (escudo, pisao, dash mais curto)
//  Os dois terminam qualquer fase: o caminho e que muda.
//
//  Tudo continua em UM arquivo: a arte e desenhada em canvas no BootScene e
//  o som e gerado pela Web Audio API. Nenhuma imagem nem audio externo.
//
//  ONDE MEXER EM CADA COISA
//    FIS / ELEM / HAB / PERFIS ... numeros de fisica, elementos e habilidades
//    MAPAS + FASES .............. as fases (ASCII) e os dados de cada uma
//    Controles .................. teclas, remapeamento e conflitos
//    Placar / PONT / DESAFIOS ... pontuacao, combo e objetivos
//    CONQUISTAS / Diario ........ progressao de longo prazo
//    BICHOS / BOSSES ............ inimigos e chefes
//    ATAQUES_CHEFE .............. os golpes de cada chefe (preparo/golpe/pausa)
//    FX / Aura / AMBIENTES ...... particulas, brilhos, aura e clima das fases
//    Cinema / Roteiro ........... faixas de cinema e o sequenciador das cutscenes
//    CampaignScene: roteiro*() .. as cutscenes (Samurai, dispositivo, Gigante, final)
// ============================================================================

var LARG = 960, ALT = 540;      // resolucao base
var T = 32;                     // tamanho do bloco em pixels

// Fonte pixelada. A Silkscreen desenha as maiusculas acentuadas (Ã, Ç, Ê, Ô...)
// em tamanho cheio, entao "KOBURÔ" e "PERSEGUIÇÃO" ficam legiveis. Ela e mais
// estreita que a Press Start 2P, por isso os tamanhos pedidos sao multiplicados
// por ESCALA_FONTE (o layout das telas continua o mesmo).
var FONTE = '"Silkscreen", "Courier New", monospace';
var ESCALA_FONTE = 1.5;

// ---- Paleta (strings, para desenhar no canvas) -----------------------------
var C = {
  ceu0:      '#1a1c2c', ceu1: '#3b5dc9',
  escuro:    '#1a1c2c', escuro2: '#29366f',
  bloco:     '#5d275d', blocoTopo: '#b13e53', blocoDet: '#ef7d57',
  perigo:    '#ef7d57', perigo2: '#ffcd75',
  p1:        '#41a6f6', p1luz: '#73eff7',
  p2:        '#38b764', p2luz: '#a7f070',
  moeda:     '#ffcd75', moedaEsc: '#ef7d57',
  ui:        '#f4f4f4', painel: '#333c57', painelLuz: '#566c86',
  cinza:     '#94b0c2',
  // vilarejo: telhas de ceramica azul-ardosia, reboco, madeira e papel de janela
  telha:     '#566c86', telhaLuz: '#94b0c2', telhaEsc: '#333c57',

// ---- Utilidades ------------------------------------------------------------
function limita(v, a, b) { return v < a ? a : (v > b ? b : v); }
// move "atual" na direcao de "alvo" no maximo "passo" (usado na aceleracao)
function aproxima(atual, alvo, passo) {
  if (atual < alvo) return Math.min(atual + passo, alvo);
  if (atual > alvo) return Math.max(atual - passo, alvo);
  return alvo;
}
// gerador pseudo-aleatorio com semente (a arte fica igual em toda sessao)
function semente(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hex2rgb(h) {
  return { r: parseInt(h.substr(1, 2), 16), g: parseInt(h.substr(3, 2), 16), b: parseInt(h.substr(5, 2), 16) };
}
function rgb2hex(r, g, b) {
  var f = function (v) { var s = limita(Math.round(v), 0, 255).toString(16); return s.length < 2 ? '0' + s : s; };
  return '#' + f(r) + f(g) + f(b);
}
function escurece(h, f) { var c = hex2rgb(h); return rgb2hex(c.r * f, c.g * f, c.b * f); }
function mistura(h1, h2, t) {
  var a = hex2rgb(h1), b = hex2rgb(h2);
  return rgb2hex(a.r + (b.r - a.r) * t, a.g + (b.g - a.g) * t, a.b + (b.b - a.b) * t);
}
// 12345 -> "12.345" (o jogo mostra pontuacao alta o tempo todo)
function num(n) {
  var s = String(Math.max(0, Math.round(n))), saida = '', i, c = 0;
  for (i = s.length - 1; i >= 0; i--) {
    saida = s.charAt(i) + saida;
    if (++c % 3 === 0 && i > 0) saida = '.' + saida;
  }
  return saida;
}
// No celular nao existe "SHIFT": a dica tem de citar o BOTAO da tela. Os
// simbolos ficam em ASCII de proposito - a Silkscreen nao tem as setinhas.
var ROTULO_TOQUE = {
  esq: '<', dir: '>', baixo: 'V', pulo: 'PULO', dash: 'DASH', hab: 'ESP'
};
// Troca marcadores como "{dash}" pela tecla configurada de verdade. Assim a
// dica da fase continua certa depois de o jogador remapear os controles.
function comTeclas(texto, jog) {
  return texto.replace(/\{(\w+)\}/g, function (todo, acao) {
    if (TOQUE && TOQUE.ativo && ROTULO_TOQUE[acao]) return ROTULO_TOQUE[acao];
    var cods = Controles.teclasDe(jog || 1, acao);
    if (!cods.length) cods = Controles.teclasDe(jog === 1 ? 2 : 1, acao);
    if (!cods.length) return '?';
    var nomes = [], i;
    for (i = 0; i < cods.length; i++) nomes.push(nomeTecla(cods[i]));
    return nomes.join(' OU ');
  });
}
function tempoStr(ms) {
  var s = Math.floor(ms / 1000), m = Math.floor(s / 60);
  var cs = Math.floor((ms % 1000) / 10);
  var dd = function (v) { return v < 10 ? '0' + v : '' + v; };
  return dd(m) + ':' + dd(s % 60) + '.' + dd(cs);
}

var MUSICA = {
  faixa: null, def: null, prox: 0, compasso: 0, timer: null,
  toca: function (nome, retomando) {
    if (!FAIXAS[nome]) return;
    if (this.faixa === nome && !retomando) return;
    this.faixa = nome;
    this.def = FAIXAS[nome];
    this.compasso = 0;
    if (!SOM.ctx) return;                       // ainda sem audio: comeca ao liberar
    this.prox = SOM.ctx.currentTime + 0.06;
    this.roda();
  },
  para: function () { this.faixa = null; this.def = null; },
  // agenda tudo o que cabe nos proximos ~1,5s e volta a olhar em 300ms
  roda: function () {
    if (this.timer) { clearTimeout(this.timer); this.timer = null; }
    if (!this.faixa || !SOM.ctx) return;
    var d = this.def, passo = 60 / d.bpm / 2;            // uma colcheia
    var limite = SOM.ctx.currentTime + 1.5, i, n;
    var oit = d.oitava !== undefined ? d.oitava : 1, oitB = d.oitBaixo !== undefined ? d.oitBaixo : -1;
    if (this.prox < SOM.ctx.currentTime) this.prox = SOM.ctx.currentTime + 0.05;
    while (this.prox < limite) {
      for (i = 0; i < 16; i++) {
        n = d.melodia[i];
        if (n) SOM.nota(hz(n, oit), passo * 0.9, d.onda, d.vol, this.prox + i * passo);
        if (i % 2 === 0) {
          n = d.baixo[i / 2];
          if (n) SOM.nota(hz(n, oitB), passo * 1.8, d.baixoOnda, d.volBaixo, this.prox + i * passo);
        }
        if (d.tambor) {
          n = d.tambor.charAt(i);
          if (n === 'T') SOM.batida(this.prox + i * passo, d.volTambor);
          else if (n === 'x') SOM.chiado(this.prox + i * passo, (d.volTambor || 0.1) * 0.35);
        }
      }
      this.prox += 16 * passo;
      this.compasso++;
    }
    var mus = this;
    this.timer = setTimeout(function () { mus.roda(); }, 300);
  }
};

// ============================================================================
//  PROGRESSO - salvo em localStorage
// ============================================================================
// A CHAVE do save NUNCA muda: quem ja jogava continua com o progresso dele.
// Quem cresce e o VERSAO_SAVE, e cada versao nova sabe migrar a anterior
// (veja "migra"). Nada e apagado sem o jogador pedir.
var CHAVE = 'dashrush_save_v1';
// numero velho -> numero novo de cada fase (saves de antes das 10 fases).
// As que sairam do jogo nao aparecem (indices 5 = arena do guardao,
// 6 = Corrida no Beiral, 11 = Capitao; o 12 era o chefe final da versao 4).
var MIGRA_FASES_V5 = { 0: 0, 1: 1, 2: 2, 3: 3, 4: 4, 7: 5, 8: 6, 9: 8, 10: 7, 12: 9 };
var VERSAO_SAVE = 5;

var Save = {
  d: null,
  padrao: function () {
    return {
      v: VERSAO_SAVE,
      desbloqueadas: 1,
      fases: {},            // por fase: tempo, moedas, mortes, feita, pontos,
                            // combo, estrelas, desafios, secretos
      mudo: false,
      personagem: 1,
      volume: 100,          // volume geral (0 a 100)
      volEfeitos: 100,      // efeitos sonoros
      volMusica: 50,        // musica
      poucoMov: null,       // null = segue a preferencia do sistema
      legendas: false,      // avisos escritos alem dos sons
      teclas: null,         // null = controles padrao
      xp: 0,
      conquistas: {},       // { id: true }
      infinito: { dist: 0, pontos: 0 },
      diario: { dia: '', pontos: 0, feito: false, tentativas: 0 },
      cenas: {}             // cutscenes ja vistas (as vistas podem ser puladas)
    };
  },

  carregar: function () {
    var lido = null;
    try {
      var s = window.localStorage.getItem(CHAVE);
      if (s) lido = JSON.parse(s);
    } catch (e) { lido = null; }
    this.d = Object.assign(this.padrao(), lido || {});
    if (lido) this.migra(lido);
    this.valida();
    this.aplica();
    return this.d;
  },

  // ---- MIGRACAO: leva um save antigo para o formato de hoje -----------------
  // Regra: so ACRESCENTA. Nunca joga fora o que ja estava salvo.
  migra: function (antigo) {
    var vAnt = Number(antigo.v) || 1;
    if (vAnt >= VERSAO_SAVE) return;
    if (vAnt < 2) {
      // v1 nao tinha volumes separados: os dois herdam o volume que existia
      var vol = isFinite(Number(antigo.volume)) ? Number(antigo.volume) : 100;
      this.d.volEfeitos = vol;
      this.d.volMusica = Math.round(vol * 0.5);
    }
    if (vAnt < 3) {
      // v2 nao tinha pontos/estrelas: as fases ja concluidas ganham o minimo
      // (1 estrela por ter concluido) para ninguem "perder" progresso visivel
      var k, f;
      for (k in this.d.fases) {
        f = this.d.fases[k];
        if (!f || !f.feita) continue;
        if (f.estrelas === undefined) f.estrelas = 1;
        if (f.pontos === undefined) f.pontos = 0;
        if (f.combo === undefined) f.combo = 0;
        if (!f.desafios) f.desafios = {};
        if (f.secretos === undefined) f.secretos = 0;
      }
    }
    if (vAnt < 5) {
      // A campanha passou a ter 10 fases (saiu a Corrida no Beiral, a arena do
      // guardao virou a surpresa do fim da Ronda, saiu o Capitao e entrou o
      // chefe final). O progresso de cada fase vai para o numero novo dela;
      // o que ja estava aberto continua aberto, e quem ja tinha terminado a
      // ultima fase antiga ganha o chefe final destravado.
      if (!this.d.cenas || typeof this.d.cenas !== 'object') this.d.cenas = {};
      var NOVO = MIGRA_FASES_V5, novas = {}, kf, nf, maxVelho = (Number(this.d.desbloqueadas) || 1) - 1, desb = 1, kv;
      for (kf in this.d.fases) {
        nf = NOVO[kf];
        if (nf !== undefined && this.d.fases[kf]) novas[nf] = this.d.fases[kf];
      }
      for (kv = maxVelho; kv >= 0; kv--) if (NOVO[kv] !== undefined) { desb = NOVO[kv] + 1; break; }
      for (kf in novas) if (novas[kf].feita) desb = Math.max(desb, Number(kf) + 2);
      if (this.d.fases[11] && this.d.fases[11].feita) desb = 10;
      this.d.fases = novas;
      this.d.desbloqueadas = Math.min(10, Math.max(1, desb));
      this.d.cenas = {};
    }
    this.d.v = VERSAO_SAVE;
  },

  salvar: function () {
    try { window.localStorage.setItem(CHAVE, JSON.stringify(this.d)); } catch (e) {}
  },

  // Qualquer valor estranho (save antigo, editado a mao, corrompido) cai no
  // padrao em vez de travar o jogo.
  valida: function () {
    var p = this.padrao(), d = this.d;
    var num = function (v, min, max, pad) {
      v = Number(v);
      return isFinite(v) ? Math.max(min, Math.min(max, Math.round(v))) : pad;
    };
    d.volume     = num(Math.round(d.volume / 10) * 10, 0, 100, 100);
    d.volEfeitos = num(Math.round(d.volEfeitos / 10) * 10, 0, 100, 100);
    d.volMusica  = num(Math.round(d.volMusica / 10) * 10, 0, 100, 50);
    d.xp         = num(d.xp, 0, 99999999, 0);
    d.desbloqueadas = num(d.desbloqueadas, 1, 999, 1);
    if (!d.fases || typeof d.fases !== 'object') d.fases = {};
    if (!d.conquistas || typeof d.conquistas !== 'object') d.conquistas = {};
    if (!d.infinito || typeof d.infinito !== 'object') d.infinito = p.infinito;
    if (!d.diario || typeof d.diario !== 'object') d.diario = p.diario;
    if (!d.cenas || typeof d.cenas !== 'object') d.cenas = {};
    if (d.poucoMov !== null && d.poucoMov !== true && d.poucoMov !== false) d.poucoMov = null;
    d.legendas = !!d.legendas;
    d.mudo = !!d.mudo;
    d.v = VERSAO_SAVE;
  },

  // joga as configuracoes salvas para dentro do jogo (som e acessibilidade)
  aplica: function () {
    SOM.mudo = !!this.d.mudo;
    SOM.volume = this.d.volume / 100;
    SOM.volEfeitos = this.d.volEfeitos / 100;
    SOM.volMusica = this.d.volMusica / 100;
    SOM.aplicaVolumes();
    POUCO_MOV = (this.d.poucoMov === null) ? POUCO_MOV_SISTEMA : !!this.d.poucoMov;
    LEGENDAS = !!this.d.legendas;
  },

  fase: function (i) { return this.d.fases[i] || null; },
  // registro da fase, criando um vazio se ainda nao existir
  registroFase: function (i) {
    if (!this.d.fases[i]) {
      this.d.fases[i] = { tempo: null, moedas: 0, mortes: 0, feita: false,
                          pontos: 0, combo: 0, estrelas: 0, desafios: {}, secretos: 0 };
    }
    var f = this.d.fases[i];
    if (!f.desafios) f.desafios = {};
    if (f.pontos === undefined) f.pontos = 0;
    if (f.combo === undefined) f.combo = 0;
    if (f.estrelas === undefined) f.estrelas = 0;
    if (f.secretos === undefined) f.secretos = 0;
    return f;
  },

  // Registra o resultado de uma fase concluida. Guarda sempre o MELHOR de
  // cada coisa: tempo, ovos, pontos, combo, estrelas e desafios feitos.
  // Devolve o que foi recorde, para a tela de resultado mostrar.
  concluir: function (i, res) {
    var f = this.registroFase(i), novo = {}, k;
    f.feita = true;
    if (f.tempo === null || res.tempo < f.tempo) { f.tempo = res.tempo; novo.tempo = true; }
    if (res.moedas > f.moedas) { f.moedas = res.moedas; novo.moedas = true; }
    if (res.pontos > f.pontos) { f.pontos = res.pontos; novo.pontos = true; }
    if (res.combo > f.combo) { f.combo = res.combo; novo.combo = true; }
    if (res.secretos > f.secretos) { f.secretos = res.secretos; novo.secretos = true; }
    if (res.estrelas > f.estrelas) { f.estrelas = res.estrelas; novo.estrelas = true; }
    f.mortes = (f.mortes || 0) + res.mortes;
    for (k in res.desafios) if (res.desafios[k]) f.desafios[k] = true;
    if (this.d.desbloqueadas < i + 2) this.d.desbloqueadas = Math.min(i + 2, NUM_FASES);
    this.ganhaXP(res.xp || 0);
    this.salvar();
    return novo;
  },

  totalMoedas: function () {
    var t = 0, k; for (k in this.d.fases) t += this.d.fases[k].moedas || 0; return t;
  },
  totalEstrelas: function () {
    var t = 0, k; for (k in this.d.fases) t += this.d.fases[k].estrelas || 0; return t;
  },
  fasesFeitas: function () {
    var t = 0, k; for (k in this.d.fases) if (this.d.fases[k].feita) t++; return t;
  },

  // ---- XP e nivel do jogador ----------------------------------------------
  // Cada nivel custa um pouco mais que o anterior (curva suave, sem grind).
  ganhaXP: function (n) {
    if (!n) return 0;
    var antes = this.nivel();
    this.d.xp += n;
    this.salvar();
    var depois = this.nivel();
    return depois - antes;              // quantos niveis subiu (0 = nenhum)
  },
  nivel: function () {
    var xp = this.d.xp, n = 1;
    while (xp >= this.xpDoNivel(n) && n < 99) { xp -= this.xpDoNivel(n); n++; }
    return n;
  },
  xpDoNivel: function (n) { return 500 + (n - 1) * 250; },
  // quanto falta para o proximo nivel: { atual, alvo }
  progressoNivel: function () {
    var xp = this.d.xp, n = 1;
    while (xp >= this.xpDoNivel(n) && n < 99) { xp -= this.xpDoNivel(n); n++; }
    return { atual: xp, alvo: this.xpDoNivel(n), nivel: n };
  },

  // cutscenes: a primeira vez e obrigatoria; depois da para pular
  viuCena: function (id) { return !!(this.d.cenas && this.d.cenas[id]); },
  marcaCena: function (id) {
    if (!this.d.cenas) this.d.cenas = {};
    if (this.d.cenas[id]) return;
    this.d.cenas[id] = true;
    this.salvar();
  },

  // personagem da campanha (1 = Koburo, 2 = Tobias); saves antigos caem no 1
  personagem: function () { return this.d.personagem === 2 ? 2 : 1; },
  escolhePersonagem: function (id) { this.d.personagem = (id === 2 ? 2 : 1); this.salvar(); },

  // ---- ajustes de som e acessibilidade ------------------------------------
  mudaVolume: function (v) { this.d.volume = v; this.valida(); this.aplica(); this.salvar(); },
  mudaEfeitos: function (v) { this.d.volEfeitos = v; this.valida(); this.aplica(); this.salvar(); },
  mudaMusica: function (v) { this.d.volMusica = v; this.valida(); this.aplica(); this.salvar(); },
  mudaPoucoMov: function (v) { this.d.poucoMov = v; this.aplica(); this.salvar(); },
  mudaLegendas: function (v) { this.d.legendas = !!v; this.aplica(); this.salvar(); },

  // ---- recordes dos modos extras -------------------------------------------
  recordeInfinito: function (dist, pontos) {
    var novo = {};
    if (dist > (this.d.infinito.dist || 0)) { this.d.infinito.dist = dist; novo.dist = true; }
    if (pontos > (this.d.infinito.pontos || 0)) { this.d.infinito.pontos = pontos; novo.pontos = true; }
    this.salvar();
    return novo;
  },

  // apagar o progresso nao mexe nas configuracoes (som, teclas, acessibilidade)
  apagar: function () {
    var d = this.d, novo = this.padrao();
    novo.mudo = d.mudo; novo.personagem = d.personagem;
    novo.volume = d.volume; novo.volEfeitos = d.volEfeitos; novo.volMusica = d.volMusica;
    novo.poucoMov = d.poucoMov; novo.legendas = d.legendas; novo.teclas = d.teclas;
    this.d = novo;
    this.salvar();
  }
};

// ============================================================================
//  RELATORIO DE QUEDAS - para testar a dificuldade com outras pessoas
//  Cada queda na Campanha fica anotada (fase, causa, coluna do mapa e
//  personagem), junto com cada vez que a fase comeca e termina. Fica numa
//  chave PROPRIA, longe do save: apagar o relatorio nao mexe no progresso.
//  Para ver o resumo:
//    - no computador: relatorioQuedas() no console do navegador;
//    - no celular: abra o jogo com "?relatorio" no fim do endereco.
//  limpaRelatorioQuedas() zera as anotacoes.
// ============================================================================
var CHAVE_QUEDAS = 'galinha_quedas_v1';
var RelQuedas = {
  MAX: 3000,                     // guarda so as ultimas (o localStorage e pequeno)
  le: function () {
    try {
      var a = JSON.parse(window.localStorage.getItem(CHAVE_QUEDAS));
      return Array.isArray(a) ? a : [];
    } catch (e) { return []; }
  },
  anota: function (fase, causa, col) {
    var a = this.le();
    a.push({ f: fase, c: causa, x: col, p: Save.personagem(), t: Date.now() });
    if (a.length > this.MAX) a = a.slice(a.length - this.MAX);
    try { window.localStorage.setItem(CHAVE_QUEDAS, JSON.stringify(a)); } catch (e) {}
  },
  limpa: function () {
    try { window.localStorage.removeItem(CHAVE_QUEDAS); } catch (e) {}
  },
  // Resumo em texto, fase por fase: quantas vezes comecou e terminou, quedas
  // por causa e as colunas do mapa onde mais se cai (os "pontos quentes").
  texto: function () {
    var a = this.le(), porFase = {}, i, e, g;
    for (i = 0; i < a.length; i++) {
      e = a[i];
      g = porFase[e.f] || (porFase[e.f] = { comecou: 0, concluiu: 0, quedas: 0, causas: {}, cols: {} });
      if (e.c === 'comecou') g.comecou++;
      else if (e.c === 'concluiu') g.concluiu++;
      else {
        g.quedas++;
        g.causas[e.c] = (g.causas[e.c] || 0) + 1;
        g.cols[e.x] = (g.cols[e.x] || 0) + 1;
      }
    }
    var ordena = function (obj) {
      return Object.keys(obj).sort(function (x, y) { return obj[y] - obj[x]; });
    };
    var linhas = ['RELATORIO DE QUEDAS - ' + a.length + ' anotacoes', ''];
    var fases = Object.keys(porFase).map(Number).sort(function (x, y) { return x - y; });
    if (!fases.length) linhas.push('Nada anotado ainda. Jogue a Campanha e volte aqui.');
    for (i = 0; i < fases.length; i++) {
      g = porFase[fases[i]];
      var nome = (FASES[fases[i]] && FASES[fases[i]].nome) || ('FASE ' + fases[i]);
      var causas = ordena(g.causas).map(function (k) { return k + ' ' + g.causas[k]; });
      var quentes = ordena(g.cols).slice(0, 3).map(function (k) { return 'col ' + k + ' (' + g.cols[k] + 'x)'; });
      linhas.push((fases[i] + 1) + '. ' + nome);
      linhas.push('   comecou ' + g.comecou + '   concluiu ' + g.concluiu + '   quedas ' + g.quedas +
                  (g.concluiu ? '   (' + (g.quedas / g.concluiu).toFixed(1) + ' por conclusao)' : ''));
      if (causas.length) linhas.push('   causas: ' + causas.join(', '));
      if (quentes.length) linhas.push('   onde mais cai: ' + quentes.join(', '));
    }
    return linhas.join('\n');
  }
};

function preparaFases() {
  var i, f, g, y, x, ch, ovos, sec, bichos;
  for (i = 0; i < FASES.length; i++) {

        if (ch === 'o') ovos++;
        else if (ch === 's') sec++;
        else if (ch === 'E' || ch === 'V' || ch === 'G') bichos++;

    f.totalOvos = ovos;
    f.totalSecretos = sec;
    f.totalBichos = bichos;

    if (f.alvoTempo === undefined) {

function elipse(ctx, cx, cy, rw, rh, cor) {
  ctx.fillStyle = cor;
  for (var y = -rh; y <= rh; y++) {
    var t = y / (rh + 0.6);
    var w = Math.round(rw * Math.sqrt(Math.max(0, 1 - t * t)));
    if (w <= 0) continue;
    ctx.fillRect(Math.round(cx - w), Math.round(cy + y), w * 2, 1);
  }
}

function ovo(ctx, cx, cy, rw, rh, cor) {
  ctx.fillStyle = cor;
  for (var y = -rh; y <= rh; y++) {
    var t = y / (rh + 0.6);
    var w = Math.round(rw * Math.sqrt(Math.max(0, 1 - t * t)) * (0.78 + 0.11 * (t + 1)));
    if (w <= 0) continue;
    ctx.fillRect(Math.round(cx - w), Math.round(cy + y), w * 2, 1);

function estrelaPix(ctx, cx, cy, r, cor) {
  var pts = [], i, ang, rr, y, xs, a, b;
  for (i = 0; i < 10; i++) {
    ang = -Math.PI / 2 + i * Math.PI / 5;
    rr = (i % 2 === 0) ? r : r * 0.44;
    pts.push([cx + Math.cos(ang) * rr, cy + Math.sin(ang) * rr]);
  }
  for (y = Math.floor(cy - r); y <= Math.ceil(cy + r); y++) {
    xs = [];
    for (i = 0; i < 10; i++) {
      a = pts[i]; b = pts[(i + 1) % 10];
      if ((a[1] <= y && b[1] > y) || (b[1] <= y && a[1] > y)) {
        xs.push(a[0] + (y - a[1]) / (b[1] - a[1]) * (b[0] - a[0]));
      }
    }
    xs.sort(function (q, w) { return q - w; });
    for (i = 0; i + 1 < xs.length; i += 2) {
      rect(ctx, Math.round(xs[i]), y, Math.max(1, Math.round(xs[i + 1]) - Math.round(xs[i])), 1, cor);
    }
  }

function triangulo(ctx, ax, ay, bx, by, qx, qy, cor) {
  ctx.fillStyle = cor;

  var y0 = Math.ceil(Math.min(ay, by, qy)), y1 = Math.floor(Math.max(ay, by, qy));
  for (var y = y0; y <= y1; y++) {
    var xs = [];
    for (var i = 0; i < 3; i++) {
      var e = arestas[i];
      if ((y >= e[1] && y <= e[3]) || (y >= e[3] && y <= e[1])) {
        if (e[1] === e[3]) xs.push(e[0], e[2]);
        else xs.push(e[0] + (y - e[1]) * (e[2] - e[0]) / (e[3] - e[1]));
      }
    }
    if (xs.length < 2) continue;
    var mn = Math.round(Math.min.apply(null, xs)), mx = Math.round(Math.max.apply(null, xs));

  var i, y, xs, a, b, yc, y0 = Infinity, y1 = -Infinity, xa, xb;
  for (i = 0; i < pts.length; i++) { y0 = Math.min(y0, pts[i][1]); y1 = Math.max(y1, pts[i][1]); }
  ctx.fillStyle = cor;
  for (y = Math.floor(y0); y <= Math.ceil(y1); y++) {
    yc = y + 0.5; xs = [];
    for (i = 0; i < pts.length; i++) {
      a = pts[i]; b = pts[(i + 1) % pts.length];
      if ((a[1] <= yc && b[1] > yc) || (b[1] <= yc && a[1] > yc)) {
        xs.push(a[0] + (yc - a[1]) / (b[1] - a[1]) * (b[0] - a[0]));
      }
    }
    xs.sort(function (p, q) { return p - q; });
    for (i = 0; i + 1 < xs.length; i += 2) {

    for (i = 0; i < pts.length; i++) q.push([pts[i][0] + d[k][0], pts[i][1] + d[k][1]]);
